[package]
name = "ohc-mono"
version = "0.4.44"
edition = "2024"
build = "src/server/build.rs"

[lib]
name = "server_lib"
path = "src/server/lib.rs"

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tonic = { workspace = true, features = ["transport"] }
prost = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aes-gcm = "0.10"
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
image = "0.25"
bcrypt = "0.16.0"
rand = "0.8"
hex = "0.4"
chrono = { workspace = true }
ed25519-dalek = "2"
reqwest = { workspace = true }
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
config = "0.15.22"
redis = { version = "0.27.6", features = ["tokio-comp"] }
glob = "0.3"
walkdir = "2"
once_cell = "1"
async-trait = "0.1"
futures = { workspace = true }
urlencoding = "2"
qrcode = { version = "0.14", default-features = false }
async-recursion = "1"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
tonic-build = "0.12"
axum = { version = "0.8.1", features = ["ws"] }
tokio-tungstenite = "0.29.0"
dashmap = "5"
async-nats = "0.47.0"
protoc-gen-prost = { workspace = true }
protoc-gen-tonic = { workspace = true }
prost-types = { workspace = true }
tempfile = "3.27.0"
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
strsim = "0.11.1"

[build-dependencies]
tonic-build = "0.12"

[workspace]
members = ["src/ui/tauri"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
protoc-gen-prost = "0.4.0"
protoc-gen-tonic = "0.4.0"
prost-types = "0.13"
futures = "0.3"

[dev-dependencies]
temp-env = "0.3.6"
futures-util = "0.3.32"
tauri-cli = "2"
tower = "0.4"
