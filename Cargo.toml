[[bin]]
name = "server"
path = "src/server/main.rs"

[package]
name = "ohc-mono"
version = "0.4.47"
edition = "2024"
build = "src/server/build.rs"

[lib]
name = "server_lib"
path = "src/server/lib.rs"

[dependencies]
tracing = "0.1"
aes-gcm = "0.10"
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
image = "0.25"
bcrypt = "0.16.0"
rand = "0.8"
hex = "0.4"
ed25519-dalek = "2"
flate2 = "1"
regex = "1"
config = "0.15.22"
glob = "0.3"
walkdir = "2"
once_cell = "1"
async-trait = "0.1"
urlencoding = "2"
async-recursion = "1"
tracing-opentelemetry = "0.28"
tonic-build = "0.12"
tokio-tungstenite = "0.29.0"
dashmap = "5"
async-nats = "0.47.0"
tempfile = "3.27.0"
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"

[build-dependencies]
tonic-build = "0.12"

[workspace]
members = [ "src/server/integrations/twilio", "src/server/integrations/mcp_config_sync", "src/server/integrations/shippo", "src/server/integrations/shipday", "src/server/oidc", "src/server/config", "src/ui/tauri", "src/server/telemetry", "src/server/integrations/buffer", "src/server/auth", "src/server/integrations/cal_com", "src/server/integrations/nats", "src/server/integrations/resend", "src/server/harness", "src/server/integrations/stripe", "src/server/integrations/task_scheduler", "src/server/integrations/shipengine", "src/server/ohc", "src/server/integrations/zoom", "src/server/integrations/acuity", "src/server/integrations/google_calendar", "src/server/integrations/messagebird", "src/server/utils", "src/server/integrations/easypost", "src/server/integrations/restic", "src/server/integrations/sendgrid", "src/server/integrations/teams", "src/server/integrations/convertkit", "src/server/pricing", "src/server/integrations/nylas", "src/server/integrations/calendly", "src/server/integrations/pubsub", "src/server/integrations/meta", "src/server/integrations/jitsi", "src/server/integrations/alipay", "src/server/integrations/mercadopago", "src/server/integrations/core", "src/server/common", "src/server/integrations/daily", "src/server/integrations/razorpay", "src/server/integrations/mailchimp", "src/server/integrations/ayrshare", "src/server/integrations/chromadb", "src/server/integrations/chatwoot", "src/server/integrations/doordash", "src/agents/builtin/core", "src/agents/builtin/llm", "src/agents/builtin/tools", "src/agents/builtin", "src/server/integrations/listmonk", "src/server/integrations/manychat",]

[dev-dependencies]
temp-env = "0.3.6"
futures-util = "0.3.32"
tauri-cli = "2"
tower = "0.4"

[dependencies.tokio]
workspace = true
features = [ "full",]

[dependencies.tokio-stream]
version = "0.1"
features = [ "full",]

[dependencies.tonic]
workspace = true
features = [ "transport",]

[dependencies.prost]
workspace = true

[dependencies.serde_yaml]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tracing-subscriber]
version = "0.3"
features = [ "env-filter", "json",]

[dependencies.chrono]
workspace = true

[dependencies.reqwest]
workspace = true

[dependencies.uuid]
version = "1"
features = [ "v4", "serde",]

[dependencies.redis]
version = "0.27.6"
features = [ "tokio-comp",]

[dependencies.futures]
workspace = true

[dependencies.futures-util]
version = "0.3.32"

[dependencies.qrcode]
version = "0.14"
default-features = false

[dependencies.libsqlite3-sys]
version = "0.30.1"
features = ["bundled-sqlcipher"]

[dependencies.sqlx]
version = "0.8"
features = [ "postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros",]

[dependencies.opentelemetry]
version = "0.27"
features = [ "metrics", "trace",]

[dependencies.opentelemetry_sdk]
version = "0.27"
features = [ "rt-tokio",]

[dependencies.opentelemetry-otlp]
version = "0.27"
features = [ "grpc-tonic",]

[dependencies.axum]
version = "0.8.1"
features = [ "ws", "multipart",]

[dependencies.protoc-gen-prost]
workspace = true

[dependencies.protoc-gen-tonic]
workspace = true

[dependencies.prost-types]
workspace = true

[dependencies.server_pricing]
path = "src/server/pricing"

[dependencies.server_common]
path = "src/server/common"

[dependencies.server_harness]
path = "src/server/harness"

[dependencies.server_ohc]
path = "src/server/ohc"

[dependencies.server_telemetry]
path = "src/server/telemetry"

[dependencies.server_auth]
path = "src/server/auth"

[dependencies.server_oidc]
path = "src/server/oidc"

[dependencies.server_integrations_core]
path = "src/server/integrations/core"

[dependencies.ohc_builtin_agent]
path = "src/agents/builtin"

[dependencies.server_config]
path = "src/server/config"

[dependencies.server_utils]
path = "src/server/utils"

[dependencies.server_integrations_pubsub]
path = "src/server/integrations/pubsub"

[dependencies.server_integrations_stripe]
path = "src/server/integrations/stripe"

[dependencies.server_integrations_buffer]
path = "src/server/integrations/buffer"

[dependencies.server_integrations_mailchimp]
path = "src/server/integrations/mailchimp"

[dependencies.server_integrations_task_scheduler]
path = "src/server/integrations/task_scheduler"

[dependencies.server_integrations_shippo]
path = "src/server/integrations/shippo"

[dependencies.server_integrations_shipday]
path = "src/server/integrations/shipday"

[dependencies.server_integrations_chatwoot]
path = "src/server/integrations/chatwoot"

[dependencies.server_integrations_doordash]
path = "src/server/integrations/doordash"

[dependencies.server_integrations_chromadb]
path = "src/server/integrations/chromadb"

[dependencies.server_integrations_nylas]
path = "src/server/integrations/nylas"

[dependencies.server_integrations_mcp_config_sync]
path = "src/server/integrations/mcp_config_sync"

[dependencies.server_integrations_easypost]
path = "src/server/integrations/easypost"

[dependencies.server_integrations_manychat]
path = "src/server/integrations/manychat"

[dependencies.server_integrations_twilio]
path = "src/server/integrations/twilio"

[dependencies.server_integrations_listmonk]
path = "src/server/integrations/listmonk"

[dependencies.server_integrations_shipengine]
path = "src/server/integrations/shipengine"

[dependencies.server_integrations_restic]
path = "src/server/integrations/restic"

[dependencies.server_integrations_ayrshare]
path = "src/server/integrations/ayrshare"

[dependencies.server_integrations_nats]
path = "src/server/integrations/nats"

[dependencies.server_integrations_meta]
path = "src/server/integrations/meta"

[dependencies.server_integrations_sendgrid]
path = "src/server/integrations/sendgrid"

[dependencies.server_integrations_teams]
path = "src/server/integrations/teams"

[dependencies.server_integrations_acuity]
path = "src/server/integrations/acuity"

[dependencies.server_integrations_razorpay]
path = "src/server/integrations/razorpay"

[dependencies.server_integrations_daily]
path = "src/server/integrations/daily"

[dependencies.server_integrations_alipay]
path = "src/server/integrations/alipay"

[dependencies.server_integrations_resend]
path = "src/server/integrations/resend"

[dependencies.server_integrations_mercadopago]
path = "src/server/integrations/mercadopago"

[dependencies.server_integrations_convertkit]
path = "src/server/integrations/convertkit"

[dependencies.server_integrations_cal_com]
path = "src/server/integrations/cal_com"

[dependencies.server_integrations_calendly]
path = "src/server/integrations/calendly"

[dependencies.server_integrations_google_calendar]
path = "src/server/integrations/google_calendar"

[dependencies.server_integrations_jitsi]
path = "src/server/integrations/jitsi"

[dependencies.server_integrations_messagebird]
path = "src/server/integrations/messagebird"

[dependencies.server_integrations_zoom]
path = "src/server/integrations/zoom"

[dependencies.server_integrations_taxjar]
path = "src/server/integrations/taxjar"

[workspace.dependencies]
tonic = "0.12"
prost = "0.13"
serde_json = "1"
serde_yaml = "0.9"
protoc-gen-prost = "0.4.0"
protoc-gen-tonic = "0.4.0"
prost-types = "0.13"
futures = "0.3"

[workspace.dependencies.tokio]
version = "1"
features = [ "full",]

[workspace.dependencies.serde]
version = "1"
features = [ "derive",]

[workspace.dependencies.chrono]
version = "0.4"
features = [ "serde",]

[workspace.dependencies.reqwest]
version = "0.12"
features = [ "json", "rustls-tls", "stream",]
default-features = false

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ohc_bazel)', 'cfg(ohc_bazel_package)', 'cfg(ohc_bazel_tauri_context)'] }
