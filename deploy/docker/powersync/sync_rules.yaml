rules:
  - table: agents
    query: "SELECT * FROM agents WHERE organization_id = token.parameters.organization_id"
  - table: meeting_rooms
    query: "SELECT mr.* FROM meeting_rooms mr JOIN agents a ON a.id = ANY(mr.participants) WHERE a.organization_id = token.parameters.organization_id"
  - table: agent_missions
    query: "SELECT am.* FROM agent_missions am JOIN agents a ON a.id = am.payload->>'agent_id' WHERE a.organization_id = token.parameters.organization_id"
  - table: swarm_memory
    query: "SELECT * FROM swarm_memory WHERE key LIKE token.parameters.organization_id || ':%'"
  - table: capability_plugins
    query: "SELECT * FROM capability_plugins"
  - table: swarm_memory_embeddings
    query: "SELECT sme.* FROM swarm_memory_embeddings sme JOIN swarm_memory sm ON sm.key = sme.memory_id WHERE sm.key LIKE token.parameters.organization_id || ':%'"
  - table: agent_status
    query: "SELECT ast.* FROM agent_status ast JOIN agents a ON a.id = ast.agent_id WHERE a.organization_id = token.parameters.organization_id"
