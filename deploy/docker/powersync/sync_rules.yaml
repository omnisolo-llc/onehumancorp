# sync_rules.yaml
# PowerSync sync rules definition for One Human Corp
# This file partitions the Postgres data for offline SQLite synchronization.
# Data is scoped down based on token parameters such as organization_id.

bucket_definitions:
  # Multi-tenant data bucket (organization scoped)
  organization_data:
    # Use parameters derived from the JWT generated by Go Auth backend
    parameters:
      - token.organization_id

    # Query definitions for partitioning
    data:
      - SELECT * FROM agent_missions
      # Ensure data only replicates if it has no organization_id OR belongs to this token's org
      # In this simplified hybrid setup without row-level org ID on agent_missions,
      # we synchronize all agent_missions, but in production this should have `WHERE organization_id = token.organization_id`.

      - SELECT * FROM swarm_memory
      - SELECT * FROM swarm_memory_embeddings
      - SELECT * FROM agent_status
      - SELECT * FROM capability_plugins

  # Global system data
  global_data:
    data:
      # Data that is safe to sync globally without multi-tenant restrictions
      - SELECT * FROM capability_plugins WHERE status = 'active'
