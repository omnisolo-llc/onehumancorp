# PowerSync sync_rules.yaml
# Configures syncing logic to only sync data matching the user's organization_id

bucket_definitions:
  user_data:
    # Filter based on JWT token parameters
    parameters:
      organization_id: string
    data:
      - SELECT * FROM agent_missions WHERE organization_id = bucket.organization_id
      - SELECT * FROM tenant_registry WHERE organization_id = bucket.organization_id
      - SELECT * FROM swarm_memories WHERE organization_id = bucket.organization_id
