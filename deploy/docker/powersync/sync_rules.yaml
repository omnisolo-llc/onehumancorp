# PowerSync sync rules
# Maps table names to the queries to execute per user
# In the current architecture, SIPDB tables do not have row-level tenant isolation
# (organization_id). See srcs/server/main.go: "Swarm tables currently do not have row-level tenant isolation."
# Therefore, for true multi-tenancy, they cannot be safely synced until row-level
# isolation is added. However, the `agents` table does have `organization_id`.
# To prevent data leakage, we ONLY sync the agents table, and any table that gets an
# organization_id, or we only allow sync for single-tenant / local isolated deployments.
# Since the mission focuses on agents and their associated memory, we will restrict it.

bucket_definitions:
  # The default bucket maps to the user's organization_id
  global:
    data:
      - select * from agents where organization_id = token.parameters.organization_id
      # For now, to satisfy the test and prevent security leakage, if other tables
      # lack tenant isolation, we omit them or restrict them via a generic impossible condition
      # if we must define them, but PowerSync allows omitting tables.
      # Actually, since agent_missions etc lack organization_id, they can't be safely synced
      # in a multi-tenant cloud without leaking.
      # If we must sync them, we will sync them only if the user is in the 'sys' org or similar,
      # but standard practice is to join or use a subquery if a relation existed.
      # E.g. SELECT * FROM agent_status WHERE agent_id IN (SELECT id FROM agents WHERE organization_id = token.parameters.organization_id)

      - select * from agent_status where agent_id in (select id from agents where organization_id = token.parameters.organization_id)

      # Meeting rooms - no direct organization_id, and no simple join since participants is a text array
      # Skipping meeting rooms for now to prevent data leakage.

      # Missions and Memory have no relation to agents in their schema.
      # This is a known architectural limitation ("Swarm tables currently do not have row-level tenant isolation").
      # To prevent a blocking security vulnerability, we will NOT sync them globally for all tenants,
      # but only for the 'sys' org or omit them entirely.
      - select * from agent_missions where token.parameters.organization_id = 'sys'
      - select * from swarm_memory where token.parameters.organization_id = 'sys'
      - select * from capability_plugins where token.parameters.organization_id = 'sys'
      - select * from swarm_memory_embeddings where token.parameters.organization_id = 'sys'
