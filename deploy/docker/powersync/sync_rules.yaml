rules:
  - table: agents
    query: SELECT * FROM agents WHERE organization_id = token.parameters.organization_id
  - table: meeting_rooms
    # For simplicity, filter based on organization_id or similar if available, or just blanket if it's single user.
    # We will sync all for now since it's an example, or assuming multi-tenant isolation based on org.
    query: SELECT * FROM meeting_rooms WHERE organization_id = token.parameters.organization_id
  - table: agent_missions
    query: SELECT * FROM agent_missions WHERE organization_id = token.parameters.organization_id
  - table: swarm_memory
    query: SELECT * FROM swarm_memory WHERE organization_id = token.parameters.organization_id
  - table: capability_plugins
    query: SELECT * FROM capability_plugins WHERE organization_id = token.parameters.organization_id
  - table: swarm_memory_embeddings
    query: SELECT * FROM swarm_memory_embeddings WHERE organization_id = token.parameters.organization_id
  - table: agent_status
    query: SELECT * FROM agent_status WHERE organization_id = token.parameters.organization_id
