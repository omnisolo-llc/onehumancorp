global:
  scrape_interval: 15s
remote_write:
  - url: "http://localhost:9090/api/v1/write"
scrape_configs:
  - job_name: 'ohc-standalone'
    static_configs:
      - targets: ['server:8080']
  - job_name: 'ohc-core-standalone'
    static_configs:
      - targets: ['ohc-core:18789']
  - job_name: 'pushgateway-standalone'
    static_configs:
      - targets: ['pushgateway:9091']
  - job_name: 'powersync-standalone'
    static_configs:
      - targets: ['powersync:8081']
