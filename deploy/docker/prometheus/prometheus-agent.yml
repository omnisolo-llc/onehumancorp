global:
  scrape_interval: 5s
remote_write:
  - url: "http://localhost:9090/api/v1/write"
scrape_configs:
  - job_name: 'ohc-standalone'
    static_configs:
      - targets: ['localhost:8080']
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['localhost:9091']
