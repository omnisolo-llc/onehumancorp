global:
  scrape_interval: 15s
remote_write:
  - url: "http://localhost:9090/api/v1/write"
scrape_configs:
  - job_name: 'ohc-standalone'
    static_configs:
      - targets: ['localhost:8080']
  - job_name: 'ohc-core-standalone'
    static_configs:
      - targets: ['localhost:18789']
  - job_name: 'pushgateway-standalone'
    static_configs:
      - targets: ['localhost:9091']
