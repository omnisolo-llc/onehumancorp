apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ohc.fullname" . }}-alerts
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  groups:
  - name: ohc.alerts
    rules:
    - alert: KubeHpaMaxedOut
      expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "HPA has reached its maximum size"
        description: 'HPA {{ "{{ $labels.horizontalpodautoscaler }}" }} has been running at max replicas for longer than 15 minutes.'
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod is crash looping"
        description: 'Pod {{ "{{ $labels.pod }}" }} is crash looping.'
    - alert: KubePodNotReady
      expr: sum by (namespace, pod) (max by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod has been in a non-ready state for more than 15 minutes."
        description: 'Pod {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} has been in a non-ready state for longer than 15 minutes.'
    - alert: KubeDeploymentReplicasMismatch
      expr: (kube_deployment_spec_replicas != kube_deployment_status_replicas_available) and (kube_deployment_status_replicas_unavailable > 0)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Deployment replicas mismatch."
        description: 'Deployment {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.deployment }}" }} has not matched the expected number of replicas for longer than 15 minutes.'
