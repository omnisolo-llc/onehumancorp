{{- if .Values.backend.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ohc.fullname" . }}-backend
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ohc.name" . }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from other specific pods (e.g., ingress controllers)
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
    # Allow traffic from ohc-core
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-core
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-core
              app.kubernetes.io/instance: {{ .Release.Name }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-redis
              app.kubernetes.io/instance: {{ .Release.Name }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-db
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

---
{{- if and .Values.ohcCore.enabled .Values.ohcCore.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ohc.fullname" . }}-core
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ohc.name" . }}-core
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from backend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-backend
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.ohcCore.service.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-backend
              app.kubernetes.io/instance: {{ .Release.Name }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ohc.name" . }}-redis
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
