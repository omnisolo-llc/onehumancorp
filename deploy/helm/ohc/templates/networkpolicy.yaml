{{- if .Values.backend.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ohc.fullname" . }}-backend-network-policy
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- if .Values.multiTenant.enabled }}
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: frontend
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress
{{- end }}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- if .Values.multiTenant.enabled }}
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.cnpg.clusterName }}-rw
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis-master
    ports:
    - protocol: TCP
      port: 6379
{{- end }}
{{- end }}
