apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-powersync
  labels:
    app: {{ .Release.Name }}-powersync
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.powersync.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-powersync
