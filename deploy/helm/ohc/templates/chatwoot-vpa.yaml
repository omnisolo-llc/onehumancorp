{{- if and .Values.chatwoot.enabled .Values.chatwoot.autoscaling.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-chatwoot-vpa
  labels:
    app: {{ .Release.Name }}-chatwoot
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ .Release.Name }}-chatwoot
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: chatwoot
        controlledResources: ["memory"]
        minAllowed:
          memory: {{ .Values.chatwoot.resources.requests.memory }}
        maxAllowed:
          memory: {{ .Values.chatwoot.resources.limits.memory }}
{{- end }}
