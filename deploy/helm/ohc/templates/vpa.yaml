    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-core
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: core
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: {{ .Values.ohcCore.resources.requests.cpu }}
          memory: {{ .Values.ohcCore.resources.requests.memory }}
        maxAllowed:
          cpu: {{ .Values.ohcCore.resources.limits.cpu }}
          memory: {{ .Values.ohcCore.resources.limits.memory }}
{{- end }}
