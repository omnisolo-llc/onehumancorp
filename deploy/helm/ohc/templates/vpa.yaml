{{- if .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
{{- if .Values.multiTenant.enabled }}
  name: {{ include "ohc.fullname" . }}-tenant-vpa
{{- else }}
  name: {{ include "ohc.fullname" . }}-backend-vpa
{{- end }}
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-backend
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources: ["cpu", "memory"]
        minAllowed:
{{- if .Values.multiTenant.enabled }}
          cpu: "500m"
          memory: "1Gi"
{{- else }}
          cpu: {{ .Values.backend.resources.requests.cpu }}
          memory: {{ .Values.backend.resources.requests.memory }}
{{- end }}
        maxAllowed:
{{- if .Values.multiTenant.enabled }}
          cpu: "4000m"
          memory: "8Gi"
{{- else }}
          cpu: {{ .Values.backend.resources.limits.cpu }}
          memory: {{ .Values.backend.resources.limits.memory }}
{{- end }}
{{- end }}
---
{{- if .Values.ohcCore.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-core-vpa
