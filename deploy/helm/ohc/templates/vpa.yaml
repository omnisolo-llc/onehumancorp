{{- if .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-backend-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-backend
  updatePolicy:
    updateMode: "Auto"
{{- end }}
---
{{- if and .Values.ohcCore.enabled .Values.ohcCore.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-core-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-core
  updatePolicy:
    updateMode: "Auto"
{{- end }}
---
{{- if and .Values.chatwoot.enabled .Values.chatwoot.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-chatwoot-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-chatwoot
  updatePolicy:
    updateMode: "Auto"
{{- end }}
---
{{- if and .Values.powersync.enabled .Values.powersync.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-powersync-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ include "ohc.fullname" . }}-powersync
  updatePolicy:
    updateMode: "Auto"
{{- end }}
