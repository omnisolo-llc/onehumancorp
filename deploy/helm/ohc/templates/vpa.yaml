{{- if .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-backend-vpa
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ohc.fullname" . }}-backend
  updatePolicy:
    updateMode: {{ if .Values.backend.autoscaling.enabled }}"Off"{{ else }}"Auto"{{ end }}
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: {{ .Values.backend.resources.requests.cpu | quote }}
          memory: {{ .Values.backend.resources.requests.memory | quote }}
        maxAllowed:
          cpu: {{ .Values.backend.resources.limits.cpu | quote }}
          memory: {{ .Values.backend.resources.limits.memory | quote }}
{{- end }}
