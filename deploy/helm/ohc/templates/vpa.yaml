{{- if .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-backend-vpa
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ohc.fullname" . }}-backend
  updatePolicy:
    updateMode: "Off"
{{- end }}
---
{{- if .Values.ohcCore.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-core-vpa
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ohc.fullname" . }}-core
  updatePolicy:
    updateMode: "Off"
{{- end }}
---
{{- if .Values.multiTenant.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-tenant-vpa
  labels:
    app: {{ .Release.Name }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ .Release.Name }}-backend
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: "500m"
          memory: "1Gi"
        maxAllowed:
          cpu: "4000m"
          memory: "8Gi"
{{- end }}
