{{- if .Values.backend.autoscaling.verticalEnabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  updatePolicy:
    updateMode: "Auto"
{{- end }}
