apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      name: http
    - port: {{ .Values.backend.service.grpcPort }}
      targetPort: {{ .Values.backend.service.grpcPort }}
      name: grpc