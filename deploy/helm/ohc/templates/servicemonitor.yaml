      app.kubernetes.io/name: {{ include "ohc.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: core
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
---
