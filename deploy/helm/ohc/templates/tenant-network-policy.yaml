{{- if .Values.multiTenant.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-strict-tenant-isolation
  labels:
    app: {{ .Release.Name }}-tenant-isolation
spec:
  podSelector:
    matchLabels:
      tenant-isolation: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
{{- end }}
