apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-tenant-isolation
  labels:
    app: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      tenant: isolated
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tenant: isolated
  egress:
  - to:
    - podSelector:
        matchLabels:
          tenant: isolated
