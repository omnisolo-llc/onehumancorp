apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-tenant-isolation
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-tenant
spec:
  podSelector:
    matchLabels:
      tenant: isolation
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ .Release.Name }}-ohc-core
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
      podSelector:
        matchLabels:
          app: {{ .Release.Name }}-backend
