{{- if and .Values.ohcCore.enabled .Values.ohcCore.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ohc-core
  labels:
    app: {{ .Release.Name }}-ohc-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-ohc-core
  minReplicas: {{ .Values.ohcCore.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ohcCore.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ohcCore.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
