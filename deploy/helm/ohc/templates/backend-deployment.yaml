{{- $backendEnv := default dict .Values.backend.env -}}
{{- $grpcTls := default dict .Values.backend.grpcTls -}}
{{- $grpc := default dict .Values.backend.grpc -}}
{{- $grpcPort := default 8081 $grpc.port -}}
{{- $setup := default dict .Values.backend.setup -}}
{{- $auth := default dict .Values.backend.auth -}}
{{- $agentAuth := default dict .Values.backend.agentAuth -}}
{{- $probes := default dict .Values.backend.probes -}}
{{- $startupProbe := default dict (get $probes "startup") -}}
{{- $grpcTlsSecret := default "" $grpcTls.existingSecret -}}
{{- $setupSecret := default "" $setup.existingSecret -}}
{{- $authSecret := default "" $auth.existingSecret -}}
{{- $agentAuthSecret := default "" $agentAuth.existingSecret -}}
{{- $standaloneMode := eq (toString (default "false" (get $backendEnv "OHC_STANDALONE_MODE"))) "true" -}}
{{- if and (not $standaloneMode) (empty $grpcTlsSecret) -}}
{{- fail "backend.grpcTls.existingSecret is required when OHC_STANDALONE_MODE is not true" -}}
{{- end -}}
{{- if and (not $standaloneMode) (empty $authSecret) -}}
{{- fail "backend.auth.existingSecret is required in cloud mode" -}}
{{- end -}}
{{- if and (not $standaloneMode) (or (hasKey $backendEnv "JWT_SECRET") (hasKey $backendEnv "JWT_SECRET_FILE")) -}}
{{- fail "backend.env.JWT_SECRET and backend.env.JWT_SECRET_FILE are not supported in cloud mode; use backend.auth.existingSecret" -}}
{{- end -}}
{{- if and $standaloneMode (empty $agentAuthSecret) -}}
{{- fail "backend.agentAuth.existingSecret is required in standalone mode" -}}
{{- end -}}
{{- if or (hasKey $backendEnv "OHC_AGENT_TOKEN") (hasKey $backendEnv "OHC_AGENT_TOKEN_FILE") (hasKey $backendEnv "OHC_AGENT_AUTH_KEY") (hasKey $backendEnv "OHC_AGENT_AUTH_KEY_FILE") -}}
{{- fail "backend.env.OHC_AGENT_TOKEN, backend.env.OHC_AGENT_TOKEN_FILE, backend.env.OHC_AGENT_AUTH_KEY, and backend.env.OHC_AGENT_AUTH_KEY_FILE are not supported; use backend.agentAuth.existingSecret" -}}
{{- end -}}
{{- if and (hasKey $backendEnv "OHC_GRPC_PORT") (ne (toString (get $backendEnv "OHC_GRPC_PORT")) (toString $grpcPort)) -}}
{{- fail "backend.env.OHC_GRPC_PORT must match backend.grpc.port" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        {{- include "ohc.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $grpcTlsSecret }}
            - name: grpc-tls
              mountPath: /etc/ohc/grpc-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            {{- if not $standaloneMode }}
            - name: grpc
              containerPort: {{ $grpcPort }}
            {{- end }}
          env:
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "{{ .Values.backend.service.port }}"
            - name: OHC_PORT
              value: "{{ .Values.backend.service.port }}"
            {{- if not (hasKey $backendEnv "OHC_GRPC_PORT") }}
            - name: OHC_GRPC_PORT
              value: "{{ $grpcPort }}"
            {{- end }}
            {{- if and .Values.valkey.enabled (not (hasKey $backendEnv "REDIS_ADDR")) }}
            - name: REDIS_ADDR
              value: {{ include "ohc.valkey.addr" . | quote }}
            {{- end }}
            {{- if and .Values.valkey.enabled (not (hasKey $backendEnv "REDIS_URL")) }}
            - name: REDIS_URL
              value: {{ include "ohc.valkey.url" . | quote }}
            {{- end }}
            {{- if .Values.cnpg.enabled }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.cnpg.owner }}:$(POSTGRES_PASSWORD)@{{ .Values.cnpg.clusterName }}-rw/{{ .Values.cnpg.database }}?sslmode=require"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
            {{- end }}
            - name: OHC_MULTITENANT
              value: "{{ .Values.multiTenant.enabled }}"
            - name: OHC_HEADLESS
              value: "{{ .Values.backend.headless }}"
            {{- if and $setupSecret (not (hasKey $backendEnv "OHC_SETUP_TOKEN")) (not (hasKey $backendEnv "OHC_SETUP_TOKEN_FILE")) }}
            - name: OHC_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $setupSecret | quote }}
                  key: token
                  optional: true
            {{- end }}
            {{- if $grpcTlsSecret }}
            {{- if not (hasKey $backendEnv "OHC_GRPC_TLS_CERT_PATH") }}
            - name: OHC_GRPC_TLS_CERT_PATH
              value: /etc/ohc/grpc-tls/tls.crt
            {{- end }}
            {{- if not (hasKey $backendEnv "OHC_GRPC_TLS_KEY_PATH") }}
            - name: OHC_GRPC_TLS_KEY_PATH
              value: /etc/ohc/grpc-tls/tls.key
            {{- end }}
            {{- if not (hasKey $backendEnv "OHC_GRPC_CLIENT_CA_PATH") }}
            - name: OHC_GRPC_CLIENT_CA_PATH
              value: /etc/ohc/grpc-tls/ca.crt
            {{- end }}
            {{- end }}
            {{- range $name, $value := $backendEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.ohcCore.enabled }}
            - name: OHC_CORE_URL
              value: "http://{{ .Release.Name }}-ohc-core:{{ .Values.ohcCore.service.port }}"
            {{- end }}
            {{- if and $authSecret (not (hasKey $backendEnv "JWT_SECRET")) (not (hasKey $backendEnv "JWT_SECRET_FILE")) }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret | quote }}
                  key: jwtSecret
            {{- end }}
            {{- if $agentAuthSecret }}
            - name: OHC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $agentAuthSecret | quote }}
                  key: agentToken
            - name: OHC_AGENT_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $agentAuthSecret | quote }}
                  key: authKey
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            failureThreshold: {{ default 60 (get $startupProbe "failureThreshold") }}
            periodSeconds: {{ default 5 (get $startupProbe "periodSeconds") }}
            timeoutSeconds: {{ default 2 (get $startupProbe "timeoutSeconds") }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $grpcTlsSecret }}
        - name: grpc-tls
          secret:
            secretName: {{ $grpcTlsSecret | quote }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        {{- end }}
