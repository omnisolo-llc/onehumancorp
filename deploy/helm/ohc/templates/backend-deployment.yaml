{{- $backendEnv := default dict .Values.backend.env -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "{{ .Values.backend.service.port }}"
            - name: OHC_PORT
              value: "{{ .Values.backend.service.port }}"
            {{- if and .Values.valkey.enabled (not (hasKey $backendEnv "REDIS_ADDR")) }}
            - name: REDIS_ADDR
              value: {{ include "ohc.valkey.addr" . | quote }}
            {{- end }}
            {{- if and .Values.valkey.enabled (not (hasKey $backendEnv "REDIS_URL")) }}
            - name: REDIS_URL
              value: {{ include "ohc.valkey.url" . | quote }}
            {{- end }}
            {{- if .Values.cnpg.enabled }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.cnpg.owner }}:$(POSTGRES_PASSWORD)@{{ .Values.cnpg.clusterName }}-rw/{{ .Values.cnpg.database }}?sslmode=require"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
            {{- end }}
            - name: OHC_MULTITENANT
              value: "{{ .Values.multiTenant.enabled }}"
            - name: OHC_HEADLESS
              value: "{{ .Values.backend.headless }}"
            {{- range $name, $value := $backendEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.ohcCore.enabled }}
            - name: OHC_CORE_URL
              value: "http://{{ .Release.Name }}-ohc-core:{{ .Values.ohcCore.service.port }}"
            {{- end }}
            {{- if not (hasKey $backendEnv "JWT_SECRET") }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-backend-secret
                  key: jwtSecret
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
