apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ohc.fullname" . }}-grafana-dashboard
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "ohc-grafana-custom-css"
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
data:
  custom.css: |
    .grafana-app {
        backdrop-filter: blur(30px) saturate(210%) !important;
        background: rgba(22, 22, 26, 0.7) !important;
        font-family: 'Outfit', 'Inter', sans-serif !important;
    }
    .panel-container {
        backdrop-filter: blur(30px) saturate(210%);
        background: rgba(22, 22, 26, 0.7) !important;
        font-family: 'Outfit', 'Inter', sans-serif !important;
        border-radius: 12px !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    @media (prefers-color-scheme: light) {
        .panel-container {
            background: rgba(255, 255, 255, 0.65) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
        }
        .grafana-app {
            background: rgba(255, 255, 255, 0.65) !important;
        }
    }
