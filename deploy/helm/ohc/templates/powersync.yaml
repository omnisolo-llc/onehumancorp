{{- if .Values.powersync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-powersync
  labels:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.powersync.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: powersync
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: powersync
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: powersync
          image: "{{ .Values.powersync.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PS_PORT
              value: "8080"
            - name: PS_DATA_SOURCE_URI
              value: {{ .Values.powersync.dataSourceUri | quote }}
          resources:
            {{- toYaml .Values.powersync.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ohc.fullname" . }}-powersync
  labels:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.powersync.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: powersync
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
