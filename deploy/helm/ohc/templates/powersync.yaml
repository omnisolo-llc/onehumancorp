apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-powersync
spec:
  replicas: {{ .Values.powersync.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-powersync
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-powersync
    spec:
      containers:
        - name: powersync
          image: {{ .Values.powersync.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.powersync.service.port }}
          env:
            - name: PS_PORT
              value: "{{ .Values.powersync.service.port }}"
            {{- if .Values.cnpg.enabled }}
            - name: PS_DATA_SOURCE_URI
              value: "postgres://{{ .Values.cnpg.owner }}:$(POSTGRES_PASSWORD)@{{ .Values.cnpg.clusterName }}-rw:5432/{{ .Values.cnpg.database }}?sslmode=require"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
            {{- else }}
            - name: PS_DATA_SOURCE_URI
              value: "postgres://ohc:ohc@{{ .Release.Name }}-postgres:5432/ohc?sslmode=disable"
            {{- end }}
          resources:
            {{- toYaml .Values.powersync.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.powersync.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.powersync.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-powersync
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.powersync.service.port }}
      targetPort: {{ .Values.powersync.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-powersync
