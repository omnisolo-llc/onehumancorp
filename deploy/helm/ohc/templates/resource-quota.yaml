{{- if .Values.backend.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-tenant-quota
spec:
  hard:
    requests.cpu: {{ .Values.backend.resourceQuota.requests.cpu | default "4" | quote }}
    requests.memory: {{ .Values.backend.resourceQuota.requests.memory | default "8Gi" | quote }}
    requests.ephemeral-storage: {{ .Values.backend.resourceQuota.requests.ephemeralStorage | default "10Gi" | quote }}
    limits.cpu: {{ .Values.backend.resourceQuota.limits.cpu | default "8" | quote }}
    limits.memory: {{ .Values.backend.resourceQuota.limits.memory | default "16Gi" | quote }}
    limits.ephemeral-storage: {{ .Values.backend.resourceQuota.limits.ephemeralStorage | default "20Gi" | quote }}
    pods: {{ .Values.backend.resourceQuota.limits.pods | default "50" | quote }}
{{- end }}
