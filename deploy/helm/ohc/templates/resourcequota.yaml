{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ohc.fullname" . }}-resource-quota
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ default "4" .Values.resourceQuota.requests.cpu | quote }}
    requests.memory: {{ default "8Gi" .Values.resourceQuota.requests.memory | quote }}
    requests.ephemeral-storage: {{ default "10Gi" .Values.resourceQuota.requests.ephemeralStorage | quote }}
    limits.cpu: {{ default "8" .Values.resourceQuota.limits.cpu | quote }}
    limits.memory: {{ default "16Gi" .Values.resourceQuota.limits.memory | quote }}
    limits.ephemeral-storage: {{ default "20Gi" .Values.resourceQuota.limits.ephemeralStorage | quote }}
    pods: {{ default "20" .Values.resourceQuota.limits.pods | quote }}
{{- end }}
