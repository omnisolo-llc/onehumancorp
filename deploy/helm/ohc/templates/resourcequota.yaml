{{- if .Values.backend.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ohc.fullname" . }}-resource-quota
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ if .Values.multiTenant.enabled }}"4"{{ else }}{{ .Values.backend.resourceQuota.requests.cpu | quote }}{{ end }}
    requests.memory: {{ if .Values.multiTenant.enabled }}"8Gi"{{ else }}{{ .Values.backend.resourceQuota.requests.memory | quote }}{{ end }}
    requests.ephemeral-storage: {{ .Values.backend.resourceQuota.requests.ephemeralStorage | quote }}
    limits.cpu: {{ if .Values.multiTenant.enabled }}"8"{{ else }}{{ .Values.backend.resourceQuota.limits.cpu | quote }}{{ end }}
    limits.memory: {{ if .Values.multiTenant.enabled }}"16Gi"{{ else }}{{ .Values.backend.resourceQuota.limits.memory | quote }}{{ end }}
    limits.ephemeral-storage: {{ .Values.backend.resourceQuota.limits.ephemeralStorage | quote }}
    pods: {{ if .Values.multiTenant.enabled }}"20"{{ else }}{{ .Values.backend.resourceQuota.limits.pods | quote }}{{ end }}
{{- end }}
