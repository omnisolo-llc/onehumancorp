{{- if .Values.backend.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "ohc.fullname" . }}-resource-quota
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.backend.resourceQuota.requests.cpu | quote }}
    requests.memory: {{ .Values.backend.resourceQuota.requests.memory | quote }}
    requests.ephemeral-storage: {{ .Values.backend.resourceQuota.requests.ephemeralStorage | quote }}
    limits.cpu: {{ .Values.backend.resourceQuota.limits.cpu | quote }}
    limits.memory: {{ .Values.backend.resourceQuota.limits.memory | quote }}
    limits.ephemeral-storage: {{ .Values.backend.resourceQuota.limits.ephemeralStorage | quote }}
    pods: {{ .Values.backend.resourceQuota.limits.pods | quote }}
{{- end }}
