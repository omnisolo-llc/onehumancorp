{{- if and .Values.ohcCore.enabled .Values.ohcCore.autoscaling.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ohc-core-vpa
  labels:
    app: {{ .Release.Name }}-ohc-core
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ .Release.Name }}-ohc-core
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: ohc-core
        controlledResources: ["memory"]
        minAllowed:
          memory: {{ .Values.ohcCore.resources.requests.memory }}
        maxAllowed:
          memory: {{ .Values.ohcCore.resources.limits.memory }}
{{- end }}
