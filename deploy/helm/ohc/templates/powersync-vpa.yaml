{{- if and .Values.powersync.enabled .Values.powersync.autoscaling.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-powersync-vpa
  labels:
    app: {{ .Release.Name }}-powersync
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind:       Deployment
    name:       {{ .Release.Name }}-powersync
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: powersync
        controlledResources: ["memory"]
        minAllowed:
          memory: {{ .Values.powersync.resources.requests.memory }}
        maxAllowed:
          memory: {{ .Values.powersync.resources.limits.memory }}
{{- end }}
