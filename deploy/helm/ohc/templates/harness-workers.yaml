{{- if .Values.harnessWorkers.enabled }}
{{- range .Values.harnessWorkers.workers }}
{{- $worker := . }}
{{- $name := printf "%s-harness-%s" $.Release.Name $worker.id | trunc 63 | trimSuffix "-" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  replicas: {{ default $.Values.harnessWorkers.defaultReplicas $worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: {{ $.Release.Name }}
        omnisolo.io/harness: {{ $worker.harnessId | quote }}
        omnisolo.io/pool: {{ $worker.poolId | quote }}
    spec:
      terminationGracePeriodSeconds: {{ default 120 $.Values.harnessWorkers.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness-worker
          image: {{ default $.Values.harnessWorkers.image $worker.image }}
          imagePullPolicy: {{ $.Values.harnessWorkers.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ default $.Values.harnessWorkers.defaultGrpcPort $worker.grpcPort }}
            - name: health
              containerPort: {{ default $.Values.harnessWorkers.defaultHealthPort $worker.healthPort }}
          env:
            - name: OMNISOLO_HARNESS_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OMNISOLO_HARNESS_ID
              value: {{ $worker.harnessId | quote }}
            - name: OMNISOLO_HARNESS_POOL_ID
              value: {{ $worker.poolId | quote }}
            - name: OMNISOLO_HARNESS_GRPC_ADDR
              value: {{ printf "0.0.0.0:%v" (default $.Values.harnessWorkers.defaultGrpcPort $worker.grpcPort) | quote }}
            - name: OMNISOLO_HARNESS_HEALTH_ADDR
              value: {{ printf "0.0.0.0:%v" (default $.Values.harnessWorkers.defaultHealthPort $worker.healthPort) | quote }}
            {{- if $worker.localServices }}
            - name: OMNISOLO_LOCAL_SERVICE_ENDPOINT
              value: http://127.0.0.1:8095
            - name: OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "localServices.controlSecretName is required" $worker.localServices.controlSecretName | quote }}
                  key: {{ default "token" $worker.localServices.controlSecretKey | quote }}
            {{- end }}
            {{- range $key, $value := $worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $secret := $worker.secretEnv }}
            - name: {{ $secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secretName | quote }}
                  key: {{ $secret.key | quote }}
            {{- end }}
          resources:
            {{- toYaml (default $.Values.harnessWorkers.resources $worker.resources) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspace
              mountPath: /workspace
            - name: harness-home
              mountPath: /home/omnisolo
        {{- if $worker.localServices }}
        - name: local-services
          image: {{ required "localServices.image is required" $worker.localServices.image | quote }}
          imagePullPolicy: {{ $.Values.harnessWorkers.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: OMNISOLO_LOCAL_SERVICE_ADDR
              value: 127.0.0.1:8095
            - name: OMNISOLO_LOCAL_SERVICE_CONFIG_FILE
              value: /services-config/configuration.json
            - name: OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $worker.localServices.controlSecretName | quote }}
                  key: {{ default "token" $worker.localServices.controlSecretKey | quote }}
            {{- with $worker.localServices.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml (default $.Values.harnessWorkers.resources $worker.localServices.resources) | nindent 12 }}
          volumeMounts:
            - name: local-service-config
              mountPath: /services-config
              readOnly: true
            - name: local-service-data
              mountPath: /services
            - name: local-service-tmp
              mountPath: /tmp
        {{- end }}
        {{- if $worker.plandexServer }}
        - name: plandex-server
          image: {{ $worker.plandexServer.image | quote }}
          imagePullPolicy: {{ $.Values.harnessWorkers.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $worker.plandexServer.databaseSecretName | quote }}
                  key: {{ $worker.plandexServer.databaseSecretKey | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["python3", "-c", "import socket; socket.create_connection(('127.0.0.1',8099),2).close()"]
            periodSeconds: 5
          volumeMounts:
            - name: plandex-tmp
              mountPath: /tmp
            - name: plandex-files
              mountPath: /var/lib/plandex
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: harness-home
          emptyDir: {}
        {{- if $worker.localServices }}
        - name: local-service-config
          {{- if and $worker.localServices.configSecret $worker.localServices.configMap }}
          {{- fail "configure exactly one localServices.configSecret or configMap" }}
          {{- end }}
          {{- if $worker.localServices.configSecret }}
          secret:
            secretName: {{ $worker.localServices.configSecret | quote }}
          {{- else }}
          configMap:
            name: {{ required "localServices.configMap or configSecret is required" $worker.localServices.configMap | quote }}
          {{- end }}
        - name: local-service-data
          persistentVolumeClaim:
            claimName: {{ required "localServices.dataClaim is required" $worker.localServices.dataClaim | quote }}
        - name: local-service-tmp
          emptyDir: {}
        {{- end }}
        {{- if $worker.plandexServer }}
        - name: plandex-tmp
          emptyDir: {}
        - name: plandex-files
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: grpc
      port: {{ default $.Values.harnessWorkers.defaultGrpcPort $worker.grpcPort }}
      targetPort: grpc
{{- end }}
{{- end }}
