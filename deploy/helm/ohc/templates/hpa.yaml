{{- range $name, $component := dict "backend" .Values.backend "core" .Values.ohcCore "chatwoot" .Values.chatwoot "powersync" .Values.powersync }}
{{- if and (or (not (hasKey $component "enabled")) $component.enabled) $component.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" $ }}-{{ if eq $name "core" }}core{{ else }}{{ $name }}{{ end }}
  labels:
    {{- include "ohc.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ohc.fullname" $ }}-{{ if eq $name "core" }}core{{ else }}{{ $name }}{{ end }}
  minReplicas: {{ $component.autoscaling.minReplicas }}
  maxReplicas: {{ $component.autoscaling.maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: {{ if eq $name "core" }}ohc-core{{ else }}{{ $name }}{{ end }}
        target:
          type: Utilization
          averageUtilization: {{ $component.autoscaling.targetCPUUtilizationPercentage }}
{{- if $component.autoscaling.targetMemoryUtilizationPercentage }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: {{ if eq $name "core" }}ohc-core{{ else }}{{ $name }}{{ end }}
        target:
          type: Utilization
          averageUtilization: {{ $component.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
