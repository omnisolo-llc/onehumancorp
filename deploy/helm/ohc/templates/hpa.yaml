    name: {{ include "ohc.fullname" . }}-core
  minReplicas: {{ .Values.ohcCore.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ohcCore.autoscaling.maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: ohc-core
        target:
          type: Utilization
          averageUtilization: {{ .Values.ohcCore.autoscaling.targetCPUUtilizationPercentage }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: ohc-core
        target:
          type: Utilization
          averageUtilization: {{ .Values.ohcCore.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
---
{{- if and .Values.powersync.enabled .Values.powersync.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-powersync
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ohc.fullname" . }}-powersync
  minReplicas: {{ .Values.powersync.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.powersync.autoscaling.maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: powersync
        target:
          type: Utilization
          averageUtilization: {{ .Values.powersync.autoscaling.targetCPUUtilizationPercentage }}
{{- if .Values.powersync.autoscaling.targetMemoryUtilizationPercentage }}
    - type: ContainerResource
      containerResource:
        name: memory
        container: powersync
        target:
          type: Utilization
          averageUtilization: {{ .Values.powersync.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- end }}
