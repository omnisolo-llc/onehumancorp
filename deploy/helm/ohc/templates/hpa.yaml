{{- if .Values.ohcCore.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-ohc-core-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-ohc-core
  minReplicas: {{ .Values.ohcCore.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.ohcCore.autoscaling.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ohcCore.autoscaling.targetCPUUtilizationPercentage | default 80 }}
{{- end }}
