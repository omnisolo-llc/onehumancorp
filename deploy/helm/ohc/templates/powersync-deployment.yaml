{{- $dataSource := default dict .Values.powersync.dataSource -}}
{{- $dataSourceSecret := default "" $dataSource.existingSecret -}}
{{- if and .Values.powersync.enabled (not .Values.cnpg.enabled) (empty $dataSourceSecret) -}}
{{- fail "powersync.dataSource.existingSecret is required when PowerSync is enabled without CNPG" -}}
{{- end -}}
{{- if .Values.powersync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-powersync
spec:
  replicas: {{ .Values.powersync.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-powersync
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-powersync
        {{- include "ohc.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: powersync
          image: {{ .Values.powersync.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.powersync.service.targetPort }}
          env:
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
            - name: PS_PORT
              value: "{{ .Values.powersync.service.targetPort }}"
            {{- if .Values.cnpg.enabled }}
            - name: PS_DATA_SOURCE_URI
              value: "postgres://{{ .Values.cnpg.owner }}:$(POSTGRES_PASSWORD)@{{ .Values.cnpg.clusterName }}-rw/{{ .Values.cnpg.database }}?sslmode=require"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cnpg.clusterName }}-app
                  key: password
            {{- else }}
            - name: PS_DATA_SOURCE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $dataSourceSecret | quote }}
                  key: uri
            {{- end }}
          resources:
            {{- toYaml .Values.powersync.resources | nindent 12 }}
{{- end }}
