apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-powersync
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
    app.kubernetes.io/component: powersync
spec:
  replicas: {{ .Values.powersync.replicas }}
  selector:
    matchLabels:
      {{- include "ohc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: powersync
  template:
    metadata:
      labels:
        {{- include "ohc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: powersync
    spec:
      containers:
        - name: powersync
          image: "{{ .Values.powersync.image }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PS_PORT
              value: "8080"
            - name: PS_DATA_SOURCE_URI
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=disable"
            - name: POSTGRES_USER
              value: "ohc"
            - name: POSTGRES_PASSWORD
              value: "ohc"
            - name: POSTGRES_HOST
              value: "{{ include "ohc.fullname" . }}-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "ohc"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.powersync.resources | nindent 12 }}
