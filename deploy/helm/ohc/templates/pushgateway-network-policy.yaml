{{- if and .Values.pushgateway.enabled .Values.pushgateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-pushgateway-policy
  labels:
    app: {{ .Release.Name }}-pushgateway
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-pushgateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9091
          protocol: TCP
  egress:
    - {}
{{- end }}
