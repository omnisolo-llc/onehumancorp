apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pushgateway
  labels:
    app: {{ .Release.Name }}-pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pushgateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pushgateway
    spec:
      containers:
      - name: pushgateway
        image: prom/pushgateway:latest
        ports:
        - containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pushgateway
  labels:
    app: {{ .Release.Name }}-pushgateway
spec:
  ports:
  - port: 9091
    targetPort: 9091
    name: http
  selector:
    app: {{ .Release.Name }}-pushgateway
