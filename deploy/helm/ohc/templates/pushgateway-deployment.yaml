{{- if .Values.pushgateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.6.2
        args:
        - "--log.level=info"
        - "--log.format=json"
        ports:
        - containerPort: 9091
        resources:
          {{- toYaml .Values.pushgateway.resources | nindent 12 }}
{{- end }}
