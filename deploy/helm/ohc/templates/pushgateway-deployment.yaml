apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-pushgateway
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
    app.kubernetes.io/component: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ohc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pushgateway
  template:
    metadata:
      labels:
        {{- include "ohc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: "prom/pushgateway:v1.6.2"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
