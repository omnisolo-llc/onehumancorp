{{- if .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "ohc.fullname" . }}-backend
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: {{ include "ohc.fullname" . }}-backend
  updatePolicy:
    updateMode: "Auto"
{{- end }}
