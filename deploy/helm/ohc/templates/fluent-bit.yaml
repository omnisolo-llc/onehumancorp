{{- if .Values.fluentBit.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ohc.fullname" . }}-fluent-bit
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
      - name: fluent-bit
        image: {{ .Values.fluentBit.image }}
        resources:
          requests:
            cpu: {{ .Values.fluentBit.resources.requests.cpu | quote }}
            memory: {{ .Values.fluentBit.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.fluentBit.resources.limits.cpu | quote }}
            memory: {{ .Values.fluentBit.resources.limits.memory | quote }}
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: "elasticsearch-master"
        - name: FLUENT_ELASTICSEARCH_PORT
          value: "9200"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluent-bit-config
        configMap:
          name: {{ include "ohc.fullname" . }}-fluent-bit-config
{{- end }}
