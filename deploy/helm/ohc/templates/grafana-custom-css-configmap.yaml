apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-custom-css
  labels:
    {{- include "ohc.labels" . | nindent 4 }}
data:
  custom.css: |-
    /* OHC Premium CSS Tokens */
    * {
        font-family: 'Outfit', 'Inter', sans-serif;
    }

    /* Light Mode Translucent Glass */
    @media (prefers-color-scheme: light) {
        .panel-container {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(30px) saturate(210%) !important;
            font-family: 'Outfit', 'Inter', sans-serif !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
        }
        .grafana-app {
            background: rgba(255, 255, 255, 0.65) !important;
            backdrop-filter: blur(30px) saturate(210%) !important;
            font-family: 'Outfit', 'Inter', sans-serif !important;
        }
    }

    /* Dark Mode Translucent Glass */
    @media (prefers-color-scheme: dark) {
        .panel-container {
            background: rgba(22, 22, 26, 0.7) !important;
            backdrop-filter: blur(30px) saturate(210%) !important;
            font-family: 'Outfit', 'Inter', sans-serif !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .grafana-app {
            background: rgba(22, 22, 26, 0.7) !important;
            backdrop-filter: blur(30px) saturate(210%) !important;
            background-color: #0b0c10 !important;
            font-family: 'Outfit', 'Inter', sans-serif !important;
        }
    }
