# Dynamically provision Grafana dashboards for Dashboard-as-Code automation
{{- if dig "kube-prometheus-stack" "grafana" "enabled" false .Values }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  labels:
    grafana_dashboard: "1"
data:
{{- range $file, $content := .Files.Glob "dashboards/*.json" }}
  {{ base $file }}: |-
{{ $content | toString | indent 4 }}
{{- end }}
{{- end }}
