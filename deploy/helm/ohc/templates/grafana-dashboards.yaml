{{- if index .Values "kube-prometheus-stack" "grafana" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ohc.fullname" . }}-dashboards
  labels:
    grafana_dashboard: "1"
    {{- include "ohc.labels" . | nindent 4 }}
data:
{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
{{- end }}
