{{- if index .Values "kube-prometheus-stack" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  labels:
    grafana_dashboard: "1"
data:
{{- range $path, $bytes := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
{{- end }}
