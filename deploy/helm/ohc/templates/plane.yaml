{{- if .Values.plane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-plane-api
  labels:
    app.kubernetes.io/name: plane-api
spec:
  replicas: {{ .Values.plane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-api
    spec:
      containers:
        - name: plane-api
          image: "{{ .Values.plane.backendImage }}"
          command: ["./bin/takeoff"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgres://ohc:ohc@{{ include "ohc.fullname" . }}-postgres:5432/plane?sslmode=disable"
            - name: REDIS_URL
              value: "redis://{{ include "ohc.fullname" . }}-redis:6379/1"
            - name: SECRET_KEY
              value: {{ .Values.plane.secretKey | quote }}
            - name: WEB_URL
              value: "http://{{ include "ohc.fullname" . }}-plane-web"
          resources:
            {{- toYaml .Values.plane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ohc.fullname" . }}-plane-api
  labels:
    app.kubernetes.io/name: plane-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: plane-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-plane-web
  labels:
    app.kubernetes.io/name: plane-web
spec:
  replicas: {{ .Values.plane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-web
    spec:
      containers:
        - name: plane-web
          image: "{{ .Values.plane.frontendImage }}"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://{{ include "ohc.fullname" . }}-plane-api:8000"
          resources:
            {{- toYaml .Values.plane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ohc.fullname" . }}-plane-web
  labels:
    app.kubernetes.io/name: plane-web
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: plane-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ohc.fullname" . }}-plane-worker
  labels:
    app.kubernetes.io/name: plane-worker
spec:
  replicas: {{ .Values.plane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-worker
    spec:
      containers:
        - name: plane-worker
          image: "{{ .Values.plane.backendImage }}"
          command: ["./bin/worker"]
          env:
            - name: DATABASE_URL
              value: "postgres://ohc:ohc@{{ include "ohc.fullname" . }}-postgres:5432/plane?sslmode=disable"
            - name: REDIS_URL
              value: "redis://{{ include "ohc.fullname" . }}-redis:6379/1"
            - name: SECRET_KEY
              value: {{ .Values.plane.secretKey | quote }}
          resources:
            {{- toYaml .Values.plane.resources | nindent 12 }}
{{- end }}
