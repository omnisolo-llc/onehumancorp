apiVersion: v2
name: ohc
description: One Human Corp backend/frontend chart (includes Redis and CloudNative-PG)
type: application
version: 0.4.32
appVersion: "0.4.32"
dependencies:
  - name: redis
    version: "20.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: kube-prometheus-stack
    version: "58.1.3"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kube-prometheus-stack.enabled
