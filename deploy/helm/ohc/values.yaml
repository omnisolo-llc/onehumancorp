backend:
  image: onehumancorp/server:latest
  replicas: 1
  headless: false
  service:
    port: 8080
  networkPolicy:
    enabled: true
  vpa:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  # Set to "true" to enable the multi-tenant TenantRegistry.
  # In multi-tenant mode a single server instance handles all organisations;
  # each user can only see their own company's data after login.
  multiTenant: true

  networkPolicy:
    enabled: true

resourceQuota:
  enabled: true
  requests:
    cpu: "20"
    memory: "20Gi"
    ephemeralStorage: "50Gi"
  limits:
    cpu: "60"
    memory: "120Gi"
    ephemeralStorage: "150Gi"
    pods: "200"

# OHC Core — Rust library (settings · agent scheduler · meeting rooms · chat)
# In cloud-native mode the core runs as a dedicated micro-service.
ohcCore:
  enabled: true
  image: onehumancorp/mono-core:latest
  replicas: 1
  service:
    port: 18789
  networkPolicy:
    enabled: true
  vpa:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Redis subchart (Bitnami) – used for session caching and pub/sub
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false

# CloudNative PostgreSQL operator cluster
# Set cnpg.enabled=true when the CNPG operator is installed in the cluster.
cnpg:
  enabled: false
  clusterName: ohc-pg
  instances: 3
  storage:
    size: 10Gi
  database: ohc
  owner: ohc

# Chatwoot – open-source chat platform used for all chat room communication
# (agent-to-agent, agent-to-human, agent-to-customer, human-to-customer).
chatwoot:
  enabled: true
  image: chatwoot/chatwoot:v3.15.1
  replicas: 1
  service:
    port: 3000
  networkPolicy:
    enabled: true
  vpa:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Admin credentials used by OHC backend to auto-configure the inbox.
  adminEmail: admin@ohc.local
  # PostgreSQL connection for Chatwoot's own schema.
  # When cnpg.enabled=true, override this to point to the CNPG cluster.
  databaseUrl: ""   # defaults to in-cluster postgres service
  # Redis URL – defaults to the same Redis as the OHC backend.
  redisUrl: ""      # defaults to in-cluster redis service

# Multi-tenant configuration.
# When multiTenant.enabled is true the backend uses the TenantRegistry so
# that every logged-in user can only see their own company's data.
multiTenant:
  enabled: true
  # Maximum number of tenant organisations supported per replica.
  maxOrgs: 5000


# PowerSync - synchronization engine
powersync:
  enabled: true
  image: journeyapps/powersync-service:latest
  replicas: 1
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8080
  networkPolicy:
    enabled: true
  vpa:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Kube-Prometheus-Stack for Cloud Observability
kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
    env:
      GF_LOG_CONSOLE_FORMAT: "json"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"


# ─── Observability Stack Extensions ───────────────────────────────────────
promtail:
  enabled: true
  image: grafana/promtail:latest
  resources:
    limits:
      cpu: 100m
      memory: 128Mi

loki:
  enabled: true
  image: grafana/loki:latest
  resources:
    limits:
      cpu: 200m
      memory: 256Mi

