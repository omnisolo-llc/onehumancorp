backend:
  autoscaling:
    enabled: true
    maxReplicas: 200
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  headless: false
  image: onehumancorp/server:latest
  multiTenant: true
  networkPolicy:
    enabled: true
  replicas: 2
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  service:
    port: 8080
  vpa:
    enabled: true
chatwoot:
  adminEmail: admin@ohc.local
  autoscaling:
    enabled: true
    maxReplicas: 200
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  databaseUrl: ''
  enabled: true
  image: chatwoot/chatwoot:v3.15.1
  networkPolicy:
    enabled: true
  redisUrl: ''
  replicas: 2
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  service:
    port: 3000
  vpa:
    enabled: true
cnpg:
  clusterName: ohc-pg
  database: ohc
  enabled: false
  instances: 3
  owner: ohc
  storage:
    size: 10Gi
fluentBit:
  enabled: true
  image: fluent/fluent-bit:latest
  logLevel: info
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
    env:
      GF_LOG_CONSOLE_FORMAT: json
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/grafana-dashboard.json"
      GF_FEATURE_TOGGLES_ENABLE: "newPanelChromeUI"
    extraConfigmapMounts:
    - configMap: ohc-grafana-custom-css
      mountPath: /usr/share/grafana/public/css/custom.css
      name: grafana-custom-css
      readOnly: true
      subPath: custom.css
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: '1'
multiTenant:
  enabled: true
  maxOrgs: 5000
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
ohcCore:
  autoscaling:
    enabled: true
    maxReplicas: 200
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  enabled: true
  image: onehumancorp/mono-core:latest
  networkPolicy:
    enabled: true
  replicas: 2
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  service:
    port: 18789
  vpa:
    enabled: true
powersync:
  autoscaling:
    enabled: true
    maxReplicas: 200
    minReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  enabled: true
  image: journeyapps/powersync-service:latest
  networkPolicy:
    enabled: true
  replicas: 2
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  service:
    port: 8081
    targetPort: 8080
    type: ClusterIP
  vpa:
    enabled: true
resourceQuota:
  enabled: true
  limits:
    cpu: '50'
    ephemeralStorage: 200Gi
    memory: 100Gi
    pods: '100'
  requests:
    cpu: '10'
    ephemeralStorage: 50Gi
    memory: 20Gi
valkey:
  dataStorage:
    accessModes:
    - ReadWriteOnce
    className: ''
    enabled: false
    requestedSize: 1Gi
  enabled: true
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: valkey/valkey
    tag: ''
  podSecurityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  service:
    port: 6379
