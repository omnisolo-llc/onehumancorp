{{- if .Values.harnessWorkers.enabled }}
{{- range .Values.harnessWorkers.workers }}
{{- if .autoscaling.enabled }}
{{- $name := printf "%s-harness-%s" $.Release.Name .id | trunc 63 | trimSuffix "-" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .autoscaling.minReplicas }}
  maxReplicas: {{ .autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
