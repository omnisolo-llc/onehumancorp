# OmniSolo's unattended DeepSeek Harness composition. Stdout is reserved for
# newline-delimited JSON-RPC; credentials are referenced by environment name.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-openai-compatible
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai-compatible:
        displayName: OpenAI-compatible
        apiKeyEnv: OPENAI_API_KEY
        api: openai-responses
        baseURL: !!js process.env.OPENAI_API_BASE_URL ?? 'https://api.openai.com/v1'
        reasoning: !!js process.env.OPENAI_REASONING_EFFORT ?? 'max'
        models:
          - id: !!js process.env.OPENAI_MODEL ?? 'gpt-5.6-luna'
            name: !!js process.env.OPENAI_MODEL ?? 'gpt-5.6-luna'
            contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 400000)
            maxTokens: !!js Number(process.env.DSH_MAX_OUTPUT_TOKENS ?? 128000)
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              max: max

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pty
  name: '@deepseek-ai/dsh-terminal'

- id: terminal-bash
  name: '@deepseek-ai/dsh-terminal-bash'
  config:
    timeoutMs: 300000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are an OmniSolo software engineering agent.'
    workspaceContext:
      maxBytes: 65536

- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  config:
    timeoutMs: 300000

- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? '/tmp/omnisolo-deepseek-sessions'
    compression: none
