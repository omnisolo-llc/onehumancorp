# Optional overlay: add -f deploy/docker-compose.local-services.yml to the base Compose command.
# Provision each <root>/<harness>/configuration.json and data directory before startup.
services:
  harness-omnisolo:
    environment:
      OMNISOLO_LOCAL_SERVICE_ENDPOINT: http://127.0.0.1:8095
      OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN: ${OMNISOLO_OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN:-}
  harness-omnisolo-local-services:
    profiles: ["harness"]
    image: ${OMNISOLO_LOCAL_SERVICE_IMAGE:-omnisolo/harness-local-services:local}
    network_mode: service:harness-omnisolo
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    environment:
      OMNISOLO_LOCAL_SERVICE_ADDR: 127.0.0.1:8095
      OMNISOLO_LOCAL_SERVICE_CONFIG_FILE: /services-config/configuration.json
      OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN: ${OMNISOLO_OMNISOLO_LOCAL_SERVICE_CONTROL_TOKEN:-}
    volumes:
      - ${OMNISOLO_LOCAL_SERVICE_ROOT:?service configuration root required}/omnisolo/configuration.json:/services-config/configuration.json:ro
      - ${OMNISOLO_LOCAL_SERVICE_ROOT:?service configuration root required}/omnisolo/data:/services
    depends_on:
      harness-omnisolo:
        condition: service_started
  harness-codex:
    environment:
