# One Human Corp — Docker Compose
#
# Single-machine deployment defaults to the same lean cloud/web shape exercised
# by deploy/tests/kind_e2e_test.sh: server + pgvector Postgres + Valkey.
# Optional sidecars are available through Compose profiles.
#
# Cloud-native (k8s) deployment: see deploy/helm/ for multi-tenant Helm charts.

services:
  # ─── Rust Core (settings · agent scheduler · meeting rooms · chat) ────────
  ohc-core:
    profiles: ["ohc-core"]
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/mono-core:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      LISTEN_ADDR: "0.0.0.0:18789"
      PORT: "18789"
      OHC_PORT: "18789"
      OHC_GRPC_PORT: "18790"
      DATABASE_URL_FILE: /run/secrets/database-url
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      OHC_STANDALONE_MODE: "false"
      OHC_MULTITENANT: "true"
      OHC_AUTH_RATE_LIMIT_DEPLOYMENT: single-instance
      OHC_GRPC_TLS_CERT_PATH: /etc/ohc/grpc-tls/server.crt
      OHC_GRPC_TLS_KEY_PATH: /etc/ohc/grpc-tls/server.key
      OHC_GRPC_CLIENT_CA_PATH: /etc/ohc/grpc-tls/ca.crt
      REDIS_URL: redis://valkey:6379
    volumes:
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.crt:/etc/ohc/grpc-tls/server.crt:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.key:/etc/ohc/grpc-tls/server.key:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/ca.crt:/etc/ohc/grpc-tls/ca.crt:ro
      - ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}:/run/secrets/jwt-secret:ro
      - ${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}:/run/secrets/database-url:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "18789:18789"

  server:
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/server:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      PORT: "8080"
      OHC_PORT: "8080"
      REDIS_ADDR: valkey:6379
      REDIS_URL: redis://valkey:6379
      DATABASE_URL_FILE: /run/secrets/database-url
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OHC_LLM_PROVIDER: ${OHC_LLM_PROVIDER:-minimax}
      OHC_LLM_MODEL: ${OHC_LLM_MODEL:-MiniMax-M3}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      OHC_AGENT_TASK_TIMEOUT_SECS: ${OHC_AGENT_TASK_TIMEOUT_SECS:-240}
      OHC_LLM_TIMEOUT_SECS: ${OHC_LLM_TIMEOUT_SECS:-180}
      OHC_BUILTIN_AGENT_BINARY: ${OHC_BUILTIN_AGENT_BINARY:-/usr/local/bin/ohc-builtin-agent}
      OHC_STANDALONE_MODE: "false"
      OHC_AUTH_RATE_LIMIT_DEPLOYMENT: single-instance
      OHC_GRPC_TLS_CERT_PATH: /etc/ohc/grpc-tls/server.crt
      OHC_GRPC_TLS_KEY_PATH: /etc/ohc/grpc-tls/server.key
      OHC_GRPC_CLIENT_CA_PATH: /etc/ohc/grpc-tls/ca.crt
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      OHC_SETUP_TOKEN_FILE: /run/secrets/setup-token
      OHC_MULTITENANT: "true"
      # Set to "true" for API-only / remote-client deployments.
      OHC_HEADLESS: ${OHC_HEADLESS:-false}
    volumes:
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.crt:/etc/ohc/grpc-tls/server.crt:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.key:/etc/ohc/grpc-tls/server.key:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/ca.crt:/etc/ohc/grpc-tls/ca.crt:ro
      - ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}:/run/secrets/jwt-secret:ro
      - ${OHC_SETUP_TOKEN_FILE:?OHC_SETUP_TOKEN_FILE is required}:/run/secrets/setup-token:ro
      - ${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}:/run/secrets/database-url:ro
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${OHC_DOCKER_SERVER_PORT:-8080}:8080"
      - "${OHC_DOCKER_GRPC_PORT:-127.0.0.1:8081}:8081"

  # ─── One-time admin bootstrap ─────────────────────────────────────────────
  # Runs once at install time: waits for `server` to be healthy, then creates
  # the initial admin account from SETUP_ADMIN_INIT_USERNAME / _PASSWORD.
  # The setup endpoint is one-admin-only and returns 409 after success, so this
  # helper safely verifies bootstrap state on every stack start.
  server-init:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    entrypoint: ["/bin/sh"]
    command: ["/scripts/bootstrap-admin.sh"]
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/server-init/bootstrap-admin.sh:/scripts/bootstrap-admin.sh:ro
      - ${OHC_SETUP_TOKEN_FILE:?OHC_SETUP_TOKEN_FILE is required}:/run/secrets/setup-token:ro
      - ${SETUP_ADMIN_INIT_PASSWORD_FILE:?SETUP_ADMIN_INIT_PASSWORD_FILE is required}:/run/secrets/admin-password:ro
    environment:
      SERVER_URL: http://server:8080
      OHC_SETUP_TOKEN_FILE: /run/secrets/setup-token
      SETUP_ADMIN_INIT_USERNAME: ${SETUP_ADMIN_INIT_USERNAME:?SETUP_ADMIN_INIT_USERNAME is required}
      SETUP_ADMIN_INIT_EMAIL: ${SETUP_ADMIN_INIT_EMAIL:?SETUP_ADMIN_INIT_EMAIL is required}
      SETUP_ADMIN_INIT_PASSWORD_FILE: /run/secrets/admin-password
      SETUP_ADMIN_INIT_ORGANIZATION_ID: ${SETUP_ADMIN_INIT_ORGANIZATION_ID:?SETUP_ADMIN_INIT_ORGANIZATION_ID is required}
    depends_on:
      server:
        condition: service_started
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  valkey:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: valkey/valkey:8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    pull_policy: missing
    ports:
      - "${OHC_DOCKER_VALKEY_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: pgvector/pgvector:pg15@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
    pull_policy: missing
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      LOG_LEVEL: "info"
      POSTGRES_USER: ohc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ohc
      POSTGRES_MULTIPLE_DATABASES: ohc
    volumes:
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - postgres-data:/var/lib/postgresql/data
      - ${OHC_POSTGRES_PASSWORD_FILE:?OHC_POSTGRES_PASSWORD_FILE is required}:/run/secrets/postgres-password:ro
    ports:
      - "${OHC_DOCKER_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohc"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  powersync:
    profiles: ["sync"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: journeyapps/powersync-service:latest
    ports:
      - "${OHC_DOCKER_POWERSYNC_PORT:-127.0.0.1:8082}:8080"
    environment:
      LOG_LEVEL: "info"
      PS_DATA_SOURCE_URI: ${OHC_POWERSYNC_DATABASE_URL:-}
      PS_PORT: "8080"
    volumes:
      - ./docker/powersync/sync_rules.yaml:/config/sync_rules.yaml
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  prometheus:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=agent'
    volumes:
      - ./docker/prometheus/prometheus-agent.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M

  grafana:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_LOG_CONSOLE_FORMAT: "json"
      LOG_LEVEL: "info"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/grafana-dashboard.json"
      GF_FEATURE_TOGGLES_ENABLE: "newPanelChromeUI"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/custom.css:/usr/share/grafana/public/css/custom.css:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M




  pushgateway:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  telemetry-mcp-bridge:
    profiles: ["telemetry-mcp"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: mcp/telemetry-bridge:latest
    environment:
      LOG_LEVEL: "info"
      PROMETHEUS_URL: http://prometheus:9090
      OHC_STANDALONE_MODE: $${OHC_STANDALONE_MODE:-false}
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  edge-cache:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:

      - server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

volumes:
  # Persist the real database across normal Compose restarts.
  postgres-data:
  nginx-cache:
