      OMNISOLO_HARNESS_POOL_ID: openhands
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OMNISOLO_HARNESS_EXECUTABLE: openhands-agent-server
