# OmniSolo — Docker Compose
#
# Single-machine deployment defaults to the same lean cloud/web shape exercised
# by deploy/tests/kind_e2e_test.sh: server + pgvector Postgres + Valkey.
# Optional sidecars are available through Compose profiles.
#
# Cloud-native (k8s) deployment: see deploy/helm/ for multi-tenant Helm charts.

services:
  # ─── Rust Core (settings · agent scheduler · meeting rooms · chat) ────────
  ohc-core:
    profiles: ["ohc-core"]
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/mono-core:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      LISTEN_ADDR: "0.0.0.0:18789"
      PORT: "18789"
      OHC_PORT: "18789"
      OHC_GRPC_PORT: "18790"
      DATABASE_URL_FILE: /run/secrets/database-url
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      OHC_STANDALONE_MODE: "false"
      OHC_MULTITENANT: "true"
      OHC_AUTH_RATE_LIMIT_DEPLOYMENT: single-instance
      OHC_GRPC_TLS_CERT_PATH: /etc/ohc/grpc-tls/server.crt
      OHC_GRPC_TLS_KEY_PATH: /etc/ohc/grpc-tls/server.key
      OHC_GRPC_CLIENT_CA_PATH: /etc/ohc/grpc-tls/ca.crt
      REDIS_URL: redis://valkey:6379
    volumes:
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.crt:/etc/ohc/grpc-tls/server.crt:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.key:/etc/ohc/grpc-tls/server.key:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/ca.crt:/etc/ohc/grpc-tls/ca.crt:ro
      - ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}:/run/secrets/jwt-secret:ro
      - ${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}:/run/secrets/database-url:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "18789:18789"

  server:
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/server:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      PORT: "8080"
      OHC_PORT: "8080"
      REDIS_ADDR: valkey:6379
      REDIS_URL: redis://valkey:6379
      DATABASE_URL_FILE: /run/secrets/database-url
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OHC_LLM_PROVIDER: ${OHC_LLM_PROVIDER:-minimax}
      OHC_LLM_MODEL: ${OHC_LLM_MODEL:-MiniMax-M3}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      OHC_AGENT_TASK_TIMEOUT_SECS: ${OHC_AGENT_TASK_TIMEOUT_SECS:-240}
      OHC_LLM_TIMEOUT_SECS: ${OHC_LLM_TIMEOUT_SECS:-180}
      OHC_BUILTIN_AGENT_BINARY: ${OHC_BUILTIN_AGENT_BINARY:-/usr/local/bin/ohc-builtin-agent}
      OHC_STANDALONE_MODE: "false"
      OHC_AUTH_RATE_LIMIT_DEPLOYMENT: single-instance
      OHC_GRPC_TLS_CERT_PATH: /etc/ohc/grpc-tls/server.crt
      OHC_GRPC_TLS_KEY_PATH: /etc/ohc/grpc-tls/server.key
      OHC_GRPC_CLIENT_CA_PATH: /etc/ohc/grpc-tls/ca.crt
      JWT_SECRET_FILE: /run/secrets/jwt-secret
      OHC_SETUP_TOKEN_FILE: /run/secrets/setup-token
      OHC_MULTITENANT: "true"
      # Set to "true" for API-only / remote-client deployments.
      OHC_HEADLESS: ${OHC_HEADLESS:-false}
    volumes:
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.crt:/etc/ohc/grpc-tls/server.crt:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/server.key:/etc/ohc/grpc-tls/server.key:ro
      - ${OHC_DOCKER_GRPC_TLS_DIR:?OHC_DOCKER_GRPC_TLS_DIR is required}/ca.crt:/etc/ohc/grpc-tls/ca.crt:ro
      - ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}:/run/secrets/jwt-secret:ro
      - ${OHC_SETUP_TOKEN_FILE:?OHC_SETUP_TOKEN_FILE is required}:/run/secrets/setup-token:ro
      - ${DATABASE_URL_FILE:?DATABASE_URL_FILE is required}:/run/secrets/database-url:ro
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${OHC_DOCKER_SERVER_PORT:-8080}:8080"
      - "${OHC_DOCKER_GRPC_PORT:-127.0.0.1:8081}:8081"

  # Harness pools are separate services so each adapter can scale independently
  # from the gateway and from the other harnesses.
  harness-omnisolo:
    profiles: ["harness"]
    image: ${OMNISOLO_HARNESS_WORKER_IMAGE:-omnisolo/harness-worker:0.1.0}
    stop_grace_period: ${OMNISOLO_HARNESS_STOP_GRACE_PERIOD:-120s}
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /workspace:mode=0700,uid=1000,gid=1000
      - /home/omnisolo:mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_HARNESS_WORKER_ID: harness-omnisolo
      OMNISOLO_HARNESS_ID: omnisolo
      OMNISOLO_HARNESS_POOL_ID: omnisolo
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://llmapi.omnisolo.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_OMNISOLO_GRPC_PORT:-127.0.0.1:8090}:8090"
      - "${OMNISOLO_HARNESS_OMNISOLO_HEALTH_PORT:-127.0.0.1:8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  harness-codex:
    profiles: ["harness"]
    image: ${OMNISOLO_HARNESS_CODEX_IMAGE:-omnisolo/harness-worker-codex:0.149.0}
    stop_grace_period: ${OMNISOLO_HARNESS_STOP_GRACE_PERIOD:-120s}
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /workspace:mode=0700,uid=1000,gid=1000
      - /home/omnisolo:mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_HARNESS_WORKER_ID: harness-codex
      OMNISOLO_HARNESS_ID: codex
      OMNISOLO_HARNESS_POOL_ID: codex
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OMNISOLO_HARNESS_EXECUTABLE: ${OMNISOLO_HARNESS_CODEX_EXECUTABLE:-codex}
      OMNISOLO_HARNESS_ARGS_JSON: ${OMNISOLO_HARNESS_CODEX_ARGS_JSON:-["app-server","--stdio"]}
      OMNISOLO_HARNESS_PROTOCOL: codex_app_server
      OMNISOLO_HARNESS_REQUEST_TIMEOUT_SECS: ${OMNISOLO_HARNESS_CODEX_TIMEOUT_SECS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://llmapi.omnisolo.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_CODEX_GRPC_PORT:-127.0.0.1:8092}:8090"
      - "${OMNISOLO_HARNESS_CODEX_HEALTH_PORT:-127.0.0.1:8093}:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

