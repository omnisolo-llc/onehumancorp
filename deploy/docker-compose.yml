  harness-goose:
    profiles: ["harness"]
    image: ${OMNISOLO_HARNESS_GOOSE_IMAGE:-omnisolo/harness-worker-goose:1.33.1}
    stop_grace_period: ${OMNISOLO_HARNESS_STOP_GRACE_PERIOD:-120s}
