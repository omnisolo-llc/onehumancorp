# One Human Corp — Docker Compose
#
# Single-machine deployment defaults to the same lean cloud/web shape exercised
# by deploy/tests/kind_e2e_test.sh: server + pgvector Postgres + Valkey.
# Optional sidecars are available through Compose profiles.
#
# Cloud-native (k8s) deployment: see deploy/helm/ for multi-tenant Helm charts.

services:
  # ─── Rust Core (settings · agent scheduler · meeting rooms · chat) ────────
  ohc-core:
    profiles: ["ohc-core"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/mono-core:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      LISTEN_ADDR: "0.0.0.0:18789"
      DATABASE_URL: postgres://ohc:ohc@postgres:5432/ohc?sslmode=disable
      REDIS_URL: redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "18789:18789"

  server:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 256M
    image: onehumancorp/server:latest
    pull_policy: never
    environment:
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
      PORT: "8080"
      OHC_PORT: "8080"
      REDIS_ADDR: valkey:6379
      REDIS_URL: redis://valkey:6379
      DATABASE_URL: postgres://ohc:ohc@postgres:5432/ohc?sslmode=disable
      CHATWOOT_URL: http://chatwoot:3000
      CHATWOOT_ADMIN_EMAIL: admin@ohc.local
      CHATWOOT_ADMIN_PASSWORD: changeme
      CHATWOOT_ENABLED: ${CHATWOOT_ENABLED:-false}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OHC_LLM_PROVIDER: ${OHC_LLM_PROVIDER:-minimax}
      OHC_LLM_MODEL: ${OHC_LLM_MODEL:-MiniMax-M3}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      OHC_AGENT_TASK_TIMEOUT_SECS: ${OHC_AGENT_TASK_TIMEOUT_SECS:-240}
      OHC_LLM_TIMEOUT_SECS: ${OHC_LLM_TIMEOUT_SECS:-180}
      OHC_BUILTIN_AGENT_BINARY: ${OHC_BUILTIN_AGENT_BINARY:-/usr/local/bin/ohc-builtin-agent}
      # Multi-tenant mode is disabled by default in single-docker deployment.
      # Set to "true" to enable the TenantRegistry for k8s-style multi-tenancy.
      OHC_MULTITENANT: ${OHC_MULTITENANT:-false}
      # Set to "true" for API-only / remote-client deployments.
      OHC_HEADLESS: ${OHC_HEADLESS:-false}
      # Initial admin credentials read by the one-time bootstrap script.
      SETUP_ADMIN_INIT_USERNAME: ${SETUP_ADMIN_INIT_USERNAME:-admin}
      SETUP_ADMIN_INIT_PASSWORD: ${SETUP_ADMIN_INIT_PASSWORD:-admin}
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${OHC_DOCKER_SERVER_PORT:-8080}:8080"

  # ─── One-time admin bootstrap ─────────────────────────────────────────────
  # Runs once at install time: waits for `server` to be healthy, then creates
  # the initial admin account from SETUP_ADMIN_INIT_USERNAME / _PASSWORD.
  # A marker file written to the `server-init-data` volume prevents it from
  # repeating even if the container is restarted.
  server-init:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: alpine:3.19
    command: sh /scripts/bootstrap-admin.sh
    volumes:
      - ./docker/server-init/bootstrap-admin.sh:/scripts/bootstrap-admin.sh:ro
      - server-init-data:/data
    environment:
      SERVER_URL: http://server:8080
      SETUP_ADMIN_INIT_USERNAME: ${SETUP_ADMIN_INIT_USERNAME:-admin}
      SETUP_ADMIN_INIT_PASSWORD: ${SETUP_ADMIN_INIT_PASSWORD:-admin}
    depends_on:
      server:
        condition: service_started
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  valkey:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7
    pull_policy: missing
    ports:
      - "${OHC_DOCKER_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:15
    pull_policy: missing
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      LOG_LEVEL: "info"
      POSTGRES_USER: ohc
      POSTGRES_PASSWORD: ohc
      POSTGRES_DB: ohc
      POSTGRES_MULTIPLE_DATABASES: ohc,chatwoot
    volumes:
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    ports:
      - "${OHC_DOCKER_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohc"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  powersync:
    profiles: ["sync"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: journeyapps/powersync-service:latest
    ports:
      - "8081:8080"
    environment:
      LOG_LEVEL: "info"
      PS_DATA_SOURCE_URI: postgres://ohc:ohc@postgres:5432/ohc?sslmode=disable
      PS_PORT: "8080"
    volumes:
      - ./docker/powersync/sync_rules.yaml:/config/sync_rules.yaml
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  chatwoot-migrate:
    profiles: ["chatwoot"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: chatwoot/chatwoot:latest
    command: bundle exec rails db:chatwoot_prepare
    environment:
      LOG_LEVEL: "info"
      SECRET_KEY_BASE: changeme_secret_key_base_at_least_64_chars_long_for_production
      DATABASE_URL: postgres://ohc:ohc@postgres:5432/chatwoot?sslmode=disable
      REDIS_URL: redis://valkey:6379
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      DEFAULT_LOCALE: en
      FORCE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  chatwoot:
    profiles: ["chatwoot"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: chatwoot/chatwoot:latest
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      LOG_LEVEL: "info"
      SECRET_KEY_BASE: changeme_secret_key_base_at_least_64_chars_long_for_production
      DATABASE_URL: postgres://ohc:ohc@postgres:5432/chatwoot?sslmode=disable
      REDIS_URL: redis://valkey:6379
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      DEFAULT_LOCALE: en
      FORCE_SSL: "false"
    ports:
      - "3002:3000"
    depends_on:
      - chatwoot-migrate
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  chatwoot-worker:
    profiles: ["chatwoot"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: chatwoot/chatwoot:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      LOG_LEVEL: "info"
      SECRET_KEY_BASE: changeme_secret_key_base_at_least_64_chars_long_for_production
      DATABASE_URL: postgres://ohc:ohc@postgres:5432/chatwoot?sslmode=disable
      REDIS_URL: redis://valkey:6379
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      DEFAULT_LOCALE: en
      FORCE_SSL: "false"
    depends_on:
      - chatwoot
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  prometheus:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=agent'
    volumes:
      - ./docker/prometheus/prometheus-agent.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M

  grafana:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_LOG_CONSOLE_FORMAT: "json"
      LOG_LEVEL: "info"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/grafana-dashboard.json"
      GF_FEATURE_TOGGLES_ENABLE: "newPanelChromeUI"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/custom.css:/usr/share/grafana/public/css/custom.css:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M




  pushgateway:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  telemetry-mcp-bridge:
    profiles: ["telemetry-mcp"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: mcp/telemetry-bridge:latest
    environment:
      LOG_LEVEL: "info"
      PROMETHEUS_URL: http://prometheus:9090
      OHC_STANDALONE_MODE: $${OHC_STANDALONE_MODE:-false}
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

volumes:
  # Persists the bootstrap marker so the admin-init script runs only once.
  server-init-data:
