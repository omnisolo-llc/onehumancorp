    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_HARNESS_WORKER_ID: harness-goose
      OMNISOLO_HARNESS_ID: goose
      OMNISOLO_HARNESS_POOL_ID: goose
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OMNISOLO_HARNESS_EXECUTABLE: omnisolo-openai-shim
      OMNISOLO_HARNESS_ARGS_JSON: '[]'
      OMNISOLO_HARNESS_PROTOCOL: openai_compatible_shim
      OMNISOLO_HARNESS_REQUEST_TIMEOUT_SECS: ${OMNISOLO_HARNESS_GOOSE_TIMEOUT_SECS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://llmapi.omnisolo.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_GOOSE_GRPC_PORT:-127.0.0.1:8112}:8090"
      - "${OMNISOLO_HARNESS_GOOSE_HEALTH_PORT:-127.0.0.1:8113}:8091"
    healthcheck: *harness-healthcheck

  harness-open-interpreter:
    profiles: ["harness"]
    image: ${OMNISOLO_HARNESS_OPEN_INTERPRETER_IMAGE:-omnisolo/harness-worker-open-interpreter:0.4.2}
    stop_grace_period: ${OMNISOLO_HARNESS_STOP_GRACE_PERIOD:-120s}
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /workspace:mode=0700,uid=1000,gid=1000
      - /home/omnisolo:mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_HARNESS_WORKER_ID: harness-open-interpreter
      OMNISOLO_HARNESS_ID: open-interpreter
      OMNISOLO_HARNESS_POOL_ID: open-interpreter
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OMNISOLO_HARNESS_EXECUTABLE: omnisolo-openai-shim
      OMNISOLO_HARNESS_ARGS_JSON: '[]'
      OMNISOLO_HARNESS_PROTOCOL: openai_compatible_shim
      OMNISOLO_HARNESS_REQUEST_TIMEOUT_SECS: ${OMNISOLO_HARNESS_OPEN_INTERPRETER_TIMEOUT_SECS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://llmapi.omnisolo.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_OPEN_INTERPRETER_GRPC_PORT:-127.0.0.1:8114}:8090"
      - "${OMNISOLO_HARNESS_OPEN_INTERPRETER_HEALTH_PORT:-127.0.0.1:8115}:8091"
    healthcheck: *harness-healthcheck

  harness-plandex:
    profiles: ["harness"]
    image: ${OMNISOLO_HARNESS_PLANDEX_IMAGE:-omnisolo/harness-worker-plandex:2.2.1}
    stop_grace_period: ${OMNISOLO_HARNESS_STOP_GRACE_PERIOD:-120s}
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /workspace:mode=0700,uid=1000,gid=1000
      - /home/omnisolo:mode=0700,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_HARNESS_WORKER_ID: harness-plandex
      PLANDEX_ENV: development
      PLANDEX_API_HOST: http://127.0.0.1:8099
      OMNISOLO_HARNESS_ID: plandex
      OMNISOLO_HARNESS_POOL_ID: plandex
      OMNISOLO_HARNESS_GRPC_ADDR: 0.0.0.0:8090
      OMNISOLO_HARNESS_HEALTH_ADDR: 0.0.0.0:8091
      OMNISOLO_HARNESS_EXECUTABLE: omnisolo-openai-shim
      OMNISOLO_HARNESS_ARGS_JSON: '[]'
      OMNISOLO_HARNESS_PROTOCOL: openai_compatible_shim
      OMNISOLO_HARNESS_REQUEST_TIMEOUT_SECS: ${OMNISOLO_HARNESS_PLANDEX_TIMEOUT_SECS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://llmapi.omnisolo.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_PLANDEX_GRPC_PORT:-127.0.0.1:8116}:8090"
      - "${OMNISOLO_HARNESS_PLANDEX_HEALTH_PORT:-127.0.0.1:8117}:8091"
    healthcheck: *harness-healthcheck

  # Plandex's native server shares loopback with its CLI worker, while owning
  # its database credentials and filesystem in separate containers/volumes.
  plandex-server:
    profiles: ["harness"]
    image: ${OMNISOLO_PLANDEX_SERVER_IMAGE:-omnisolo/plandex-server:2.2.1}
    network_mode: service:harness-plandex
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    environment:
      DB_HOST: plandex-postgres
      DB_SSLMODE: disable
      DB_PORT: "5432"
      DB_USER: plandex
      DB_NAME: plandex
      DB_PASSWORD_FILE: /run/secrets/plandex-database-password
    volumes:
      - plandex-files:/var/lib/plandex
      - ${OHC_POSTGRES_PASSWORD_FILE:?OHC_POSTGRES_PASSWORD_FILE is required}:/run/secrets/plandex-database-password:ro
    depends_on:
      harness-plandex:
        condition: service_started
      plandex-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',8099),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 24

  plandex-postgres:
    profiles: ["harness"]
    image: pgvector/pgvector:pg15@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
    environment:
      POSTGRES_USER: plandex
      POSTGRES_DB: plandex
      POSTGRES_PASSWORD_FILE: /run/secrets/plandex-database-password
    volumes:
      - plandex-postgres-data:/var/lib/postgresql/data
      - ${OHC_POSTGRES_PASSWORD_FILE:?OHC_POSTGRES_PASSWORD_FILE is required}:/run/secrets/plandex-database-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plandex -d plandex"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional model-runtime pool. This is a protocol placeholder until an
  # approved managed or self-hosted serving image is selected.
  model-runtime-default:
    profiles: ["model-runtime"]
    image: ${OMNISOLO_MODEL_RUNTIME_WORKER_IMAGE:-omnisolo/model-runtime-worker:latest}
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      OMNISOLO_MODEL_RUNTIME_WORKER_ID: model-runtime-default
      OMNISOLO_MODEL_RUNTIME_RUNTIME_ID: ${OMNISOLO_MODEL_RUNTIME_ID:-managed-api}
      OMNISOLO_MODEL_RUNTIME_POOL_ID: model-default
      OMNISOLO_MODEL_RUNTIME_GRPC_ADDR: 0.0.0.0:8096
      OMNISOLO_MODEL_RUNTIME_HEALTH_ADDR: 0.0.0.0:8097
    ports:
      - "${OMNISOLO_MODEL_RUNTIME_GRPC_PORT:-127.0.0.1:8096}:8096"
      - "${OMNISOLO_MODEL_RUNTIME_HEALTH_PORT:-127.0.0.1:8097}:8097"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8097/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── One-time admin bootstrap ─────────────────────────────────────────────
  # Runs once at install time: waits for `server` to be healthy, then creates
  # the initial admin account from SETUP_ADMIN_INIT_USERNAME / _PASSWORD.
  # The setup endpoint is one-admin-only and returns 409 after success, so this
  # helper safely verifies bootstrap state on every stack start.
  server-init:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
    entrypoint: ["/bin/sh"]
    command: ["/scripts/bootstrap-admin.sh"]
    user: "${OHC_DOCKER_UID:-1000}:${OHC_DOCKER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./docker/server-init/bootstrap-admin.sh:/scripts/bootstrap-admin.sh:ro
      - ${OHC_SETUP_TOKEN_FILE:?OHC_SETUP_TOKEN_FILE is required}:/run/secrets/setup-token:ro
      - ${SETUP_ADMIN_INIT_PASSWORD_FILE:?SETUP_ADMIN_INIT_PASSWORD_FILE is required}:/run/secrets/admin-password:ro
    environment:
      SERVER_URL: http://server:8080
      OHC_SETUP_TOKEN_FILE: /run/secrets/setup-token
      SETUP_ADMIN_INIT_USERNAME: ${SETUP_ADMIN_INIT_USERNAME:?SETUP_ADMIN_INIT_USERNAME is required}
      SETUP_ADMIN_INIT_EMAIL: ${SETUP_ADMIN_INIT_EMAIL:?SETUP_ADMIN_INIT_EMAIL is required}
      SETUP_ADMIN_INIT_PASSWORD_FILE: /run/secrets/admin-password
      SETUP_ADMIN_INIT_ORGANIZATION_ID: ${SETUP_ADMIN_INIT_ORGANIZATION_ID:?SETUP_ADMIN_INIT_ORGANIZATION_ID is required}
    depends_on:
      server:
        condition: service_started
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  valkey:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: valkey/valkey:8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    pull_policy: missing
    ports:
      - "${OHC_DOCKER_VALKEY_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: pgvector/pgvector:pg15@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
    pull_policy: missing
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      LOG_LEVEL: "info"
      POSTGRES_USER: ohc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB: ohc
      POSTGRES_MULTIPLE_DATABASES: ohc
    volumes:
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - postgres-data:/var/lib/postgresql/data
      - ${OHC_POSTGRES_PASSWORD_FILE:?OHC_POSTGRES_PASSWORD_FILE is required}:/run/secrets/postgres-password:ro
    ports:
      - "${OHC_DOCKER_POSTGRES_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohc"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  powersync:
    profiles: ["sync"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: journeyapps/powersync-service:latest
    ports:
      - "${OHC_DOCKER_POWERSYNC_PORT:-127.0.0.1:8082}:8080"
    environment:
      LOG_LEVEL: "info"
      PS_DATA_SOURCE_URI: ${OHC_POWERSYNC_DATABASE_URL:-}
      PS_PORT: "8080"
    volumes:
      - ./docker/powersync/sync_rules.yaml:/config/sync_rules.yaml
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  prometheus:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=agent'
    volumes:
      - ./docker/prometheus/prometheus-agent.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M

  grafana:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_LOG_CONSOLE_FORMAT: "json"
      LOG_LEVEL: "info"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/grafana-dashboard.json"
      GF_FEATURE_TOGGLES_ENABLE: "newPanelChromeUI"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/custom.css:/usr/share/grafana/public/css/custom.css:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M




  pushgateway:
    profiles: ["observability"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  telemetry-mcp-bridge:
    profiles: ["telemetry-mcp"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: mcp/telemetry-bridge:latest
    environment:
      LOG_LEVEL: "info"
      PROMETHEUS_URL: http://prometheus:9090
      OHC_STANDALONE_MODE: $${OHC_STANDALONE_MODE:-false}
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256M

  edge-cache:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:

      - server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

volumes:
  # Persist the real database across normal Compose restarts.
  postgres-data:
  plandex-postgres-data:
  plandex-files:
  nginx-cache:
