      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-max}
    ports:
      - "${OMNISOLO_HARNESS_DEEPSEEK_GRPC_PORT:-127.0.0.1:8100}:8090"
      - "${OMNISOLO_HARNESS_DEEPSEEK_HEALTH_PORT:-127.0.0.1:8101}:8091"
    healthcheck: &harness-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/healthz >/dev/null"]
