services:
  server:
    pull_policy: never
    build:
      context: ../
      dockerfile: deploy/docker/server/Dockerfile

  postgres:
    image: pgvector/pgvector:pg15
    pull_policy: missing
    command: ["postgres", "-c", "wal_level=logical"]

  valkey:
    image: valkey/valkey:8-alpine
    pull_policy: missing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
