services:
  ohc-core:
    pull_policy: never
    image: onehumancorp/mono-core:latest

  server:
    pull_policy: never
    image: onehumancorp/server:latest

  postgres:
    pull_policy: never
    # Using local-pgvector:15 as a fallback when pgvector/pgvector hits rate limits or fails on overlayfs.
    image: local-pgvector:15
