services:
  ohc-core:
    pull_policy: never
    image: onehumancorp/mono-core:latest

  server:
    pull_policy: never
    image: onehumancorp/server:latest

  postgres:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "wal_level=logical"]

  valkey:
    image: valkey/valkey:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
