# docker-compose.e2e.yml — Lean E2E infrastructure stack.
#
# Starts ONLY the shared infrastructure services (postgres, redis, and the
# ohc-core stub).  The OHC server binary is intentionally NOT run as a
# container here: it is started directly by run-playwright.mjs from the
# Bazel-built binary so that no Docker image rebuild is required.
#
# Usage (managed automatically by run-playwright.mjs):
#   docker compose -f deploy/docker-compose.e2e.yml up -d

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: public.ecr.aws/docker/library/postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ohc
      POSTGRES_PASSWORD: ohc
      POSTGRES_DB: ohc
      POSTGRES_MULTIPLE_DATABASES: ohc,chatwoot
    volumes:
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohc"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: public.ecr.aws/docker/library/redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 64M

  # ─── ohc-core stub ────────────────────────────────────────────────────────
  # The sync daemons in the Go server only run in SQLite mode
  # (IsSQLite() == false for Postgres), so no actual requests are made.
  # This container simply exists to satisfy any connectivity checks.
  ohc-core:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: public.ecr.aws/docker/library/busybox:latest
    command: sleep infinity
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 8M
