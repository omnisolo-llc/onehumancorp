[package]
name = "ohc-builtin-agent"
version = "0.1.0"
edition = "2021"
description = "OHC builtin agent - headless agent communicating with main server via gRPC"

[[bin]]
name = "ohc-builtin-agent"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glob = "0.3"
anyhow = "1"
futures = "0.3"
bytes = "1"
http = "1"
async-trait = "0.1"
regex = "1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
