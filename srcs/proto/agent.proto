edition = "2024";

package ohc.agent;

import "srcs/proto/common.proto";

option go_package = "github.com/onehumancorp/mono/srcs/proto/ohc/agent;agentpb";

message Agent {
  string id = 1;
  ohc.common.Role role = 2;
  string name = 3;
  ohc.common.AgentStatus status = 4;
  string organization_id = 5;
}

message AgentMessage {
  string id = 1;
  string from_agent_id = 2;
  string to_agent_id = 3;
  string message_type = 4;
  string content = 5;
  string meeting_id = 6;
  int64 occurred_at_unix = 7;
}

enum InteractionType {
  TASK = 0;
  STATUS = 1;
  HANDOFF = 2;
  APPROVAL = 3;
}

message AgentInteraction {
  string id = 1;                // UUID for tracing
  string sender_id = 2;         // SPIFFE ID of the sender
  string recipient_id = 3;      // Optional (Empty for broadcast)
  string meeting_id = 4;        // Context grouping
  InteractionType type = 5;     // TASK, STATUS, HANDOFF, APPROVAL
  bytes payload = 6;            // Protobuf-encoded domain data
  map<string, string> metadata = 7; // Operational headers (Tracing, Priority)
}

message AgentHandoff {
  string source_agent_id = 1;
  string target_agent_id = 2;
  string task_id = 3;
  string context_summary = 4;
  bytes state_snapshot = 5;     // Serialized state/checkpoint data for smooth resumption
  map<string, string> metadata = 6;
}

service AgentOrchestration {
  rpc RegisterAgent(Agent) returns (Agent);
  rpc PublishMessage(AgentMessage) returns (AgentMessage);
  rpc InitiateHandoff(AgentHandoff) returns (AgentMessage);
  rpc StreamInteractions(AgentInteraction) returns (stream AgentInteraction);
}
