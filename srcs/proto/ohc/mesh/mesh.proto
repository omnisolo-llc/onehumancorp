edition = "2024";

package ohc.mesh;


option go_package = "github.com/onehumancorp/mono/srcs/proto/ohc/mesh;meshpb";

message MeshEvent {
  string agent_id = 1;
  string action = 2;
  string status = 3;
  string sender_id = 4;
  string role = 5;
  string content = 6;
  int64 timestamp_ms = 7;
}

service MeshService {
    rpc Broadcast(MeshEvent) returns (MeshEvent);
}
