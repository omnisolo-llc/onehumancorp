edition = "2024";

package ohc.wizard;

option go_package = "github.com/onehumancorp/mono/srcs/proto/wizardpb;wizardpb";

import "model.proto";

// WizardMode describes whether the user is in form mode or natural-language mode.
enum WizardMode {
  WIZARD_MODE_UNSPECIFIED = 0;
  WIZARD_MODE_FORM = 1;
  WIZARD_MODE_NATURAL_LANGUAGE = 2;
}

// WizardConfigureRequest configures the platform via the wizard.
message WizardConfigureRequest {
  string listen_addr = 1;
  string db_path = 2;
  string postgres_url = 3;
  string redis_url = 4;
  string centrifuge_url = 5;
  string minimax_api_key = 6;
  repeated ModelProviderConfig ai_providers = 7;
  map<string, string> extras = 8;
}

// ModelProviderConfig describes an AI provider configuration.
message ModelProviderConfig {
  string id = 1;
  ohc.model.ProviderType provider_type = 2;
  string name = 3;
  string base_url = 4;
  string api_key = 5;
  string model = 6;
  repeated string models = 7;
  bool enabled = 8;
  bool is_official = 9;
}

// WizardStatusResponse describes the completion state of each wizard step.
message WizardStatusResponse {
  bool configured = 1;
  bool step_server = 2;
  bool step_ai_provider = 3;
  bool step_centrifuge = 4;
}

// WizardBootstrapBusinessRequest initiates AI-driven company creation.
message WizardBootstrapBusinessRequest {
  string prompt = 1;
  string company_name = 2;
  string industry = 3;
  string company_size = 4;
  repeated string goals = 5;
  string deployment_preference = 6;
  string admin_name = 7;
  string admin_email = 8;
  WizardMode mode = 9;
}

// WizardNlChatRequest sends a natural-language message in the NL wizard mode.
message WizardNlChatRequest {
  string session_id = 1;
  string message = 2;
  // Current partial form state carried along so NL mode can populate form fields.
  WizardBootstrapBusinessRequest partial_state = 3;
}

// WizardNlChatResponse carries the assistant reply and any field updates.
message WizardNlChatResponse {
  string session_id = 1;
  string reply = 2;
  // Field updates extracted from the NL reply (key = field name, value = new value).
  map<string, string> field_updates = 3;
  bool ready_to_submit = 4;
}

// ModelProviderWizardRequest walks the user through configuring a model provider.
message ModelProviderWizardRequest {
  int32 step = 1;
  ModelProviderConfig provider = 2;
  string agent_type = 3; // "builtin" | "openclaw" | "ironclaw"
}

// ModelProviderWizardResponse returns wizard step instructions and validation.
message ModelProviderWizardResponse {
  int32 step = 1;
  int32 total_steps = 2;
  string title = 3;
  string instruction = 4;
  repeated string validation_errors = 5;
  bool complete = 6;
  ModelProviderConfig configured_provider = 7;
}

// WizardService provides the wizard over gRPC and WebSocket.
service WizardService {
  // Configure the platform settings.
  rpc Configure(WizardConfigureRequest) returns (WizardStatusResponse);
  // Bootstrap a new business using AI.
  rpc BootstrapBusiness(WizardBootstrapBusinessRequest) returns (WizardStatusResponse);
  // Natural-language wizard chat (streaming).
  rpc NlChat(WizardNlChatRequest) returns (stream WizardNlChatResponse);
  // Model provider configuration wizard.
  rpc ModelProviderWizard(ModelProviderWizardRequest) returns (ModelProviderWizardResponse);
}
