edition = "2024";

package ohc.integration;

option go_package = "github.com/onehumancorp/mono/srcs/proto/integrationpb;integrationpb";

message WizardField {
  string key = 1;
  string label = 2;
  string type = 3; // e.g., "text", "password", "url"
  bool required = 4;
  string description = 5;
}

message WizardStep {
  string title = 1;
  string description = 2;
  repeated WizardField fields = 3;
}

message IntegrationMetadata {
  string id = 1;
  string name = 2;
  string type = 3;      
  string category = 4;  
  string base_url = 5;
  string description = 6;
  string publisher = 7;
  string icon = 8;
  repeated string tags = 9;
}
