edition = "2024";

package ohc.orchestration;


option go_package = "github.com/onehumancorp/mono/srcs/proto;orchestrationpb";

message Agent {
  string id = 1;
  string name = 2;
  string role = 3;
  string organization_id = 4;
  string status = 5;
  string provider_type = 6;
}

message Message {
  string id = 1;
  string from_agent = 2;
  string to_agent = 3;
  string type = 4;
  string content = 5;
  string meeting_id = 6;
  int64 occurred_at_unix = 7;
}

message MeetingRoom {
  string id = 1;
  string agenda = 2;
  repeated string participants = 3;
  repeated Message transcript = 4;
}

message RegisterAgentRequest {
  Agent agent = 1;
}

message RegisterAgentResponse {
  bool success = 1;
}

message OpenMeetingRequest {
  string meeting_id = 1;
  string agenda = 2;
  repeated string participants = 3;
}

message PublishMessageRequest {
  Message message = 1;
}

message PublishMessageResponse {
  bool success = 1;
}

message DelegateTaskRequest {
  string from_agent_id = 1;
  string to_agent_id = 2;
  Message task = 3;
}

message DelegateTaskResponse {
  bool success = 1;
}

message SubTask {
  string task_id = 1;
  string target_role = 2;
  string instruction = 3;
  string parent_thread_id = 4;
  string from_agent_id = 5;
}

message TokenEfficientContextSummarizationEvent {
  string event_id = 1;
  string agent_id = 2;
  bytes payload = 3;
}

message ToolParameterAutoCorrectionEvent {
  string event_id = 1;
  string agent_id = 2;
  bytes payload = 3;
}

message StreamMessagesRequest {
  string agent_id = 1;
}

message ReasonRequest {
  string prompt = 1;
  string from_agent_id = 2;
}

message ReasonResponse {
  string content = 1;
}

service HubService {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc OpenMeeting(OpenMeetingRequest) returns (MeetingRoom);
  rpc Publish(PublishMessageRequest) returns (PublishMessageResponse);
  rpc DelegateTask(DelegateTaskRequest) returns (DelegateTaskResponse);
  rpc StreamMessages(StreamMessagesRequest) returns (stream Message);
  rpc Reason(ReasonRequest) returns (ReasonResponse);
  rpc InitiateHandoff(HandoffRequest) returns (HandoffResponse);
  rpc ResolveHandoff(HandoffResolveRequest) returns (HandoffResolveResponse);
  rpc DelegateSubTask(SubTask) returns (DelegateTaskResponse);
}

message HandoffPackage {
  string id = 1;
  string intent = 2;
  string from_agent_id = 3;
  string to_human_role = 4;
  string current_state = 5;
  int32 failed_attempts = 6;
  string status = 7;
  string created_at = 8;
  bytes visual_ground_truth = 9;
}

message HandoffRequest {
  HandoffPackage handoff = 1;
}

message HandoffResponse {
  bool success = 1;
}

message HandoffResolveRequest {
  string handoff_id = 1;
  string status = 2;
}

message HandoffResolveResponse {
  bool success = 1;
}
