syntax = "proto3";

package ohc.orchestration;

option go_package = "github.com/onehumancorp/mono/srcs/proto;pb";

message MeshEvent {
  string event_id = 1;
  string topic = 2;
  bytes payload = 3;
  int64 timestamp = 4;
}

message PublishMeshEventRequest {
  MeshEvent event = 1;
}

message PublishMessageResponse {
  bool success = 1;
}

message EventStreamRequest {
  string topic = 1;
}

service HubService {
  rpc StreamMeshEvents(EventStreamRequest) returns (stream MeshEvent);
  rpc PublishMeshEvent(PublishMeshEventRequest) returns (PublishMessageResponse);
}
