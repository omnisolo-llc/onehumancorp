edition = "2024";

package ohc.orchestration;


option go_package = "github.com/onehumancorp/mono/srcs/proto;pb";

message Agent {
  string id = 1;
  string name = 2;
  string role = 3;
  string organization_id = 4;
  string status = 5;
  string provider_type = 6;
  string region = 7;
  bool managed = 8;
}

message Message {
  string id = 1;
  string from_agent = 2;
  string to_agent = 3;
  string type = 4;
  string content = 5;
  string meeting_id = 6;
  int64 occurred_at_unix = 7;
}

message MeetingRoom {
  string id = 1;
  string agenda = 2;
  repeated string participants = 3;
  repeated Message transcript = 4;
}

message RegisterAgentRequest {
  Agent agent = 1;
}

message RegisterAgentResponse {
  bool success = 1;
}

message OpenMeetingRequest {
  string meeting_id = 1;
  string agenda = 2;
  repeated string participants = 3;
}

message PublishMessageRequest {
  Message message = 1;
}

message PublishMessageResponse {
  bool success = 1;
}

message DelegateTaskRequest {
  string from_agent_id = 1;
  string to_agent_id = 2;
  Message task = 3;
}

message DelegateTaskResponse {
  bool success = 1;
}

message SubTask {
  string task_id = 1;
  string target_role = 2;
  string instruction = 3;
  string parent_thread_id = 4;
  string from_agent_id = 5;
}

message TokenEfficientContextSummarizationEvent {
  string event_id = 1;
  string agent_id = 2;
  bytes payload = 3;
}

message ToolParameterAutoCorrectionEvent {
  string event_id = 1;
  string agent_id = 2;
  bytes payload = 3;
}

message StreamMessagesRequest {
  string agent_id = 1;
}

message ReasonRequest {
  string prompt = 1;
  string from_agent_id = 2;
}

message ReasonResponse {
  string content = 1;
}

message AgentCapabilities {
  string agent_id = 1;
  repeated string supported_skills = 2;
  int32 max_concurrent_tasks = 3;
}

message Query {
  string filter = 1;
}

message EventStreamRequest {
  string topic = 1;
}

message MeshEvent {
  string event_id = 1;
  string topic = 2;
  bytes payload = 3;
  int64 timestamp = 4;
}

enum WorkerPhase {
  WORKER_PHASE_UNSPECIFIED = 0;
  WORKER_PHASE_STARTING = 1;
  WORKER_PHASE_READY = 2;
  WORKER_PHASE_BUSY = 3;
  WORKER_PHASE_STOPPING = 4;
  WORKER_PHASE_FAILED = 5;
}

message WorkerState {
  string agent_id = 1;
  WorkerPhase phase = 2;
  string runtime = 3;
  int64 observed_at_unix = 4;
  string detail = 5;
}

message ReportWorkerStateRequest {
  WorkerState state = 1;
}

message ReportWorkerStateResponse {
  bool success = 1;
}

message WorkerConfig {
  string agent_id = 1;
  string agent_name = 2;
  string role = 3;
  string organization_id = 4;
  string provider_type = 5;
  string region = 6;
  string hub_address = 7;
  string builtin_address = 8;
}

message TaskAssignment {
  string issue_id = 1;
  string issue_name = 2;
  string directive = 3;
  string prompt = 4;
  string work_dir = 5;
}

message KillTaskRequest {
  string task_id = 1;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_COMPLETED = 1;
  TASK_STATUS_FAILED = 2;
  TASK_STATUS_KILLED = 3;
}

message TaskResultEnvelope {
  string task_id = 1;
  string description = 2;
  TaskStatus status = 3;
  string result = 4;
  string error = 5;
  int32 tool_use_count = 6;
  int64 started_at_unix = 7;
  int64 ended_at_unix = 8;
}

service HubService {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc ReportWorkerState(ReportWorkerStateRequest) returns (ReportWorkerStateResponse);
  rpc OpenMeeting(OpenMeetingRequest) returns (MeetingRoom);
  rpc Publish(PublishMessageRequest) returns (PublishMessageResponse);
  rpc DelegateTask(DelegateTaskRequest) returns (DelegateTaskResponse);
  rpc StreamMessages(StreamMessagesRequest) returns (stream Message);
  rpc Reason(ReasonRequest) returns (ReasonResponse);
  rpc DelegateSubTask(SubTask) returns (DelegateTaskResponse);
  rpc AdvertiseCapabilities(AgentCapabilities) returns (PublishMessageResponse);
  rpc DiscoverAgents(Query) returns (stream AgentCapabilities);
  rpc StreamMeshEvents(EventStreamRequest) returns (stream MeshEvent);
}

message WizardField {
  string key = 1;
  string label = 2;
  string type = 3; // e.g., "text", "password", "url"
  bool required = 4;
  string description = 5;
}

message WizardStep {
  string title = 1;
  string description = 2;
  repeated WizardField fields = 3;
}

message IntegrationMetadata {
  string id = 1;
  string name = 2;
  string type = 3;      
  string category = 4;  
  string base_url = 5;
  string description = 6;
  string publisher = 7;
  string icon = 8;
  repeated string tags = 9;
}
