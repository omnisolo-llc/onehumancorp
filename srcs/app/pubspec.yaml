name: ohc_app
description: One Human Corp — Cross-platform app (iOS, Android, macOS, Windows, Linux, Web)
publish_to: "none"
version: 0.4.5+1

environment:
  sdk: "^3.8.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^17.2.1

  # State management
  flutter_riverpod: ^3.3.1

  # Networking
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  centrifuge: ^0.18.0
  protobuf: ^6.0.0
  grpc: ^5.1.0

  # Local storage
  shared_preferences: ^2.5.5

  # Icons
  cupertino_icons: ^1.0.9

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  path: ^1.9.1
  yaml: ^3.1.3
  # flutter_svg: ^2.0.10 # Disabled for Bazel build compatibility

  # Database Sync (PowerSync for Hybrid Architecture)
  powersync: ^2.0.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  analyzer: ^12.1.0
  dart_style: ^3.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
