name: ohc_app
description: One Human Corp — Cross-platform app (iOS, Android, macOS, Windows, Linux, Web)
publish_to: "none"
version: 0.3.6+1

environment:
  sdk: "^3.7.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  centrifuge: ^0.14.1
  protobuf: ^3.1.0
  grpc: ^4.0.0

  # Local storage
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.6

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  path: ^1.9.1
  # flutter_svg: ^2.0.10 # Disabled for Bazel build compatibility

  # Database Sync (PowerSync for Hybrid Architecture)
  powersync: ^1.7.5
  path_provider: ^2.1.3
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
