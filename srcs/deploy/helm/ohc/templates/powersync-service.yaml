{{- if .Values.powersync.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-powersync
spec:
  type: {{ .Values.powersync.service.type }}
  ports:
    - port: {{ .Values.powersync.service.port }}
      targetPort: {{ .Values.powersync.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-powersync
{{- end }}
