issue_category: security
status: complete
details: |
  Audited hybrid privacy boundaries. Discovered that the Go telemetry implementation (srcs/server/telemetry) lacked the PII redaction layer present in the Rust backend, creating a potential compliance violation for Standalone metrics. Implemented a mirror of `RedactInterfacePII` in Go to strip sensitive keys and emails from telemetry attributes before JSON serialization. Also verified the bash standalone launch script (`ohc-standalone.sh`) enforces strict data sovereignty via the `OHC_TELEMETRY_ENABLED` opt-in boundary.
