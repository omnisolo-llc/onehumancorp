issue_category: security
status: resolved
details: |
  Audited hybrid privacy constraints. Implemented dynamic PII redaction across the Go backend (telemetry, orchestration mesh, onboarding workflows) before JSON serialization and cloud egress. Handled slices and nested maps. Unblocked Bazel tests by correcting ignored paths.
debt_report: |
  The redaction is structural but does not use reflection for nested structs. If custom structs are nested within maps without being converted to maps, their PII could leak.
