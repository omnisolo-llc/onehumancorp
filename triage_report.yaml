health_status: "Healthy"
issue_category: "security"
triage_results:
  - issue: "Tenant Isolation Leak in Cloud Mode"
    description: "The 'system' org_id allowed bypassing multitenant tenant boundaries, potentially causing an IDOR."
    resolution: "Blocked 'system' tenant resolution in Cloud/multitenant mode in src/server/utils/auth_utils.rs."
  - issue: "Local Wrapper Permissions Missing"
    description: "Standalone Bash wrapper did not explicitly set restrictive file permissions for agents."
    resolution: "Appended `umask 077` to the bash wrapper preamble in src/server/harness/sandbox/wrapper.rs."
  - issue: "Access Token Revocation DB Sync"
    description: "Token revocation relied on an in-memory map which would fail in multi-node clusters."
    resolution: "Updated Store::revoke_token and Store::is_revoked to asynchronously insert and query the Postgres/SQLite database directly."
debt_report:
  - description: "App UI and Cargo tests rely on optional packages missing in purely non-Bazel workflows, standardizing dependency loading could simplify local cargo invocations."
