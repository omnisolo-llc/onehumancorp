issue_category: "cleanup"
summary: "Implemented health guardianship and PRUNED log noise while resolving stuck missions."
details:
  - Pruned debug logging in sync_daemon to eliminate noise.
  - Added Ping() to TaskStore, SqliteTaskStore, PostgresTaskStore.
  - Added ProbeHealth() to MissionSynchronizer, DefaultMissionSynchronizer, HybridMCPRAGDaemon.
  - Updated syncCompletedEscalations to revert missing cloud missions back to CLOUD_ESCALATION from CLOUD_PROCESSING to prevent stuck states using safe localDB.UpdateTaskStatus method instead of unsafe manual SQL execution.
