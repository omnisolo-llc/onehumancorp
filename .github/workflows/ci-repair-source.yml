name: CI repair source snapshot

# Temporary repair-branch diagnostic; remove before merging.
on:
  push:
    branches: [fix/ci-parallel-head-20260920]
    paths: [.github/workflows/ci-repair-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-repair-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/ci-repair-source/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ci-repair-source/source.sha"
          git ls-tree -r HEAD > "$RUNNER_TEMP/ci-repair-source/source-tree.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-source
          path: ${{ runner.temp }}/ci-repair-source
          retention-days: 1
          if-no-files-found: error
