name: CI repair source snapshot
on:
  push:
    branches: [fix/ci-head-parallel-20260920]
    paths: [.github/workflows/ci-repair-source.yml]
permissions:
  contents: read
concurrency:
  group: ci-repair-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive only tracked source for reproducible CI repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-repair-source"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/ci-repair-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-repair-source/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ci-repair-source/tree-sha.txt"
          cd "$RUNNER_TEMP/ci-repair-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/ci-repair-source
          if-no-files-found: error
          retention-days: 1
