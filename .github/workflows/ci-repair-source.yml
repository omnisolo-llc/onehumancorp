name: CI repair source snapshot

on:
  push:
    branches: [fix/ci-parallel-repair-20260920]
    paths: [.github/workflows/ci-repair-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-repair-source"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-repair-source/source-sha.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/ci-repair-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/ci-repair-source/source.tar.gz" > "$RUNNER_TEMP/ci-repair-source/source.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-source-${{ github.sha }}
          path: ${{ runner.temp }}/ci-repair-source
          retention-days: 1
          if-no-files-found: error
