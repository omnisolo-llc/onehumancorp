name: CI repair source snapshot

on:
  push:
    branches: [fix/ci-parallel-repair-20260920]
    paths: [.github/workflows/ci-repair-source.yml]

permissions:
  contents: read
  actions: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ci-repair-tools-4f3a46b7971e1e981f9da0758d71ef6cf47b96ca
          run-id: 35536034216
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ci-repair-tools
      - name: Verify and split without reinstalling dependencies
        working-directory: ${{ runner.temp }}/ci-repair-tools
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check artifacts.sha256
          split --bytes=200M --numeric-suffixes=1 node-dependencies.tar.gz dependencies.part-
          sha256sum dependencies.part-* > parts.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tools-metadata
          path: |
            ${{ runner.temp }}/ci-repair-tools/node
            ${{ runner.temp }}/ci-repair-tools/*.sha256
            ${{ runner.temp }}/ci-repair-tools/source-sha.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tools-part-1
          path: ${{ runner.temp }}/ci-repair-tools/dependencies.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tools-part-2
          path: ${{ runner.temp }}/ci-repair-tools/dependencies.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tools-part-3
          path: ${{ runner.temp }}/ci-repair-tools/dependencies.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
