name: CI repair source snapshot
on:
  push:
    branches: [fix/ci-head-parallel-20260920]
    paths: [.github/workflows/ci-repair-source.yml]
permissions:
  contents: read
concurrency:
  group: ci-repair-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          rust: 'false'
          node-scope: all
          cache: 'true'
      - name: Archive locked public dependencies and pinned runtime only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-repair-tooling"
          tar -czf "$RUNNER_TEMP/ci-repair-tooling/dependencies.tar.gz" node_modules src/ui/next/node_modules src/cli/node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/ci-repair-tooling/node"
          cp .node-version "$RUNNER_TEMP/ci-repair-tooling/node-version.txt"
          sha256sum package-lock.json src/ui/next/package-lock.json src/cli/package-lock.json > "$RUNNER_TEMP/ci-repair-tooling/lockfiles.sha256"
          cd "$RUNNER_TEMP/ci-repair-tooling"
          split --bytes=240M --numeric-suffixes=0 dependencies.tar.gz dependencies.part
          sha256sum dependencies.tar.gz dependencies.part* node > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tooling-runtime
          path: |
            ${{ runner.temp }}/ci-repair-tooling/node
            ${{ runner.temp }}/ci-repair-tooling/*.txt
            ${{ runner.temp }}/ci-repair-tooling/*.sha256
            ${{ runner.temp }}/ci-repair-tooling/SHA256SUMS
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tooling-part00
          path: ${{ runner.temp }}/ci-repair-tooling/dependencies.part00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tooling-part01
          path: ${{ runner.temp }}/ci-repair-tooling/dependencies.part01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tooling-part02
          path: ${{ runner.temp }}/ci-repair-tooling/dependencies.part02
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
