name: CI repair tree assembly
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-repair-diagnostics.yml'
permissions:
  contents: read
jobs:
  assemble:
    if: github.head_ref == 'fix/ci-parallel-head-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assemble checked Git objects without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,os,pathlib,re,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='omnisolo-llc/onehumancorp'
          payload={'base_sha': '15a913e27462c939e804c1863d5e4d659e74c93d', 'expected_tree': '15129799d73903e3d37dddb502f352c0aa20cfe3', 'patch_sha256': 'f423f12c363ade42223bf82414496ae021c77081c41013700324a0f63f42a648', 'chunks': ['d1b1aaf9b6cd3f5736df597806d6798555a7553a', '41d67387c768b637fa3aae96e239cf10cc950efc', '9357d667f70e2ef667305c8862d158fee5e0e476', 'd969a6c2eab1355783e27d534107bd98e90bd11a', '974bc0dc72432af48c06a11aa274bea65ce422af', '8560d7ef356bb2cb1c4253260a71c5e699e57594', 'c3c1fd3a203fe5bbb473d20569c24d90385b4c01', '79014c111cc907cd967c8887b394727ae7a29ffa', '597414238b1e2cbe5eaca63d4273b01c993363cf', 'cfff119aa70d55f4436b5573478ef95696b4adac', 'a3efc21749415061a79c873cc4edca9eb41be923', '63e2a75d9bb58c9ded8e621cef98aec5789c5691']}
          for key in ['base_sha','expected_tree']:
              assert re.fullmatch('[a-f0-9]{40}',payload[key])
          compressed=bytearray()
          for sha in payload['chunks']:
              part=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              value=base64.b64decode(part['content'])
              assert hashlib.sha1(f'blob {len(value)}\0'.encode()+value).hexdigest()==sha
              compressed.extend(value)
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch=stream.read(1048577)
          assert len(patch)<=1048576 and hashlib.sha256(patch).hexdigest()==payload['patch_sha256']
          def git(*args,input=None,env=None):
              return subprocess.check_output(['git',*args],input=input,env=env)
          parent=git('rev-parse','HEAD').decode().strip()
          assert parent==os.environ['PARENT_SHA']
          git('fetch','--no-tags','--depth=1','origin',payload['base_sha'])
          index=pathlib.Path(os.environ['RUNNER_TEMP'])/'ci-repair.index'
          assert not index.exists()
          env={**os.environ,'GIT_INDEX_FILE':str(index)}
          git('read-tree',payload['base_sha'],env=env)
          git('apply','--cached','--check',input=patch,env=env)
          git('apply','--cached','--whitespace=error-all',input=patch,env=env)
          tree=git('write-tree',env=env).decode().strip()
          assert tree==payload['expected_tree'],'Patch did not produce the locally validated tree'
          def api(endpoint,body):
              result=subprocess.run(['gh','api','--method','POST',f'repos/{repo}/{endpoint}','--input','-'],input=json.dumps(body),text=True,capture_output=True,check=True)
              return json.loads(result.stdout)
          changes=git('diff','--cached','--no-renames','--name-status','-z',payload['base_sha'],env=env).decode().strip('\0').split('\0')
          assert len(changes)%2==0
          entries=[]
          for status,name in zip(changes[::2],changes[1::2]):
              assert status in ['A','M','D','T'] and not name.startswith('.git/')
              if status=='D':
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              metadata=git('ls-tree','-z',tree,'--',name).split(b'\t',1)[0].decode().split()
              mode,kind,sha=metadata
              assert kind=='blob'
              content=git('cat-file','blob',sha)
              uploaded=api('git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert uploaded['sha']==sha
              entries.append({'path':name,'mode':mode,'type':'blob','sha':sha})
          base_tree=git('rev-parse',payload['base_sha']+'^{tree}').decode().strip()
          remote_tree=api('git/trees',{'base_tree':base_tree,'tree':entries})
          assert remote_tree['sha']==tree
          commit=api('git/commits',{'message':'ci: parallelize PR checks and require complete source-bound browser results','tree':tree,'parents':[parent]})
          result={'parent':parent,'tree':tree,'commit':commit['sha'],'changed_files':len(entries)}
          pathlib.Path(os.environ['RUNNER_TEMP'],'ci-repair-result.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-repair-result.json
          retention-days: 1
          if-no-files-found: error
