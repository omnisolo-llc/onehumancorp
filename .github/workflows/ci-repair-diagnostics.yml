name: CI repair diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-repair-diagnostics.yml'

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.head_ref == 'fix/ci-parallel-head-repair' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-repair-source"
          git rev-parse HEAD > "$RUNNER_TEMP/ci-repair-source/source-sha.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/ci-repair-source/source.tar"
          sha256sum "$RUNNER_TEMP/ci-repair-source/source.tar" > "$RUNNER_TEMP/ci-repair-source/source.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ci-repair-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-repair-source
          retention-days: 1
          if-no-files-found: error
