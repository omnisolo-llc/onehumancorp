name: Kind E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KIND_VERSION: "v0.31.0"
  KUBECTL_VERSION: "v1.36.1"
  HELM_VERSION: "v3.20.2"
  KIND_SHA256_AMD64: "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa"
  KIND_SHA256_ARM64: "8e1014e87c34901cc422a1445866835d1e666f2a61301c27e722bdeab5a1f7e4"
  KUBECTL_SHA256_AMD64: "629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7"
  KUBECTL_SHA256_ARM64: "59f7ee8e477fae658447607dc3c8790ac17a1b016c01c622c12070e969e2d4e7"
  HELM_SHA256_AMD64: "258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea"
  HELM_SHA256_ARM64: "5ea2d6bc2cda3f8edf985e028809f5a9278f404fb8ab24044de9b7cb9b79a691"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/usr/local/share/powershell"
          sudo rm -rf "/opt/hostedtoolcache/CodeQL"
          docker image prune --all --force
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/rust

      - name: Install Kubernetes tools
        run: |
          case "$(uname -m)" in
            x86_64)
              CI_ARCH=amd64
              KIND_SHA256="$KIND_SHA256_AMD64"
              KUBECTL_SHA256="$KUBECTL_SHA256_AMD64"
              HELM_SHA256="$HELM_SHA256_AMD64"
              ;;
            aarch64|arm64)
              CI_ARCH=arm64
              KIND_SHA256="$KIND_SHA256_ARM64"
              KUBECTL_SHA256="$KUBECTL_SHA256_ARM64"
              HELM_SHA256="$HELM_SHA256_ARM64"
              ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "CI_ARCH=${CI_ARCH}" >> "${GITHUB_ENV}"

          tool_dir="$(mktemp -d)"

          curl -fsSL -o "$tool_dir/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${CI_ARCH}"
          echo "${KIND_SHA256}  $tool_dir/kind" | sha256sum --check --strict
          chmod +x "$tool_dir/kind"
          sudo install "$tool_dir/kind" /usr/local/bin/kind

          curl -fsSL -o "$tool_dir/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${CI_ARCH}/kubectl"
          echo "${KUBECTL_SHA256}  $tool_dir/kubectl" | sha256sum --check --strict
          chmod +x "$tool_dir/kubectl"
          sudo install "$tool_dir/kubectl" /usr/local/bin/kubectl

          curl -fsSL -o "$tool_dir/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-${CI_ARCH}.tar.gz"
          echo "${HELM_SHA256}  $tool_dir/helm.tar.gz" | sha256sum --check --strict
          tar -C "$tool_dir" -xzf "$tool_dir/helm.tar.gz"
          sudo install "$tool_dir/linux-${CI_ARCH}/helm" /usr/local/bin/helm

          kind version
          kubectl version --client=true
          helm version --short

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Run Kind smoke test
        run: |
          command -v kind
          command -v kubectl
          command -v helm
          command -v docker
          command -v bazelisk
          if [[ "${CI_ARCH}" == "arm64" ]]; then
            BAZEL_PLATFORM_CONFIG=linux_arm64
          else
            BAZEL_PLATFORM_CONFIG=linux
          fi
          bazelisk test //deploy:kind_e2e_test \
            --config="${BAZEL_PLATFORM_CONFIG}" \
            --nocache_test_results \
            --test_output=streamed \
            --test_summary=terse \
            --test_timeout=300,600,900,1800
