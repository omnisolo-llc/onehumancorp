name: Kind E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KIND_VERSION: "v0.31.0"
  KUBECTL_VERSION: "v1.36.1"
  HELM_VERSION: "v3.20.2"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Kubernetes tools
        run: |
          case "$(uname -m)" in
            x86_64) CI_ARCH=amd64 ;;
            aarch64|arm64) CI_ARCH=arm64 ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "CI_ARCH=${CI_ARCH}" >> "${GITHUB_ENV}"

          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${CI_ARCH}"
          chmod +x /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind

          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${CI_ARCH}/kubectl"
          chmod +x /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl

          curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${CI_ARCH}.tar.gz"
          tar -C /tmp -xzf /tmp/helm.tar.gz
          sudo install "/tmp/linux-${CI_ARCH}/helm" /usr/local/bin/helm

          kind version
          kubectl version --client=true
          helm version --short

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Run Kind smoke test
        run: |
          command -v kind
          command -v kubectl
          command -v helm
          command -v docker
          command -v bazelisk
          if [[ "${CI_ARCH}" == "arm64" ]]; then
            BAZEL_PLATFORM_CONFIG=linux_arm64
          else
            BAZEL_PLATFORM_CONFIG=linux
          fi
          bazelisk test //deploy:kind_e2e_test \
            --config="${BAZEL_PLATFORM_CONFIG}" \
            --nocache_test_results \
            --test_output=streamed \
            --test_summary=terse \
            --test_timeout=300,600,900,1800
