name: Prepare bounded guardrail repair
on:
  push:
    branches: [fix/ci-guardrail-prep-20260920]
    paths: [.github/workflows/guardrail-repair-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'omnisolo-llc/onehumancorp' && github.ref == 'refs/heads/fix/ci-guardrail-prep-20260920'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Apply checksum-bound patch and format only the repaired sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/omnisolo-llc/onehumancorp/git/blobs/44b0a1a4d7ddb7bf01f57e350dee3b4f1f603736 --jq .content | base64 --decode > "$RUNNER_TEMP/guardrail.patch"
          echo 'bb540377063f66fade6a9b8e10459b0a27bbcee320a77e2814c051a6068897a9  '"$RUNNER_TEMP/guardrail.patch" | sha256sum --check --strict
          git apply --index --check "$RUNNER_TEMP/guardrail.patch"
          git apply --index "$RUNNER_TEMP/guardrail.patch"
          git rm .github/workflows/guardrail-repair-prepare.yml
          test "$(git write-tree)" = 5097d007a0671091bc5eacdd40b9f65a7652f140
          cargo fmt --all
          cargo fmt --all -- --check
          python3 - <<'PY'
          import subprocess
          allowed = {'src/server/api/agents/guardrails.rs', 'src/server/api/agents/mod.rs', 'src/server/lib.rs'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit('Unexpected formatter changes: ' + repr(changed - allowed))
          PY
          git add src/server/api/agents/guardrails.rs src/server/api/agents/mod.rs src/server/lib.rs
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/guardrail-output"
          git diff --cached --binary HEAD -- src > "$RUNNER_TEMP/guardrail-output/guardrail-formatted.patch"
          git write-tree > "$RUNNER_TEMP/guardrail-output/tree.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(guardrails): connect authenticated read-only preview to the runtime evaluator'
          git push origin HEAD:refs/heads/fix/ci-guardrail-prep-20260920
          git rev-parse HEAD > "$RUNNER_TEMP/guardrail-output/commit.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-guardrail-repair
          path: ${{ runner.temp }}/guardrail-output
          retention-days: 1
          if-no-files-found: error
