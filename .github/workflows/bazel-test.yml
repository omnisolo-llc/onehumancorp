name: Bazel Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet

          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/usr/local/share/powershell"
          sudo rm -rf "/opt/hostedtoolcache/CodeQL"
          docker image prune --all --force
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/rust

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Test all targets
        run: |
          bazelisk test \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            //...
