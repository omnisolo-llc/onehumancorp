name: Bazel Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet

          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/usr/local/share/powershell"
          sudo rm -rf "/opt/hostedtoolcache/CodeQL"
          docker image prune --all --force
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/rust

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            # build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Test all targets
        run: |
          bazelisk test \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            //...
