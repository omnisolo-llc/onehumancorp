name: docs-site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs-site.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('/pr/{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-changes:
    name: Check what files changed
    runs-on: ubuntu-latest
    outputs:
      markdown-changed: ${{ steps.check.outputs.markdown-changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if markdown files changed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$changed_files"

          md_files=$(echo "$changed_files" | grep '\.md$' || true)

          if [ -n "$md_files" ]; then
            echo "markdown-changed=true" >> "$GITHUB_OUTPUT"
            echo "Markdown files changed: $md_files"
          else
            echo "markdown-changed=false" >> "$GITHUB_OUTPUT"
            echo "No markdown files changed"
          fi

  build:
    needs: check-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-changes.outputs.markdown-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set Bazel cache week
        run: echo "CACHE_WEEK=$(date +%G-W%V)" >> $GITHUB_ENV

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ env.CACHE_WEEK }}-${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            common --remote_header=x-nativelink-api-key=${{ secrets.NATIVELINK_API_KEY }}
            common --bes_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            common --remote_upload_local_results=true
            build --build_metadata=ROLE=CI
            build --show_timestamps

      - name: Build docs site
        run: bazelisk run //:docs_build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
