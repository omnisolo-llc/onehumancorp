name: docs-site

on:
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_COMPILE_CACHE: "none"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: oci-runner
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Bazel cache week
        run: echo "CACHE_WEEK=$(date +%G-W%V)" >> $GITHUB_ENV

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ env.CACHE_WEEK }}-${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            common --remote_header=x-nativelink-api-key=${{ secrets.NATIVELINK_API_KEY }}
            common --bes_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            common --remote_upload_local_results=true
            build --build_metadata=ROLE=CI
            build --show_timestamps

      - name: Build docs site
        run: bazelisk run //:docs_build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: oci-runner
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
