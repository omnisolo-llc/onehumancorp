name: docs-site

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs-site.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build docs site
        run: bazelisk run //:docs_build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
