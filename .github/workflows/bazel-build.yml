name: Bazel Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-build:
    name: Bazel build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            bazel_config: linux
            install_linux_deps: true
          # - name: windows-x86_64
          #   runner: ubuntu-24.04
          #   bazel_config: windows
          #   install_linux_deps: true
          #- name: macos-aarch64
          #  runner: macos-latest
          #  bazel_config: macos
          #  install_linux_deps: false
          #- name: macos-x86_64
          #  runner: macos-15-intel
          #  bazel_config: macos_x86_64
          #  install_linux_deps: false
    steps:
      - uses: actions/checkout@v6

      - name: Install base dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git mingw-w64 rpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode
        if: startsWith(matrix.name, 'macos-')
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-${{ matrix.name }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Build all artifacts
        run: bazelisk build //... --config=${{ matrix.bazel_config }}

      - name: Build server web image tarball
        if: matrix.name == 'linux-x86_64'
        run: bazelisk build //deploy:server_web_image_tar --config=linux --output_groups=+tarball

      - name: Build Tauri Android Bazel targets
        if: matrix.name == 'linux-x86_64'
        run: |
          bazelisk build \
            //src/ui/tauri:tauri_android_apk \
            //src/ui/tauri:tauri_android_aab \
            --config=linux

      - name: Install iOS signing assets
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to build the iOS IPA" >&2
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/ohc-ios-signing.p12"
          profile_path="$RUNNER_TEMP/ohc.mobileprovision"
          keychain_path="$RUNNER_TEMP/ohc-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/ohc.mobileprovision"

      - name: Build Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos

      - name: Analyze Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name == 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos --nobuild
