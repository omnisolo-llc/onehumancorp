name: Bazel Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-build:
    name: Bazel build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_config: linux_x86_64
          - name: windows-x86_64
            runner: ubuntu-latest
            bazel_config: windows_x86_64
          - name: android
            runner: ubuntu-latest
            bazel_config: linux_x86_64
         # - name: windows-arm64
          #  runner: windows-11-arm
         #   bazel_config: windows_arm64
          #- name: macos-aarch64
          #  runner: macos-latest
          #  bazel_config: macos_aarch64
          #- name: macos-x86_64
          #  runner: macos-15-intel
          #  bazel_config: macos_x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        if: startsWith(matrix.runner, 'ubuntu')
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Select Xcode
        if: startsWith(matrix.name, 'macos-')
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Build non-test artifacts
        if: matrix.name != 'android'
        run: |
          bazelisk query '
            kind(".* rule", //...)
            except kind(".*_test rule", //...)
            except attr("tags", "manual", //...)
            except //src/ui/tauri:all
          ' > build-targets.txt
          xargs -r bazelisk build \
            --config=${{ matrix.bazel_config }} \
            --skip_incompatible_explicit_targets \
            < build-targets.txt

      - name: Install Linux Tauri desktop dependencies
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Build Tauri desktop Bazel target
        if: matrix.name == 'linux-x86_64'
        run: |
          bazelisk build \
            //src/ui/tauri:app \
            --config=linux_x86_64 \
            --//src/ui/tauri:build_tauri=true

      - name: Build server web image tarball
        if: matrix.name == 'linux-x86_64'
        run: bazelisk build //deploy:server_web_image_tar --config=linux_x86_64 --output_groups=+tarball

      - name: Build Tauri Android Bazel targets
        if: matrix.name == 'android'
        run: |
          bazelisk build \
            //src/ui/tauri:tauri_android_apk \
            //src/ui/tauri:tauri_android_aab \
            --config=linux_x86_64

      - name: Install iOS signing assets
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to build the iOS IPA" >&2
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/ohc-ios-signing.p12"
          profile_path="$RUNNER_TEMP/ohc.mobileprovision"
          keychain_path="$RUNNER_TEMP/ohc-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/ohc.mobileprovision"

      - name: Build Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos_aarch64

      - name: Analyze Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name == 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos_aarch64 --nobuild
