name: Bazel Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-build:
    name: Bazel build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_config: linux_x86_64
          # - name: windows-x86_64
          #   runner: ubuntu-latest
          #   bazel_config: windows_x86_64
          # - name: windows-arm64
          #   runner: windows-11-arm
          #   bazel_config: windows_arm64
          #- name: macos-aarch64
          #  runner: macos-latest
          #  bazel_config: macos_aarch64
          #- name: macos-x86_64
          #  runner: macos-15-intel
          #  bazel_config: macos_x86_64
    steps:
      - name: Free runner disk space (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Path "C:\ProgramData\Docker\windowsfilter" -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\dotnet" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\npm\cache" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet

          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/usr/local/share/powershell"
          sudo rm -rf "/opt/hostedtoolcache/CodeQL"
          docker image prune --all --force
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/julia
          sudo rm -rf /usr/local/rust
          # Additional aggressive cleanup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/php
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/heroku
          docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
      - uses: actions/checkout@v6

      - name: Select Xcode
        if: startsWith(matrix.name, 'macos-')
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-${{ matrix.name }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Build all artifacts
        run: bazelisk build //... --config=${{ matrix.bazel_config }}

      - name: Build server web image tarball
        if: matrix.name == 'linux-x86_64'
        run: bazelisk build //deploy:server_web_image_tar --config=linux_x86_64 --output_groups=+tarball

      - name: Build Tauri Android Bazel targets
        if: matrix.name == 'linux-x86_64'
        run: |
          bazelisk build \
            //src/ui/tauri:tauri_android_apk \
            //src/ui/tauri:tauri_android_aab \
            --config=linux_x86_64

      - name: Install iOS signing assets
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to build the iOS IPA" >&2
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/ohc-ios-signing.p12"
          profile_path="$RUNNER_TEMP/ohc.mobileprovision"
          keychain_path="$RUNNER_TEMP/ohc-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/ohc.mobileprovision"

      - name: Build Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name != 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos_aarch64

      - name: Analyze Tauri iOS Bazel target
        if: matrix.name == 'macos-aarch64' && github.event_name == 'pull_request'
        run: bazelisk build //src/ui/tauri:tauri_ios_ipa --config=macos_aarch64 --nobuild
