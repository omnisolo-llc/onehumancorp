name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  build-release-artifacts:
    name: Build release artifacts (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_config: linux
            archive_name: ohc-x86_64-unknown-linux-gnu.tar.gz
            install_linux_deps: true
          - name: windows-x86_64
            runner: ubuntu-latest
            bazel_config: windows
            archive_name: ohc-x86_64-pc-windows-gnu.zip
            install_linux_deps: true
          - name: macos-aarch64
            runner: macos-latest
            bazel_config: macos
            archive_name: ohc-aarch64-apple-darwin.tar.gz
            install_linux_deps: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            ca-certificates curl git mingw-w64

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build packaged application
        run: bazelisk build //release:all_release_artifacts --config=${{ matrix.bazel_config }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          bazelisk cquery --output=files //release:all_release_artifacts --config=${{ matrix.bazel_config }} > artifact-files.txt
          while IFS= read -r src; do
            [[ -f "$src" ]] || continue
            case "$src" in
              *.tar.gz|*.zip)
                cp "$src" "dist/${{ matrix.archive_name }}"
                ;;
              *.deb|*.rpm)
                cp "$src" dist/
                ;;
            esac
          done < artifact-files.txt
          ls -lh dist/

      - name: Generate platform checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-${{ matrix.name }}.txt
          else
            shasum -a 256 * > checksums-${{ matrix.name }}.txt
          fi
          cat checksums-${{ matrix.name }}.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/
          retention-days: 7

  build-desktop-installers:
    name: Build desktop installers (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            bundles: msi,nsis
            patterns: "*.msi *.exe"
            install_linux_deps: false
          - name: macos-aarch64
            runner: macos-latest
            bundles: dmg
            patterns: "*.dmg"
            install_linux_deps: false
          - name: linux-x86_64
            runner: ubuntu-latest
            bundles: deb,rpm
            patterns: "*.deb *.rpm"
            install_linux_deps: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop packaging dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git patchelf rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri installer
        run: cargo tauri build --bundles "${{ matrix.bundles }}"
        working-directory: src/ui/tauri

      - name: Collect desktop installer artifacts
        run: |
          mkdir -p dist
          roots=()
          for root in target src/ui/tauri/target; do
            if [[ -d "$root/release/bundle" ]]; then
              roots+=("$root/release/bundle")
            fi
          done
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "No Tauri bundle directory found" >&2
            exit 1
          fi
          for pattern in ${{ matrix.patterns }}; do
            find "${roots[@]}" -type f -name "$pattern" -exec cp {} dist/ \;
          done
          if ! find dist -type f | grep -q .; then
            echo "No desktop installer artifacts matched ${{ matrix.patterns }}" >&2
            exit 1
          fi
          ls -lh dist/

      - name: Generate desktop installer checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-desktop-${{ matrix.name }}.txt
          else
            shasum -a 256 * > checksums-desktop-${{ matrix.name }}.txt
          fi
          cat checksums-desktop-${{ matrix.name }}.txt

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/
          retention-days: 7

  build-server-web-image:
    name: Build server web image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            ca-certificates curl git

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-server-web-image
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build server web image tarball
        run: bazelisk build //deploy:server_web_image_tar --config=linux --output_groups=+tarball

      - name: Collect server web image artifact
        run: |
          mkdir -p dist
          bazelisk cquery --output=files //deploy:server_web_image_tar --config=linux > image-files.txt
          image_tar="$(grep -E '/tarball\.tar$' image-files.txt | head -n 1)"
          if [[ -z "$image_tar" || ! -f "$image_tar" ]]; then
            echo "No server web image tarball found" >&2
            cat image-files.txt >&2
            exit 1
          fi
          cp "$image_tar" dist/ohc-server-web-image-linux-amd64.tar
          ls -lh dist/

      - name: Generate server web image checksums
        run: |
          cd dist
          sha256sum * > checksums-server-web-image.txt
          cat checksums-server-web-image.txt

      - name: Upload server web image artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-web-image
          path: dist/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-release-artifacts
      - build-desktop-installers
      - build-server-web-image
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist/ {} +
          find dist -type d -empty -delete
          ls -lh dist/

      - name: Generate combined checksums
        run: |
          cd dist
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find . -maxdepth 1 -type f ! -name 'checksums*.txt' -print0)
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-docker:
    name: Push container images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Push server web image
        run: |
          bazelisk run //deploy:server_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:server_push_dockerhub \
            -- --tag "${{ github.ref_name }}"

      - name: Push agent image
        run: |
          bazelisk run //deploy:agent_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:agent_push_dockerhub \
            -- --tag "${{ github.ref_name }}"
