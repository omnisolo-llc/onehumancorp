name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  build-release-artifacts:
    name: Build release artifacts (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_config: linux_x86_64
            archive_name: ohc-x86_64-unknown-linux-gnu.tar.gz
            install_linux_deps: true
          - name: windows-x86_64
            runner: ubuntu-latest
            bazel_config: windows_x86_64
            archive_name: ohc-x86_64-pc-windows-gnu.zip
            install_linux_deps: true
          # - name: windows-arm64
          #   runner: windows-11-arm
          #   bazel_config: windows_arm64
          #   archive_name: ohc-aarch64-pc-windows-msvc.zip
          #   install_linux_deps: false
          - name: macos-aarch64
            runner: macos-15
            bazel_config: macos_aarch64
            archive_name: ohc-aarch64-apple-darwin.tar.gz
            install_linux_deps: false
          - name: macos-x86_64
            runner: macos-15-intel
            bazel_config: macos_x86_64
            archive_name: ohc-x86_64-apple-darwin.tar.gz
            install_linux_deps: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            ca-certificates curl git rpm

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-${{ matrix.name }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build packaged application
        run: bazelisk build //release:all_release_artifacts --config=${{ matrix.bazel_config }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          bazelisk cquery --output=files //release:all_release_artifacts --config=${{ matrix.bazel_config }} > artifact-files.txt
          while IFS= read -r src; do
            [[ -f "$src" ]] || continue
            case "$src" in
              *.tar.gz|*.zip)
                cp "$src" "dist/${{ matrix.archive_name }}"
                ;;
              *.deb|*.rpm)
                cp "$src" dist/
                ;;
            esac
          done < artifact-files.txt
          ls -lh dist/

      - name: Generate platform checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-${{ matrix.name }}.txt
          else
            shasum -a 256 * > checksums-${{ matrix.name }}.txt
          fi
          cat checksums-${{ matrix.name }}.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/
          retention-days: 7

  build-desktop-installers:
    name: Build desktop installers (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            patterns: "*.msi *.exe"
            install_linux_deps: false
          - name: macos-aarch64
            runner: macos-15
            patterns: "*.dmg"
            install_linux_deps: false
          - name: macos-x86_64
            runner: macos-15-intel
            patterns: "*.dmg"
            install_linux_deps: false
          - name: linux-x86_64
            runner: ubuntu-latest
            patterns: "*.deb *.rpm"
            install_linux_deps: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop packaging dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxdo-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            ca-certificates curl wget file git patchelf rpm

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-desktop-${{ matrix.name }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Install macOS signing assets
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to sign and notarize macOS release artifacts" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/ohc-macos-signing.p12"
          keychain_path="$RUNNER_TEMP/ohc-macos-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          {
            echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build Tauri installer
        run: bazelisk build //src/ui/tauri:tauri_desktop_installers --//src/ui/tauri:build_tauri=true

      - name: Collect desktop installer artifacts
        run: |
          mkdir -p dist
          bazelisk cquery --output=files //src/ui/tauri:tauri_desktop_installers --//src/ui/tauri:build_tauri=true > desktop-installer-files.txt
          for pattern in ${{ matrix.patterns }}; do
            while IFS= read -r artifact; do
              [[ -f "$artifact" ]] || continue
              case "$(basename "$artifact")" in
                $pattern)
                  cp "$artifact" "dist/${{ matrix.name }}-$(basename "$artifact")"
                  ;;
              esac
            done < desktop-installer-files.txt
          done
          if ! find dist -type f | grep -q .; then
            echo "No desktop installer artifacts matched ${{ matrix.patterns }}" >&2
            exit 1
          fi
          ls -lh dist/

      - name: Generate desktop installer checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > checksums-desktop-${{ matrix.name }}.txt
          else
            shasum -a 256 * > checksums-desktop-${{ matrix.name }}.txt
          fi
          cat checksums-desktop-${{ matrix.name }}.txt

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/
          retention-days: 7

  build-mobile-artifacts:
    name: Build mobile artifacts (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            runner: ubuntu-latest
            targets: "//src/ui/tauri:tauri_android_apk //src/ui/tauri:tauri_android_aab"
            patterns: "*.apk *.aab"
          - name: ios
            runner: macos-latest
            targets: "//src/ui/tauri:tauri_ios_ipa"
            patterns: "*.ipa"
    steps:
      - uses: actions/checkout@v6

      - name: Install iOS build dependencies
        if: matrix.name == 'ios'
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Install iOS signing assets
        if: matrix.name == 'ios'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required to build the iOS IPA" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/ohc-ios-signing.p12"
          profile_path="$RUNNER_TEMP/ohc.mobileprovision"
          keychain_path="$RUNNER_TEMP/ohc-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/ohc.mobileprovision"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-mobile-${{ matrix.name }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build Tauri mobile artifacts
        run: bazelisk build ${{ matrix.targets }}

      - name: Collect mobile artifacts
        run: |
          mkdir -p dist
          : > mobile-files.txt
          for target in ${{ matrix.targets }}; do
            bazelisk cquery --output=files "$target" >> mobile-files.txt
          done
          for pattern in ${{ matrix.patterns }}; do
            while IFS= read -r src; do
              [[ -f "$src" && "$src" == $pattern ]] && cp "$src" dist/
            done < mobile-files.txt
            if ! find dist -maxdepth 1 -type f -name "$pattern" | grep -q .; then
              echo "No artifact matched $pattern" >&2
              cat mobile-files.txt >&2
              exit 1
            fi
          done
          find dist -type f | sort

      - name: Generate mobile checksums
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            find . -type f ! -name 'checksums*.txt' -print0 | xargs -0 sha256sum > checksums-mobile-${{ matrix.name }}.txt
          else
            find . -type f ! -name 'checksums*.txt' -print0 | xargs -0 shasum -a 256 > checksums-mobile-${{ matrix.name }}.txt
          fi
          cat checksums-mobile-${{ matrix.name }}.txt

      - name: Upload mobile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.name }}
          path: dist/
          retention-days: 7

  build-server-web-image:
    name: Build server web image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            ca-certificates curl git

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-server-web-image
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build server web image tarball
        run: bazelisk build //deploy:server_web_image_tar --config=linux_x86_64 --output_groups=+tarball

      - name: Collect server web image artifact
        run: |
          mkdir -p dist
          bazelisk cquery --output=files //deploy:server_web_image_tar --config=linux_x86_64 > image-files.txt
          image_tar="$(grep -E '/tarball\.tar$' image-files.txt | head -n 1)"
          if [[ -z "$image_tar" || ! -f "$image_tar" ]]; then
            echo "No server web image tarball found" >&2
            cat image-files.txt >&2
            exit 1
          fi
          cp "$image_tar" dist/ohc-server-web-image-linux-amd64.tar
          ls -lh dist/

      - name: Generate server web image checksums
        run: |
          cd dist
          sha256sum * > checksums-server-web-image.txt
          cat checksums-server-web-image.txt

      - name: Upload server web image artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-web-image
          path: dist/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-release-artifacts
      - build-desktop-installers
      - build-mobile-artifacts
      - build-server-web-image
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist/ {} +
          find dist -type d -empty -delete
          ls -lh dist/

      - name: Generate combined checksums
        run: |
          cd dist
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find . -maxdepth 1 -type f ! -name 'checksums*.txt' -print0)
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.apk
            dist/*.aab
            dist/*.ipa
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-docker:
    name: Push container images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - WORKSPACE
            - .bazelrc
            - .bazelversion
            - repositories.bzl
            - bazel/rules/**/*.bzl
            - bazel/patches/**
            - Cargo.lock
            - Cargo.toml
            - pnpm-lock.yaml
            - package-lock.json
            - package.json
            - go.mod
            - go.sum
          external-cache: |
            manifest:
              npm:
                - MODULE.bazel
                - MODULE.bazel.lock
                - pnpm-lock.yaml
                - package.json
              tauri_cargo_vendor:
                - MODULE.bazel
                - Cargo.lock
              crates:
                - MODULE.bazel
                - MODULE.bazel.lock
                - Cargo.lock
                - Cargo.toml
          cache-save: true
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Push server web image
        run: |
          bazelisk run //deploy:server_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:server_push_dockerhub \
            -- --tag "${{ github.ref_name }}"

      - name: Push agent image
        run: |
          bazelisk run //deploy:agent_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:agent_push_dockerhub \
            -- --tag "${{ github.ref_name }}"
