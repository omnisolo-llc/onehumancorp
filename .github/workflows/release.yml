name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('/pr/{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
defaults:
  run:
    shell: bash
jobs:
  release-metadata:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.release.outputs.identity }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      revision: ${{ steps.release.outputs.revision }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Validate tag or derive a consistent nightly version
      id: release
      env:
        PUBLISH_REQUESTED: ${{ inputs.publish || false }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python scripts/release_contract.py resolve

  release-qualification:
    name: Release qualification
    needs: release-metadata
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      performance_prefix: 'Release qualification / '

  build-release-artifacts:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release-metadata
    name: Build release artifacts (${{ matrix.name }})
    env:
      CARGO_BUILD_JOBS: ${{ startsWith(matrix.name, 'macos-') && '1' || '2' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        # Build on the oldest declared supported Linux baseline, not a moving image.
        - name: linux-x86_64
          runner: ubuntu-22.04
          install_linux_deps: true
          target: x86_64-unknown-linux-gnu
        - name: windows-x86_64
          runner: windows-latest
          install_linux_deps: false
          target: x86_64-pc-windows-msvc
        # Retain the former Bazel GNU Windows archive, alongside native MSVC.
        - name: windows-x86_64-gnu
          runner: windows-latest
          install_linux_deps: false
          target: x86_64-pc-windows-gnu
        - name: macos-aarch64
          runner: macos-15
          install_linux_deps: false
          target: aarch64-apple-darwin
        - name: linux-arm64
          runner: ubuntu-22.04-arm
          install_linux_deps: true
          target: aarch64-unknown-linux-gnu
        - name: windows-arm64
          runner: windows-11-arm
          install_linux_deps: false
          target: aarch64-pc-windows-msvc
        - name: macos-x86_64
          runner: macos-15-intel
          install_linux_deps: false
          target: x86_64-apple-darwin
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/prepare-release
      with:
        identity: ${{ needs.release-metadata.outputs.identity }}
    - name: Install Linux build dependencies
      if: matrix.install_linux_deps
      run: |
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends --fix-missing \
          build-essential pkg-config libssl-dev \
          ca-certificates curl git rpm
    - uses: ./.github/actions/setup-native
      with:
        role: release-${{ matrix.target }}
        node: 'false'
    - name: Configure native MSVC compiler tools
      if: endsWith(matrix.target, '-windows-msvc')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ startsWith(matrix.target, 'aarch64') && 'arm64' || 'x64' }}
    - name: Install GNU Windows compiler and make
      if: matrix.target == 'x86_64-pc-windows-gnu'
      uses: msys2/setup-msys2@v2
      id: mingw
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc make perl
    - name: Expose the GNU toolchain to Cargo
      if: matrix.target == 'x86_64-pc-windows-gnu'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.mingw.outputs.msys2-location }}
      run: |
        "$env:MSYS2_LOCATION\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Verify vendored crypto build prerequisites
      if: runner.os == 'Windows'
      run: perl -v
    - name: Install the exact Rust target
      run: rustup target add "${{ matrix.target }}"
    - name: Build native Cargo release
      run: cargo build --locked --release --target "${{ matrix.target }}" -p omnisolo -p omnisolo_builtin_agent -p omnisolo_harness_worker --bins
    - name: Package and bind native outputs to the release identity
      run: |
        python scripts/native-release.py --target "${{ matrix.target }}"
        python scripts/release_contract.py record --group "backend-${{ matrix.target }}"
    - name: Attest backend package provenance
      if: needs.release-metadata.outputs.publish == 'true'
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: dist/*
    - name: Upload release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-payload-backend-${{ matrix.target }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
  build-desktop-installers:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release-metadata
    name: Build desktop installers (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: ${{ startsWith(matrix.name, 'macos-') && '1' || '2' }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY
        != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_KEYCHAIN_PASSWORD != ''
        }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows-x86_64
          runner: windows-latest
          os_name: windows
          arch: x86_64
          target: x86_64-pc-windows-msvc
          bundles: msi
          install_linux_deps: false
        - name: macos-aarch64
          runner: macos-15
          os_name: macos
          arch: aarch64
          target: aarch64-apple-darwin
          bundles: app,dmg
          install_linux_deps: false
        - name: macos-x86_64
          runner: macos-15-intel
          os_name: macos
          arch: x86_64
          target: x86_64-apple-darwin
          bundles: app,dmg
          install_linux_deps: false
        - name: linux-x86_64
          runner: ubuntu-22.04
          os_name: linux
          arch: x86_64
          target: x86_64-unknown-linux-gnu
          bundles: appimage,deb,rpm
          install_linux_deps: true
        - name: linux-arm64
          runner: ubuntu-22.04-arm
          os_name: linux
          arch: arm64
          target: aarch64-unknown-linux-gnu
          bundles: appimage,deb,rpm
          install_linux_deps: true
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/prepare-release
      with:
        identity: ${{ needs.release-metadata.outputs.identity }}
    - name: Install Linux desktop packaging dependencies
      if: matrix.install_linux_deps
      run: |
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends --fix-missing \
          build-essential pkg-config libssl-dev curl wget file \
          libdbus-1-dev libglib2.0-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
          ca-certificates git patchelf rpm xdg-utils
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
    - uses: ./.github/actions/setup-native
      with:
        role: desktop-release-${{ matrix.name }}
        node-scope: web
    - name: Prepare release version and updater signing
      env:
        TAURI_SIGNING_PUBLIC_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        VERSION="$OMNISOLO_RELEASE_VERSION"

        if [[ -z "${TAURI_SIGNING_PUBLIC_KEY_SECRET:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_SECRET:-}" ]]; then
          echo "TAURI_SIGNING_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY GitHub secrets are required for updater-signed desktop release artifacts." >&2
          exit 1
        fi

        normalize_tauri_signing_key() {
          local value="$1"
          if [[ "$value" == *"untrusted comment:"* ]]; then
            printf '%s' "$value" | base64 | tr -d '\r\n'
            return
          fi

          local decoded
          decoded="$(printf '%s' "$value" | base64 --decode 2>/dev/null || printf '%s' "$value" | base64 -D 2>/dev/null || true)"
          if [[ "$decoded" == *"untrusted comment:"* ]]; then
            printf '%s' "$decoded" | base64 | tr -d '\r\n'
          else
            printf '%s' "$value"
          fi
        }

        TAURI_SIGNING_PUBLIC_KEY_SECRET="$(normalize_tauri_signing_key "$TAURI_SIGNING_PUBLIC_KEY_SECRET")"
        TAURI_SIGNING_PRIVATE_KEY_SECRET="$(normalize_tauri_signing_key "$TAURI_SIGNING_PRIVATE_KEY_SECRET")"
        echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY_SECRET"

        export VERSION
        node <<'NODE'
        const fs = require('fs');
        const version = process.env.VERSION;
        const pubkey = process.env.TAURI_SIGNING_PUBLIC_KEY_SECRET;
        const configPath = 'src/ui/tauri/tauri.conf.json';
        const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
        config.version = version;
        config.plugins ??= {};
        config.plugins.updater ??= {};
        config.plugins.updater.pubkey = pubkey;
        fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

        // All product and lockfile versions were stamped together by prepare-release.
        NODE

        private_key_path="$RUNNER_TEMP/tauri-updater-signing.key"
        printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" > "$private_key_path"
        chmod 600 "$private_key_path" 2>/dev/null || true
        echo "TAURI_SIGNING_PRIVATE_KEY=$private_key_path" >> "$GITHUB_ENV"

        if [[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET:-}" ]]; then
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
        fi
        echo "OMNISOLO_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "OMNISOLO_RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
    - name: Install macOS signing assets
      if: matrix.os_name == 'macos' && env.MACOS_SIGNING_ENABLED == 'true'
      env:
        MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      run: |
        set -euo pipefail
        for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
          if [[ -z "${!name}" ]]; then
            echo "$name is required to sign and notarize macOS release artifacts" >&2
            exit 1
          fi
        done

        certificate_path="$RUNNER_TEMP/omnisolo-macos-signing.p12"
        keychain_path="$RUNNER_TEMP/omnisolo-macos-signing.keychain-db"

        ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user | tr -d '"' | xargs)"
        echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
        echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security default-keychain -s "$keychain_path"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
        security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
        security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
        xcrun notarytool store-credentials omnisolo-release --apple-id "$APPLE_ID" \
          --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --keychain "$keychain_path"
        echo "OMNISOLO_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

        {
          echo "APPLE_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
          echo "APPLE_ID=$APPLE_ID"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
        } >> "$GITHUB_ENV"
    - name: Install the explicit native desktop target
      run: rustup target add "${{ matrix.target }}"
    - name: Sign the bundled Node runtime before Tauri packaging
      if: matrix.os_name == 'macos' && env.MACOS_SIGNING_ENABLED == 'true'
      run: |
        set -euo pipefail
        npm run build:web
        export OMNISOLO_PREBUILT_WEB=target/native-web
        node --input-type=module -e "import {prepareDesktop} from './scripts/prepare-desktop.mjs'; await prepareDesktop();"
        codesign --force --options runtime --timestamp --entitlements deploy/node-entitlements.plist --sign "$APPLE_SIGNING_IDENTITY" src/ui/tauri/native-resources/bin/node
        echo 'OMNISOLO_DESKTOP_RESOURCES_PREPARED=1' >> "$GITHUB_ENV"
    - name: Build installers with the official Tauri action
      id: tauri
      uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
      with:
        projectPath: src/ui/tauri
        tauriScript: node ../../../scripts/run-tauri.mjs
        args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        # Only the final complete-matrix publisher may create a release.
        uploadWorkflowArtifacts: false
        uploadUpdaterJson: false
        retryAttempts: 0
    - name: Collect exact reported artifacts and verify product version
      env:
        TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        TAURI_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        TAURI_BUILD_TARGET: ${{ matrix.target }}
      run: python scripts/collect_desktop.py --os "${{ matrix.os_name }}" --arch "${{ matrix.arch }}"
    - name: Attest desktop package provenance
      if: needs.release-metadata.outputs.publish == 'true'
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: dist/*
    - name: Upload desktop installer artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-payload-desktop-${{ matrix.os_name }}-${{ matrix.arch }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
    - name: Clean up Apple signing keychain
      if: matrix.os_name == 'macos' && always()
      run: |
        if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]]; then
          security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
        fi
        if [[ -f "$RUNNER_TEMP/omnisolo-macos-signing.keychain-db" ]]; then
          security delete-keychain "$RUNNER_TEMP/omnisolo-macos-signing.keychain-db" || true
        fi
  build-mobile-artifacts:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release-metadata
    name: Build mobile artifacts (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: android
          runner: ubuntu-latest
          patterns: '*.apk *.aab'
    steps:
    - uses: actions/checkout@v6
    # The prior release matrix shipped Android APK/AAB, not an iOS IPA.
    - uses: ./.github/actions/prepare-release
      with:
        identity: ${{ needs.release-metadata.outputs.identity }}
    - uses: ./.github/actions/setup-native
      with:
        role: android-release
        node-scope: root
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - name: Install pinned Android NDK and Rust targets
      run: |-
        sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    - name: Initialize native Android project
      run: node scripts/run-tauri.mjs android init --ci
    - name: Configure Android release signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: python3 scripts/prepare-android-signing.py
    - name: Build Tauri mobile artifacts
      run: node scripts/run-tauri.mjs android build --ci --apk --aab
    - name: Verify signatures and collect versioned universal mobile packages
      run: |
        set -euo pipefail
        mkdir -p dist
        for extension in apk aab; do
          mapfile -d '' files < <(find src/ui/tauri/gen/android/app/build/outputs -type f -path '*release*' -name "*.$extension" -print0)
          [[ "${#files[@]}" == 1 ]] || { echo "Expected exactly one universal release $extension, found ${#files[@]}" >&2; exit 1; }
          file="${files[0]}"
          [[ "$file" != *unsigned* ]] || { echo 'Refusing unsigned Android release' >&2; exit 1; }
          if [[ "$extension" == apk ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$file"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$file" > "$RUNNER_TEMP/android-badging.txt"
            grep -F "versionName='$OMNISOLO_RELEASE_VERSION'" "$RUNNER_TEMP/android-badging.txt"
            grep -F "versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/android-badging.txt"
          else
            jarsigner -verify "$file" | grep -q 'jar verified'
          fi
          cp "$file" "dist/OmniSolo-${OMNISOLO_RELEASE_TAG}-Android-universal.$extension"
        done
        python scripts/release_contract.py record --group mobile-android
    - name: Attest Android package provenance
      if: needs.release-metadata.outputs.publish == 'true'
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: dist/*
    - name: Upload mobile artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-payload-mobile-${{ matrix.name }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
    env:
      OMNISOLO_MOBILE_WEB_URL: ${{ vars.OMNISOLO_MOBILE_WEB_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  build-server-web-image:
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: release-metadata
    name: Build server web image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/prepare-release
      with:
        identity: ${{ needs.release-metadata.outputs.identity }}
    - uses: docker/setup-buildx-action@v4
    - name: Build native Node image archive
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/docker/web/Dockerfile
        platforms: linux/amd64
        outputs: type=docker,dest=omnisolo-server-web-image-linux-amd64.tar
        tags: omnisolo/server-web:${{ needs.release-metadata.outputs.image_tag }}
        cache-from: type=gha,scope=release-web-amd64
        cache-to: type=gha,mode=max,scope=release-web-amd64
    - name: Bind the versioned web image to this release
      run: |
        mkdir -p dist
        mv omnisolo-server-web-image-linux-amd64.tar "dist/omnisolo-server-web-${OMNISOLO_RELEASE_TAG}-linux-amd64.tar"
        python scripts/release_contract.py record --group server-web-image
    - name: Attest web-image archive provenance
      if: needs.release-metadata.outputs.publish == 'true'
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      with:
        subject-path: dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: release-payload-server-web-image
        path: dist/
        if-no-files-found: error
        retention-days: 7
  publish-release:
    name: Assemble and optionally publish GitHub Release
    runs-on: ubuntu-latest
    needs:
    - release-metadata
    - release-qualification
    - build-release-artifacts
    - build-desktop-installers
    - build-mobile-artifacts
    - build-server-web-image
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      RELEASE_IDENTITY: ${{ needs.release-metadata.outputs.identity }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v8
      with:
        pattern: release-payload-*
        path: incoming/
    - name: Validate every platform, source, version and checksum before publishing
      run: python scripts/release_contract.py assemble --incoming incoming --directory dist
    - name: Preserve verified packages for build-only runs
      uses: actions/upload-artifact@v7
      with:
        name: verified-release-${{ needs.release-metadata.outputs.tag }}
        path: dist/
        if-no-files-found: error
        retention-days: 7
    - name: Refuse existing releases or conflicting tags
      if: needs.release-metadata.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/release_contract.py check-publication
    - name: Upload the complete payload to an unpublished draft
      id: draft
      if: needs.release-metadata.outputs.publish == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.release-metadata.outputs.tag }}
        name: OmniSolo ${{ needs.release-metadata.outputs.tag }}
        target_commitish: ${{ needs.release-metadata.outputs.revision }}
        files: dist/*
        fail_on_unmatched_files: true
        overwrite_files: false
        generate_release_notes: true
        body: |
          Native Cargo, Node.js and Tauri release. All asset names, embedded product
          versions and release-manifest.json refer to this tag and exact source commit.
          Choose the package matching your OS and architecture. macOS arm64 and Intel
          applications each include their matching Node runtime. Verify checksums.txt.
          latest.json and every required desktop signature are included in this upload.
          See docs/development/native-releases.md for prerequisites and platform details.
        draft: true
        prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
        make_latest: 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify the uploaded draft before public promotion
      id: verify-upload
      if: needs.release-metadata.outputs.publish == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DRAFT_RELEASE_ID: ${{ steps.draft.outputs.id }}
      run: python scripts/verify_release_upload.py --directory dist --release-id "$DRAFT_RELEASE_ID"
    - name: Publish only the verified draft
      if: needs.release-metadata.outputs.publish == 'true' && steps.verify-upload.outputs.verified_release_id != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERIFIED_RELEASE_ID: ${{ steps.verify-upload.outputs.verified_release_id }}
        PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        MAKE_LATEST: ${{ needs.release-metadata.outputs.prerelease == 'true' && 'false' || 'legacy' }}
      run: |
        set -euo pipefail
        [[ "$VERIFIED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid verified release ID' >&2; exit 1; }
        gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$VERIFIED_RELEASE_ID" \
          -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$MAKE_LATEST"
  arm64-cloud-images:
    needs: release-qualification
    permissions:
      contents: read
      packages: write
    name: Publish immutable ARM64 cloud images
    if: github.event_name == 'workflow_dispatch' && inputs.publish_cloud_images && github.ref == 'refs/heads/codex/omnisolo-seaorm'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push web image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/docker/web/Dockerfile
        platforms: linux/arm64
        push: true
        tags: ghcr.io/omnisolo/server-web:${{ github.sha }}
        cache-from: type=gha,scope=cloud-web-arm64
        cache-to: type=gha,mode=max,scope=cloud-web-arm64
    - name: Build and push backend image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/docker/server/Dockerfile
        target: server
        platforms: linux/arm64
        push: true
        tags: ghcr.io/omnisolo/server:${{ github.sha }}
        cache-from: type=gha,scope=cloud-server-arm64
        cache-to: type=gha,mode=max,scope=cloud-server-arm64
    - name: Verify immutable image architectures and digests
      run: |
        set -euo pipefail
        for image in server server-web; do
          reference="ghcr.io/omnisolo/${image}:${GITHUB_SHA}"
          docker pull --platform linux/arm64 "$reference"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = "linux/arm64"
          digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          printf '%s=ghcr.io/omnisolo/%s@%s\n' "$image" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
        done
        docker run --rm --platform linux/arm64 --entrypoint /usr/bin/test \
          "ghcr.io/omnisolo/server:${GITHUB_SHA}" \
          -e /usr/lib/aarch64-linux-gnu/libcrypto.so.3 \
          -a -e /usr/lib/aarch64-linux-gnu/libssl.so.3
  push-docker:
    permissions:
      contents: read
      packages: write
    name: Push container images
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-metadata.outputs.publish == 'true'
    needs:
    - publish-release
    - release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/prepare-release
      with:
        identity: ${{ needs.release-metadata.outputs.identity }}
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v4
    - name: Native container tags
      id: image-tags
      env:
        IMAGE_TAG: ${{ needs.release-metadata.outputs.image_tag }}
        PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
      run: |
        set -euo pipefail
        {
         echo 'tags<<TAGS'
         echo "ghcr.io/omnisolo/${{ matrix.image }}:$IMAGE_TAG"
         echo "omnisolo/${{ matrix.image }}:$IMAGE_TAG"
         if [[ "$PRERELEASE" == false ]]; then
           echo "ghcr.io/omnisolo/${{ matrix.image }}:latest"
           echo "omnisolo/${{ matrix.image }}:latest"
         fi
         echo TAGS
        } >> "$GITHUB_OUTPUT"
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/docker/server/Dockerfile
        target: ${{ matrix.target }}
        push: true
        tags: ${{ steps.image-tags.outputs.tags }}
        cache-from: type=gha,scope=release-${{ matrix.image }}-amd64
        cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}-amd64
    strategy:
      fail-fast: false
      matrix:
        include:
        - image: server
          target: server
        - image: agent
          target: agent
'on':
  push:
    tags:
    - v*
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the complete verified release (otherwise build-only)
        type: boolean
        default: false
      publish_cloud_images:
        description: Explicitly publish the existing ARM64 cloud-image lane on its configured branch
        type: boolean
        default: false
