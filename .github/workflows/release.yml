name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  # ── Build cross-platform ohc archives ──────────────────────────────────
  build-archives:
    name: Build release archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            test --config=buildbuddy
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
            # build --config=buildbuddy-official
            # test --config=buildbuddy-official
            build --build_metadata=ROLE=CI
            test --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Build ohc archives
        run: |
          bazelisk build \
            //release:ohc-x86_64-unknown-linux-gnu

      - name: Collect archives and generate checksums
        run: |
          mkdir -p dist
          # Copy all built archives into dist/ using their canonical names
          for target in \
            ohc-x86_64-unknown-linux-gnu; do
            src=$(bazelisk cquery --output=files //release:${target} 2>/dev/null | head -1)
            if [ -n "$src" ] && [ -f "$src" ]; then
              ext="${src##*.}"
              if [ "$ext" = "zip" ]; then
                cp "$src" "dist/${target}.zip"
              else
                cp "$src" "dist/${target}.tar.gz"
              fi
            fi
          done
          ls -lh dist/
          cd dist && sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/
          retention-days: 7

  # ── Build Flutter Android APK + App Bundle ──────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-archives
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            test --config=buildbuddy
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
            # build --config=buildbuddy-official
            # test --config=buildbuddy-official
            build --build_metadata=ROLE=CI
            test --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: dist/

      - name: Flatten artifact directories
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist/ {} +
          ls -lh dist/

      - name: Generate combined checksums
        run: |
          cd dist
          # Build a list of all release files and generate checksums.
          # Individual patterns are checked separately so a missing platform
          # (e.g. no APK when the Android job was skipped) does not abort.
          files=()
          for pat in "*.tar.gz" "*.zip" "*.aab" "*.apk"; do
            # shellcheck disable=SC2206
            found=( $pat ) 2>/dev/null || true
            for f in "${found[@]}"; do
              [[ -f "${f}" ]] && files+=("${f}")
            done
          done
          if [[ ${#files[@]} -gt 0 ]]; then
            sha256sum "${files[@]}" > checksums.txt
          else
            echo "(no release files found)" > checksums.txt
          fi
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.aab
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Push Docker images to GHCR ─────────────────────────────────────────────
  push-docker:
    name: Push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            test --config=buildbuddy
            # common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_OFFICIAL_API_KEY }}
            # build --config=buildbuddy-official
            # test --config=buildbuddy-official
            build --build_metadata=ROLE=CI
            test --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps

      - name: Push server image
        run: |
          bazelisk run //deploy:server_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:server_push_dockerhub \
            -- --tag "${{ github.ref_name }}"

      - name: Push agent image
        run: |
          bazelisk run //deploy:agent_push_ghcr \
            -- --tag "${{ github.ref_name }}"
          bazelisk run //deploy:agent_push_dockerhub \
            -- --tag "${{ github.ref_name }}"

      - name: Push UI image
        run: |
          bazelisk run //deploy:ui_push \
            -- --tag "${{ github.ref_name }}"
