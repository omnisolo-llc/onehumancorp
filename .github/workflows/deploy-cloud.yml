name: Build cloud runtime images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  arm64-images:
    name: Publish immutable ARM64 images
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/omnisolo/server-web:${{ github.sha }}
          cache-from: type=gha,scope=cloud-web-arm64
          cache-to: type=gha,mode=max,scope=cloud-web-arm64

      - name: Build and push native backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/server/Dockerfile
          target: server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/omnisolo/server:${{ github.sha }}
          cache-from: type=gha,scope=cloud-backend-arm64
          cache-to: type=gha,mode=max,scope=cloud-backend-arm64

      - name: Verify immutable image architectures and digests
        run: |
          set -euo pipefail
          for image in server server-web; do
            reference="ghcr.io/omnisolo/${image}:${GITHUB_SHA}"
            docker pull --platform linux/arm64 "$reference"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = "linux/arm64"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            printf '%s=ghcr.io/omnisolo/%s@%s\n' "$image" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/test \
            "ghcr.io/omnisolo/server:${GITHUB_SHA}" \
            -e /usr/lib/aarch64-linux-gnu/libcrypto.so.3 \
            -a -e /usr/lib/aarch64-linux-gnu/libssl.so.3
