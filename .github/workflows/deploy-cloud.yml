name: Build cloud runtime images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  arm64-images:
    name: Publish immutable ARM64 images
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: src/ui/next
          file: src/ui/next/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/onehumancorp/server-web:${{ github.sha }}

      - name: Install backend build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev ca-certificates

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: onehumancorp-cloud-arm64
          repository-cache: true
          external-cache: true

      - name: Build and push backend image
        run: |
          bazelisk run --config=release //deploy:server_push_ghcr -- --tag "${GITHUB_SHA}"

      - name: Verify immutable image architectures and digests
        run: |
          set -euo pipefail
          for image in server server-web; do
            reference="ghcr.io/onehumancorp/${image}:${GITHUB_SHA}"
            docker buildx imagetools inspect "$reference" | grep -q 'linux/arm64'
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            printf '%s=ghcr.io/onehumancorp/%s@%s\n' "$image" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/test \
            "ghcr.io/onehumancorp/server:${GITHUB_SHA}" \
            -e /usr/lib/aarch64-linux-gnu/libcrypto.so.3
