name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bazel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install base dependencies
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git mingw-w64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - name: Install Bazelisk
      #   run: |
      #     go install github.com/bazelbuild/bazelisk@latest
      #     echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Test all targets
        run: |
          bazelisk test \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            //...

  bazel-build:
    name: Bazel build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            bazel_config: linux
            install_linux_deps: true
          - name: windows-x86_64
            runner: ubuntu-latest
            bazel_config: windows
            install_linux_deps: true
          - name: macos-aarch64
            runner: macos-latest
            bazel_config: macos
            install_linux_deps: false
    steps:
      - uses: actions/checkout@v6

      - name: Install base dependencies
        if: matrix.install_linux_deps
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git mingw-w64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - name: Install Bazelisk
      #   run: |
      #     go install github.com/bazelbuild/bazelisk@latest
      #     echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-bazel-disk-${{ github.workflow }}-${{ matrix.name }}
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --config=buildbuddy
            build --build_metadata=ROLE=CI
            build --color=yes
            build --show_timestamps
            test --sandbox_add_mount_pair=/var/run/docker.sock

      - name: Build all artifacts
        run: bazelisk build //... --config=${{ matrix.bazel_config }}

      - name: Build server web image tarball
        if: matrix.name == 'linux-x86_64'
        run: bazelisk build //deploy:server_web_image_tar --config=linux --output_groups=+tarball
