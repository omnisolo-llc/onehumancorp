name: Apply verified CI repair

on:
  push:
    branches: [fix/ci-parallel-repair-20260920]
    paths: [.github/ci-repair-ready.txt]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'omnisolo-llc/onehumancorp' && github.ref == 'refs/heads/fix/ci-parallel-repair-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact locally verified source patch
        shell: bash
        env:
          EXPECTED_PATCH: 6db4010a428d9938231df220773f7c0b26b1b0d8a57694476e6ab89fa825003b
          EXPECTED_TREE: 0488b0c99a688b8de13a5dcf856e3b995c8e4630
          EXPECTED_BRANCH: fix/ci-parallel-repair-20260920
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 15a913e27462c939e804c1863d5e4d659e74c93d HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = [Path(f'.github/ci-repair-payload-{index:02d}.txt').read_text().strip() for index in range(1, 5)]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != os.environ['EXPECTED_PATCH']:
              raise SystemExit('Repair payload checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'ci-repair.patch').write_bytes(patch)
          PY
          git apply --index --check "$RUNNER_TEMP/ci-repair.patch"
          git apply --index "$RUNNER_TEMP/ci-repair.patch"
          git rm .github/workflows/ci-repair-source.yml .github/workflows/ci-repair-apply.yml .github/ci-repair-ready.txt .github/ci-repair-payload-01.txt .github/ci-repair-payload-02.txt .github/ci-repair-payload-03.txt .github/ci-repair-payload-04.txt
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          test "$(git ls-remote --heads origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): parallelize strict gates and repair browser contracts with complete coverage proofs'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
          echo "Published source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified source tree: $EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
