name: Prepare exact CI repair candidate
on:
  push:
    branches: [fix/ci-head-parallel-evaluation]
    paths: [.github/workflows/ci-repair-apply.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'omnisolo-llc/onehumancorp' && github.ref == 'refs/heads/fix/ci-head-parallel-evaluation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact reviewed patches
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          base = '6d848e02906f86a0e83cb3d9238f0ca7c5a96c31'
          parts = [f'scripts/ci-repair-part-{i}.b64' for i in range(1, 4)]
          temporary = ['.github/workflows/ci-repair-apply.yml', '.github/ci-repair-python.patch', *parts]
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          if set(changed) != set(temporary):
              raise SystemExit('Unexpected source changed; refusing to apply')
          primary = gzip.decompress(base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts), validate=True))
          secondary = pathlib.Path('.github/ci-repair-python.patch').read_bytes()
          for patch, expected in [(primary, 'af7e9cd3030ce6d1a7a25a4960a92134d3d83a6cce8389ce2a4e0950905c0fc6'), (secondary, '5a0fb1b22d2a8fadd845a8549260b8d63afc68b3a46b99a4b5e885e84e7b35d7')]:
              if hashlib.sha256(patch).hexdigest() != expected:
                  raise SystemExit('Patch checksum mismatch')
              subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '--', *temporary], check=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'repair-evidence')
          allowed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True)
          (out / 'allowed-paths.txt').write_text(allowed)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt
      - name: Check formatting and bounded source identity
        id: format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = set(pathlib.Path(os.environ['RUNNER_TEMP'], 'repair-evidence/allowed-paths.txt').read_text().splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if not changed.issubset(allowed):
              raise SystemExit('Formatter changed unrelated files: ' + str(changed - allowed))
          PY
          git diff --check
          git add -u
      - uses: ./.github/actions/setup-ci-python
      - name: Check CI regression tests and preserve exact contract output
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum scripts/native-contracts.mjs scripts/native-e2e.mjs .github/scripts/check_repo_hygiene.sh
          python3 .github/scripts/check_parallel_ci_test.py
          node --test scripts/ci-coverage.test.mjs scripts/ci-reporter.test.mjs scripts/ci-parallel.test.mjs
          node scripts/native-contracts.mjs 2>&1 | tee "$RUNNER_TEMP/repair-evidence/contracts.log"
      - name: Store candidate Git objects for required PR validation
        if: ${{ always() && steps.apply.outcome == 'success' && steps.format.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = 'repos/omnisolo-llc/onehumancorp'
          def api(path, data):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', repo + path, '--input', '-'], input=json.dumps(data).encode()))
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          entries = []
          for name in names:
              index = subprocess.check_output(['git', 'ls-files', '--stage', '--', name], text=True).strip()
              if not index:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, _ = index.split(None, 2)
              data = subprocess.check_output(['git', 'show', ':' + name])
              blob = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              if blob['sha'] != expected:
                  raise SystemExit('Git blob identity mismatch: ' + name)
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})
          if tree['sha'] != subprocess.check_output(['git', 'write-tree'], text=True).strip():
              raise SystemExit('Git tree identity mismatch')
          result = {'tree_sha': tree['sha'], 'parent_sha': os.environ['GITHUB_SHA'], 'contract_result': os.environ['CONTRACT_RESULT'], 'full_ci_passed': False, 'changed_paths': names}
          out = pathlib.Path(os.environ['RUNNER_TEMP'], 'repair-evidence')
          (out / 'candidate-tree.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve candidate evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repair-evidence"
          git status --short > "$RUNNER_TEMP/repair-evidence/status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/repair-evidence/head.txt"
          git diff --binary 6d848e02906f86a0e83cb3d9238f0ca7c5a96c31 > "$RUNNER_TEMP/repair-evidence/result.patch"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: repair-candidate-evidence
          path: ${{ runner.temp }}/repair-evidence
          retention-days: 3
          if-no-files-found: error
