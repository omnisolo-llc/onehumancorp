name: Native Rust and Node toolchains
description: Pinned toolchains and role-scoped dependency caches without credentials or release artifacts
inputs:
  role:
    description: Cache isolation for backend, test, desktop, or release builds
    default: backend
  node:
    description: Install the locked Node dependency trees
    default: 'true'
  rust:
    description: Install Rust and restore compiled dependencies
    default: 'true'
  node-scope:
    description: Locked dependency trees to install (root, web, or all)
    default: all
  cache:
    description: Restore/save caches; false exercises a fresh-runner cold build
    default: 'true'
outputs:
  rust-cache-hit:
    description: Exact Rust cache match (a non-exact match may still restore dependencies)
    value: ${{ steps.rust-cache.outputs.cache-hit }}
  npm-cache-hit:
    description: Exact npm download-cache match
    value: ${{ steps.npm-restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust == 'true'
      with:
        toolchain: '1.95.0'
        components: rustfmt, clippy
    - name: Bound CI artifact growth
      if: inputs.rust == 'true'
      shell: bash
      run: |
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == Linux ]]; then echo 'MALLOC_ARENA_MAX=2' >> "$GITHUB_ENV"; fi
    - uses: Swatinem/rust-cache@v2
      id: rust-cache
      if: inputs.rust == 'true' && inputs.cache == 'true'
      with:
        # One-time namespace change retires the old source-artifact-heavy cache.
        prefix-key: ohc-native-dependencies-v1
        shared-key: native-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS || 'custom-image' }}-${{ inputs.role }}
        # rust-cache supplies compiler/environment/Cargo lock+manifest hashes and
        # compatible dependency fallbacks. Do not duplicate them in a job key.
        cache-on-failure: 'false'
        # Do not cache installed executables or mutate the user's toolchain bin.
        cache-bin: 'false'
        # Source-bound server/test executables are same-run artifacts, not an
        # immutable dependency cache that accumulates obsolete monolith outputs.
        cache-workspace-crates: 'false'
        # Trusted main/tag builds may publish role/OS/architecture-scoped dependencies.
        # A positive event allowlist also excludes pull_request_target; checking
        # only event != pull_request could let that event write trusted main caches.
        # Never treat a restored target as test evidence.
        save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    - uses: actions/setup-node@v6
      if: inputs.node == 'true'
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Locate npm download cache
      if: inputs.node == 'true'
      id: npm-cache
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v5
      if: inputs.node == 'true' && inputs.cache == 'true'
      id: npm-restore
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-scope }}-${{ hashFiles('.node-version', 'package-lock.json', 'src/ui/next/package-lock.json', 'src/cli/package-lock.json') }}
    - name: Install locked Node dependencies
      if: inputs.node == 'true'
      shell: bash
      env:
        NODE_SCOPE: ${{ inputs.node-scope }}
      run: |
        set -euo pipefail
        case "$NODE_SCOPE" in root|web|all) ;; *) echo 'Invalid native Node dependency scope' >&2; exit 1 ;; esac
        npm ci --prefer-offline --no-audit --no-fund
        if [[ "$NODE_SCOPE" != root ]]; then
          npm --prefix src/ui/next ci --prefer-offline --no-audit --no-fund
        fi
        if [[ "$NODE_SCOPE" == all ]]; then
          npm --prefix src/cli ci --prefer-offline --no-audit --no-fund
        fi
    - uses: actions/cache/save@v5
      if: inputs.node == 'true' && inputs.cache == 'true' && steps.npm-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      with:
        path: ${{ steps.npm-cache.outputs.path }}
        key: ${{ steps.npm-restore.outputs.cache-primary-key }}
