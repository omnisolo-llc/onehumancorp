[package]
name = "server_harness"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
sqlx = { version = "0.8", features = ["postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
server_telemetry = { path = "../telemetry" }
opentelemetry = "0.27"
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"
async-trait = "0.1"
tracing = "0.1"
