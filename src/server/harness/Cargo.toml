[package]
name = "server_harness"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.1"
server_common = { path = "../common" }
server_telemetry = { path = "../telemetry" }
server_omnisolo = { path = "../omnisolo" }
async-trait = "0.1"
prost = { workspace = true }
tonic = { workspace = true }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { workspace = true }
tokio-stream = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
chrono = { workspace = true }
tree-sitter = "0.26.8"
tree-sitter-bash = "0.25.1"
regex = "1"
reqwest = { workspace = true }
futures-util = "0.3.32"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[lib]
path = "mod.rs"
