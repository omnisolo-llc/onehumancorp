[package]
name = "ohc_chat_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.8.1"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
temp-env = "0.3.6"
tokio = { version = "1", features = ["full", "test-util"] }
tower = "0.5"
