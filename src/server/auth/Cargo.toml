[package]
name = "server_auth"
version = "0.1.0"
edition = "2024"

[dependencies]
temp-env = { version = "0.3", features = ["async_closure"] }
async-trait = "0.1"
axum = { version = "0.8.1", features = ["ws", "multipart"] }
base64 = "0.22"
bcrypt = "0.16.0"
chrono = { workspace = true }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.8"
redis = { version = "0.27.6", features = ["tokio-comp"] }
serde = { workspace = true }
serde_json = { workspace = true }
server_common = { path = "../common" }
server_config = { path = "../config" }
server_ohc = { path = "../ohc" }
server_oidc = { path = "../oidc" }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "mysql", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
tonic = { workspace = true, features = ["transport", "tls"] }
tracing = "0.1"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lib]
path = "mod.rs"
