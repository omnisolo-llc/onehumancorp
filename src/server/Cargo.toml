[package]
name = "server-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
redis = { version = "0.25", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
aes-gcm = "0.10"
jsonwebtoken = "9"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
bcrypt = "0.15"
rand = "0.8"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[build-dependencies]
tonic-build = "0.12"
