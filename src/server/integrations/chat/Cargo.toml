[package]
name = "integration_chat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
tracing = "0.1"

[lib]
name = "integration_chat"
path = "src/lib.rs"
