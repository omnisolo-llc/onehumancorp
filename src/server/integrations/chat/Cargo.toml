[package]
name = "server_integrations_chat"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.80"
reqwest = { version = "0.12.4", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37.0", features = ["full"] }
server_integrations_core = { path = "../core" }

[dev-dependencies]
rand = "0.8.5"
