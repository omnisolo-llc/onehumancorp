[package]
name = "server_integrations_chat"
version = "0.1.0"
edition = "2021"

[dependencies]
server_common = { path = "../../common" }
sea-orm = { version = "=1.1.19", features = ["macros", "runtime-tokio-native-tls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
server_harness = { path = "../../harness" }
