[package]
name = "server_integrations_chat"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "=1.1.19", default-features = false, features = ["mock", "macros", "runtime-tokio-native-tls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
