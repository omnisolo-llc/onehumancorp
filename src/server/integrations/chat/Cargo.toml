[package]
name = "server_integrations_chat"
version = "0.4.47"
edition = "2024"

[dependencies]
server_common = { path = "../../common" }
server_telemetry = { path = "../../telemetry" }
server_auth = { path = "../../auth" }
server_utils = { path = "../../utils" }

tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8.1", features = ["ws"] }
tokio-tungstenite = "0.29.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
redis = { version = "0.27.6", features = ["tokio-comp"] }
futures-util = "0.3.32"
futures = { workspace = true }
tracing = "0.1"
