syntax = "proto3";

package mcp_webhook_tunnel;

option go_package = "github.com/onehumancorp/mono/src/server/integrations/mcp_webhook_tunnel";

message WebhookPayloadMessage {
    string agent_id = 1;
    map<string, string> headers = 2;
    bytes body = 3;
}

message TunnelRequest {
    string agent_id = 1;
}

service WebhookTunnel {
    rpc ConnectStream(TunnelRequest) returns (stream WebhookPayloadMessage);
}
