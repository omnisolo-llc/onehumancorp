[package]
name = "server_integrations_wallet_pass"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
server_common = { path = "../../common" }
server_integrations_core = { path = "../core" }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
zip = "8.6.0"
ring = "0.17.14"
sha1 = "0.11.0"
openssl = "0.10.80"

[lib]
name = "server_integrations_wallet_pass"
path = "lib.rs"
