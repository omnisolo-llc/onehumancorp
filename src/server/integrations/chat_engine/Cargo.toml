[package]
name = "server_integrations_chat_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
server_integrations_core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
