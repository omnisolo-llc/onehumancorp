[package]
name = "server_integrations_omnichannel"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.77"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "=1.1.19", default-features = false, features = ["macros", "with-chrono", "with-json", "with-uuid"] }
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4.0"
