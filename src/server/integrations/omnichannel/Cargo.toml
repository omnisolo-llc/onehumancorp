[package]
name = "server_integrations_omnichannel"
version = "0.4.47"
edition = "2024"

[dependencies]
async-trait = "0.1"
sea-orm = { version = "1.1.19", default-features = false, features = ["macros", "runtime-tokio-native-tls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ohc_bazel)', 'cfg(ohc_bazel_package)', 'cfg(ohc_bazel_tauri_context)'] }
