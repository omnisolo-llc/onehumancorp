[package]
name = "server_integrations_mcp_config_sync"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "bigdecimal"] }
