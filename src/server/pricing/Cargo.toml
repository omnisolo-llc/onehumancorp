[package]
name = "server_pricing"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
server_harness = { path = "../harness" }
opentelemetry = "0.32"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { workspace = true }
# Preserve the existing image decoders and WebP output. The default avif feature
# only adds an unused AVIF encoder (ravif/rav1e); AVIF decoding would require the
# separate avif-native feature, which was never enabled by this application.
image = { version = "0.25", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
redis = { version = "0.27.6", features = ["tokio-comp"] }
chrono = { workspace = true }
flate2 = "1"
base64 = "0.22"
dashmap = "5"
sha2 = "0.10"
tracing = "0.1"
hex = "0.4"

[lib]
path = "mod.rs"
