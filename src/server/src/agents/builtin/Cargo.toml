[package]
name = "ohc-builtin-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ohc-builtin-agent"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
redis = { version = "0.25", features = ["tokio-comp"] }

# gRPC / protobuf
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"

# HTTP clients (LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex for caveman compression and web scraping
regex = "1"

# HMAC/SHA for auth
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Glob pattern matching
glob = "0.3"

# tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lazy statics
once_cell = "1"

# async trait support
async-trait = "0.1"

# gzip for context compression
flate2 = "1"

# base64 for context compression
base64 = "0.22"

# random bytes for task ID generation
rand = "0.8"

# Futures utilities
futures = "0.3"

# URL encoding for web search
urlencoding = "2"

# QR code generation
qrcode = { version = "0.14", default-features = false }

# Recursive async fn support
async-recursion = "1"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Database (pgvector / memory)
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }

# Observability
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"

[build-dependencies]
tonic-build = "0.12"
