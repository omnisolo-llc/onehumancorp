[package]
name = "server_voice"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.80"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1.40"
uuid = { version = "1.8.0", features = ["v4", "serde"] }

server_domain = { path = "../domain" }
server_integrations_twilio = { path = "../integrations/twilio" }
server_orchestration = { path = "../orchestration" }
server_telemetry = { path = "../telemetry" }
minimax = { path = "../" }
server_ohc = { path = "../ohc" }

[dev-dependencies]
