<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHC Unified Inbox</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --primary-text: #333;
            --secondary-text: #666;
            --accent-color: #007aff;
            --bg-color: #f0f2f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            max-width: 375px; /* Mobile first */
            margin: 0 auto;
            position: relative;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #message-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .message.incoming {
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            padding: 12px;
            display: flex;
            gap: 8px;
            position: sticky;
            bottom: 0;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 1rem;
            outline: none;
            min-height: 44px; /* Touch target size */
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px; /* Touch target size */
            min-width: 44px;
        }

        .badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 10px;
            margin-bottom: 4px;
            display: inline-block;
        }

    </style>
</head>
<body>
    <header>Unified Inbox</header>
    <div id="message-list">
        <!-- Messages will be injected here -->
    </div>
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        // Use a dummy tenant and conversation ID for the UI when in real e2e environment it will be injected by the app wrapper
        const urlParams = new URLSearchParams(window.location.search);
        const TENANT_ID = urlParams.get('tenant_id') || '00000000-0000-0000-0000-000000000000';
        const CONVERSATION_ID = urlParams.get('conversation_id') || '00000000-0000-0000-0000-000000000001';

        const messageList = document.getElementById('message-list');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = `message ${msg.message_type}`;

            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.textContent = msg.message_type === 'incoming' ? 'WhatsApp' : 'You';
            div.appendChild(badge);

            const content = document.createElement('div');
            content.textContent = msg.content;
            div.appendChild(content);

            messageList.appendChild(div);
            messageList.scrollTop = messageList.scrollHeight;
        }

        async function loadMessages() {
            try {
                const res = await fetch(`/api/tenants/${TENANT_ID}/conversations/${CONVERSATION_ID}/messages`);
                if (!res.ok) throw new Error('Failed to load messages');
                const messages = await res.json();
                messageList.innerHTML = '';
                messages.forEach(appendMessage);
            } catch (err) {
                console.error(err);
                // Intentionally throw error and not mock data
                messageList.innerHTML = '<div style="padding: 1rem; color: red;">Failed to load messages from live server</div>';
            }
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;

            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const res = await fetch(`/api/tenants/${TENANT_ID}/conversations/${CONVERSATION_ID}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                if (res.ok) {
                    const msg = await res.json();
                    appendMessage(msg);
                } else {
                     console.error('Failed to send message via real network');
                }
            } catch (err) {
                console.error(err);
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        loadMessages();
    </script>
</body>
</html>
