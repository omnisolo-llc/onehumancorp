[package]
name = "server_telemetry"
version = "0.1.0"
edition = "2024"

[dependencies]
server_config = { path = "../config" }
opentelemetry = "0.27"
tracing = "0.1"
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[lib]
path = "mod.rs"
