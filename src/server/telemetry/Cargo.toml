[package]
name = "server_telemetry"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
sqlx = { version = "0.8", features = ["postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"
opentelemetry_sdk = "0.27"
tracing = "0.1"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
