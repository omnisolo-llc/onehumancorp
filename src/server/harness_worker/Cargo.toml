[package]
name = "omnisolo_harness_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.1"
server_harness = { path = "../harness" }
server_ohc = { path = "../ohc" }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lib]
path = "lib.rs"

[dev-dependencies]
reqwest = { workspace = true }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "omnisolo-harness-worker"
path = "main.rs"
