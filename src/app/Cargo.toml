[package]
name = "app-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.8.0", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.8.0"
