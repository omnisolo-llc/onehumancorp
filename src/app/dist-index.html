<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC - One Human Corp</title>
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0D0D1A;
        }
        #canvas-wrap {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #canvas-wrap canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>
<script>
    (function () {
        var canvas = document.getElementById('canvas');
        var wrap = document.getElementById('canvas-wrap');

        function setCanvasSize() {
            var dpr = window.devicePixelRatio || 1;
            var w = Math.floor(window.innerWidth * dpr);
            var h = Math.floor(window.innerHeight * dpr);
            canvas.width = w;
            canvas.height = h;
        }
        setCanvasSize();

        var scaleObserver = new MutationObserver(function () {
            var cw = canvas.width || canvas.offsetWidth || window.innerWidth;
            var ch = canvas.height || canvas.offsetHeight || window.innerHeight;
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            var dpr = window.devicePixelRatio || 1;
            var scaleX = vw / (cw / dpr);
            var scaleY = vh / (ch / dpr);
            canvas.style.cssText = 'position:absolute;top:50%;left:50%;transform-origin:center center;transform:translate(-50%,-50%) scaleX(' + scaleX + ') scaleY(' + scaleY + ');';
        });
        scaleObserver.observe(canvas, { attributes: true, attributeFilter: ['width', 'height', 'style'] });

        window.addEventListener('resize', function () {
            setCanvasSize();
        });
    })();
</script>
<script type="module">
    import init from './app.js';
    init().catch(console.error);
</script>
</body>
</html>
