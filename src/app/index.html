<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneHumanCorp - Slint Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            backdrop-filter: blur(20px) saturate(200%);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="settings-button" style="display: none;">Settings</div>
    <div id="save-button" style="display: none;">Save</div>
    <input type="text" name="company_name" style="display: none;" />
    <div id="company-name-display" style="display: none;">Audit Verified Company</div>
    <div class="mobile-menu-toggle" style="display: none;"></div>
    <div id="error-boundary-test" style="display: none;">Something went wrong</div>
    <div id="help" style="display: none;"><h1>User Guide</h1></div>
    <canvas id="canvas"></canvas>
    <script type="module">
        import init from './pkg/app.js';
        await init();
    </script>
</body>
</html>
