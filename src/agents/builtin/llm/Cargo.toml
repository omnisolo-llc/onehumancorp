[package]
name = "ohc-builtin-agent-llm"
version = "0.1.0"
edition = "2024"

[lib]
name = "ohc_builtin_agent_llm"
path = "mod.rs"

[dependencies]
ohc-builtin-agent-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
async-trait = "0.1"
