[package]
name = "ohc_builtin_agent_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "../core.rs"

[dependencies]
dirs = "5.0"
server_pricing = { path = "../../../server/pricing" }
async-trait = "0.1"
chrono = { workspace = true }
futures = { workspace = true }
hmac = "0.12"
once_cell = "1"
rand = "0.8"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
