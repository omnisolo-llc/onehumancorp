[package]
name = "ohc_builtin_agent"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4"
futures = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
