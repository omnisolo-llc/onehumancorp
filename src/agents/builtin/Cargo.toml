[package]
name = "ohc-builtin-agent"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "ohc_builtin_agent"
path = "lib.rs"

[[bin]]
name = "ohc-builtin-agent"
path = "main.rs"

[dependencies]
ohc-builtin-agent-core = { path = "core" }
ohc-builtin-agent-llm = { path = "llm" }
ohc-builtin-agent-tools = { path = "tools" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
async-trait = "0.1"
async-recursion = "1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
redis = { version = "0.27.6", features = ["tokio-comp"] }
glob = "0.3"
regex = "1"
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
urlencoding = "2"
dashmap = "5"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }

[build-dependencies]
tonic-build = "0.12"
