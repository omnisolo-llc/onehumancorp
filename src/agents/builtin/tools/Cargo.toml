[package]
name = "ohc-builtin-agent-tools"
version = "0.1.0"
edition = "2024"

[lib]
name = "ohc_builtin_agent_tools"
path = "mod.rs"

[dependencies]
ohc-builtin-agent-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
qrcode = { version = "0.14", default-features = false }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
async-trait = "0.1"
async-recursion = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
dashmap = "5"
