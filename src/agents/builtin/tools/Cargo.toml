[package]
name = "ohc_builtin_agent_tools"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
server_pricing = { path = "../../../server/pricing" }
async-recursion = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
dashmap = "5"
glob = "0.3"
ohc_builtin_agent_llm = { path = "../llm" }
ohc_builtin_agent_core = { path = "../core" }
once_cell = "1"
qrcode = { version = "0.14", default-features = false }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
server_ohc = { path = "../../../server/ohc" }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { workspace = true }
tracing = "0.1"
tree-sitter = "0.26.9"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.8"
urlencoding = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.8.9"

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"
