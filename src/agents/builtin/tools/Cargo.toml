[package]
name = "ohc_builtin_agent_tools"
version = "0.1.0"
edition = "2024"

[lib]
path = "mod.rs"

[dependencies]
async-recursion = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { workspace = true }
dashmap = "5"
glob = "0.3"
ohc_builtin_agent_core = { path = "../core" }
ohc_builtin_agent_llm = { path = "../llm" }
once_cell = "1"
qrcode = { version = "0.14", default-features = false }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
server_ohc = { path = "../../../server/ohc" }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { workspace = true }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"

[lints]
workspace = true
