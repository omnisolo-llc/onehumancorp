syntax = "proto3";

package ohc.collective;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/collective;collectivepb";

message Collective {
  string id = 1;
  string name = 2;
  string location_center = 3;
  float radius_meters = 4;
}

message CollectiveMember {
  string collective_id = 1;
  string tenant_id = 2;
  string status = 3; // "ACTIVE" | "PENDING"
}

message SharedOffer {
  string id = 1;
  string collective_id = 2;
  string originating_tenant_id = 3;
  string target_tenant_id = 4;
  string discount_type = 5; // "PERCENT" | "FIXED"
  float value = 6;
  bool auto_apply = 7;
}

message CollectiveLoyaltyBalance {
  string collective_id = 1;
  string buyer_id = 2;
  int32 balance = 3;
}

message GetNearbyTenantsRequest {
  string tenant_id = 1;
  float radius_meters = 2;
}

message GetNearbyTenantsResponse {
  repeated string tenant_ids = 1;
}

message InviteTenantRequest {
  string collective_id = 1;
  string target_tenant_id = 2;
}

message InviteTenantResponse {
  bool success = 1;
}

message AcceptInviteRequest {
  string collective_id = 1;
  string tenant_id = 2;
}

message AcceptInviteResponse {
  bool success = 1;
}

message GetCollectivesRequest {
  string tenant_id = 1;
}

message GetCollectivesResponse {
  repeated Collective collectives = 1;
}

message RecordLoyaltyPointsRequest {
  string collective_id = 1;
  string buyer_id = 2;
  string tenant_id = 3;
  int32 points = 4;
}

message RecordLoyaltyPointsResponse {
  bool success = 1;
  int32 new_balance = 2;
}

message SpendLoyaltyPointsRequest {
  string collective_id = 1;
  string buyer_id = 2;
  string tenant_id = 3;
  int32 points = 4;
}

message SpendLoyaltyPointsResponse {
  bool success = 1;
  int32 new_balance = 2;
}

message MatchSynergyRequest {
  string tenant_id = 1;
  string category = 2;
}

message MatchSynergyResponse {
  repeated string suggested_tenant_ids = 1;
}

service CollectiveService {
  rpc GetNearbyTenants(GetNearbyTenantsRequest) returns (GetNearbyTenantsResponse);
  rpc InviteTenant(InviteTenantRequest) returns (InviteTenantResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc GetCollectives(GetCollectivesRequest) returns (GetCollectivesResponse);

  rpc RecordLoyaltyPoints(RecordLoyaltyPointsRequest) returns (RecordLoyaltyPointsResponse);
  rpc SpendLoyaltyPoints(SpendLoyaltyPointsRequest) returns (SpendLoyaltyPointsResponse);
  rpc MatchSynergy(MatchSynergyRequest) returns (MatchSynergyResponse);
}
