syntax = "proto3";

package ohc.agent.feed;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/agent/feed;agentfeedpb";

enum FeedItemState {
  FEED_ITEM_STATE_UNSPECIFIED = 0;
  FEED_ITEM_STATE_PENDING = 1;
  FEED_ITEM_STATE_EXECUTED = 2;
  FEED_ITEM_STATE_DISMISSED = 3;
}

message AgentFeedItem {
  string id = 1;
  string tenant_id = 2;
  string trigger_event = 3;
  string context_payload_json = 4;
  string proposed_action_json = 5;
  FeedItemState state = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
}

message GetFeedRequest {
  string tenant_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message GetFeedResponse {
  repeated AgentFeedItem items = 1;
  string next_cursor = 2;
}

message UpdateFeedItemStateRequest {
  string tenant_id = 1;
  string id = 2;
  FeedItemState new_state = 3;
}

message UpdateFeedItemStateResponse {
  AgentFeedItem item = 1;
}

service AgentFeedService {
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
  rpc UpdateFeedItemState(UpdateFeedItemStateRequest) returns (UpdateFeedItemStateResponse);
}
