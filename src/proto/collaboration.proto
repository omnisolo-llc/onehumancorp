syntax = "proto3";

package ohc.collaboration;

import "src/proto/organization.proto";

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/collaboration;collaborationpb";

message BundleProduct {
    string id = 1;
    string name = 2;
    int64 price_cents = 3;
    repeated BundleItem items = 4;
}

message BundleItem {
    string product_id = 1;
    string tenant_id = 2;
    int64 split_cents = 3;
}

message UnifiedCart {
    string id = 1;
    string customer_id = 2;
    repeated CartItem items = 3;
    int64 total_cents = 4;
    string status = 5; // PENDING, CHECKOUT_INITIATED, RESERVED, PAID, FAILED, COMPLETED
}

message CartItem {
    string id = 1;
    string bundle_id = 2;
    int32 quantity = 3;
}

message CheckoutRequest {
    string cart_id = 1;
    string payment_method_id = 2;
}

message CheckoutResponse {
    bool success = 1;
    string transaction_id = 2;
    string error_message = 3;
}

service CollaborationService {
    rpc CreateBundle(BundleProduct) returns (BundleProduct);
    rpc GetBundle(GetBundleRequest) returns (BundleProduct);
    rpc CreateCart(UnifiedCart) returns (UnifiedCart);
    rpc AddToCart(AddToCartRequest) returns (UnifiedCart);
    rpc Checkout(CheckoutRequest) returns (CheckoutResponse);
}

message GetBundleRequest {
    string bundle_id = 1;
}

message AddToCartRequest {
    string cart_id = 1;
    CartItem item = 2;
}
