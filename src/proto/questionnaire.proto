syntax = "proto3";

package ohc.orchestration;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/orchestration;orchestrationpb";

message QuestionnaireTemplate {
    string id = 1;
    string tenant_id = 2;
    string title = 3;
    string status = 4;
}

message Question {
    string id = 1;
    string template_id = 2;
    string type = 3; // "text", "multiple_choice", "photo_upload"
    string text = 4;
    bool is_required = 5;
}

message IntakeSubmission {
    string id = 1;
    string customer_id = 2;
    string status = 3; // "draft", "submitted", "processed"
    string parsed_entities = 4; // JSON string
    int64 created_at_unix = 5;
}

message SubmissionAnswer {
    string id = 1;
    string submission_id = 2;
    string question_id = 3;
    string raw_response = 4;
    string media_url = 5;
}

message CreateTemplateRequest {
    string title = 1;
}

message CreateTemplateResponse {
    QuestionnaireTemplate template = 1;
}

message GetTemplateRequest {
    string template_id = 1;
}

message GetTemplateResponse {
    QuestionnaireTemplate template = 1;
    repeated Question questions = 2;
}

message SubmitIntakeRequest {
    string customer_id = 1;
    repeated SubmissionAnswer answers = 2;
}

message SubmitIntakeResponse {
    IntakeSubmission submission = 1;
}

service QuestionnaireService {
    rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
    rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
    rpc SubmitIntake(SubmitIntakeRequest) returns (SubmitIntakeResponse);
}
