syntax = "proto3";

package ohc.funding;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/funding;fundingpb";

message FundingOpportunity {
  string id = 1;
  string tenant_id = 2;
  string grant_name = 3;
  double amount = 4;
  string draft_proposal_text = 5;
  string status = 6;
  string deadline = 7;
}

message ListFundingOpportunitiesRequest {
  string tenant_id = 1;
}

message ListFundingOpportunitiesResponse {
  repeated FundingOpportunity opportunities = 1;
}

message ApproveFundingOpportunityRequest {
  string tenant_id = 1;
  string opportunity_id = 2;
}

message ApproveFundingOpportunityResponse {
  bool success = 1;
}

service FundingService {
  rpc ListFundingOpportunities(ListFundingOpportunitiesRequest) returns (ListFundingOpportunitiesResponse);
  rpc ApproveFundingOpportunity(ApproveFundingOpportunityRequest) returns (ApproveFundingOpportunityResponse);
}
