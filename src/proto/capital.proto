syntax = "proto3";

package ohc.capital;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/capital;capitalpb";

// Cash flow prediction for a specific date
message CashFlowPrediction {
  string id = 1;
  string tenant_id = 2;
  string business_id = 3;
  string predicted_date = 4; // YYYY-MM-DD format
  double predicted_inflow = 5;
  double predicted_outflow = 6;
  double predicted_balance = 7;
  double confidence_score = 8;
  int64 created_at_unix = 9;
}

// Capital offer generated by the engine
message CapitalOffer {
  string id = 1;
  string tenant_id = 2;
  string business_id = 3;
  double offer_amount = 4;
  double flat_fee_amount = 5;
  double flat_fee_percentage = 6;
  double repayment_percentage = 7;
  int32 estimated_repayment_days = 8;
  double total_repayment_amount = 9;
  string status = 10; // pending, accepted, active, repaid, declined
  string reason = 11;
  int64 expires_at_unix = 12;
  int64 accepted_at_unix = 13;
  int64 created_at_unix = 14;
}

// Active capital advance
message CapitalAdvance {
  string id = 1;
  string tenant_id = 2;
  string business_id = 3;
  string offer_id = 4;
  double principal_amount = 5;
  double flat_fee_amount = 6;
  double total_owed = 7;
  double amount_repaid = 8;
  double repayment_percentage = 9;
  string status = 10; // active, repaid, defaulted
  int64 disbursed_at_unix = 11;
  int64 repaid_at_unix = 12;
  int64 created_at_unix = 13;
}

// Repayment transaction
message CapitalRepayment {
  string id = 1;
  string tenant_id = 2;
  string advance_id = 3;
  string transaction_id = 4;
  double repayment_amount = 5;
  double transaction_amount = 6;
  int64 repayment_date_unix = 7;
  int64 created_at_unix = 8;
}

// Sales transaction for cash flow tracking
message SalesTransaction {
  string id = 1;
  string tenant_id = 2;
  string business_id = 3;
  int64 transaction_date_unix = 4;
  double amount = 5;
  string transaction_type = 6; // sale, refund, expense
  string description = 7;
  int64 created_at_unix = 8;
}

// Request messages
message GetCashFlowRequest {
  string business_id = 1;
  int32 days_ahead = 2; // Number of days to predict
}

message GetCapitalOffersRequest {
  string business_id = 1;
}

message AcceptCapitalOfferRequest {
  string offer_id = 1;
}

message RecordSaleRequest {
  string business_id = 1;
  double amount = 2;
  string transaction_type = 3;
  string description = 4;
}

message GetAdvancesRequest {
  string business_id = 1;
}

message EmptyCapitalRequest {}

// Response messages
message CashFlowResponse {
  repeated CashFlowPrediction predictions = 1;
  double current_balance = 2;
  bool cash_crunch_detected = 3;
  string next_crunch_date = 4;
  double crunch_severity = 5;
}

message CapitalOffersResponse {
  repeated CapitalOffer offers = 1;
  bool eligible_for_capital = 2;
  string ineligibility_reason = 3;
}

message AcceptOfferResponse {
  CapitalAdvance advance = 1;
  bool success = 2;
  string message = 3;
}

message RecordSaleResponse {
  SalesTransaction transaction = 1;
  bool success = 2;
}

message AdvancesResponse {
  repeated CapitalAdvance advances = 1;
  double total_outstanding = 2;
}

message CapitalDashboardResponse {
  double available_capital = 1;
  double outstanding_balance = 2;
  double total_repaid = 3;
  int32 active_advances_count = 4;
  repeated CapitalOffer pending_offers = 5;
  repeated CapitalAdvance active_advances = 6;
  CashFlowResponse cash_flow = 7;
}

// Capital service
service CapitalService {
  // Get cash flow predictions
  rpc GetCashFlowPredictions(GetCashFlowRequest) returns (CashFlowResponse);
  
  // Get available capital offers
  rpc GetCapitalOffers(GetCapitalOffersRequest) returns (CapitalOffersResponse);
  
  // Accept a capital offer
  rpc AcceptCapitalOffer(AcceptCapitalOfferRequest) returns (AcceptOfferResponse);
  
  // Record a sales transaction
  rpc RecordSalesTransaction(RecordSaleRequest) returns (RecordSaleResponse);
  
  // Get active advances
  rpc GetActiveAdvances(GetAdvancesRequest) returns (AdvancesResponse);
  
  // Get capital dashboard overview
  rpc GetCapitalDashboard(EmptyCapitalRequest) returns (CapitalDashboardResponse);
}
