syntax = "proto3";

package translation;

option go_package = "github.com/onehumancorp/mono/src/proto/translation";

service TranslationMesh {
    rpc Translate(TranslateRequest) returns (TranslateResponse) {}
}

message TranslateRequest {
    string tenant_id = 1;
    string source_text = 2;
    string target_locale = 3;
}

message TranslateResponse {
    string translated_text = 1;
    string status = 2; // "COMPLETED" or "PENDING"
}
