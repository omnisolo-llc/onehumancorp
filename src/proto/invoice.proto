syntax = "proto3";

package ohc.invoice;

message InvoiceLineItem {
  string id = 1;
  string invoice_id = 2;
  string description = 3;
  int32 quantity = 4;
  double unit_price = 5;
  double amount = 6;
}

message Invoice {
  string id = 1;
  string client_id = 2;
  string client_name = 3;
  string status = 4;
  int64 due_date = 5;
  string currency = 6;
  double total_amount = 7;
  int32 total_amount_cents = 13;
  string payment_status = 14;
  int32 view_count = 15;
  int32 amount_paid_cents = 16;
  string stripe_invoice_id = 8;
  string stripe_payment_link = 9;
  repeated InvoiceLineItem line_items = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  int64 last_reminded_at = 17;
}

message CreateInvoiceRequest {
  string tenant_id = 1;
  string client_id = 2;
  string client_name = 3;
  int64 due_date = 4;
  string currency = 5;
  repeated InvoiceLineItem line_items = 6;
}

message GetInvoiceRequest {
  string tenant_id = 1;
  string invoice_id = 2;
}

message ListInvoicesRequest {
  string tenant_id = 1;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

message UpdateInvoiceStatusRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  string status = 3;
}

message DraftInvoiceFromContextRequest {
  string tenant_id = 1;
  string client_name = 2;
  string project_context = 3;
}

message DraftInvoiceFromContextResponse {
  Invoice draft = 1;
}

service InvoiceService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (Invoice);
  rpc GetInvoice(GetInvoiceRequest) returns (Invoice);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc UpdateInvoiceStatus(UpdateInvoiceStatusRequest) returns (Invoice);
  rpc DraftInvoiceFromContext(DraftInvoiceFromContextRequest) returns (DraftInvoiceFromContextResponse);
  rpc CheckOverdueInvoices(CheckOverdueInvoicesRequest) returns (CheckOverdueInvoicesResponse);
  rpc SendInvoiceReminder(SendInvoiceReminderRequest) returns (Invoice);
}

message CheckOverdueInvoicesRequest {
  string tenant_id = 1;
}

message OverdueInvoiceDraft {
  string invoice_id = 1;
  string client_name = 2;
  string drafted_message = 3;
  double amount = 4;
  int64 due_date = 5;
  string context_summary = 6;
}

message CheckOverdueInvoicesResponse {
  repeated OverdueInvoiceDraft drafts = 1;
}

message SendInvoiceReminderRequest {
  string tenant_id = 1;
  string invoice_id = 2;
  string message = 3;
}
