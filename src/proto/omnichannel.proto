syntax = "proto3";

package ohc.omnichannel;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/omnichannel;omnichannelpb";

message Tenant {
    string id = 1;
    string name = 2;
}

message Inbox {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
}

message Channel {
    string id = 1;
    string provider_type = 2;
}

message Contact {
    string id = 1;
    string tenant_id = 2;
    string email = 3;
    string phone = 4;
}

message Conversation {
    string id = 1;
    string inbox_id = 2;
    string contact_id = 3;
    string status = 4;
}

message Message {
    string id = 1;
    string conversation_id = 2;
    string content = 3;
    string status = 4;
}

message CreateInboxRequest {
    string tenant_id = 1;
    string name = 2;
}

message CreateInboxResponse {
    Inbox inbox = 1;
}

message GetInboxRequest {
    string id = 1;
    string tenant_id = 2;
}

message GetInboxResponse {
    Inbox inbox = 1;
}

message CreateConversationRequest {
    string tenant_id = 1;
    string inbox_id = 2;
    string contact_id = 3;
    string status = 4;
}

message CreateConversationResponse {
    Conversation conversation = 1;
}

message GetConversationRequest {
    string id = 1;
    string tenant_id = 2;
}

message GetConversationResponse {
    Conversation conversation = 1;
}

message CreateMessageRequest {
    string tenant_id = 1;
    string conversation_id = 2;
    string content = 3;
    string status = 4;
}

message CreateMessageResponse {
    Message message = 1;
}

message GetMessageRequest {
    string id = 1;
    string tenant_id = 2;
}

message GetMessageResponse {
    Message message = 1;
}

service OmnichannelService {
    rpc CreateInbox(CreateInboxRequest) returns (CreateInboxResponse);
    rpc GetInbox(GetInboxRequest) returns (GetInboxResponse);
    rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
    rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
    rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);
    rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
}
