syntax = "proto3";

package ohc.docs.v1;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/docs/v1;docsv1";

message HelpArticle {
  string id = 1;
  string topic = 2; // e.g. "Getting Started", "My Store", "Payments", "AI Agents", "Marketing", "Account & Billing"
  string title = 3;
  string content_markdown = 4;
}

message GetHelpArticleRequest {
  string id = 1;
}

message GetHelpArticleResponse {
  HelpArticle article = 1;
}

message SearchHelpArticlesRequest {
  string query = 1;
  string topic_filter = 2; // optional
}

message SearchHelpArticlesResponse {
  repeated HelpArticle articles = 1;
}

message Tooltip {
  string element_id = 1;
  string title = 2;
  string plain_language_description = 3; // Max 2 sentences
}

message GetTooltipRequest {
  string element_id = 1;
}

message GetTooltipResponse {
  Tooltip tooltip = 1;
}

service DocsService {
  rpc GetHelpArticle(GetHelpArticleRequest) returns (GetHelpArticleResponse);
  rpc SearchHelpArticles(SearchHelpArticlesRequest) returns (SearchHelpArticlesResponse);
  rpc GetTooltip(GetTooltipRequest) returns (GetTooltipResponse);
}
