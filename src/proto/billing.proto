syntax = "proto3";

package ohc.billing;


option go_package = "github.com/onehumancorp/mono/src/proto/ohc/billing;billingpb";

message TokenUsage {
  string agent_id = 1;
  string organization_id = 2;
  string model = 3;
  int64 prompt_tokens = 4;
  int64 completion_tokens = 5;
  double cost_usd = 6;
  int64 occurred_at_unix = 7;
}

message CostSummary {
  string organization_id = 1;
  double total_cost_usd = 2;
  int64 total_tokens = 3;
  double projected_monthly_usd = 4;
  repeated AgentCostSummary agents = 5;
}

message AgentCostSummary {
  string agent_id = 1;
  double cost_usd = 2;
  int64 token_used = 3;
  double roi = 4;
  double efficiency = 5;
  float pct = 6;
  int64 storage_usage_bytes = 7;
}

message BudgetAlert {
  string id = 1;
  string organization_id = 2;
  double threshold_usd = 3;
  double notify_at_pct = 4;
  bool triggered = 5;
}

message GetMyPlanRequest {
  string organization_id = 1;
}

message GetMyPlanResponse {
  string current_tier = 1;
  uint32 ai_actions_used = 2;
  uint32 ai_actions_limit = 3;
  int64 storage_used_bytes = 4;
  int64 storage_limit_bytes = 5;
  double estimated_next_bill_usd = 6;
}

message UpgradePlanRequest {
  string organization_id = 1;
  string target_tier = 2; // "Starter", "Pro", "Business"
}

message UpgradePlanResponse {
  bool success = 1;
  string checkout_url = 2; // e.g. Stripe checkout URL
}

message CancelPlanRequest {
  string organization_id = 1;
}

message CancelPlanResponse {
  bool success = 1;
}

message GetBillingHistoryRequest {
  string organization_id = 1;
}

message BillingHistoryItem {
  string invoice_id = 1;
  double amount_usd = 2;
  string status = 3; // "paid", "open"
  string invoice_pdf_url = 4;
  int64 date_unix = 5;
}

message GetBillingHistoryResponse {
  repeated BillingHistoryItem history = 1;
}

service BillingService {
  rpc TrackTokenUsage(TokenUsage) returns (TokenUsage);
  rpc GetCostSummary(TokenUsage) returns (CostSummary);

  rpc GetMyPlan(GetMyPlanRequest) returns (GetMyPlanResponse);
  rpc UpgradePlan(UpgradePlanRequest) returns (UpgradePlanResponse);
  rpc CancelPlan(CancelPlanRequest) returns (CancelPlanResponse);
  rpc GetBillingHistory(GetBillingHistoryRequest) returns (GetBillingHistoryResponse);
}
