syntax = "proto3";

package ohc.assistant.v1;

import "src/proto/common.proto";

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/assistant/v1;assistantv1";

message AssistantWorkspace {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string default_work_directory = 4;
  string default_model = 5;
  string created_at = 6;
  string updated_at = 7;
}

message AssistantTask {
  string id = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  string title = 4;
  string prompt = 5;
  string status = 6;
  string mode = 7;
  string model = 8;
  string provider = 9;
  string permission_profile = 10;
  string current_step = 11;
  string created_at = 12;
  string updated_at = 13;
}

message AssistantMessage {
  string id = 1;
  string tenant_id = 2;
  string task_id = 3;
  string role = 4;
  string content = 5;
  string attachments = 6;
  string tool_call_metadata = 7;
  string created_at = 8;
}

message AssistantArtifact {
  string id = 1;
  string tenant_id = 2;
  string task_id = 3;
  string type = 4;
  string filename = 5;
  string path = 6;
  string mime_type = 7;
  int64 size = 8;
  string preview_ref = 9;
  string created_at = 10;
}

message AssistantChange {
  string id = 1;
  string tenant_id = 2;
  string task_id = 3;
  string path = 4;
  string change_type = 5;
  string diff = 6;
  string approval_status = 7;
  string created_at = 8;
}
