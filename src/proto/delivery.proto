syntax = "proto3";

package ohc.api.v1;

import "src/proto/organization.proto";

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/api/v1;apiv1";

message DeliveryZone {
    string id = 1;
    string organization_id = 2;
    string polygon_wkt = 3; // Well-Known Text (WKT) for the polygon geometry
    int64 flat_fee_cents = 4;
    int64 min_order_value_cents = 5;
    int64 created_at_unix = 6;
    int64 updated_at_unix = 7;
}

message RoutePlan {
    string id = 1;
    string organization_id = 2;
    string delivery_date = 3; // Format: YYYY-MM-DD
    string waypoint_sequence_json = 4;
    int64 created_at_unix = 5;
    int64 updated_at_unix = 6;
}

message DeliveryTask {
    string id = 1;
    string organization_id = 2;
    string order_id = 3;
    string driver_id = 4;
    string route_plan_id = 5;
    string status = 6; // PENDING, IN_TRANSIT, DELIVERED, FAILED
    int64 estimated_arrival_unix = 7;
    double delivery_location_lat = 8;
    double delivery_location_lng = 9;
    int64 created_at_unix = 10;
    int64 updated_at_unix = 11;
}

message ConfigureDeliveryZoneRequest {
    string organization_id = 1;
    string polygon_wkt = 2;
    int64 flat_fee_cents = 3;
    int64 min_order_value_cents = 4;
}

message ConfigureDeliveryZoneResponse {
    DeliveryZone zone = 1;
}

message GetDeliveryZoneRequest {
    string organization_id = 1;
}

message GetDeliveryZoneResponse {
    DeliveryZone zone = 1;
}

message GetDailyItineraryRequest {
    string organization_id = 1;
    string delivery_date = 2; // Format: YYYY-MM-DD
}

message GetDailyItineraryResponse {
    RoutePlan route_plan = 1;
    repeated DeliveryTask tasks = 2;
}

message UpdateDeliveryTaskStatusRequest {
    string organization_id = 1;
    string task_id = 2;
    string status = 3;
}

message UpdateDeliveryTaskStatusResponse {
    DeliveryTask task = 1;
}

message CanDeliverToLocationRequest {
   string organization_id = 1;
   double lat = 2;
   double lng = 3;
}

message CanDeliverToLocationResponse {
   bool can_deliver = 1;
   int64 flat_fee_cents = 2;
}

service DeliveryService {
    rpc ConfigureDeliveryZone(ConfigureDeliveryZoneRequest) returns (ConfigureDeliveryZoneResponse);
    rpc GetDeliveryZone(GetDeliveryZoneRequest) returns (GetDeliveryZoneResponse);
    rpc GetDailyItinerary(GetDailyItineraryRequest) returns (GetDailyItineraryResponse);
    rpc UpdateDeliveryTaskStatus(UpdateDeliveryTaskStatusRequest) returns (UpdateDeliveryTaskStatusResponse);
    rpc CanDeliverToLocation(CanDeliverToLocationRequest) returns (CanDeliverToLocationResponse);
}
