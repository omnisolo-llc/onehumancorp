syntax = "proto3";

package ohc.chat;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/chat;chatpb";

message Inbox {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string channel_type = 4;
}

message Contact {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string email = 4;
    string phone = 5;
}

message Conversation {
    string id = 1;
    string tenant_id = 2;
    string inbox_id = 3;
    string contact_id = 4;
    string status = 5; // "open", "resolved", "snoozed"
}

message Message {
    string id = 1;
    string tenant_id = 2;
    string conversation_id = 3;
    string content = 4;
    string sender_type = 5; // "contact", "agent", "bot"
    string sender_id = 6;
}

message CreateInboxRequest {
    Inbox inbox = 1;
}
message CreateInboxResponse {
    Inbox inbox = 1;
}

message ListInboxesRequest {
    string tenant_id = 1;
}
message ListInboxesResponse {
    repeated Inbox inboxes = 1;
}

message CreateContactRequest {
    Contact contact = 1;
}
message CreateContactResponse {
    Contact contact = 1;
}

message CreateConversationRequest {
    Conversation conversation = 1;
}
message CreateConversationResponse {
    Conversation conversation = 1;
}

message CreateMessageRequest {
    Message message = 1;
}
message CreateMessageResponse {
    Message message = 1;
}

message ListConversationsRequest {
    string tenant_id = 1;
    string inbox_id = 2;
}
message ListConversationsResponse {
    repeated Conversation conversations = 1;
}

message ListMessagesRequest {
    string tenant_id = 1;
    string conversation_id = 2;
}
message ListMessagesResponse {
    repeated Message messages = 1;
}

service ChatService {
    rpc CreateInbox(CreateInboxRequest) returns (CreateInboxResponse);
    rpc ListInboxes(ListInboxesRequest) returns (ListInboxesResponse);
    rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
    rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
    rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
    rpc CreateMessage(CreateMessageRequest) returns (CreateMessageResponse);
    rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
}
