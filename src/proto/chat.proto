syntax = "proto3";

package ohc.chat;

message Conversation {
  string id = 1;
  string tenant_id = 2;
  string status = 3;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string tenant_id = 3;
  string content = 4;
  string sender_type = 5;
}

message Contact {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string identifier = 4;
}

message SendMessageRequest {
  string tenant_id = 1;
  string content = 2;
  string conversation_id = 3;
}

message SendMessageResponse {
  Message message = 1;
}

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}
