syntax = "proto3";

package ohc.chat;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/chat;chatpb";

message Inbox {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string created_at = 4;
    string updated_at = 5;
}

message Channel {
    string id = 1;
    string tenant_id = 2;
    string inbox_id = 3;
    string channel_type = 4;
    string config = 5; // JSON
    string created_at = 6;
    string updated_at = 7;
}

message Contact {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    string email = 4;
    string phone = 5;
    string created_at = 6;
    string updated_at = 7;
}

message Conversation {
    string id = 1;
    string tenant_id = 2;
    string inbox_id = 3;
    string contact_id = 4;
    string assignee_id = 5;
    string status = 6;
    string created_at = 7;
    string updated_at = 8;
}

message Message {
    string id = 1;
    string tenant_id = 2;
    string conversation_id = 3;
    string sender_type = 4;
    string sender_id = 5;
    string content = 6;
    string created_at = 7;
    string updated_at = 8;
}

message CreateInboxRequest {
    string tenant_id = 1;
    string name = 2;
}

message CreateInboxResponse {
    Inbox inbox = 1;
}

message CreateChannelRequest {
    string tenant_id = 1;
    string inbox_id = 2;
    string channel_type = 3;
    string config = 4;
}

message CreateChannelResponse {
    Channel channel = 1;
}

message CreateContactRequest {
    string tenant_id = 1;
    string name = 2;
    string email = 3;
    string phone = 4;
}

message CreateContactResponse {
    Contact contact = 1;
}

message StartConversationRequest {
    string tenant_id = 1;
    string inbox_id = 2;
    string contact_id = 3;
    string assignee_id = 4;
}

message StartConversationResponse {
    Conversation conversation = 1;
}

message SendMessageRequest {
    string tenant_id = 1;
    string conversation_id = 2;
    string sender_type = 3;
    string sender_id = 4;
    string content = 5;
}

message SendMessageResponse {
    Message message = 1;
}

service ChatService {
    rpc CreateInbox(CreateInboxRequest) returns (CreateInboxResponse);
    rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
    rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
    rpc StartConversation(StartConversationRequest) returns (StartConversationResponse);
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}
