syntax = "proto3";

package help;

message HelpArticle {
  string id = 1;
  string title = 2;
  string content = 3;
  string category = 4;
  string created_at = 5;
  string updated_at = 6;
}

message Tooltip {
  string id = 1;
  string element_id = 2;
  string text = 3;
  string screen = 4;
}

message WalkthroughStep {
  string id = 1;
  string element_id = 2;
  string text = 3;
  int32 order = 4;
}

message Walkthrough {
  string id = 1;
  string title = 2;
  repeated WalkthroughStep steps = 3;
}

message VideoTutorial {
  string id = 1;
  string title = 2;
  string url = 3;
  string duration = 4;
  string thumbnail_url = 5;
}

message ReleaseNote {
  string version = 1;
  string title = 2;
  string description = 3;
  string date = 4;
  repeated string screenshots = 5;
}

message GetHelpCenterRequest {
  string query = 1;
}

message GetHelpCenterResponse {
  repeated HelpArticle articles = 1;
}

message GetTooltipsRequest {
  string screen = 1;
}

message GetTooltipsResponse {
  repeated Tooltip tooltips = 1;
}

message GetWalkthroughsRequest {
}

message GetWalkthroughsResponse {
  repeated Walkthrough walkthroughs = 1;
}

message GetVideoTutorialsRequest {
}

message GetVideoTutorialsResponse {
  repeated VideoTutorial videos = 1;
}

message GetReleaseNotesRequest {
}

message GetReleaseNotesResponse {
  repeated ReleaseNote notes = 1;
}

message AskHelpChatRequest {
  string query = 1;
}

message AskHelpChatResponse {
  string answer = 1;
  repeated string related_article_ids = 2;
}

service HelpService {
  rpc GetHelpCenter(GetHelpCenterRequest) returns (GetHelpCenterResponse);
  rpc GetTooltips(GetTooltipsRequest) returns (GetTooltipsResponse);
  rpc GetWalkthroughs(GetWalkthroughsRequest) returns (GetWalkthroughsResponse);
  rpc GetVideoTutorials(GetVideoTutorialsRequest) returns (GetVideoTutorialsResponse);
  rpc GetReleaseNotes(GetReleaseNotesRequest) returns (GetReleaseNotesResponse);
  rpc AskHelpChat(AskHelpChatRequest) returns (AskHelpChatResponse);
}
