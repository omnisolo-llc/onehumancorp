syntax = "proto3";

package ohc.inventory;

message ReserveInventoryRequest {
  string tenant_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  int32 ttl_seconds = 4;
}

message ReserveInventoryResponse {
  bool success = 1;
  string lock_id = 2;
  string error_message = 3;
}

message CommitInventoryRequest {
  string tenant_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  string lock_id = 4;
}

message CommitInventoryResponse {
  bool success = 1;
  string error_message = 2;
}

message OfflineTransaction {
  string product_id = 1;
  int32 quantity = 2;
  string client_timestamp = 3;
  string client_transaction_id = 4;
}

message SyncOfflineTransactionsRequest {
  repeated OfflineTransaction transactions = 1;
}

message SyncTransactionResult {
  string client_transaction_id = 1;
  bool success = 2;
  string error_message = 3;
}

message SyncOfflineTransactionsResponse {
  repeated SyncTransactionResult results = 1;
}

service InventorySyncService {
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
  rpc CommitInventory(CommitInventoryRequest) returns (CommitInventoryResponse);
  rpc SyncOfflineTransactions(SyncOfflineTransactionsRequest) returns (SyncOfflineTransactionsResponse);
}
