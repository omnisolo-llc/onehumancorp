syntax = "proto3";

package ohc.ledger;

import "google/protobuf/timestamp.proto";

service LedgerService {
  rpc RecordTransaction (RecordTransactionRequest) returns (RecordTransactionResponse);
  rpc GetBalance (GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetStatement (GetStatementRequest) returns (GetStatementResponse);
}

message TransactionEntry {
  string account_id = 1;
  enum Direction {
    CREDIT = 0;
    DEBIT = 1;
  }
  Direction direction = 2;
  int64 amount = 3;
}

message RecordTransactionRequest {
  string tenant_id = 1;
  string currency = 2;
  repeated TransactionEntry entries = 3;
}

message RecordTransactionResponse {
  string tx_id = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message GetBalanceRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetBalanceResponse {
  int64 balance = 1;
  string currency = 2;
}

message GetStatementRequest {
  string tenant_id = 1;
  string account_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
}

message TransactionRecord {
  string tx_id = 1;
  int64 amount = 2;
  string currency = 3;
  google.protobuf.Timestamp timestamp = 4;
  string direction = 5;
}

message GetStatementResponse {
  repeated TransactionRecord transactions = 1;
}
