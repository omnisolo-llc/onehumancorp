syntax = "proto3";

package ohc.ledger;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/ledger;ledgerpb";

message Account {
  string tenant_id = 1;
  string account_id = 2;
  string currency = 3;
  double balance = 4;
}

message Transaction {
  string tenant_id = 1;
  string tx_id = 2;
  double amount = 3;
  string currency = 4;
  int64 timestamp = 5;
  string base_currency = 6;
  string transaction_currency = 7;
  double exchange_rate = 8;
}

message Entry {
  string tenant_id = 1;
  string entry_id = 2;
  string tx_id = 3;
  string account_id = 4;
  string direction = 5; // "CREDIT" or "DEBIT"
  double amount = 6;
}

message RecordTransactionRequest {
  string tenant_id = 1;
  double amount = 2;
  string currency = 3;
  string from_account_id = 4;
  string to_account_id = 5;
}

message RecordTransactionResponse {
  string tx_id = 1;
  bool success = 2;
}

message GetBalanceRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetBalanceResponse {
  double balance = 1;
  string currency = 2;
}

message GetStatementRequest {
  string tenant_id = 1;
  string account_id = 2;
}

message GetStatementResponse {
  repeated Transaction transactions = 1;
  repeated Entry entries = 2;
}

service LedgerService {
  rpc RecordTransaction(RecordTransactionRequest) returns (RecordTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);
}
