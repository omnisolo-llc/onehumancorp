syntax = "proto3";

package ohc.ledger;

option go_package = "github.com/onehumancorp/mono/src/proto/ohc/ledger;ledgerpb";

message Entry {
  string account_id = 1;
  int64 amount_cents = 2;
  string direction = 3; // "CREDIT" or "DEBIT"
}

message RecordTransactionRequest {
  string organization_id = 1;
  string currency = 2;
  repeated Entry entries = 3;
  string description = 4;
  string reference_type = 5;
  string reference_id = 6;
}

message RecordTransactionResponse {
  string transaction_id = 1;
}

message GetBalanceRequest {
  string organization_id = 1;
  string account_id = 2;
  string currency = 3;
}

message GetBalanceResponse {
  int64 balance_cents = 1;
  string currency = 2;
}

message LedgerEntry {
  string entry_id = 1;
  string transaction_id = 2;
  string account_id = 3;
  int64 amount_cents = 4;
  string direction = 5;
  int64 created_at = 6;
}

message GetStatementRequest {
  string organization_id = 1;
  string account_id = 2;
  int64 limit = 3;
  int64 offset = 4;
}

message GetStatementResponse {
  repeated LedgerEntry entries = 1;
  int64 total_count = 2;
}

service LedgerService {
  rpc RecordTransaction(RecordTransactionRequest) returns (RecordTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetStatement(GetStatementRequest) returns (GetStatementResponse);
}
