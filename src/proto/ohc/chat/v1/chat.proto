syntax = "proto3";

package ohc.chat.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "onehumancorp/src/proto/ohc/chat/v1";

service ChatService {
  rpc CreateConversation(CreateConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc GetInbox(GetInboxRequest) returns (Inbox);
  rpc CreateContact(CreateContactRequest) returns (Contact);
}

message Inbox {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string channel_type = 4;
  google.protobuf.Struct config = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Contact {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string email = 4;
  string phone_number = 5;
  string avatar_url = 6;
  google.protobuf.Struct custom_attributes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Conversation {
  string id = 1;
  string tenant_id = 2;
  string inbox_id = 3;
  string contact_id = 4;
  string assignee_id = 5;
  string status = 6;
  string priority = 7;
  google.protobuf.Struct custom_attributes = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_activity_at = 11;
}

message Message {
  string id = 1;
  string tenant_id = 2;
  string conversation_id = 3;
  string sender_id = 4;
  string sender_type = 5;
  string content = 6;
  string content_type = 7;
  google.protobuf.Struct attachments = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateConversationRequest {
  string inbox_id = 1;
  string contact_id = 2;
}

message ListConversationsRequest {
  string inbox_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_page_token = 2;
}

message SendMessageRequest {
  string conversation_id = 1;
  string content = 2;
  string sender_type = 3;
  string sender_id = 4;
}

message ListMessagesRequest {
  string conversation_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message GetInboxRequest {
  string inbox_id = 1;
}

message CreateContactRequest {
  string name = 1;
  string email = 2;
  string phone_number = 3;
}
