<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OneHuman - Agents</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Outfit', sans-serif; background: #1a1a2e; color: white; margin: 0; padding: 20px; }
            nav { margin-bottom: 40px; display: flex; gap: 20px; }
            a { color: white; text-decoration: none; }
            a.active { color: #4ecca3; }
            .agent-list { display: flex; gap: 20px; flex-wrap: wrap; }
            .agent-card { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 12px; width: 200px; border: 1px solid rgba(255,255,255,0.1); }
            h1 { color: #4ecca3; }
            button { margin-top: 20px; padding: 12px 24px; background: #4ecca3; border: none; border-radius: 8px; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        </style>
    </head>
    <body>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/agents" class="active">Agents</a>
            <a href="/business-setup">Setup</a>
            <a href="/manage-ai">Manage AI</a>
        </nav>
        <h1>Your AI Team</h1>
        <div class="agent-list">
            <div class="agent-card">
                <h3>Marketing Pro</h3>
                <p style="font-size:12px; color:rgba(255,255,255,0.7);">Status: Active</p>
                <button style="padding:4px 8px; font-size:10px; margin-top:10px; width:auto;" onclick="window.location.href='/manage-ai'">Configure</button>
            </div>
        </div>
        <button onclick="window.location.href='/manage-ai'">Hire New Agent</button>
    </body>
</html>
