<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OneHuman - Login</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Outfit', sans-serif; background: #1a1a2e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 10px; width: 300px; border: 1px solid rgba(255,255,255,0.1); }
            h1 { margin-top: 0; color: #4ecca3; }
            input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; }
            button { width: 100%; padding: 12px; background: #4ecca3; border: none; border-radius: 8px; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        </style>
    </head>
    <body>
        <div class="login-card">
            <h1>Login</h1>
            <input type="email" placeholder="Email" />
            <input type="password" placeholder="Password" />
            <button onclick="window.location.href='/'">Login</button>
        </div>
    </body>
</html>
