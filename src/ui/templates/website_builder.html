<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OneHuman - Website Builder</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
        <style>
            :root {
                --glass-bg: rgba(255, 255, 255, 0.03);
                --glass-border: rgba(255, 255, 255, 0.1);
                --accent: #4ecca3;
                --accent-glow: rgba(78, 204, 163, 0.3);
                --bg: #0f172a;
                --text-main: #ffffff;
                --text-muted: rgba(255, 255, 255, 0.7);
            }

            body {
                font-family: 'Inter', sans-serif;
                background: radial-gradient(circle at top right, #1e293b, #0f172a);
                color: var(--text-main);
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            h1, h2, h3 { font-family: 'Outfit', sans-serif; }

            .glass-card {
                background: var(--glass-bg);
                backdrop-filter: blur(20px);
                border: 1px solid var(--glass-border);
                border-radius: 24px;
                padding: 40px;
                width: 100%;
                max-width: 800px;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            }

            .template-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
                margin-top: 24px;
            }

            .template-card {
                background: rgba(255, 255, 255, 0.05);
                border: 2px solid transparent;
                border-radius: 12px;
                overflow: hidden;
                cursor: pointer;
                transition: all 0.2s;
            }

            .template-card:hover { transform: scale(1.02); }
            .template-card.selected { border-color: var(--accent); }

            .template-preview {
                height: 120px;
                background: #334155;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
            }

            .btn-primary {
                background: var(--accent);
                color: #0f172a;
                border: none;
                padding: 12px 24px;
                border-radius: 10px;
                font-weight: 600;
                cursor: pointer;
            }

            .color-swatch {
                width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
            }
            .color-swatch.selected { border-color: white; }

            input, textarea {
                width: 100%;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid var(--glass-border);
                border-radius: 12px;
                padding: 12px 16px;
                color: white;
                font-family: inherit;
                box-sizing: border-box;
                transition: border-color 0.2s;
            }
            input:focus { outline: none; border-color: var(--accent); }
        </style>
    </head>
    <body>
        <div class="glass-card">
            <div id="builder-step">
                <!-- Injected -->
            </div>
        </div>

        <script>
            const state = {
                step: 0,
                template: '',
                brand_color: '#4ecca3',
                product: { name: '', price: '', desc: '' },
                domain: '',
                is_published: false
            };

            const steps = [
                {
                    title: "Choose a Template",
                    render: () => `
                        <h2>Pick your starting point</h2>
                        <div class="template-grid">
                            ${['Modern', 'Minimal', 'Classic', 'Bold'].map(t => `
                                <div class="template-card ${state.template === t ? 'selected' : ''}" onclick="selectTemplate('${t}')">
                                    <div class="template-preview">${t[0]}</div>
                                    <div style="padding:12px; text-align:center;">${t}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top:32px; display:flex; justify-content:flex-end;">
                            <button class="btn-primary" onclick="nextStep()" ${!state.template ? 'disabled' : ''}>Use this template →</button>
                        </div>
                    `
                },
                {
                    title: "Brand Identity",
                    render: () => `
                        <h2>Brand colors & logo</h2>
                        <p style="color:var(--text-muted);">AI suggested palettes for your business:</p>
                        <div style="display:flex; gap:12px; margin-bottom:24px;">
                            ${['#4ecca3', '#3498db', '#e74c3c', '#f1c40f'].map(c => `
                                <div class="color-swatch" style="background:${c};" onclick="state.brand_color='${c}';render();"></div>
                            `).join('')}
                        </div>
                        <div style="border: 2px dashed var(--glass-border); border-radius:12px; padding:32px; text-align:center; margin-bottom:24px;">
                            <span style="font-size:24px;">🖼️</span><br>
                            <p style="font-size:14px; color:var(--text-muted);">Drop logo here or <a href="#" style="color:var(--accent);">Generate with AI</a></p>
                        </div>
                        <button class="btn-primary" onclick="nextStep()">Continue</button>
                    `
                },
                {
                    title: "First Product",
                    render: () => `
                        <h2>Add your first item</h2>
                        <div style="display:flex; gap:24px;">
                            <div style="flex:1;">
                                <input type="text" placeholder="Product Name" style="margin-bottom:12px;" oninput="state.product.name=this.value">
                                <input type="text" placeholder="Price ($)" style="margin-bottom:12px;" oninput="state.product.price=this.value">
                                <textarea placeholder="Description" rows="4" id="prod-desc" oninput="state.product.desc=this.value">${state.product.desc}</textarea>
                                <button onclick="genDesc()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:12px; margin-top:4px;">✨ Generate Description</button>
                            </div>
                            <div style="width:150px; height:150px; background:rgba(255,255,255,0.05); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--text-muted);">
                                Photo
                            </div>
                        </div>
                        <button class="btn-primary" style="margin-top:24px;" onclick="nextStep()">Continue</button>
                    `
                },
                {
                    title: "Connect Domain",
                    render: () => `
                        <h2>Where should people go?</h2>
                        <div style="background:rgba(255,255,255,0.05); border-radius:12px; padding:20px; margin-bottom:12px; cursor:pointer; border:1px solid var(--accent);" onclick="state.domain='free';render();">
                            <div style="font-weight:600;">Free OHC Subdomain</div>
                            <div style="font-size:12px; color:var(--text-muted);">mybusiness.ohc.app</div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05); border-radius:12px; padding:20px; margin-bottom:12px; color:var(--text-muted);">
                            <div style="font-weight:600;">Use my own domain</div>
                        </div>
                        <button class="btn-primary" onclick="nextStep()">Continue</button>
                    `
                },
                {
                    title: "Go Live",
                    render: () => `
                        <h2>Preview & Publish</h2>
                        <div style="width:100%; height:300px; background:white; border-radius:12px; overflow:hidden; position:relative;">
                            <div style="padding:20px; color:#0f172a;">
                                <h1 style="margin:0;">${state.product.name || 'My Business'}</h1>
                                <div style="width:50px; height:4px; background:${state.brand_color}; margin:10px 0;"></div>
                                <p>${state.product.desc || 'Coming soon...'}</p>
                            </div>
                        </div>
                        <button class="btn-primary" style="width:100%; margin-top:24px;" onclick="publish()">Publish Instantly →</button>
                    `
                }
            ];

            function render() {
                const step = steps[state.step];
                document.getElementById('builder-step').innerHTML = step.render();
            }

            function nextStep() { state.step++; render(); }
            function selectTemplate(t) { state.template = t; render(); }

            async function genDesc() {
                 const res = await fetch('/api/onboarding/suggest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name: state.product.name, business_type: 'Product' })
                });
                const json = await res.json();
                state.product.desc = json.description;
                document.getElementById('prod-desc').value = json.description;
            }

            async function publish() {
                const res = await fetch('/api/v1/builder/publish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(state)
                });
                document.body.innerHTML = `
                    <div class="glass-card" style="text-align:center;">
                        <h2>🚀 Your site is live!</h2>
                        <p style="color:var(--text-muted);">Share your business with the world.</p>
                        <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:8px; margin:24px 0;">mybusiness.ohc.app</div>
                        <button class="btn-primary" onclick="window.location.href='/'">Go to Dashboard</button>
                    </div>
                `;
            }

            render();
        </script>
    </body>
</html>
