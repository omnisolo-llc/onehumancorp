<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; color: #111827; padding: 2rem; max-width: 4xl; margin: 0 auto; }
      .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
      h1 { margin-top: 0; font-size: 1.875rem; color: #1f2937; }
      label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
      input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 1.5rem; box-sizing: border-box; }
      button { background: #2563eb; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
      button:hover { background: #1d4ed8; }
      button:disabled { background: #93c5fd; cursor: not-allowed; }
      #result-container { margin-top: 2rem; display: none; }
      pre { background: #f3f4f6; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.875rem; color: #374151; }
      .error { color: #dc2626; margin-top: 1rem; display: none; }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aider RepoMap</title>
  </head>
  <body>
    <div class="glassmorphism" style="padding: 24px; max-width: 800px; margin: 0 auto;">
        <h1>Aider RepoMap</h1>
        <p style="color: #6b7280; margin-bottom: 2rem;">Generate a concise structural view of a codebase using Aider's RepoMap mechanic.</p>

        <div>
            <label for="workspace-path">Workspace Path</label>
            <input type="text" id="workspace-path" placeholder="e.g. ." value=".">
        </div>

        <button id="generate-btn">Generate RepoMap</button>

        <div id="error-msg" class="error"></div>

        <div id="result-container">
            <h3>RepoMap Result</h3>
            <pre id="result-content"></pre>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const btn = document.getElementById('generate-btn');
            const pathInput = document.getElementById('workspace-path').value || '.';
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');

            btn.disabled = true;
            btn.textContent = 'Generating...';
            errorMsg.style.display = 'none';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/api/v1/rpc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        id: "aider-1",
                        method: "aider_repomap",
                        params: { path: pathInput }
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message || 'Unknown error');
                }

                resultContent.textContent = data.result;
                resultContainer.style.display = 'block';
            } catch (err) {
                errorMsg.textContent = 'Error: ' + err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate RepoMap';
            }
        });
    </script>
  </body>
</html>
