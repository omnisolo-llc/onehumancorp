<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hyperlocal Lead Gen</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(40px) saturate(220%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 24px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #1d1d1f;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 24px;
      text-align: center;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255, 255, 255, 0.65);
      font-family: inherit;
      box-sizing: border-box;
    }
    button {
      background: #0066FF;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:disabled {
      background: #a0c4ff;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
    .success-card {
      display: none;
      background: rgba(0, 255, 0, 0.05);
      border: 1px solid rgba(0, 255, 0, 0.2);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .success-card h2 {
      margin-top: 0;
      color: #1d1d1f;
    }
    .success-card p {
      color: #86868b;
      font-size: 14px;
      margin-bottom: 0;
    }
    .back-nav {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #0066FF;
      font-weight: 600;
      font-size: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #000000; }
      .container {
        background: rgba(22, 22, 26, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      h1, label, .success-card h2 { color: #f5f5f7; }
      .subtitle { color: #a1a1a6; }
      input[type="number"] {
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
      }
    }
  </style>
</head>
<body>
  <a href="dashboard.html" class="back-nav">← Back</a>

  <div class="container glassmorphism" id="form-container">
    <div style="text-align: center; font-size: 48px; margin-bottom: 16px;">📍</div>
    <h1>Hyperlocal Lead Gen</h1>
    <p class="subtitle">Want more local jobs this week? Set a budget and let AI find customers.</p>

    <div class="input-group">
      <label>Weekly Budget ($)</label>
      <input type="number" id="budget-input" placeholder="e.g. 50" data-testid="lead-gen-budget">
    </div>

    <div class="input-group">
      <label>Target Zip Code</label>
      <input type="number" id="zip-input" placeholder="e.g. 90210" data-testid="lead-gen-zip">
    </div>

    <div id="error-msg" class="error-msg"></div>

    <button id="submit-btn" data-testid="lead-gen-submit">Start Finding Jobs</button>
  </div>

  <div class="container success-card glassmorphism" id="success-container">
    <div style="font-size: 48px; margin-bottom: 16px;">✨</div>
    <h2>Campaign Active!</h2>
    <p id="success-desc">The AI is now finding leads for your zip code. Check your inbox soon.</p>
    <a href="dashboard.html" style="display: block; margin-top: 24px; color: #0066FF; text-decoration: none; font-weight: 600;">Back to Dashboard</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default';

      const submitBtn = document.getElementById('submit-btn');
      const budgetInput = document.getElementById('budget-input');
      const zipInput = document.getElementById('zip-input');
      const errorMsg = document.getElementById('error-msg');
      const formContainer = document.getElementById('form-container');
      const successContainer = document.getElementById('success-container');
      const successDesc = document.getElementById('success-desc');

      submitBtn.addEventListener('click', async () => {
        const budget = budgetInput.value;
        const zipCode = zipInput.value;

        if (!budget || !zipCode) {
          errorMsg.textContent = 'Please enter budget and zip code.';
          return;
        }

        const budgetCents = Math.floor(parseFloat(budget) * 100);

        submitBtn.disabled = true;
        submitBtn.textContent = 'Starting...';
        errorMsg.textContent = '';

        try {
          // Detect API URL
          let url = '/api/v1/growth/campaign/lead-gen';
          if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
             url = 'http://127.0.0.1:18789/api/v1/growth/campaign/lead-gen';
             // If we are in Tauri dev and we know the custom port is running
             if (window.__TAURI__) { url = 'http://127.0.0.1:18789/api/v1/growth/campaign/lead-gen'; }
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tenant_id: tenantId,
              zip_code: zipCode,
              weekly_budget_cents: budgetCents,
            }),
          });

          if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              throw new Error(data.error || 'Failed to start campaign.');
          }

          const data = await res.json();
          if (data.success || data.id) { // handle slightly different success responses just in case
            formContainer.style.display = 'none';
            successContainer.style.display = 'block';
            successDesc.textContent = `The AI is now finding leads for ${zipCode}. Check your inbox soon.`;
          } else {
            throw new Error(data.error || 'Failed to start campaign.');
          }
        } catch (e) {
          console.error(e);
          errorMsg.textContent = e.message || 'Network error.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Start Finding Jobs';
        }
      });
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
