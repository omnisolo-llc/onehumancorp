<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work Triage - Unified Agent Feed</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .header-section {
        margin-bottom: 24px;
      }
      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        margin-top: 0;
      }
      .subtitle {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 16px;
      }

      .status-badges {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
      }

      .app-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        text-transform: capitalize;
      }
      .app-badge.good { background-color: #e5f5e5; color: #1e7e34; }
      .app-badge.warn { background-color: #fff3cd; color: #856404; }
      .app-badge.bad { background-color: #f8d7da; color: #721c24; }
      .app-badge.neutral { background-color: #e2e3e5; color: #383d41; }

      .action-status {
        margin-bottom: 16px;
        padding: 12px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 14px;
        display: none;
      }
      .action-status.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .action-status.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .app-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 768px) {
        .app-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .app-panel {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }

      .app-panel-header {
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 16px;
        color: #1d1d1f;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        padding-bottom: 12px;
      }

      .app-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .app-list-item {
        background: transparent;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.2s;
        text-align: left;
      }
      .app-list-item:hover {
        background: rgba(255, 255, 255, 0.8);
      }
      .app-list-item.selected {
        background: #fff;
        border-color: #0066FF;
        box-shadow: 0 0 0 1px #0066FF;
      }

      .app-list-title {
        font-weight: 600;
        font-size: 15px;
        color: #1d1d1f;
        margin-bottom: 4px;
      }
      .app-list-subtitle {
        font-size: 13px;
        color: #86868b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
      }

      .app-empty {
        padding: 24px;
        text-align: center;
        color: #86868b;
        font-size: 14px;
        font-style: italic;
      }

      .app-metric-label {
        font-size: 12px;
        font-weight: 600;
        color: #86868b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail-group {
        margin-bottom: 16px;
      }
      .detail-value {
        margin-top: 4px;
        font-size: 14px;
        color: #1d1d1f;
        background: rgba(0, 0, 0, 0.03);
        padding: 10px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        line-height: 1.5;
      }

      .proposed-action {
        background: rgba(0, 102, 255, 0.05);
        border: 1px solid rgba(0, 102, 255, 0.2);
        color: #004085;
      }

      .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        flex-direction: column;
      }
      @media (min-width: 414px) {
        .btn-group {
          flex-direction: row;
        }
      }

      button {
        font-family: inherit;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
        transition: all 0.2s;
        min-height: 44px;
      }

      .btn-primary {
        background-color: #0066FF;
        color: white;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
      }
      .btn-primary:hover {
        background-color: #0052cc;
      }
      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        background-color: #fff;
        color: #383d41;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .btn-secondary:hover {
        background-color: #f8f9fa;
      }

      .nav-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #0066FF;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .nav-link:hover {
        text-decoration: underline;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .container {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        h1, .app-panel-header, .app-list-title { color: #f5f5f7; }
        .subtitle, .app-metric-label { color: #a1a1a6; }
        .app-panel {
          background: rgba(255, 255, 255, 0.05);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .app-list-item { border-color: rgba(255, 255, 255, 0.1); }
        .app-list-item:hover { background: rgba(255, 255, 255, 0.1); }
        .app-list-item.selected {
          background: rgba(0, 102, 255, 0.1);
          border-color: #0066FF;
        }
        .detail-value {
          background: rgba(255, 255, 255, 0.05);
          border-color: rgba(255, 255, 255, 0.1);
          color: #e0e0e0;
        }
        .proposed-action {
          background: rgba(0, 102, 255, 0.15);
          color: #cce5ff;
        }
        .btn-secondary {
          background-color: #2c2c2e;
          color: #f5f5f7;
          border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover { background-color: #3a3a3c; }
        .app-badge.neutral { background-color: #333; color: #ddd; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="dashboard.html" class="nav-link">← Back to Dashboard</a>

      <div class="header-section">
        <h1>Unified Agent Feed</h1>
        <div class="subtitle">Review AI-prepared actions and reply drafts across all channels.</div>

        <div class="status-badges">
          <span class="app-badge neutral" id="active-count-badge">Active: 0</span>
          <span class="app-badge bad" id="urgent-count-badge" style="display: none;">Urgent: 0</span>
        </div>
      </div>

      <div id="action-status" class="action-status"></div>

      <div class="app-grid">
        <section class="app-panel">
          <div class="app-panel-header">Triage Queue</div>
          <div id="triage-list" class="app-list">
            <div class="app-empty">Loading triage items...</div>
          </div>
        </section>

        <section class="app-panel">
          <div class="app-panel-header">Triage Detail</div>
          <div id="triage-detail">
            <div class="app-empty">Select a triage item to review it.</div>
          </div>
        </section>
      </div>
    </div>

    <script>
      let items = [];
      let selectedId = null;

      function tenantId() {
        return localStorage.getItem("tenant_id") || localStorage.getItem("tenant") || "default";
      }

      function badgeTone(priority) {
        const normalized = (priority || "").toLowerCase();
        if (["urgent", "high"].includes(normalized)) return "bad";
        if (["action needed", "medium"].includes(normalized)) return "warn";
        if (["fyi", "low"].includes(normalized)) return "good";
        return "neutral";
      }

      async function loadItems() {
        const listEl = document.getElementById("triage-list");
        try {
          const res = await fetch(`/api/ui/triage?tenant_id=${encodeURIComponent(tenantId())}`);
          if (!res.ok) throw new Error("Failed to load triage items from the database");

          const data = await res.json();
          items = Array.isArray(data) ? data : [];

          if (!selectedId && items.length > 0) {
            selectedId = items[0].id;
          }

          renderUI();
        } catch (e) {
          listEl.innerHTML = `<div class="app-empty" style="color: #d9534f;">${e.message || "Failed to load triage items"}</div>`;
        }
      }

      function showStatus(message, isSuccess = true) {
        const statusEl = document.getElementById("action-status");
        statusEl.textContent = message;
        statusEl.className = `action-status ${isSuccess ? 'success' : 'error'}`;
        statusEl.style.display = "block";
        setTimeout(() => {
          statusEl.style.display = "none";
        }, 3000);
      }

      async function handleDecision(id, approved) {
        try {
          const res = await fetch(`/api/ui/triage/action?tenant_id=${encodeURIComponent(tenantId())}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ triage_item_id: id, approved })
          });

          if (!res.ok) throw new Error("Failed to update action");

          showStatus(approved ? "Approved!" : "Dismissed.", true);

          items = items.filter(i => i.id !== id);
          if (selectedId === id) {
            selectedId = items.length > 0 ? items[0].id : null;
          }

          renderUI();
        } catch (e) {
          console.error(e);
          showStatus("Error updating action.", false);
        }
      }

      function renderUI() {
        // Badges
        const activeCount = items.length;
        const urgentCount = items.filter(item => ["urgent", "high"].includes((item.priority || "").toLowerCase())).length;

        document.getElementById("active-count-badge").textContent = `Active: ${activeCount}`;
        document.getElementById("active-count-badge").className = `app-badge ${activeCount > 0 ? 'warn' : 'good'}`;

        const urgentBadge = document.getElementById("urgent-count-badge");
        if (urgentCount > 0) {
          urgentBadge.textContent = `Urgent: ${urgentCount}`;
          urgentBadge.style.display = "inline-block";
        } else {
          urgentBadge.style.display = "none";
        }

        // List
        const listEl = document.getElementById("triage-list");
        if (items.length === 0) {
          listEl.innerHTML = `<div class="app-empty">No items need your attention right now. Great job!</div>`;
        } else {
          listEl.innerHTML = items.map(item => `
            <button
              type="button"
              data-testid="triage-card-${item.id}"
              class="app-list-item ${selectedId === item.id ? 'selected' : ''}"
              onclick="selectItem('${item.id}')"
            >
              <div style="min-width: 0;">
                <div class="app-list-title">${item.source || "Unknown Source"}</div>
                <div class="app-list-subtitle">${item.context || "No context provided"}</div>
              </div>
              <span class="app-badge ${badgeTone(item.priority)}">${item.priority || "Normal"}</span>
            </button>
          `).join('');
        }

        // Detail
        const detailEl = document.getElementById("triage-detail");
        const selected = items.find(i => i.id === selectedId);

        if (!selected) {
          detailEl.innerHTML = `<div class="app-empty">Select a triage item to review it.</div>`;
        } else {
          const dateStr = selected.created_at
            ? new Date(selected.created_at).toLocaleString()
            : new Date().toLocaleString();

          let actionHtml = '';
          if (selected.action_type) {
            actionHtml = `
              <div class="detail-group">
                <div class="app-metric-label">Proposed Action: ${selected.action_type}</div>
                <div class="detail-value proposed-action">
                  ${selected.action_payload || "No specific payload"}
                </div>
              </div>
            `;
          }

          detailEl.innerHTML = `
            <div class="detail-group">
              <div class="app-metric-label">Source</div>
              <div class="detail-value" style="font-weight: 600; background: transparent; border: none; padding: 4px 0;">${selected.source || "Unknown source"}</div>
            </div>

            <div class="detail-group">
              <div class="app-metric-label">Context</div>
              <div class="detail-value">
                ${selected.context || "No context"}
              </div>
            </div>

            ${actionHtml}

            <div style="display: flex; gap: 16px; margin-bottom: 16px;">
              <div>
                <div class="app-metric-label">Priority</div>
                <div style="margin-top: 8px;"><span class="app-badge ${badgeTone(selected.priority)}">${selected.priority || "Normal"}</span></div>
              </div>
              <div>
                <div class="app-metric-label">Created</div>
                <div class="detail-value" style="font-weight: 600; background: transparent; border: none; padding: 4px 0;">${dateStr}</div>
              </div>
            </div>

            <div class="btn-group">
              <button
                class="btn-primary"
                data-testid="approve-btn"
                onclick="handleDecision('${selected.id}', true)"
              >
                ✨ Approve & Send
              </button>
              <button
                class="btn-secondary"
                data-testid="dismiss-btn"
                onclick="handleDecision('${selected.id}', false)"
              >
                Dismiss
              </button>
            </div>
          `;
        }
      }

      window.selectItem = function(id) {
        selectedId = id;
        renderUI();
      };

      document.addEventListener("DOMContentLoaded", () => {
        loadItems();
      });
    </script>
  </body>
</html>
