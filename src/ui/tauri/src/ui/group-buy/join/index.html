<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Buy Unlock | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #1d1d1f;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-banner {
      background-color: #000;
      color: white;
      width: 100%;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .main-container {
      max-width: 500px;
      width: 100%;
      padding: 30px 20px;
      box-sizing: border-box;
      flex: 1;
    }

    .deal-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .deal-badge {
      position: absolute;
      top: 15px;
      right: -30px;
      background: #ff3b30;
      color: white;
      font-weight: bold;
      padding: 5px 35px;
      transform: rotate(45deg);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .product-title {
      font-family: "Outfit", sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-top: 10px;
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .price-container {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 25px;
    }

    .group-price {
      font-size: 42px;
      font-weight: 800;
      color: #0066FF;
      font-family: "Outfit", sans-serif;
    }

    .reg-price {
      font-size: 20px;
      color: #86868b;
      text-decoration: line-through;
      font-weight: 500;
    }

    .progress-section {
      background: #f5f5f7;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .progress-text {
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .avatars {
      display: flex;
      justify-content: center;
      gap: -10px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e5e5ea;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #86868b;
      margin-left: -10px;
      position: relative;
      z-index: 1;
    }

    .avatar:first-child {
      margin-left: 0;
    }

    .avatar.filled {
      background: #34c759;
      color: white;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e5e5ea;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #34c759;
      width: 33%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d1d6;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #0066FF;
    }

    .btn-primary {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 18px 24px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 8px 20px rgba(0, 102, 255, 0.2);
    }

    .btn-primary:hover {
      background-color: #0052cc;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary:disabled {
      background-color: #a1a1a6;
      box-shadow: none;
      cursor: not-allowed;
    }

    .share-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eaeaea;
    }

    .share-input-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .share-input-wrapper input {
      flex: 1;
      padding: 14px;
      background: #f5f5f7;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      color: #1d1d1f;
      outline: none;
    }

    .btn-copy {
      background: #1d1d1f;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #86868b;
      font-size: 13px;
      font-weight: 500;
    }

    .footer a {
      color: #86868b;
      text-decoration: none;
    }


      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
</head>
<body>
  <div class="header-banner">
    FLASH DEAL: GROUP BUY UNLOCK
  </div>

  <div class="main-container">
    <div class="deal-card">
      <div class="deal-badge" id="savings-badge">SAVE 50%</div>

      <div style="font-size: 40px; margin-bottom: 10px;">🛍️</div>
      <h1 class="product-title" id="display-product">Premium Product</h1>

      <div class="price-container">
        <div class="group-price" id="display-group-price">$49</div>
        <div class="reg-price" id="display-reg-price">$100</div>
      </div>

      <div class="progress-section">
        <div class="progress-text">
          <span id="spots-filled">1</span> / <span id="spots-total">3</span> Joined to Unlock
        </div>
        <div class="avatars" id="avatars-container">
          <!-- Filled by JS -->
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p style="font-size: 13px; color: #86868b; margin-top: 15px; margin-bottom: 0;">If the group size is not met in 24h, you will not be charged.</p>
      </div>

      <div id="join-form">
        <div class="input-group">
          <input type="email" id="email-input" placeholder="Enter your email to secure spot" />
        </div>
        <button class="btn-primary" id="join-btn">Lock in $49 Price</button>
      </div>

      <div class="share-section" id="share-section">
        <h3 style="margin-top: 0; font-family: 'Outfit', sans-serif;">You're in line! 🎉</h3>
        <p style="color: #4b5563; font-size: 14px; margin-bottom: 0;">Invite friends to hit the goal faster. The deal unlocks for everyone when the group is full.</p>

        <div class="share-input-wrapper">
          <input type="text" id="share-link" readonly />
          <button class="btn-copy" id="copy-btn">Copy</button>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <a href="/setup.html?source=groupbuy_footer" target="_blank" id="footer-branding">⚡ Powered by OHC</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const product = urlParams.get('product') || 'Mystery Item';
      const regPrice = parseFloat(urlParams.get('reg')) || 100;
      const grpPrice = parseFloat(urlParams.get('grp')) || 49;
      const size = parseInt(urlParams.get('size')) || 3;
      const ref = urlParams.get('ref') || 'demo';

      // Update UI
      document.title = `${product} - Group Buy Unlock`;
      document.getElementById('display-product').textContent = product;
      document.getElementById('display-reg-price').textContent = `$${regPrice}`;
      document.getElementById('display-group-price').textContent = `$${grpPrice}`;
      document.getElementById('join-btn').textContent = `Lock in $${grpPrice} Price`;
      document.getElementById('spots-total').textContent = size;

      const savingsPct = Math.round((1 - (grpPrice / regPrice)) * 100);
      document.getElementById('savings-badge').textContent = `SAVE ${savingsPct}%`;

      // Base state is 1 person joined (the inviter), unless they are the first
      let currentJoined = 1;

      function renderProgress() {
        document.getElementById('spots-filled').textContent = currentJoined;
        const pct = (currentJoined / size) * 100;
        document.getElementById('progress-bar').style.width = `${pct}%`;

        const container = document.getElementById('avatars-container');
        container.innerHTML = '';
        for (let i = 0; i < size; i++) {
          const div = document.createElement('div');
          div.className = 'avatar';
          if (i < currentJoined) {
            div.classList.add('filled');
            div.textContent = '✓';
          } else {
            div.textContent = '?';
          }
          container.appendChild(div);
        }
      }

      renderProgress();

      document.getElementById('join-btn').addEventListener('click', () => {
        const email = document.getElementById('email-input').value;
        if (!email || !email.includes('@')) {
          alert('Please enter a valid email address.');
          return;
        }

        const btn = document.getElementById('join-btn');
        btn.textContent = 'Securing Spot...';
        btn.disabled = true;

        setTimeout(() => {
          document.getElementById('join-form').style.display = 'none';
          document.getElementById('share-section').style.display = 'block';
          document.getElementById('share-link').value = window.location.href;

          currentJoined++;
          if (currentJoined > size) currentJoined = size;
          renderProgress();

          if (currentJoined === size) {
             document.getElementById('share-section').innerHTML = `<h3 style="margin-top: 0; color: #34c759; font-family: 'Outfit', sans-serif;">Deal Unlocked! 🎉</h3><p style="color: #4b5563; font-size: 14px;">Check your email to complete checkout at the $${grpPrice} price.</p>`;
          }
        }, 800);
      });

      document.getElementById('copy-btn').addEventListener('click', () => {
        const input = document.getElementById('share-link');
        input.select();
        document.execCommand('copy');

        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        btn.style.backgroundColor = '#34c759';

        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.style.backgroundColor = '#1d1d1f';
        }, 2000);
      });
    });
  </script>
</body>
</html>
