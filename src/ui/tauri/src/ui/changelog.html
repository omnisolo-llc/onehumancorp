<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Notes & Changelog</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        font-size: 14px;
        padding: 8px 0;
        min-height: 44px;
      }
      .back-link svg {
        width: 16px;
        height: 16px;
        margin-right: 5px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .header {
        margin-bottom: 40px;
        text-align: center;
      }
      h1 {
        color: #1d1d1f;
        font-size: 32px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .changelog-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        margin-bottom: 30px;
      }
      .version-title {
        color: #0066FF;
        font-size: 24px;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 20px;
      }
      .content {
        color: #333;
        font-size: 16px;
        line-height: 1.6;
      }
      .content h3 {
        color: #1d1d1f;
        font-size: 18px;
        margin-top: 25px;
        margin-bottom: 15px;
      }
      .screenshot {
        width: 100%;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.1);
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-weight: 500;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .changelog-card {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        h1, .content h3 { color: #f5f5f7; }
        .content { color: #d1d1d6; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="dashboard.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Dashboard
      </a>

      <div class="header">
        <h1>Release Notes & Changelog</h1>
      </div>

      <div id="changelog-container">
        <div class="loading">Loading changelog...</div>
      </div>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(console.error);
    }
    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    let hideTimeout;

    function showTooltip(e, text) {
        clearTimeout(hideTimeout);
        tooltipEl.textContent = text;

        const targetRect = e.target.getBoundingClientRect();

        // Position below the element by default
        let top = targetRect.bottom + 10;
        let left = targetRect.left + (targetRect.width / 2) - (tooltipEl.offsetWidth / 2);

        // Adjust if it goes off screen
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        if (top + tooltipEl.offsetHeight > window.innerHeight - 10) {
            // Position above if it doesn't fit below
            top = targetRect.top - tooltipEl.offsetHeight - 10;
        }

        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        hideTimeout = setTimeout(() => {
            tooltipEl.classList.remove('visible');
        }, 100); // slight delay to prevent flicker
    }

    // Desktop hover
    document.addEventListener('mouseover', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target; if (target && typeof target.closest === 'function' && target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            touchTimeout = setTimeout(() => {
                showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});

</script>
    <script src="help-widget.js"></script>

    <script>
      const container = document.getElementById('changelog-container');

      async function loadChangelog() {
        try {
          let data = null;
          if (window.__TAURI__ && window.__TAURI__.core) {
             data = await window.__TAURI__.core.invoke('get_changelog', {});
          } else {
             const res = await fetch(`/api/changelog`);
             if (res.ok) data = await res.json();
          }



          let html = '';
          data.forEach(item => {
             let contentHtml = item.contentLines ? item.contentLines.map(line => {
                if (line.startsWith('### ')) return `<h3>${line.substring(4)}</h3>`;
                if (line.startsWith('- ')) return `<p>• ${line.substring(2)}</p>`;
                return `<p>${line}</p>`;
             }).join('') : (item.content_lines ? item.content_lines.map(line => {
                if (line.startsWith('### ')) return `<h3>${line.substring(4)}</h3>`;
                if (line.startsWith('- ')) return `<p>• ${line.substring(2)}</p>`;
                return `<p>${line}</p>`;
             }).join('') : '');

             let imgHtml = item.screenshot_url ? `<img src="${item.screenshot_url}" class="screenshot" alt="Screenshot" onerror="this.style.display='none'"/>` : '';

             html += `
               <div class="changelog-card">
                 <h2 class="version-title">${item.version}</h2>
                 ${imgHtml}
                 <div class="content">${contentHtml}</div>
               </div>
             `;
          });
          container.innerHTML = html;
        } catch (e) {
          console.error("Failed to load changelog", e);
          container.innerHTML = `<div class="changelog-card"><p style="color:#FF3B30">Failed to load changelog.</p></div>`;
        }
      }

      loadChangelog();
    </script>

  </body>
</html>
