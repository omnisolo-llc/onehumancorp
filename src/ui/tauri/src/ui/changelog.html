<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
        border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Notes & Changelog</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        font-size: 14px;
        padding: 8px 0;
        min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
      }
      .back-link svg {
        width: 16px;
        height: 16px;
        margin-right: 5px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .header {
        margin-bottom: 40px;
        text-align: center;
      }
      h1 {
        color: #1d1d1f;
        font-size: 32px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .changelog-card {
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        margin-bottom: 30px;
      }
      .version-title {
        color: #0066FF;
        font-size: 24px;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 20px;
      }
      .content {
        color: #333;
        font-size: 16px;
        line-height: 1.6;
      }
      .content h3 {
        color: #1d1d1f;
        font-size: 18px;
        margin-top: 25px;
        margin-bottom: 15px;
      }
      .screenshot {
        width: 100%;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 1px solid rgba(0,0,0,0.1);
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-weight: 500;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .changelog-card {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        h1, .content h3 { color: #f5f5f7; }
        .content { color: #d1d1d6; }
      }
    </style>
  </head>
  <body>
    <div class="container glassmorphism">
      <a href="dashboard.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Dashboard
      </a>

      <div class="header">
        <h1>Release Notes & Changelog</h1>
      </div>

      <div id="changelog-container">Loading...</div>

    <script>
      const container = document.getElementById('changelog-container');

      async function loadChangelog() {
        try {
          let data = null;
          if (window.__TAURI__ && window.__TAURI__.core) {
             data = await window.__TAURI__.core.invoke('get_changelog', {});
          } else {
             const res = await fetch('/api/changelog');
             if (res.ok) data = await res.json();
          }

          if (!data || data.length === 0) {
             container.innerHTML = '<p>No release notes found.</p>';
             return;
          }

          let html = '';
          data.forEach(item => {
             let contentHtml = item.contentLines ? item.contentLines.map(line => {
                if (line.startsWith('### ')) return `<h3>${line.substring(4)}</h3>`;
                if (line.startsWith('- ')) return `<p>• ${line.substring(2)}</p>`;
                return `<p>${line}</p>`;
             }).join('') : (item.content_lines ? item.content_lines.map(line => {
                if (line.startsWith('### ')) return `<h3>${line.substring(4)}</h3>`;
                if (line.startsWith('- ')) return `<p>• ${line.substring(2)}</p>`;
                return `<p>${line}</p>`;
             }).join('') : '');

             let imgHtml = item.screenshot_url ? `<img src="${item.screenshot_url}" class="screenshot" alt="Screenshot" onerror="this.style.display='none'"/>` : '';

             html += `
                <div class="changelog-card">
                  <h2 class="version-title">${item.version}</h2>
                  ${imgHtml}
                  ${contentHtml}
                </div>
             `;
          });

          container.innerHTML = html;
        } catch (e) {
          console.error('Failed to load changelog', e);
          container.innerHTML = '<p>Error loading release notes.</p>';
        }
      }

      loadChangelog();
    </script>

}
.ohc-tooltip.visible {
    opacity: 1;
}
</style>

</body>
