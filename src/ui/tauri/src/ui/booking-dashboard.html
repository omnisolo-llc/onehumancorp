<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bookings Dashboard - OHC</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.65);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.4);
      --accent-color: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.65);
        --text-main: #f5f5f7;
        --text-sub: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .mobile-container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
      margin-top: 40px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .header p {
      margin: 0;
      color: var(--text-sub);
      font-size: 15px;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
    }
    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .booking-item:last-child {
      border-bottom: none;
    }
    .booking-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    .booking-time {
      font-size: 13px;
      color: var(--text-sub);
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .status-confirmed {
      background: rgba(52, 199, 89, 0.15);
      color: #34C759;
    }
    .status-pending {
      background: rgba(255, 149, 0, 0.15);
      color: #FF9500;
    }
    .status-cancelled {
      background: rgba(255, 59, 48, 0.15);
      color: #FF3B30;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: transform 0.1s;
      cursor: pointer;
      border: none;
      background-color: rgba(0,0,0,0.05);
      color: var(--text-main);
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <a href="dashboard.html" class="btn" style="margin-bottom: 20px;">&larr; Back to Dashboard</a>

    <div class="header">
      <h1>Bookings Dashboard</h1>
      <p>Manage your upcoming appointments and requests</p>
    </div>

    <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 12px; margin-top: 24px;">AI Suggested Follow-ups</h2>
    <div class="glass-card" id="agent-feed-card" style="display: none;">
      <div id="agent-feed-list">
        <!-- Feed items will be inserted here -->
      </div>
    </div>
    <div id="agent-feed-empty" style="text-align: center; padding: 20px; color: var(--text-sub); display: none;">No pending follow-ups.</div>

    <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 12px; margin-top: 24px;">Upcoming Bookings</h2>
    <div class="glass-card">
      <div id="loading" style="text-align: center; padding: 20px; color: var(--text-sub);">Loading bookings...</div>
      <div id="empty-state" style="display: none; text-align: center; padding: 20px; color: var(--text-sub);">No bookings found.</div>
      <div id="bookings-list" style="display: none;">
        <!-- Bookings will be inserted here -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loadingEl = document.getElementById('loading');
      const emptyStateEl = document.getElementById('empty-state');
      const listEl = document.getElementById('bookings-list');
      const feedCard = document.getElementById('agent-feed-card');
      const feedList = document.getElementById('agent-feed-list');
      const feedEmpty = document.getElementById('agent-feed-empty');

      const tenantId = localStorage.getItem('ohc_tenant_id') || 'default-store';

      // 1. Fetch unified agent feed via WS to display pending follow-ups
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const token = localStorage.getItem('token') || '';
      const wsUrl = `${protocol}//${window.location.host}/api/v1/feed/ws`;

      let ws;
      try {
          ws = new WebSocket(wsUrl, ["access_token", token]);
      } catch(e) {
          console.warn("WebSocket init failed", e);
      }

      if (ws) {
          ws.onopen = () => {
              ws.send(JSON.stringify({
                  event: "subscribe",
                  data: { tenant_id: tenantId, channel: "agent_feed" }
              }));
          };

          ws.onmessage = (event) => {
              try {
                  const data = JSON.parse(event.data);
                  if (data.event === "init" || data.event === "update") {
                      const feedItems = data.data || [];
                      const pendingItems = feedItems.filter(item => item.lifecycle_state === 'PENDING_APPROVAL');

                      if (pendingItems.length === 0) {
                          feedCard.style.display = 'none';
                          feedEmpty.style.display = 'block';
                      } else {
                          feedEmpty.style.display = 'none';
                          feedCard.style.display = 'block';
                          feedList.innerHTML = pendingItems.map(item => {
                              const payload = item.context_payload || {};
                              const action = item.proposed_action || {};
                              return `
                                <div class="booking-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                                  <div style="display: flex; justify-content: space-between; width: 100%;">
                                    <div class="booking-title" style="color: var(--accent-color);">✨ ${payload.description || 'AI Action'}</div>
                                    <div class="status-badge status-pending">Action Required</div>
                                  </div>
                                  <div class="booking-time" style="font-size: 14px;">${action.message || action.draft_action || ''}</div>
                                  <div style="display: flex; gap: 8px; margin-top: 8px; width: 100%;">
                                    <button class="btn btn-primary" style="padding: 8px 16px; font-size: 14px; flex: 1;">Approve</button>
                                    <button class="btn" style="padding: 8px 16px; font-size: 14px; flex: 1;">Dismiss</button>
                                  </div>
                                </div>
                              `;
                          }).join('');
                      }
                  }
              } catch(e) {
                  console.error("Feed error", e);
              }
          };
      }

      // 2. Fetch bookings
      try {
        const res = await fetch('/api/v1/booking/engine/list', {
          headers: {
            'x-tenant-id': tenantId
          }
        });

        if (!res.ok) throw new Error('Failed to load bookings');

        const data = await res.json();

        loadingEl.style.display = 'none';

        if (!data.bookings || data.bookings.length === 0) {
          emptyStateEl.style.display = 'block';
        } else {
          listEl.style.display = 'block';
          listEl.innerHTML = data.bookings.map(b => {
            const startDate = new Date(b.start_time);
            const formattedTime = startDate.toLocaleString('en-US', {
              weekday: 'short', month: 'short', day: 'numeric',
              hour: 'numeric', minute: '2-digit'
            });

            let statusClass = 'status-pending';
            if (b.status === 'confirmed' || b.status === 'completed') statusClass = 'status-confirmed';
            if (b.status === 'cancelled') statusClass = 'status-cancelled';

            return `
              <div class="booking-item" data-testid="booking-item">
                <div>
                  <div class="booking-title">Service ID: ${b.product_id}</div>
                  <div class="booking-time">${formattedTime} • Customer: ${b.customer_id.substring(0, 8)}...</div>
                </div>
                <div class="status-badge ${statusClass}" data-testid="booking-status-${b.status}">${b.status.replace('_', ' ')}</div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        console.error(err);
        loadingEl.innerText = 'Error loading bookings.';
      }
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
