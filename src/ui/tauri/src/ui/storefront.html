<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review Storefront</title>
    <style>
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
                color: #F5F5F7;
            }
        }
        .container {
            max-width: 800px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        @media (prefers-color-scheme: dark) {
            .container {
                background: rgba(22, 22, 26, 0.7);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
            color: #1d1d1f;
        }
        @media (prefers-color-scheme: dark) {
            h1 {
                color: #F5F5F7;
            }
        }
        .btn {
            background-color: #0066FF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(150, 150, 150, 0.2);
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-link {
            text-decoration: none;
            color: #0066FF;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
            align-self: flex-start;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    <div class="container">
        <div class="header">
            <h1>Your Storefront Preview</h1>
            <button id="copy-link-btn" class="btn" style="display: none;">Copy Link</button>
        </div>
        <div class="iframe-wrapper" id="preview-wrapper">
            <div class="loading" id="loading-state">Loading your catalog...</div>
            <iframe id="storefront-iframe" style="display: none;" title="Live Storefront Preview"></iframe>
        </div>

        <footer style="margin-top: 24px; text-align: center; padding: 16px; font-size: 14px; font-weight: 600; background: rgba(255, 255, 255, 0.65); border-radius: 12px; width: 100%; box-sizing: border-box;">
            <a href="/setup.html" id="storefront-footer-viral-link" data-testid="storefront-footer-viral-link" style="color: #6b7280; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span style="background: #0066FF; color: white; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800;">OHC</span>
                ⚡ Powered by OHC
            </a>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tenantId = localStorage.getItem('tenant_id') || 'default';
            const copyBtn = document.getElementById('copy-link-btn');
            const footerLink = document.getElementById('storefront-footer-viral-link');
            if (footerLink) {
                footerLink.href = `/setup.html?ref=${encodeURIComponent(tenantId)}&source=storefront_footer`;
            }
            const iframe = document.getElementById('storefront-iframe');
            const loading = document.getElementById('loading-state');

            try {
                // Fetch products to get a valid product ID
                const res = await fetch('/api/v1/products', {
                    headers: { 'x-tenant-id': tenantId }
                });

                let productId = '00000000-0000-0000-0000-000000000000';

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.products && data.products.length > 0) {
                        productId = data.products[0].id;
                    }
                }

                const storefrontUrl = `http://127.0.0.1:18789/api/v1/storefront/${tenantId}/${productId}`;

                iframe.src = storefrontUrl;
                iframe.onload = () => {
                    loading.style.display = 'none';
                    iframe.style.display = 'block';
                    copyBtn.style.display = 'block';
                };

                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(storefrontUrl).then(() => {
                        const originalText = copyBtn.innerText;
                        copyBtn.innerText = 'Copied!';
                        setTimeout(() => {
                            copyBtn.innerText = originalText;
                        }, 2000);
                    });
                });

            } catch (err) {
                console.error("Failed to load storefront preview", err);
                loading.innerText = "Failed to load storefront preview.";
            }
        });
    </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
