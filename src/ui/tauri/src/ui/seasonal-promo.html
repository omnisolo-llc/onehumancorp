
<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8">
  <title>Seasonal Promotion Generator ✨ - OHC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .glass-container {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 30px;
      width: 400px;
      max-width: 90%;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      color: #333;
      margin-top: 0;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.65);
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      outline: none;
    }
    input:focus {
      border-color: #0066FF;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066FF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #005ce6;
    }
    #promo-result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
      color: #222;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <h1>Seasonal Promotion Generator ✨</h1>

    <input type="text" id="promo-occasion" placeholder="Occasion (e.g. Winter Wonderland)">
    <input type="text" id="promo-discount" placeholder="Discount % (e.g. 25)">
    <button id="generate-btn">Generate Campaign</button>

    <div id="promo-result" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const occasion = document.getElementById('promo-occasion').value;
      const discount = document.getElementById('promo-discount').value;

      try {
        const response = await fetch('/api/v1/growth/seasonal-promo/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ occasion, discount }),
        });

        if (response.ok) {
          const data = await response.json();
          const resultDiv = document.getElementById('promo-result');
          resultDiv.innerText = data.content;
          resultDiv.style.display = 'block';
        } else {
          console.error("Failed to generate promo");
        }
      } catch (e) {
        console.error("Error generating promo", e);
      }
    });
  </script>
</body>
</html>
