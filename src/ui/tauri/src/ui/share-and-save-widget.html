<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share & Save Widget Builder | OneHumanCorp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/swagger-ui.css">
  <style>
    :root {
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #0066FF;
      --accent-hover: #0052cc;
      --border-color: #e5e7eb;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .header {
      margin-bottom: 40px;
    }
    .header h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }
    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      flex: 1;
      transition: all 0.2s;
    }
    .btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .preview-container {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      width: 90%;
      max-width: 500px;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .code-block {
      width: 100%;
      height: 120px;
      background: #1f2937;
      color: #f3f4f6;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      box-sizing: border-box;
      margin: 16px 0;
    }

    .back-nav {
      margin-bottom: 20px;
    }
    .back-nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
</head>
<body>

  <div class="container">
    <div class="back-nav">
      <a href="dashboard.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Dashboard
      </a>
    </div>

    <div class="header">
      <h1 class="font-outfit">Share & Save Widget</h1>
      <p>Incentivize customers to share your store on social media in exchange for a discount code.</p>
    </div>

    <div class="grid">
      <!-- Configuration Panel -->
      <div class="card">
        <h2 class="font-outfit" style="margin-top: 0;">Configuration</h2>

        <div class="form-group">
          <label>Discount Type</label>
          <div class="btn-group">
            <button class="btn active" id="type-percent">% Percentage</button>
            <button class="btn" id="type-fixed">$ Fixed Amount</button>
          </div>
        </div>

        <div class="form-group">
          <label for="discount-value">Discount Value</label>
          <input type="number" id="discount-value" class="form-control" value="10">
        </div>

        <div class="form-group">
          <label for="discount-code">Discount Code to Reveal</label>
          <input type="text" id="discount-code" class="form-control" value="SHARE10">
        </div>

        <div class="form-group">
          <label>Widget Theme</label>
          <div class="btn-group">
            <button class="btn active" id="theme-light">Light</button>
            <button class="btn" id="theme-dark">Dark</button>
          </div>
        </div>

        <button class="btn-primary" id="generate-btn" style="margin-top: 20px;">Get Embed Code</button>
      </div>

      <!-- Live Preview Panel -->
      <div class="card">
        <h2 class="font-outfit" style="margin-top: 0;">Live Preview</h2>
        <div class="preview-container">
          <iframe id="preview-iframe" src="share-and-save-embed.html?val=10&type=percent&code=SHARE10&theme=light" width="100%" height="250" style="border:none; border-radius: 12px; overflow: hidden; background: transparent;"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Embed Code Modal -->
  <div class="modal-overlay" id="embed-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-modal">&times;</button>
      <h2 class="font-outfit" style="margin-top: 0;">Embed Widget</h2>
      <p>Copy and paste this HTML into your website or checkout page.</p>

      <textarea id="embed-code" class="code-block" readonly></textarea>

      <button class="btn-primary" id="copy-btn">Copy Code</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let state = {
        type: 'percent',
        value: '10',
        code: 'SHARE10',
        theme: 'light',
        tenant: localStorage.getItem('tenant_id') || 'demo'
      };

      const typePercentBtn = document.getElementById('type-percent');
      const typeFixedBtn = document.getElementById('type-fixed');
      const valueInput = document.getElementById('discount-value');
      const codeInput = document.getElementById('discount-code');
      const themeLightBtn = document.getElementById('theme-light');
      const themeDarkBtn = document.getElementById('theme-dark');
      const previewIframe = document.getElementById('preview-iframe');

      const generateBtn = document.getElementById('generate-btn');
      const embedModal = document.getElementById('embed-modal');
      const closeModal = document.getElementById('close-modal');
      const embedCodeArea = document.getElementById('embed-code');
      const copyBtn = document.getElementById('copy-btn');

      function updatePreview() {
        const origin = window.location.origin.includes('localhost') ? 'https://app.onehumancorp.com' : window.location.origin;
        // In local development we want to load the relative file. In production, we'd use the full URL.
        const previewUrl = `share-and-save-embed.html?val=${encodeURIComponent(state.value)}&type=${state.type}&code=${encodeURIComponent(state.code)}&theme=${state.theme}&tenant=${state.tenant}`;
        previewIframe.src = previewUrl;
      }

      typePercentBtn.addEventListener('click', () => {
        state.type = 'percent';
        typePercentBtn.classList.add('active');
        typeFixedBtn.classList.remove('active');
        updatePreview();
      });

      typeFixedBtn.addEventListener('click', () => {
        state.type = 'fixed';
        typeFixedBtn.classList.add('active');
        typePercentBtn.classList.remove('active');
        updatePreview();
      });

      valueInput.addEventListener('input', (e) => {
        state.value = e.target.value;
        updatePreview();
      });

      codeInput.addEventListener('input', (e) => {
        state.code = e.target.value;
        updatePreview();
      });

      themeLightBtn.addEventListener('click', () => {
        state.theme = 'light';
        themeLightBtn.classList.add('active');
        themeDarkBtn.classList.remove('active');
        updatePreview();
      });

      themeDarkBtn.addEventListener('click', () => {
        state.theme = 'dark';
        themeDarkBtn.classList.add('active');
        themeLightBtn.classList.remove('active');
        updatePreview();
      });

      generateBtn.addEventListener('click', () => {
        const origin = window.location.origin.includes('localhost') ? 'https://app.onehumancorp.com' : window.location.origin;
        const embedUrl = `${origin}/share-and-save-embed.html?val=${encodeURIComponent(state.value)}&type=${state.type}&code=${encodeURIComponent(state.code)}&theme=${state.theme}&tenant=${state.tenant}`;

        const codeSnippet = `<iframe src="${embedUrl}" width="100%" height="250" style="border:none; border-radius: 12px; overflow: hidden; background: transparent;" title="OHC Share and Save"></iframe>`;

        embedCodeArea.value = codeSnippet;
        embedModal.classList.add('active');
      });

      closeModal.addEventListener('click', () => {
        embedModal.classList.remove('active');
        copyBtn.textContent = 'Copy Code';
      });

      copyBtn.addEventListener('click', () => {
        embedCodeArea.select();
        document.execCommand('copy');
        copyBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyBtn.textContent = 'Copy Code';
        }, 2000);
      });
    });
  </script>
</body>
</html>
