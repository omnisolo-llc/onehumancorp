<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omni Chat Inbox</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --primary: #0066FF;
      --border: rgba(0, 0, 0, 0.1);
      --msg-user-bg: #0066FF;
      --msg-user-text: #ffffff;
      --msg-ai-bg: #e5e5ea;
      --msg-ai-text: #1d1d1f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }
    .back-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #86868b;
      font-weight: 600;
    }
    .message-content {
      font-size: 16px;
      line-height: 1.4;
      color: var(--text-color);
    }
    .draft-reply {
      margin-top: 12px;
      padding: 12px;
      background: #f8fafc;
      border-left: 3px solid var(--primary);
      border-radius: 4px 8px 8px 4px;
    }
    .draft-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .approve-btn {
      margin-top: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    .approve-btn:active {
      transform: scale(0.98);
    }
    #connection-status {
      text-align: center;
      font-size: 13px;
      padding: 8px;
      background: #FF9500;
      color: white;
      display: none;
    }
  </style>
</head>
<body>
  <header class="glassmorphism">
    <a href="dashboard.html" class="back-link">← Dashboard</a>
    <h1>Unified Inbox</h1>
    <div style="width: 80px;"></div>
  </header>
  <div id="connection-status">Connecting...</div>

  <div id="chat-container">
    <div id="empty-state" style="text-align: center; color: #86868b; margin-top: 40px;">No messages yet.</div>
  </div>

  <script>
    const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default';
    const token = localStorage.getItem('token') || '';
    const container = document.getElementById('chat-container');
    const emptyState = document.getElementById('empty-state');
    const statusBanner = document.getElementById('connection-status');
    let ws;

    async function loadConversations() {
      try {
        const res = await fetch('/api/v1/omni-chat/inbox/conversations', {
          headers: { 'Authorization': token ? `Bearer ${token}` : '' }
        });
        if (res.ok) {
          const data = await res.json();
          // We can render them here. For now, we wait for WS.
        }
      } catch(e) {
        console.error(e);
      }
    }

    function connectWs() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws?channels=chat`;

      try {
        ws = new WebSocket(wsUrl, ["access_token", token]);
      } catch(e) {
        ws = new WebSocket(wsUrl);
      }

      ws.onopen = () => {
        statusBanner.style.display = 'none';
        ws.send(JSON.stringify({
          action: "subscribe",
          channel: "chat",
          topic: `messages:${tenantId}`
        }));
      };

      ws.onmessage = (event) => {
        try {
          const envelope = JSON.parse(event.data);
          if (envelope.channel === 'chat' && envelope.data) {
            renderMessage(envelope.data);
          }
        } catch(e) {
          console.error("Parse error", e);
        }
      };

      ws.onclose = () => {
        statusBanner.style.display = 'block';
        statusBanner.textContent = 'Disconnected. Reconnecting...';
        setTimeout(connectWs, 3000);
      };
    }

    function renderMessage(msg) {
      if (emptyState) emptyState.style.display = 'none';

      const card = document.createElement('div');
      card.className = 'message-card';

      let innerHTML = `
        <div class="message-header">
          <span>${msg.sender_type === 'customer' ? 'Incoming Message' : 'Agent'}</span>
          <span>Just now</span>
        </div>
        <div class="message-content">${msg.content}</div>
      `;

      if (msg.sender_type === 'customer' && msg.draft_reply) {
         innerHTML += `
           <div class="draft-reply">
             <span class="draft-label">✨ AI Drafted Reply</span>
             <div>${msg.draft_reply}</div>
           </div>
           <button class="approve-btn" onclick="approveDraft('${msg.id}', this)">Approve AI Draft</button>
         `;
      } else if (msg.sender_type === 'customer') {
          // Fallback if we simulate local AI draft for test
          innerHTML += `
           <div class="draft-reply">
             <span class="draft-label">✨ AI Drafted Reply</span>
             <div>Sure, I can help with that. Let me check.</div>
           </div>
           <button class="approve-btn" onclick="approveDraft('${msg.id}', this)">Approve AI Draft</button>
         `;
      }

      card.innerHTML = innerHTML;
      container.appendChild(card);
      container.scrollTop = container.scrollHeight;
    }

    async function approveDraft(msgId, btn) {
      btn.textContent = 'Approving...';
      btn.disabled = true;

      // Simulate sending the approval back through our rest api
      try {
        await fetch('/api/v1/omni-chat/inbox/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': token ? `Bearer ${token}` : ''
          },
          body: JSON.stringify({
            conversation_id: "00000000-0000-0000-0000-000000000000",
            content: "Sure, I can help with that. Let me check."
          })
        });
        btn.textContent = 'Sent! ✅';
        btn.style.backgroundColor = '#34C759';
      } catch(e) {
        btn.textContent = 'Approve AI Draft';
        btn.disabled = false;
      }
    }

    // Connect
    loadConversations();
    connectWs();
  </script>
</body>
</html>
