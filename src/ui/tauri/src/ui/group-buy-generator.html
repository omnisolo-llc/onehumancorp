<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Group Buy Generator | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
        --bg-color: #f5f5f7;
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.65);
        --card-border: rgba(255, 255, 255, 0.4);
        --primary: #0066FF;
        --primary-hover: #0052cc;
        --input-bg: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #16161a;
            --text-color: #f5f5f7;
            --card-bg: rgba(22, 22, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(32, 32, 36, 0.8);
        }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
        border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid var(--card-border);
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(134, 134, 139, 0.3);
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: "Inter", sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }

    #result-area p {
      font-weight: 600;
      color: var(--text-color);
      margin-top: 0;
      margin-bottom: 15px;
      text-align: center;
    }

    .action-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .link-group {
        display: flex;
        gap: 8px;
    }

    .link-group input {
        margin-bottom: 0;
        flex: 1;
        border-radius: 12px;
    }

    .btn-secondary {
        background-color: #1d1d1f;
        box-shadow: none;
    }
    .btn-secondary:hover { background-color: #000; }

    @media (prefers-color-scheme: dark) {
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
        opacity: 0.8;
    }

    footer {
      margin-top: 40px;
      text-align: center;
    }

    .footer-link {
        color: #86868b;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s;
    }

    .footer-link:hover {
        color: var(--text-color);
    }

    .row-group {
      display: flex;
      gap: 16px;
    }

    .row-group > div {
      flex: 1;
    }

    .loading-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .btn-text {
        display: inline;
    }

    .btn-loading .btn-text { display: none; }
    .btn-loading .loading-spinner { display: block; }
  </style>
</head>
<body>
  <div class="container glassmorphism">
    <div style="font-size: 48px; text-align: center; margin-bottom: 10px;">👥</div>
    <h1>Viral Group Buy Generator</h1>
    <h2>Offer Details</h2>
    <p style="color: #86868b; font-size: 14px; margin-top: -10px; margin-bottom: 20px;">Offer a massive discount that only unlocks if enough friends join the deal.</p>

    <div>
      <label for="product-name">Product / Service</label>
      <input type="text" id="product-name" placeholder="e.g. Masterclass Subscription" />
    </div>

    <div class="row-group">
      <div>
        <label for="regular-price">Regular Price ($)</label>
        <input type="number" id="regular-price" placeholder="100" />
      </div>
      <div>
        <label for="group-price">Group Price ($)</label>
        <input type="number" id="group-price" placeholder="49" />
      </div>
    </div>

    <div>
      <label for="group-size">Required Group Size</label>
      <input type="number" id="group-size" placeholder="3" value="3" />
    </div>

    <button id="generate-btn">
        <span class="btn-text">Generate Group Buy Link</span>
        <div class="loading-spinner"></div>
    </button>

    <div id="result-area">
      <p>✨ Your Viral Link is Ready! ✨</p>

      <div class="action-group">
          <div class="link-group">
            <input type="text" id="generated-url" readonly />
            <button id="copy-btn" style="width: auto; padding: 14px 20px;" class="btn-secondary">Copy</button>
          </div>
      </div>
    </div>
  </div>

  <a href="/dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <footer>
    <a href="/setup.html?ref=group_buy_footer" target="_blank" class="footer-link">⚡ Powered by OHC</a>
  </footer>

  <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
      const productName = document.getElementById('product-name').value.trim();
      const regularPrice = document.getElementById('regular-price').value.trim();
      const groupPrice = document.getElementById('group-price').value.trim();
      const groupSize = document.getElementById('group-size').value.trim();
      const btn = document.getElementById('generate-btn');

      if (!productName || !regularPrice || !groupPrice || !groupSize) {
        alert("Please fill in all fields.");
        return;
      }

      btn.classList.add('btn-loading');
      btn.disabled = true;

      const baseUrl = window.location.origin.includes('localhost') ? 'https://app.onehumancorp.com' : window.location.origin;
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

      fetch('/api/v1/growth/referrals/generate', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
          }
      }).then(res => res.json()).then(data => {
          const params = new URLSearchParams({
            product: productName,
            reg: regularPrice,
            grp: groupPrice,
            size: groupSize,
            ref: data.referral_link ? data.referral_link.split('/').pop() : 'gb_' + Date.now()
          });
          const generatedUrl = `${baseUrl}/ui/group-buy/join/index.html?${params.toString()}`;

          showResult(generatedUrl);
      }).catch(err => {
          console.error(err);
          // Fallback
          const params = new URLSearchParams({
            product: productName,
            reg: regularPrice,
            grp: groupPrice,
            size: groupSize,
            ref: 'gb_' + Date.now()
          });
          const generatedUrl = `${baseUrl}/ui/group-buy/join/index.html?${params.toString()}`;

          showResult(generatedUrl);
      }).finally(() => {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
      });
    });

    function showResult(url) {
        document.getElementById('generated-url').value = url;
        document.getElementById('result-area').style.display = 'block';
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
        const urlInput = document.getElementById('generated-url');
        urlInput.select();
        document.execCommand('copy');

        const btn = document.getElementById('copy-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.backgroundColor = '#34C759';

        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '';
        }, 2000);
    });
  </script>
</body>
</html>
