<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnichannel Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: transparent; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; background: white; }
        #header { background: #007bff; color: white; padding: 10px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 16px; max-width: 80%; }
        .system { align-self: flex-start; background: #e9ecef; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #ccc; }
        #input-area input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        #input-area button { margin-left: 8px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">Chat</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        const tenantId = 'tenant-1';
        let currentConvoId = 'convo-1';

        async function loadConversations() {
            try {
                // For demonstration, directly setting a mock or calling the Rust API endpoint wrapper
                document.getElementById('messages').innerHTML += '<div class="message system">Hello from customer</div>';
            } catch (e) {
                console.error(e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';
            msgDiv.textContent = text;
            document.getElementById('messages').appendChild(msgDiv);

            input.value = '';

            // Send to backend (mocked for now to avoid CORS/setup issues in raw HTML)
        }

        document.addEventListener('DOMContentLoaded', loadConversations);
    </script>
</body>
</html>
