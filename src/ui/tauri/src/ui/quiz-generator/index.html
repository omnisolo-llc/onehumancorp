<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Quiz Generator</title>
    <style>
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #1d1d1f;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #86868b;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1d1d1f;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d1d6;
            box-sizing: border-box;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #0066FF;
        }
        button {
            background-color: #0066FF;
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #005ce6;
        }
        #result {
            margin-top: 20px;
            display: none;
        }
        .link-container {
            display: flex;
            margin-top: 10px;
        }
        .link-container input {
            flex-grow: 1;
            border-radius: 8px 0 0 8px;
            border-right: none;
        }
        .link-container button {
            width: auto;
            border-radius: 0 8px 8px 0;
            padding: 12px 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viral Quiz Generator</h1>
        <p class="subtitle">Create an engaging quiz to capture leads and grow your audience.</p>

        <h2 style="font-size: 18px; margin-bottom: 16px; text-align: left;">Quiz Details</h2>

        <div class="form-group">
            <label for="topic">Quiz Topic</label>
            <input type="text" id="topic" placeholder="e.g. What kind of startup founder are you?">
        </div>

        <div class="form-group">
            <label for="prize">Prize / Incentive (Optional)</label>
            <input type="text" id="prize" placeholder="e.g. Get a free business plan template!">
        </div>

        <button id="generateBtn">Generate Quiz Link</button>

        <div id="result">
            <h3 style="color: #34C759; margin-bottom: 8px;">Link Ready!</h3>
            <p style="font-size: 14px; color: #86868b; margin-top: 0;">Share this link to start collecting leads.</p>
            <div class="link-container">
                <input type="text" id="generatedLink" readonly>
                <button onclick="copyLink()">Copy</button>
            </div>
        </div>

        <a href="/dashboard.html" style="display: inline-block; margin-top: 20px; color: #0066FF; text-decoration: none; font-weight: 600; font-size: 14px;">&larr; Back to Dashboard</a>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', () => {
            const topic = document.getElementById('topic').value || 'What kind of startup founder are you?';
            const prize = document.getElementById('prize').value || '';
            const tenantId = localStorage.getItem('tenant_id') || 'demo';

            // Generate a simple client-side link that hits the backend
            const url = new URL(window.location.origin + '/quiz');
            url.searchParams.append('topic', topic);
            if (prize) {
                url.searchParams.append('prize', prize);
            }
            url.searchParams.append('ref', tenantId);

            document.getElementById('generatedLink').value = url.toString();
            document.getElementById('result').style.display = 'block';
        });

        function copyLink() {
            const copyText = document.getElementById("generatedLink");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            navigator.clipboard.writeText(copyText.value);
            alert("Copied the text: " + copyText.value);
        }
    </script>
</body>
</html>
