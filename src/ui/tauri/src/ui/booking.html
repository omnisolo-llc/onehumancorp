<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booking Calendar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; margin: 0; background: #f9fafb; color: #111827; }
        .container { max-width: 375px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .slot { display: block; width: 100%; padding: 16px; margin-bottom: 12px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; text-align: center; font-size: 16px; font-weight: 500; cursor: pointer; }
        .slot:hover { background: #f3f4f6; }
        .slot.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
        .btn-confirm { display: block; width: 100%; padding: 16px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 24px; }
        .btn-confirm:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Select a Time</h2>
            <p id="serviceName">Loading...</p>
        </div>
        <div id="slotsContainer">
            <!-- Slots injected here -->
        </div>
        <button id="confirmBtn" class="btn-confirm" disabled>Confirm Booking</button>
    </div>

    <script>
        // Simple mock behavior for the new autonomous booking customer view
        let selectedSlot = null;

        document.getElementById('serviceName').innerText = '1-on-1 Music Lesson';

        const mockSlots = [
            { id: '1', time: '10:00 AM - 11:00 AM' },
            { id: '2', time: '11:30 AM - 12:30 PM' },
            { id: '3', time: '2:00 PM - 3:00 PM' }
        ];

        const container = document.getElementById('slotsContainer');
        const confirmBtn = document.getElementById('confirmBtn');

        mockSlots.forEach(slot => {
            const el = document.createElement('div');
            el.className = 'slot';
            el.innerText = slot.time;
            el.onclick = () => {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                el.classList.add('selected');
                selectedSlot = slot;
                confirmBtn.disabled = false;
            };
            container.appendChild(el);
        });

        confirmBtn.onclick = async () => {
            confirmBtn.innerText = 'Processing...';
            confirmBtn.disabled = true;
            // Native deposit payment flow placeholder
            setTimeout(() => {
                alert('Redirecting to Stripe for deposit...');
                confirmBtn.innerText = 'Confirm Booking';
                confirmBtn.disabled = false;
            }, 1000);
        };
    </script>
</body>
</html>
