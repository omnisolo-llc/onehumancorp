<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Request a Service</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.65);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.4);
      --accent-color: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.65);
        --text-main: #f5f5f7;
        --text-sub: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 375px;
      padding: 24px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .glass-card {
    .tab-bar {
      display: flex;
      margin-bottom: 20px;
      gap: 12px;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-sub);
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: white;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    @media (prefers-color-scheme: dark) {
      .tab-btn.active {
        background: #2c2c2e;
      }
      .tab-bar {
        background: rgba(255, 255, 255, 0.05);
      }
    }
    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .booking-item {
      padding: 16px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .booking-item-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .booking-time {
      font-weight: 600;
      font-size: 16px;
    }
    .booking-customer {
      color: var(--text-sub);
      font-size: 14px;
    }
    .booking-status {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-confirmed { background: rgba(52, 199, 89, 0.2); color: #34C759; }
    .status-pending { background: rgba(255, 149, 0, 0.2); color: #FF9500; }
    .status-cancelled { background: rgba(255, 59, 48, 0.2); color: #FF3B30; }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <a href="dashboard.html" class="back-btn">&larr; Back to Dashboard</a>

    <div class="header" style="margin-bottom: 20px;">
      <h1 id="business-name" style="margin: 0; font-size: 28px;">Bookings</h1>
      <p style="margin: 4px 0 0 0; color: var(--text-sub);">Manage your schedule and appointments.</p>
    </div>

    <div class="tab-bar">
      <div class="tab-btn active" id="tab-upcoming">Upcoming</div>
      <div class="tab-btn" id="tab-requests">Requests</div>
    </div>

    <div id="upcoming-view">
      <div class="booking-list" id="upcoming-list">
        <div style="text-align: center; color: var(--text-sub); padding: 40px 0;">Loading bookings...</div>
      </div>
    </div>

    <div id="requests-view" style="display: none;">
      <div class="glass-card">
        <h2 style="font-size: 16px; margin: 0;">New Booking Request</h2>
        <p style="margin-top: 4px; font-size: 13px; color: var(--text-sub);">Create a request link for a customer.</p>

        <form id="booking-form" style="margin-top: 16px;">
          <textarea id="description" placeholder="e.g. Needs a follow-up appointment next week." required style="width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.5); font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
          <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; border: none; margin-top: 12px;">Create Request</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tenantId = urlParams.get('tenant') || localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

      const tabUpcoming = document.getElementById('tab-upcoming');
      const tabRequests = document.getElementById('tab-requests');
      const viewUpcoming = document.getElementById('upcoming-view');
      const viewRequests = document.getElementById('requests-view');

      tabUpcoming.addEventListener('click', () => {
        tabUpcoming.classList.add('active');
        tabRequests.classList.remove('active');
        viewUpcoming.style.display = 'block';
        viewRequests.style.display = 'none';
      });

      tabRequests.addEventListener('click', () => {
        tabRequests.classList.add('active');
        tabUpcoming.classList.remove('active');
        viewUpcoming.style.display = 'none';
        viewRequests.style.display = 'block';
      });

      async function fetchBookings() {
        try {
          const res = await fetch('/api/ui/bookings?tenant=' + tenantId);
          if (res.ok) {
            const bookings = await res.json();
            const list = document.getElementById('upcoming-list');
            list.innerHTML = '';

            if (bookings.length === 0) {
              list.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 40px 0;">No upcoming bookings.</div>';
              return;
            }

            bookings.forEach(b => {
              let statusClass = 'status-pending';
              if (b.status === 'confirmed' || b.status === 'scheduled') statusClass = 'status-confirmed';
              if (b.status === 'cancelled') statusClass = 'status-cancelled';

              let timeStr = 'TBD';
              if (b.start_time) {
                try {
                  const d = new Date(b.start_time);
                  timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                } catch(e) {
                  timeStr = b.start_time;
                }
              }

              const item = document.createElement('div');
              item.className = 'booking-item';
              item.innerHTML = `
                <div class="booking-item-details">
                  <div class="booking-time">${timeStr}</div>
                  <div class="booking-customer">${b.customer_name || 'Customer'} &bull; ${b.product_title || 'Service'}</div>
                </div>
                <div class="booking-status ${statusClass}">${b.status || 'pending'}</div>
              `;
              list.appendChild(item);
            });
          }
        } catch(e) {
          console.error(e);
          document.getElementById('upcoming-list').innerHTML = '<div style="text-align: center; color: #FF3B30; padding: 40px 0;">Failed to load bookings.</div>';
        }
      }

      fetchBookings();

      document.getElementById('booking-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const description = document.getElementById('description').value;
        const btn = document.getElementById('btn-submit');

        btn.innerText = 'Creating...';
        btn.disabled = true;

        try {
          // Simulate backend processing (AI Agent picking it up to draft a quote)
          await fetch('/api/agents/approvals/simulate-quote-draft', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-tenant-id': tenantId
            },
            body: JSON.stringify({ description })
          });

          btn.innerText = 'Created! (Check Inbox)';
          setTimeout(() => {
            btn.innerText = 'Create Request';
            btn.disabled = false;
            document.getElementById('description').value = '';
          }, 2000);

        } catch (error) {
          console.error(error);
          btn.innerText = 'Create Request';
          btn.disabled = false;
          alert('Something went wrong. Please try again.');
        }
      });
    });
  </script>
</body>
</html>
