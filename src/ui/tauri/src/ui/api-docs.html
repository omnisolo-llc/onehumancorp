    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Documentation</title>
    <link rel="stylesheet" href="/api/ui/swagger-ui.css" />
    <style>
      .swagger-ui .wrapper { max-width: 100%; overflow-x: hidden; padding: 0 10px; box-sizing: border-box; }
      .swagger-ui .opblock-body pre { white-space: pre-wrap; word-wrap: break-word; overflow-x: auto; max-width: 100%; box-sizing: border-box; }
      .swagger-ui table { display: block; overflow-x: auto; max-width: 100%; box-sizing: border-box; }
      .swagger-ui .markdown p { word-break: break-word; }
      /* Ensure that responses and models don't overflow the screen width on mobile */
      .swagger-ui .responses-inner { overflow-x: auto; max-width: 100%; }
      .swagger-ui .model-box { overflow-x: auto; max-width: 100%; }
      .swagger-ui .opblock-tag { font-size: 20px; padding: 10px 10px 10px 10px; }
      .swagger-ui .opblock .opblock-summary { padding: 5px; }
      .swagger-ui .opblock .opblock-summary-method { min-width: 60px; font-size: 12px; }
      .swagger-ui .opblock .opblock-summary-path { font-size: 14px; max-width: calc(100vw - 120px); overflow-wrap: break-word; word-break: break-all; }
      body {
        max-width: 100vw;
        overflow-x: hidden;
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        padding: 0;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      .docs-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      .docs-header {
        margin-bottom: 40px;
      }
      .docs-header h1 {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      .docs-header p {
        font-size: 20px;
        color: #86868b;
        max-width: 600px;
      }
      .docs-card {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      }
      .warning-banner {
        background: rgba(255, 59, 48, 0.1);
        color: #ff3b30;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 24px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="docs-container">
      <div class="docs-header">
        <div class="warning-banner">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
          </svg>
          Advanced: External API Integration
        </div>
        <h1>API Documentation</h1>
        <p class="subtitle">Integrate your custom checkout or external tools directly with OHC.</p>
        <p>This section is for developers directly integrating with our APIs.</p>
      </div>

      <div class="backdrop-blur-[20px] saturate-200">
        <div id="swagger-ui" class="docs-card swagger-ui" style="padding: 0; max-width: 100%; overflow-x: hidden;"></div>
      </div>
    </div>

    <link rel="stylesheet" href="/api/ui/swagger-ui.css" />
    <script src="/api/ui/swagger-ui-bundle.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.SwaggerUIBundle) {
          const swaggerUI = window.SwaggerUIBundle({
            url: "/api/api-docs-spec",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [window.SwaggerUIBundle.presets.apis, window.SwaggerUIBundle.SwaggerUIStandalonePreset],
            layout: "BaseLayout",
          });
        }
      });
    </script>
  </body>
</html>
