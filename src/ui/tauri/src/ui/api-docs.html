<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Documentation</title>
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
      .swagger-ui .wrapper { max-width: 100%; overflow-x: hidden; padding: 0 10px; }
      .swagger-ui .opblock-body pre { white-space: pre-wrap; word-wrap: break-word; overflow-x: auto; max-width: 100%; }
      .swagger-ui table { display: block; overflow-x: auto; max-width: 100%; }
      .swagger-ui .markdown p { word-break: break-word; }
      body {
        max-width: 100vw;
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .container {
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        transition: opacity 0.2s;
      }
      .back-link:hover {
        opacity: 0.8;
      }
      .back-link svg {
        margin-right: 8px;
        width: 20px;
        height: 20px;
      }
      .content-wrapper {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 30px;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        color: #1d1d1f;
        margin-top: 0;
        font-size: 28px;
        font-weight: 700;
      }
      p.subtitle {
        color: #86868b;
        font-size: 16px;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      @media (max-width: 768px) {
        body { padding: 20px 10px; }
        .content-wrapper { padding: 20px 15px; border-radius: 12px; }
        h1 { font-size: 24px; }
        .swagger-ui .wrapper { padding: 0; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="/help.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Help Center
      </a>

      <div class="content-wrapper">
        <div id="swagger-ui"></div>
      </div>
    </div>

    <!-- Swagger UI JS Bundle -->
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js" crossorigin></script>

    <script>
      window.onload = function() {
        // Initialize Swagger UI pointing to our API specs endpoint
        window.ui = SwaggerUIBundle({
          url: "/api/api-docs-spec",
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "BaseLayout"
        });
      };
    </script>


    <!-- Floating Help Button -->
    <button id="ohc-help-btn" aria-label="Help">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
    </button>
  </body>

</html>
