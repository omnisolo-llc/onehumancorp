<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Documentation</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        font-size: 14px;
        padding: 8px 0;
        min-height: 44px;
      }
      .back-link svg {
        width: 16px;
        height: 16px;
        margin-right: 5px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .header {
        margin-bottom: 40px;
        text-align: center;
      }
      h1 {
        color: #1d1d1f;
        font-size: 32px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .subtitle {
        color: #86868b;
        font-size: 16px;
        margin-top: 10px;
      }
      .badge {
        display: inline-block;
        background-color: #FF9500;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 700;
        margin-right: 10px;
        vertical-align: middle;
      }
      .docs-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        margin-bottom: 30px;
      }

      /* Swagger-like minimal UI */
      .endpoint {
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 16px;
        margin-bottom: 15px;
        overflow: hidden;
      }
      .endpoint-header {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        background: rgba(0,0,0,0.02);
        cursor: pointer;
      }
      .endpoint-method {
        font-family: monospace;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 4px;
        margin-right: 15px;
        font-size: 14px;
      }
      .method-get { background: #E1F0FF; color: #0066FF; }
      .method-post { background: #E8F5E9; color: #34C759; }
      .endpoint-path {
        font-family: monospace;
        font-weight: 600;
        color: #1d1d1f;
        font-size: 14px;
      }
      .endpoint-summary {
        margin-left: auto;
        color: #86868b;
        font-size: 14px;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .docs-card {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        h1, .endpoint-path { color: #f5f5f7; }
        .subtitle { color: #a1a1a6; }
        .endpoint { border-color: rgba(255,255,255,0.1); }
        .endpoint-header { background: rgba(255,255,255,0.02); }
        .method-get { background: rgba(0, 102, 255, 0.2); }
        .method-post { background: rgba(52, 199, 89, 0.2); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="dashboard.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Dashboard
      </a>

      <div class="header">
        <h1><span class="badge">Advanced:</span> OHC Advanced API Reference</h1>
        <p class="subtitle">Integrate your custom checkout or external tools directly with OHC.</p>
      </div>

      <div id="swagger-ui" class="docs-card" style="padding: 0;"></div>
    </div>

    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.SwaggerUIBundle) {
          const swaggerUI = window.SwaggerUIBundle({
            url: "/api/api-docs-spec",
            dom_id: "#swagger-ui",
            deepLinking: true,
            presets: [window.SwaggerUIBundle.presets.apis, window.SwaggerUIBundle.SwaggerUIStandalonePreset],
            layout: "BaseLayout",
          });
        }
      });
    </script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(console.error);
    }
    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    let hideTimeout;

    function showTooltip(e, text) {
        clearTimeout(hideTimeout);
        tooltipEl.textContent = text;

        const targetRect = e.target.getBoundingClientRect();

        // Position below the element by default
        let top = targetRect.bottom + 10;
        let left = targetRect.left + (targetRect.width / 2) - (tooltipEl.offsetWidth / 2);

        // Adjust if it goes off screen
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        if (top + tooltipEl.offsetHeight > window.innerHeight - 10) {
            // Position above if it doesn't fit below
            top = targetRect.top - tooltipEl.offsetHeight - 10;
        }

        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        hideTimeout = setTimeout(() => {
            tooltipEl.classList.remove('visible');
        }, 100); // slight delay to prevent flicker
    }

    // Desktop hover
    document.addEventListener('mouseover', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target; if (target && typeof target.closest === 'function' && target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            touchTimeout = setTimeout(() => {
                showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});

</script>
    <script src="help-widget.js"></script>

  </body>
</html>
