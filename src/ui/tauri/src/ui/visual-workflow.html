<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OHC Visual Workflow</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      color: #1d1d1f;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #86868b;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px 0 rgba(0, 102, 255, 0.3);
    }
    button:hover { background-color: #0052cc; }
    button:active { transform: scale(0.98); }

    .btn-secondary {
      background-color: #e5e5ea;
      color: #1d1d1f;
      box-shadow: none;
    }
    .btn-secondary:hover { background-color: #d1d1d6; }

    .node-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }

    .node-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .node-type-label {
      font-size: 12px;
      background: #0066FF;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 12px;
      color: #86868b;
    }

    input[type="text"] {
      padding: 8px;
      border: 1px solid #d1d1d6;
      border-radius: 6px;
      font-size: 14px;
    }

    .edges-section {
      margin-top: 20px;
    }

    .edge-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .result-panel {
      margin-top: 20px;
      padding: 15px;
      background: #1d1d1f;
      color: #f5f5f7;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #1d1d1f; color: #f5f5f7; }
      .glass-panel { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); }
      .btn-secondary { background-color: #333336; color: #f5f5f7; }
      .btn-secondary:hover { background-color: #48484a; }
      .node-card { background: rgba(0, 0, 0, 0.4); border: 1px solid #48484a; }
      input[type="text"] { background: rgba(0, 0, 0, 0.2); border: 1px solid #48484a; color: white; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Visual Workflow Builder</h1>
  <div class="subtitle">Low-code orchestration interface.</div>

  <div class="glass-panel">
    <div class="toolbar">
      <button class="btn-secondary" id="add-input-btn">Add Input Node</button>
      <button class="btn-secondary" id="add-llm-btn">Add LLM Node</button>
      <button class="btn-secondary" id="add-output-btn">Add Output Node</button>
      <button class="btn-secondary" id="add-subagent-btn">Add SubAgent Node</button>
      <button id="run-workflow-btn">Run Workflow</button>
      <button class="btn-secondary" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
    </div>

    <h3>Nodes</h3>
    <div class="node-list" id="nodes-container">
      <!-- Nodes will be injected here -->
    </div>

    <div class="edges-section">
      <h3>Edges</h3>
      <div id="edges-container"></div>
      <button class="btn-secondary" style="margin-top: 10px;" id="add-edge-btn">Add Edge</button>
    </div>

    <div class="edges-section">
      <h3>Initial Inputs</h3>
      <div id="inputs-container"></div>
      <button class="btn-secondary" style="margin-top: 10px;" id="add-input-val-btn">Add Input Value</button>
    </div>
  </div>

  <div class="result-panel" id="result-panel"></div>
</div>

<script>
  let nodes = [];
  let edges = [];
  let workflowInputs = {};

  const nodesContainer = document.getElementById('nodes-container');
  const edgesContainer = document.getElementById('edges-container');
  const inputsContainer = document.getElementById('inputs-container');

  function render() {
    nodesContainer.innerHTML = '';
    nodes.forEach((n, idx) => {
      const card = document.createElement('div');
      card.className = 'node-card';
      card.dataset.nodeId = n.id;

      let fieldsHtml = '';
      if (n.type === 'Input') {
        fieldsHtml = `
          <div class="input-group">
            <label>Name</label>
            <input type="text" class="node-field" data-idx="${idx}" data-field="name" value="${n.name || ''}" placeholder="e.g. input_var">
          </div>
        `;
      } else if (n.type === 'Llm') {
        fieldsHtml = `
          <div class="input-group">
            <label>Prompt Template</label>
            <input type="text" class="node-field" data-idx="${idx}" data-field="prompt_template" value="${n.prompt_template || ''}" placeholder="e.g. Process {{in}}">
          </div>
        `;
      } else if (n.type === 'SubAgent') {
        fieldsHtml = `
          <div class="input-group">
            <label>Agent Name</label>
            <input type="text" class="node-field" data-idx="${idx}" data-field="agent_name" value="${n.agent_name || ''}">
          </div>
          <div class="input-group">
            <label>Task Template</label>
            <input type="text" class="node-field" data-idx="${idx}" data-field="task_template" value="${n.task_template || ''}">
          </div>
        `;
      }

      card.innerHTML = `
        <div class="node-header">
          <span>${n.id}</span>
          <span class="node-type-label">${n.type}</span>
          <button class="btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="removeNode('${n.id}')">X</button>
        </div>
        ${fieldsHtml}
      `;
      nodesContainer.appendChild(card);
    });

    // Re-bind node field events
    document.querySelectorAll('.node-field').forEach(el => {
      el.addEventListener('input', (e) => {
        const idx = e.target.dataset.idx;
        const field = e.target.dataset.field;
        nodes[idx][field] = e.target.value;
      });
    });

    edgesContainer.innerHTML = '';
    edges.forEach((e, idx) => {
      const edgeDiv = document.createElement('div');
      edgeDiv.className = 'edge-item';
      edgeDiv.innerHTML = `
        <input type="text" placeholder="Source Node ID" value="${e.source}" oninput="updateEdge(${idx}, 'source', this.value)">
        <span>&rarr;</span>
        <input type="text" placeholder="Target Node ID" value="${e.target}" oninput="updateEdge(${idx}, 'target', this.value)">
        <button class="btn-secondary" onclick="removeEdge(${idx})">X</button>
      `;
      edgesContainer.appendChild(edgeDiv);
    });

    inputsContainer.innerHTML = '';
    Object.keys(workflowInputs).forEach(k => {
      const inputDiv = document.createElement('div');
      inputDiv.className = 'edge-item';
      inputDiv.innerHTML = `
        <input type="text" placeholder="Key" value="${k}" readonly>
        <span>:</span>
        <input type="text" placeholder="Value" value="${workflowInputs[k]}" oninput="updateInputValue('${k}', this.value)">
        <button class="btn-secondary" onclick="removeInputValue('${k}')">X</button>
      `;
      inputsContainer.appendChild(inputDiv);
    });
  }

  window.removeNode = (id) => {
    nodes = nodes.filter(n => n.id !== id);
    edges = edges.filter(e => e.source !== id && e.target !== id);
    render();
  };

  window.updateEdge = (idx, field, val) => {
    edges[idx][field] = val;
  };
  window.removeEdge = (idx) => {
    edges.splice(idx, 1);
    render();
  };

  window.updateInputValue = (k, val) => {
    workflowInputs[k] = val;
  };
  window.removeInputValue = (k) => {
    delete workflowInputs[k];
    render();
  };

  document.getElementById('add-input-btn').onclick = () => {
    nodes.push({ id: `node_${nodes.length + 1}`, type: 'Input', name: 'input_var' });
    render();
  };
  document.getElementById('add-llm-btn').onclick = () => {
    nodes.push({ id: `node_${nodes.length + 1}`, type: 'Llm', prompt_template: 'Process {{input_var}}' });
    render();
  };
  document.getElementById('add-output-btn').onclick = () => {
    nodes.push({ id: `node_${nodes.length + 1}`, type: 'Output' });
    render();
  };
  document.getElementById('add-subagent-btn').onclick = () => {
    nodes.push({ id: `node_${nodes.length + 1}`, type: 'SubAgent', agent_name: 'helper', task_template: 'Do {{input_var}}' });
    render();
  };

  document.getElementById('add-edge-btn').onclick = () => {
    edges.push({ source: '', target: '' });
    render();
  };
  document.getElementById('add-input-val-btn').onclick = () => {
    const keyName = prompt('Enter input key name:');
    if (keyName) {
      workflowInputs[keyName] = '';
      render();
    }
  };

  document.getElementById('run-workflow-btn').onclick = async () => {
    const btn = document.getElementById('run-workflow-btn');
    const resultPanel = document.getElementById('result-panel');

    // Map to proper backend struct format
    const backendNodes = nodes.map(n => {
      let node_type = {};
      if (n.type === 'Input') {
        node_type = { Input: { name: n.name } };
      } else if (n.type === 'Llm') {
        node_type = { Llm: { prompt_template: n.prompt_template } };
      } else if (n.type === 'Output') {
        node_type = 'Output';
      } else if (n.type === 'SubAgent') {
        node_type = { SubAgent: { agent_name: n.agent_name, task_template: n.task_template } };
      }
      return { id: n.id, node_type };
    });

    const graph = {
      nodes: backendNodes,
      edges: edges
    };

    btn.innerText = 'Running...';
    resultPanel.style.display = 'block';
    resultPanel.innerText = 'Sending request to Tauri command...';

    if (window.__TAURI__ && window.__TAURI__.core) {
      try {
        const res = await window.__TAURI__.core.invoke('run_visual_workflow', {
          graph,
          inputs: workflowInputs
        });
        resultPanel.innerText = res;
      } catch (err) {
        resultPanel.innerText = "Error: " + err;
      }
    } else {
      resultPanel.innerText = "Error: window.__TAURI__ not available (Playwright/Mock environment without Tauri context).";
    }

    btn.innerText = 'Run Workflow';
  };

  // Initial render
  render();
</script>

</body>
</html>
