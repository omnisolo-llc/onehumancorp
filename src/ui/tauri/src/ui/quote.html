<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Custom Quote</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.65);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.4);
      --accent-color: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.65);
        --text-main: #f5f5f7;
        --text-sub: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 375px;
      padding: 24px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      margin: 0;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.4;
    }
    .quote-header {
      text-align: center;
      margin-bottom: 8px;
    }
    .line-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .line-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .line-item-desc {
      font-weight: 500;
      color: var(--text-main);
    }
    .line-item-price {
      font-weight: 600;
    }
    .total-section {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 2px solid var(--border-color);
      font-weight: 700;
      font-size: 18px;
    }
    .deposit-section {
      background: rgba(0, 102, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      border: 1px solid rgba(0, 102, 255, 0.1);
    }
    .deposit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .deposit-label {
      font-weight: 600;
      color: var(--accent-color);
    }
    .deposit-amount {
      font-weight: 700;
      font-size: 20px;
      color: var(--accent-color);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 12px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }
    .btn-apple-pay {
      background-color: #000;
      color: white;
    }
    @media (prefers-color-scheme: dark) {
      .btn-apple-pay {
        background-color: #fff;
        color: #000;
      }
    }
    .calendar-widget {
      margin-top: 20px;
    }
    .date-selector {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-top: 12px;
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .date-selector::-webkit-scrollbar {
      display: none;
    }
    .date-card {
      flex: 0 0 auto;
      width: 60px;
      height: 70px;
      border-radius: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .date-card.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    .date-card .day {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.8;
    }
    .date-card .date {
      font-size: 20px;
      font-weight: 700;
    }
    .time-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .time-slot {
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      font-weight: 500;
      cursor: pointer;
    }
    .time-slot.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(0, 102, 255, 0.1);
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    /* Deposit Slider (Owner View) */
    .slider-container {
      margin-top: 16px;
      display: none; /* Shown via JS for owner view */
    }
    .slider-container.visible {
      display: block;
    }
    input[type=range] {
      width: 100%;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="mobile-container">

    <div class="quote-header">
      <div class="status-badge" id="quote-status">Pending Approval</div>
      <h1 id="business-name">Loading...</h1>
      <p id="service-title">Quote #<span id="quote-id-display">...</span></p>
    </div>

    <div class="glass-card" id="quote-details-card">
      <h2 style="font-size: 16px; margin: 0 0 16px 0;">Quote Details</h2>

      <div id="line-items-container">
        <!-- Injected via JS -->
      </div>

      <div class="total-section">
        <span>Total</span>
        <span id="quote-total">$0.00</span>
      </div>

      <div class="deposit-section">
        <div class="deposit-row">
          <span class="deposit-label">Required Deposit to Book</span>
          <span class="deposit-amount" id="deposit-amount">$0.00</span>
        </div>
        <p style="font-size: 13px; color: var(--accent-color); opacity: 0.8;">Applied to your final balance.</p>

        <div class="slider-container" id="owner-slider-container">
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 4px;">
            <span>0%</span>
            <span>Deposit %</span>
            <span>100%</span>
          </div>
          <input type="range" id="deposit-slider" min="0" max="100" value="25" step="5">
          <div style="text-align: right; font-size: 14px; font-weight: 600;" id="deposit-percent-display">25%</div>
        </div>
      </div>
    </div>

    <div class="glass-card calendar-widget" id="calendar-widget">
      <h2 style="font-size: 16px; margin: 0 0 8px 0;">Select Date & Time</h2>
      <p>Choose when you'd like the service.</p>

      <div class="date-selector" id="date-selector">
        <!-- Injected via JS -->
      </div>

      <div class="time-selector" id="time-selector">
        <!-- Injected via JS -->
      </div>
    </div>

    <div id="action-buttons">
      <button class="btn btn-primary" id="btn-approve-send" style="display: none;">Approve & Send to Customer</button>
      <button class="btn btn-apple-pay" id="btn-pay-deposit" style="display: none;">Pay Deposit with Pay</button>
      <button class="btn btn-primary" id="btn-pay-card" style="display: none; background-color: #333;">Pay with Card</button>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const quoteId = urlParams.get('id');
      const viewMode = urlParams.get('mode') || 'customer'; // 'owner' or 'customer'

      // Elements
      const lineItemsContainer = document.getElementById('line-items-container');
      const quoteTotalEl = document.getElementById('quote-total');
      const depositAmountEl = document.getElementById('deposit-amount');
      const businessNameEl = document.getElementById('business-name');
      const quoteIdDisplay = document.getElementById('quote-id-display');

      // Action Buttons
      const btnApproveSend = document.getElementById('btn-approve-send');
      const btnPayDeposit = document.getElementById('btn-pay-deposit');
      const btnPayCard = document.getElementById('btn-pay-card');
      const ownerSliderContainer = document.getElementById('owner-slider-container');
      const depositSlider = document.getElementById('deposit-slider');
      const depositPercentDisplay = document.getElementById('deposit-percent-display');

      let quoteData = {
        totalCents: 15000, // $150.00
        depositPercent: 25,
        currency: 'USD',
        tenantId: urlParams.get('tenant') || 'demo-tenant'
      };

      // Format currency
      const formatCurrency = (cents) => {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
        }).format(cents / 100);
      };

      const loadQuote = async () => {
        businessNameEl.innerText = "Carlos' Handyman Services"; // Temporarily keep until business profile API exists
        quoteIdDisplay.innerText = quoteId || '1029';

        try {
          const res = await fetch(`/api/v1/quotes/${quoteId || '1029'}`);
          if (res.ok) {
            const data = await res.json();
            // Assuming data structure based on the quoting service model
            let html = '';
            let total = 0;
            if (data.line_items) {
                data.line_items.forEach(item => {
                total += item.unit_price_cents * item.quantity;
                html += `
                    <div class="line-item">
                    <span class="line-item-desc">${item.description}</span>
                    <span class="line-item-price">${formatCurrency(item.unit_price_cents * item.quantity)}</span>
                    </div>
                `;
                });
            } else {
                html = '<div class="line-item"><span class="line-item-desc">No items</span></div>';
            }

            quoteData.totalCents = total;
            lineItemsContainer.innerHTML = html;
          } else {
             lineItemsContainer.innerHTML = '<div class="line-item"><span class="line-item-desc">Failed to load quote</span></div>';
          }
        } catch (e) {
          console.error(e);
          lineItemsContainer.innerHTML = '<div class="line-item"><span class="line-item-desc">Error loading quote</span></div>';
        }

        updateTotals();
        renderCalendar();
      };

      const updateTotals = () => {
        quoteTotalEl.innerText = formatCurrency(quoteData.totalCents);
        const depositCents = Math.round(quoteData.totalCents * (quoteData.depositPercent / 100));
        depositAmountEl.innerText = formatCurrency(depositCents);
      };

      // UI setup based on mode
      if (viewMode === 'owner') {
        ownerSliderContainer.classList.add('visible');
        btnApproveSend.style.display = 'block';
        document.getElementById('quote-status').innerText = 'Draft - Review';

        depositSlider.addEventListener('input', (e) => {
          quoteData.depositPercent = parseInt(e.target.value);
          depositPercentDisplay.innerText = quoteData.depositPercent + '%';
          updateTotals();
        });

        btnApproveSend.addEventListener('click', () => {
          btnApproveSend.innerText = 'Sending...';
          setTimeout(() => {
            alert('Quote sent to customer via SMS/WhatsApp!');
            window.location.href = 'team.html'; // Or dashboard
          }, 1000);
        });

      } else {
        // Customer View
        btnPayDeposit.style.display = 'flex';
        btnPayCard.style.display = 'block';
        document.getElementById('quote-status').innerText = 'Action Required';

        const handlePayment = async () => {
          btnPayCard.innerText = 'Processing...';
          try {
            // Trigger checkout session creation via the booking engine
            const reqBody = {
              tenant_id: quoteData.tenantId,
              customer_id: 'cust_123',
              amount_cents: Math.round(quoteData.totalCents * (quoteData.depositPercent / 100)),
              product_id: quoteId || 'quote_123'
            };

            // Simulating API call since actual API might need auth


            setTimeout(() => {
              window.location.href = 'success.html?type=booking_deposit';
            }, 1000);

          } catch (e) {
            alert('Failed to initiate checkout.');
            btnPayCard.innerText = 'Pay with Card';
          }
        };

        btnPayDeposit.addEventListener('click', handlePayment);
        btnPayCard.addEventListener('click', handlePayment);
      }

      // Render Calendar
      const renderCalendar = () => {
        const dateSelector = document.getElementById('date-selector');
        const timeSelector = document.getElementById('time-selector');

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        let dateHtml = '';

        // Generate next 5 days
        for(let i=1; i<=5; i++) {
          const d = new Date();
          d.setDate(d.getDate() + i);
          const activeClass = i === 1 ? 'active' : '';
          dateHtml += `
            <div class="date-card ${activeClass}">
              <div class="day">${days[d.getDay()]}</div>
              <div class="date">${d.getDate()}</div>
            </div>
          `;
        }
        dateSelector.innerHTML = dateHtml;

        const times = ['09:00 AM', '11:00 AM', '02:00 PM', '04:00 PM'];
        let timeHtml = '';
        times.forEach((t, i) => {
          const activeClass = i === 0 ? 'active' : '';
          timeHtml += `<div class="time-slot ${activeClass}">${t}</div>`;
        });
        timeSelector.innerHTML = timeHtml;

        // Add basic interactivity
        document.querySelectorAll('.date-card').forEach(el => {
          el.addEventListener('click', (e) => {
            document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
            e.currentTarget.classList.add('active');
          });
        });
        document.querySelectorAll('.time-slot').forEach(el => {
          el.addEventListener('click', (e) => {
            document.querySelectorAll('.time-slot').forEach(c => c.classList.remove('active'));
            e.currentTarget.classList.add('active');
          });
        });
      };

      loadQuote();
    });
  </script>

<script src="help-widget.js"></script>


<script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(console.error);
    }

    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    function showTooltip(e, text) {
        if (!text) return;
        tooltipEl.textContent = text;
        const rect = e.target.getBoundingClientRect();

        // Position above the element
        let top = rect.top - tooltipEl.offsetHeight - 10;
        let left = rect.left + (rect.width / 2) - (tooltipEl.offsetWidth / 2);

        // Adjust if out of bounds
        if (top < 10) {
            top = rect.bottom + 10; // show below if not enough space above
        }
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        tooltipEl.style.top = top + 'px';
        tooltipEl.style.left = left + 'px';
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    // Hover (desktop)
    document.addEventListener('mouseover', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target; if (target && typeof target.closest === 'function' && target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            touchTimeout = setTimeout(() => {
                showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});
</script>

</body>
</html>
