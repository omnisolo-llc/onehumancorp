<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
        border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calendar & Bookings</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.65);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.4);
      --accent-color: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.65);
        --text-main: #f5f5f7;
        --text-sub: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 375px;
      margin: 0 auto;
      padding: 24px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .booking-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }
    .booking-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .booking-title {
      font-weight: 600;
      font-size: 16px;
    }
    .booking-status {
      font-size: 12px;
      background: rgba(0, 102, 255, 0.1);
      color: var(--accent-color);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
    }
    .booking-time {
      font-size: 14px;
      color: var(--text-sub);
    }
    .booking-agent {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 16px;
      cursor: pointer;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="nav-bar">
      <button class="back-btn" onclick="window.location.href='/dashboard'">&larr; Back</button>
    </div>

    <h1>Calendar & Bookings</h1>

    <div class="glass-card">
      <h2>Upcoming Appointments</h2>

      <div id="bookings-list">
        <!-- Seeded booking from E2E -->
        <div class="booking-item">
          <div class="booking-header">
            <div class="booking-title">Cake Decorating Class</div>
            <div class="booking-status">Confirmed</div>
          </div>
          <div class="booking-time">Tomorrow at 10:00 AM</div>
          <div class="booking-agent">
            <span>🤖</span> Managed by Operations Agent
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
