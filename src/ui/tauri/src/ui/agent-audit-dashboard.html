<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OHC - Agent Audit Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 40px 20px;
      }
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      @media (prefers-color-scheme: dark) {
          body {
              background-color: #000;
              color: white;
          }
          .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        border-radius: 16px;
            background: rgba(22, 22, 26, 0.7);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          }
      }
      .container {
        max-width: 1200px;
        width: 100%;
        padding: 40px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
      }
      .header {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .header h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 600;
      }
      .back-link {
        text-decoration: none;
        color: #0066FF;
        font-weight: 500;
      }
      .panel {
        padding: 24px;
      }
      .panel h2 {
        margin-top: 0;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .cost-tracker .amount {
        font-size: 48px;
        font-weight: 700;
      }
      .cost-tracker .subtitle {
        color: #666;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
          .cost-tracker .subtitle {
              color: #999;
          }
      }
      .agent-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
      }
      .agent-card {
          padding: 16px;
          border-radius: 12px;
      }
      .agent-card h3 {
          margin: 0 0 12px 0;
          font-size: 16px;
      }
      .status-indicator {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 14px;
      }
      .status-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
      }
      .status-dot.green { background-color: #34C759; }
      .status-dot.red { background-color: #FF3B30; }
      .status-dot.yellow { background-color: #FFCC00; }

      .feed-list {
          list-style: none;
          padding: 0;
          margin: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
      }
      .feed-item {
          padding: 12px;
          border-radius: 8px;
          font-size: 14px;
      }
      .feed-item.violation {
          background: rgba(255, 59, 48, 0.1);
          border: 1px solid rgba(255, 59, 48, 0.3);
      }
      .feed-item.normal {
          background: rgba(255, 255, 255, 0.65);
      }
      @media (prefers-color-scheme: dark) {
          .feed-item.normal {
              background: rgba(22, 22, 26, 0.7);
          }
      }
      .feed-time {
          font-weight: 600;
          color: #0066FF;
          margin-right: 8px;
      }
      @media (prefers-color-scheme: dark) {
          .feed-time {
              color: #5E9BFF;
          }
      }

      .main-content {
          display: flex;
          flex-direction: column;
          gap: 24px;
      }

      @media (max-width: 768px) {
        .container {
            grid-template-columns: 1fr;
        }
        .agent-grid {
            grid-template-columns: 1fr;
        }
      }

      /* OHC Premium Glassmorphism Overrides */
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        border-radius: 16px;
      }
      button.glassmorphism,
      input.glassmorphism,
      select.glassmorphism,
      textarea.glassmorphism,
      .glassmorphism input,
      .glassmorphism select,
      .glassmorphism textarea,
      .glassmorphism button {
        border-radius: 8px;
      }
</style>
  </head>
  <body>
    <div class="container glassmorphism">
        <div class="header">
            <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
            <h1>Agent Audit Dashboard</h1>
            <div></div>
        </div>

        <div class="main-content">
            <div class="panel glassmorphism cost-tracker">
                <h2>Cost Tracker</h2>
                <div class="amount" id="total-cost">-</div>
                <div class="subtitle">Total organizational spend</div>
            </div>

            <div class="agent-grid" id="agent-grid">
                <!-- Agent cards will be populated here -->
                <div class="glassmorphism agent-card">
                    <h3>Operations</h3>
                    <div class="status-indicator">
                        <div class="status-dot green"></div>
                        <span>Agent Health: Optimal</span>
                    </div>
                </div>
                <div class="glassmorphism agent-card">
                    <h3>Marketing & Advertising</h3>
                    <div class="status-indicator">
                        <div class="status-dot green"></div>
                        <span>Campaigns Sync: Active</span>
                    </div>
                </div>
            </div>

            <div class="panel glassmorphism">
                <h2>Live Execution Log</h2>
                <div id="live-log" style="font-family: monospace; background: rgba(0,0,0,0.8); color: #0f0; padding: 12px; border-radius: 8px; height: 150px; overflow-y: auto; font-size: 12px;">
                    > Waiting for streams...
                </div>
            </div>
        </div>

        <div class="side-content">
            <div class="panel glassmorphism" style="height: 100%;">
                <h2>Violation & Activity Feed</h2>
                <ul class="feed-list" id="activity-feed">
                    <li class="feed-item normal">
                        <span class="feed-time">[10:45 AM]</span> System starting up...
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default';

            // Fetch Activities
            try {
                const res = await fetch(`/api/agents/approvals/ledger?tenant_id=${tenantId}`, {
                    headers: {
                        'x-tenant-id': tenantId,
                        'x-user-id': 'default'
                    }
                });
                if (res.ok) {
                    const data = await res.json();
                    const feed = document.getElementById('activity-feed');
                    if (data.entries && data.entries.length > 0) {
                        feed.innerHTML = '';
                        data.entries.forEach(activity => {
                            let desc = 'Action completed';
                            try {
                                const p = typeof activity.payload === 'string' ? JSON.parse(activity.payload) : activity.payload;
                                desc = p?.original_payload?.description || desc;
                            } catch (e) {}

                            const isViolation = activity.event_type === 'violation' || activity.department === 'violation';

                            const li = document.createElement('li');
                            li.className = `feed-item ${isViolation ? 'violation' : 'normal'}`;
                            const time = new Date(activity.created_at).toLocaleTimeString();

                            li.innerHTML = `<span class="feed-time">[${time}]</span> ${desc} (${activity.department})`;
                            feed.appendChild(li);
                        });
                    }
                }
            } catch (e) {
                console.error("Failed to fetch ledger", e);
            }

        });
    </script>
    <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
