<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Dashboard</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        box-sizing: border-box;
      }
      .container {
        max-width: 400px;
        width: 100%;
        padding: 40px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .subtitle {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 30px;
      }
      .status-badge {
        display: inline-block;
        background-color: #e5e5ea;
        color: #1d1d1f;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      /* OHC Glassmorphism token */
      .ohc-growth-card {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #1d1d1f;
        border-radius: 12px;
        padding: 24px;
        margin-top: 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        .container {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
          background-color: #16161a;
        }
        h1 {
          color: #f5f5f7;
        }
        .subtitle {
          color: #a1a1a6;
        }
        .status-badge {
          background-color: #333336;
          color: #f5f5f7;
        }
        .ohc-growth-card {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #ffffff;
        }
      }

      .ohc-growth-card h2 {
        margin-top: 0;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .ohc-growth-card p {
        font-size: 14px;
        color: inherit;
        opacity: 0.8;
        margin-bottom: 20px;
        line-height: 1.4;
      }

      button {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 44px; /* touch target size */
      }
      button:hover {
        background-color: #0052cc;
      }
      button:active {
        transform: scale(0.98);
      }

      .link-container {
        display: none;
        margin-top: 15px;
      }
      .link-input {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.8);
      }
      @media (prefers-color-scheme: dark) {
        .link-input {
          border: 1px solid rgba(255, 255, 255, 0.2);
          background: rgba(0, 0, 0, 0.2);
          color: #fff;
        }
      }

      .action-buttons {
        display: flex;
        gap: 10px;
      }
      .btn-secondary {
        background-color: #e5e5ea;
        color: #1d1d1f;
        box-shadow: none;
      }
      .btn-secondary:hover {
        background-color: #d1d1d6;
      }
      @media (prefers-color-scheme: dark) {
        .btn-secondary {
          background-color: #333336;
          color: #f5f5f7;
        }
        .btn-secondary:hover {
          background-color: #48484a;
        }
      }

      /* Omnibox Modal Styles */
      #omnibox-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
        z-index: 1000;
        align-items: flex-start;
        justify-content: center;
        padding-top: 10vh;
      }
      #omnibox-modal {
        width: 100%;
        max-width: 600px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      @media (prefers-color-scheme: dark) {
        #omnibox-modal {
          background: rgba(28, 28, 30, 0.9);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
      }
      #omnibox-input {
        width: 100%;
        padding: 16px 20px;
        font-size: 18px;
        border: none;
        background: transparent;
        outline: none;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        #omnibox-input {
          color: #f5f5f7;
        }
      }
      #omnibox-results {
        max-height: 50vh;
        overflow-y: auto;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        #omnibox-results {
          border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
      }
      .omnibox-item {
        padding: 12px 20px;
        cursor: pointer;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        text-align: left;
      }
      @media (prefers-color-scheme: dark) {
        .omnibox-item {
          border-bottom: 1px solid rgba(255,255,255,0.05);
        }
      }
      .omnibox-item:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        .omnibox-item:hover {
          background: rgba(255, 255, 255, 0.05);
        }
      }
      .omnibox-title {
        font-weight: 600;
        font-size: 15px;
        color: #1d1d1f;
      }
      .omnibox-subtitle {
        font-size: 13px;
        color: #86868b;
      }
      .omnibox-type {
        float: right;
        font-size: 11px;
        background: #e5e5ea;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        .omnibox-title { color: #f5f5f7; }
        .omnibox-subtitle { color: #a1a1a6; }
        .omnibox-type { background: #333336; color: #f5f5f7; }
      }

    </style>

    <style>
      /* Walkthrough Styles */
      .ohc-walkthrough-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        z-index: 99998;
        display: none;
      }
      .ohc-walkthrough-highlight {
        position: fixed;
        z-index: 99999;
        border-radius: 8px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
        pointer-events: none; z-index: 99999;
        display: none;
        transition: all 0.3s ease;
        padding: 4px;
        margin: -4px;
      }
      .ohc-walkthrough-popover {
        pointer-events: auto !important; pointer-events: auto;
        position: fixed;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px) saturate(210%);
        -webkit-backdrop-filter: blur(20px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        z-index: 100000;
        display: none;
        flex-direction: column;
        transition: opacity 0.3s ease, transform 0.3s ease;
        opacity: 0;
        transform: translateY(10px);
      }
      .ohc-walkthrough-popover.visible {
        display: flex;
        opacity: 1;
        transform: translateY(0);
      }
      .ohc-walkthrough-header {
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 8px;
        color: #1d1d1f;
      }
      .ohc-walkthrough-content {
        font-size: 14px;
        color: #86868b;
        margin-bottom: 20px;
        line-height: 1.4;
      }
      .ohc-walkthrough-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .ohc-walkthrough-steps {
        font-size: 12px;
        color: #86868b;
      }
      .ohc-walkthrough-buttons {
        display: flex;
        gap: 8px;
      }
      .ohc-walkthrough-buttons button {
        padding: 6px 12px;
        border-radius: 16px;
        border: none;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .ohc-walkthrough-btn-close {
        background: none;
        color: #86868b;
      }
      .ohc-walkthrough-btn-next {
        background: #0066FF;
        color: white;
      }
      #start-tour-btn {
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid #0066FF;
        background: transparent;
        color: #0066FF;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s, color 0.2s;
      }
      #start-tour-btn:hover {
        background: #0066FF;
        color: white;
      }
      @media (max-width: 375px) {
        .ohc-walkthrough-popover {
          width: calc(100vw - 40px);
          left: 20px;
        }
      }
      @media (prefers-color-scheme: dark) {
        .ohc-walkthrough-popover {
          background: rgba(22, 22, 26, 0.95);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .ohc-walkthrough-header { color: #f5f5f7; }
        .ohc-walkthrough-btn-close { color: #f5f5f7; }
      }
    </style>

  </head>
  <body>
    <!-- Omnibox Modal -->
    <div id="omnibox-overlay">
      <div id="omnibox-modal" onclick="event.stopPropagation()">
        <input type="text" id="omnibox-input" placeholder="Search customers, orders, messages... (Cmd+K)" autocomplete="off" />
        <div id="omnibox-results"></div>
      </div>
    </div>

    <div class="container">
      <div class="status-badge">🟢 Standalone Mode (Zero Data Leakage)</div>

      <h1 id="dashboard-title">Dashboard</h1>
      <div class="subtitle">Your private agentic workspace.</div>
      <button id="start-tour-btn">Start Tour</button>

      <div class="ohc-growth-card">
        <h2>Grow Your Team</h2>
        <p>Bridge your local sovereignty with cloud-native collaboration. Invite a team member to view agents in a secure cloud tenant.</p>

        <button id="generate-link-btn" data-tooltip="Click here to share access with a team member.">Get My Invite Link</button>

        <div class="link-container" id="link-container">
          <input type="text" class="link-input" id="referral-link" readonly value="" />
          <div class="action-buttons">
            <button class="btn-secondary" id="copy-btn" data-tooltip="Copy the referral link to your clipboard.">Copy</button>
            <button class="btn-secondary" id="share-whatsapp-btn">Share on WhatsApp</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const name = localStorage.getItem('businessName');
      if (name) {
          document.getElementById('dashboard-title').innerText = `${name} Dashboard`;
      }

      const generateBtn = document.getElementById('generate-link-btn');
      const linkContainer = document.getElementById('link-container');
      const copyBtn = document.getElementById('copy-btn');
      const referralLink = document.getElementById('referral-link');

      generateBtn.addEventListener('click', () => {
        generateBtn.innerText = "Generating...";
        // Call the real Tauri backend
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("generate_cloud_invite").then((link) => {
            referralLink.value = link;
            generateBtn.style.display = 'none';
            linkContainer.style.display = 'block';
          }).catch((err) => {
            console.error(err);
            referralLink.value = "https://cloud.ohc.network/invite/fallback";
            generateBtn.style.display = 'none';
            linkContainer.style.display = 'block';
          });
        } else {
          // Playwright mock environment fallback if Tauri API isn't injected
          referralLink.value = "https://cloud.ohc.network/invite/test-" + Date.now();
          generateBtn.style.display = 'none';
          linkContainer.style.display = 'block';
        }
      });

      copyBtn.addEventListener('click', () => {
        referralLink.select();
        document.execCommand('copy');
        copyBtn.innerText = "Copied!";
        setTimeout(() => {
          copyBtn.innerText = "Copy";
        }, 2000);
      });

      const shareWhatsAppBtn = document.getElementById('share-whatsapp-btn');
      shareWhatsAppBtn.addEventListener('click', () => {
        const link = referralLink.value;
        const text = `Join my team on OHC! Here is your invite link:\n\n${link}\n\n⚡ Powered by OHC`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      });

      // Omnibox logic
      const omniboxOverlay = document.getElementById('omnibox-overlay');
      const omniboxInput = document.getElementById('omnibox-input');
      const omniboxResults = document.getElementById('omnibox-results');
      let omniboxTimer = null;

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          if (omniboxOverlay.style.display === 'flex') {
            omniboxOverlay.style.display = 'none';
          } else {
            omniboxOverlay.style.display = 'flex';
            omniboxInput.focus();
            omniboxInput.value = '';
            omniboxResults.innerHTML = '<div style="padding: 20px; text-align: center; color: #86868b;">Type to search your workspace</div>';
          }
        } else if (e.key === 'Escape' && omniboxOverlay.style.display === 'flex') {
          omniboxOverlay.style.display = 'none';
        }
      });

      omniboxOverlay.addEventListener('click', () => {
        omniboxOverlay.style.display = 'none';
      });

      omniboxInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        if (!query) {
          omniboxResults.innerHTML = '<div style="padding: 20px; text-align: center; color: #86868b;">Type to search your workspace</div>';
          return;
        }

        clearTimeout(omniboxTimer);
        omniboxTimer = setTimeout(async () => {
          try {
            // For Tauri app, fallback to local fetch if API not injected directly
            // Adjust port if necessary, typically 18789 for Tauri dev server
            let url = `/api/v1/search?q=${encodeURIComponent(query)}`;
            if (window.__TAURI__ === undefined && location.protocol === 'file:') {
               url = `http://localhost:18789/api/v1/search?q=${encodeURIComponent(query)}`;
            }
            const res = await fetch(url);
            const data = await res.json();

            if (data.success && data.results && data.results.length > 0) {
              omniboxResults.innerHTML = data.results.map(item => `
                <div class="omnibox-item" onclick="alert('Navigating to ${item.route}'); document.getElementById('omnibox-overlay').style.display='none';">
                  <div class="omnibox-type">${item.entity_type}</div>
                  <div class="omnibox-title">${item.title}</div>
                  <div class="omnibox-subtitle">${item.subtitle}</div>
                </div>
              `).join('');
            } else {
              omniboxResults.innerHTML = `<div style="padding: 20px; text-align: center; color: #86868b;">No results found for "${query}"</div>`;
            }
          } catch (err) {
            console.error(err);
            omniboxResults.innerHTML = '<div style="padding: 20px; text-align: center; color: #86868b;">Error fetching results.</div>';
          }
        }, 300);
      });

    </script>
    <script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.85);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    let hideTimeout;

    function showTooltip(e, text) {
        clearTimeout(hideTimeout);
        tooltipEl.textContent = text;

        const targetRect = e.target.getBoundingClientRect();

        // Position below the element by default
        let top = targetRect.bottom + 10;
        let left = targetRect.left + (targetRect.width / 2) - (tooltipEl.offsetWidth / 2);

        // Adjust if it goes off screen
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        if (top + tooltipEl.offsetHeight > window.innerHeight - 10) {
            // Position above if it doesn't fit below
            top = targetRect.top - tooltipEl.offsetHeight - 10;
        }

        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        hideTimeout = setTimeout(() => {
            tooltipEl.classList.remove('visible');
        }, 100); // slight delay to prevent flicker
    }

    // Desktop hover
    document.addEventListener('mouseover', (e) => {
        const target = e.target.closest('[data-tooltip]');
        if (target) {
            showTooltip(e, target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        if (e.target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const target = e.target.closest('[data-tooltip]');
        if (target) {
            touchTimeout = setTimeout(() => {
                showTooltip(e, target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});

</script>

    `;
    document.head.appendChild(style);

    // Inject HTML
    const btn = document.createElement('button');
    btn.id = 'ohc-help-btn';
    btn.setAttribute('aria-label', 'Open help chat');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
    document.body.appendChild(btn);

    const overlay = document.createElement('div');
    overlay.id = 'ohc-help-chat-overlay';
    overlay.innerHTML = `
        <div id="ohc-help-chat-header">
            <h3>Ask AI Help</h3>
            <button id="ohc-help-close" aria-label="Close help chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="ohc-help-messages">
            <div class="msg msg-ai">Hi! I am your AI Help Agent! How can I assist you with OHC today?</div>
        </div>
        <div id="ohc-help-input-area">
            <input type="text" id="ohc-help-input" placeholder="Ask me anything..." />
            <button id="ohc-help-send" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    `;
    document.body.appendChild(overlay);

    const closeBtn = document.getElementById('ohc-help-close');
    const messages = document.getElementById('ohc-help-messages');
    const input = document.getElementById('ohc-help-input');
    const sendBtn = document.getElementById('ohc-help-send');

    btn.addEventListener('click', () => {
        overlay.style.display = 'flex';
        input.focus();
    });

    closeBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
    });

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        // Add user msg
        const uMsg = document.createElement('div');
        uMsg.className = 'msg msg-user';
        uMsg.textContent = text;
        messages.appendChild(uMsg);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        // Fake AI response based on tests and common queries
        setTimeout(() => {
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg msg-ai';

            if (text.toLowerCase().includes('credit card') || text.toLowerCase().includes('pay')) {
                aiMsg.innerHTML = `You can accept credit cards by connecting your bank account in the Payments section.<br/><a href="help_article.html?id=payments">Read the full article →</a>`;
            } else {
                aiMsg.innerHTML = `I can help you with that! Check out our Help Center for a detailed guide.<br/><a href="help.html">Read the full article →</a>`;
            }

            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
        }, 800);
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});

</script>

    <!-- Walkthrough Elements -->
    <div class="ohc-walkthrough-overlay" id="ohc-walkthrough-overlay"></div>
    <div class="ohc-walkthrough-highlight" id="ohc-walkthrough-highlight"></div>
    <div class="ohc-walkthrough-popover" id="ohc-walkthrough-popover">
      <div class="ohc-walkthrough-header" id="ohc-walkthrough-header">Title</div>
      <div class="ohc-walkthrough-content" id="ohc-walkthrough-content">Content goes here.</div>
      <div class="ohc-walkthrough-footer">
        <span class="ohc-walkthrough-steps" id="ohc-walkthrough-steps">1 of 3</span>
        <div class="ohc-walkthrough-buttons">
          <button class="ohc-walkthrough-btn-close" id="ohc-walkthrough-btn-close">Skip</button>
          <button class="ohc-walkthrough-btn-next" id="ohc-walkthrough-btn-next">Next</button>
        </div>
      </div>
    </div>


<script>
document.addEventListener('DOMContentLoaded', () => {
    const steps = [
        {
            target: '.ohc-growth-card',
            title: 'Set up your store',
            content: 'Follow the 10-Minute Setup Wizard to build your storefront, add products, and configure your basic settings.'
        },
        {
            target: '#generate-link-btn',
            title: 'Invite your Team',
            content: 'Click here to generate a secure link to invite team members to this workspace.'
        },
        {
            target: '#ohc-help-btn',
            title: 'Activate your AI Support Agent',
            content: 'Need help or want to activate your AI support bot? Click here to manage your AI agents.'
        }
    ];

    let currentStep = 0;
    const overlay = document.getElementById('ohc-walkthrough-overlay');
    const highlight = document.getElementById('ohc-walkthrough-highlight');
    const popover = document.getElementById('ohc-walkthrough-popover');
    const header = document.getElementById('ohc-walkthrough-header');
    const content = document.getElementById('ohc-walkthrough-content');
    const stepCounter = document.getElementById('ohc-walkthrough-steps');
    const btnClose = document.getElementById('ohc-walkthrough-btn-close');
    const btnNext = document.getElementById('ohc-walkthrough-btn-next');
    const startTourBtn = document.getElementById('start-tour-btn');

    function positionPopover(targetEl) {
        const rect = targetEl.getBoundingClientRect();

        // Setup highlight
        highlight.style.display = 'block';
        highlight.style.top = rect.top + 'px';
        highlight.style.left = rect.left + 'px';
        highlight.style.width = rect.width + 'px';
        highlight.style.height = rect.height + 'px';

        // Position popover (default to below)
        let top = rect.bottom + 15;
        let left = rect.left + (rect.width / 2) - 150; // Center popover (300px width / 2)

        // Adjust bounds
        if (left < 10) left = 10;
        if (left + 300 > window.innerWidth - 10) left = window.innerWidth - 310;

        if (top + 150 > window.innerHeight) {
            // Flip to above if no room below
            top = rect.top - 150 - 15;
        }

        // Apply media query overrides for mobile
        if (window.innerWidth <= 400) {
             left = Math.max(10, (window.innerWidth - 300) / 2);
             top = rect.bottom + 15;
             if (top + 150 > window.innerHeight) {
                top = rect.top - 150 - 15;
             }
        }

        popover.style.top = top + 'px';
        popover.style.left = left + 'px';
    }

    function showStep(index) {
        if (index < 0 || index >= steps.length) {
            endWalkthrough();
            return;
        }

        const step = steps[index];
        const targetEl = document.querySelector(step.target);

        if (!targetEl) {
            console.warn('Walkthrough target not found:', step.target);
            showStep(index + 1);
            return;
        }

        header.textContent = step.title;
        content.textContent = step.content;
        stepCounter.textContent = `${index + 1} of ${steps.length}`;

        if (index === steps.length - 1) {
            btnNext.textContent = 'Finish';
        } else {
            btnNext.textContent = 'Next';
        }

        targetEl.scrollIntoView({ block: 'center' });

        setTimeout(() => {
            positionPopover(targetEl);
            popover.classList.add('visible');
        }, 300);
    }

    function startWalkthrough() {
        currentStep = 0;
        overlay.style.display = 'block';
        showStep(currentStep);
    }

    function endWalkthrough() {
        overlay.style.display = 'none';
        highlight.style.display = 'none';
        popover.classList.remove('visible');
    }

    if (startTourBtn) {
        startTourBtn.addEventListener('click', startWalkthrough);
    }

    btnClose.addEventListener('click', endWalkthrough);

    btnNext.addEventListener('click', () => {
        popover.classList.remove('visible');
        setTimeout(() => {
            currentStep++;
            showStep(currentStep);
        }, 300);
    });

    window.addEventListener('resize', () => {
        if (popover.classList.contains('visible')) {
            const targetEl = document.querySelector(steps[currentStep].target);
            if (targetEl) positionPopover(targetEl);
        }
    });
});
</script>
