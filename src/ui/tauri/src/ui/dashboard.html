<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Dashboard</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        box-sizing: border-box;
      }
      .omnibox-wrapper {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 600px;
        z-index: 1000;
        padding: 0 20px;
        box-sizing: border-box;
      }
      .omnibox-container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .omnibox-input {
        width: 100%;
        padding: 16px 20px;
        font-size: 16px;
        border: none;
        background: transparent;
        color: #1d1d1f;
        box-sizing: border-box;
        outline: none;
      }
      .omnibox-results {
        display: none;
        max-height: 400px;
        overflow-y: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        padding: 8px;
      }
      .omnibox-result-item {
        padding: 12px 16px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-decoration: none;
        color: inherit;
      }
      .omnibox-result-item:hover, .omnibox-result-item.active {
        background: rgba(0, 102, 255, 0.1);
      }
      .result-title {
        font-weight: 600;
        font-size: 14px;
        color: #1d1d1f;
      }
      .result-subtitle {
        font-size: 12px;
        color: #86868b;
      }
      .result-type {
        align-self: flex-start;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 2px 6px;
        background: rgba(0,0,0,0.05);
        border-radius: 4px;
        color: #86868b;
        margin-bottom: 2px;
      }

      .container {
        max-width: 400px;
        width: 100%;
        padding: 40px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        margin-top: 100px;
      }
      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .subtitle {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 30px;
      }
      .status-badge {
        display: inline-block;
        background-color: #e5e5ea;
        color: #1d1d1f;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      /* OHC Glassmorphism token */
      .ohc-growth-card {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #1d1d1f;
        border-radius: 12px;
        padding: 24px;
        margin-top: 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        .container, .omnibox-container {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
          background-color: #16161a;
        }
        h1, .omnibox-input, .result-title {
          color: #f5f5f7;
        }
        .subtitle, .result-subtitle {
          color: #a1a1a6;
        }
        .status-badge {
          background-color: #333336;
          color: #f5f5f7;
        }
        .ohc-growth-card {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #ffffff;
        }
        .omnibox-results {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .result-type {
            background: rgba(255,255,255,0.1);
            color: #a1a1a6;
        }
      }

      .ohc-growth-card h2 {
        margin-top: 0;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .ohc-growth-card p {
        font-size: 14px;
        color: inherit;
        opacity: 0.8;
        margin-bottom: 20px;
        line-height: 1.4;
      }

      button {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 44px; /* touch target size */
      }
      button:hover {
        background-color: #0052cc;
      }
      button:active {
        transform: scale(0.98);
      }

      .link-container {
        display: none;
        margin-top: 15px;
      }
      .link-input {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.8);
      }
      @media (prefers-color-scheme: dark) {
        .link-input {
          border: 1px solid rgba(255, 255, 255, 0.2);
          background: rgba(0, 0, 0, 0.2);
          color: #fff;
        }
      }

      .action-buttons {
        display: flex;
        gap: 10px;
      }
      .btn-secondary {
        background-color: #e5e5ea;
        color: #1d1d1f;
        box-shadow: none;
      }
      .btn-secondary:hover {
        background-color: #d1d1d6;
      }
      @media (prefers-color-scheme: dark) {
        .btn-secondary {
          background-color: #333336;
          color: #f5f5f7;
        }
        .btn-secondary:hover {
          background-color: #48484a;
        }
      }
    </style>
  </head>
  <body>
    <div class="omnibox-wrapper">
        <div class="omnibox-container" id="omnibox">
            <input type="text" class="omnibox-input" id="omnibox-input" placeholder="Search customers, orders, messages... (Cmd+K)" autocomplete="off">
            <div class="omnibox-results" id="omnibox-results">
            </div>
        </div>
    </div>

    <div class="container">
      <div class="status-badge">🟢 Standalone Mode (Zero Data Leakage)</div>

      <h1 id="dashboard-title">Dashboard</h1>
      <div class="subtitle">Your private agentic workspace.</div>

      <div class="ohc-growth-card">
        <h2>Grow Your Team</h2>
        <p>Bridge your local sovereignty with cloud-native collaboration. Invite a team member to view agents in a secure cloud tenant.</p>

        <button id="generate-link-btn">Get My Invite Link</button>

        <div class="link-container" id="link-container">
          <input type="text" class="link-input" id="referral-link" readonly value="" />
          <div class="action-buttons">
            <button class="btn-secondary" id="copy-btn">Copy</button>
            <button class="btn-secondary" id="share-whatsapp-btn">Share on WhatsApp</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const name = localStorage.getItem('businessName');
      if (name) {
          document.getElementById('dashboard-title').innerText = `${name} Dashboard`;
      }

      const generateBtn = document.getElementById('generate-link-btn');
      const linkContainer = document.getElementById('link-container');
      const copyBtn = document.getElementById('copy-btn');
      const referralLink = document.getElementById('referral-link');

      generateBtn.addEventListener('click', () => {
        generateBtn.innerText = "Generating...";
        // Call the real Tauri backend
        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("generate_cloud_invite").then((link) => {
            referralLink.value = link;
            generateBtn.style.display = 'none';
            linkContainer.style.display = 'block';
          }).catch((err) => {
            console.error(err);
            referralLink.value = "https://cloud.ohc.network/invite/fallback";
            generateBtn.style.display = 'none';
            linkContainer.style.display = 'block';
          });
        } else {
          // Playwright mock environment fallback if Tauri API isn't injected
          referralLink.value = "https://cloud.ohc.network/invite/test-" + Date.now();
          generateBtn.style.display = 'none';
          linkContainer.style.display = 'block';
        }
      });

      copyBtn.addEventListener('click', () => {
        referralLink.select();
        document.execCommand('copy');
        copyBtn.innerText = "Copied!";
        setTimeout(() => {
          copyBtn.innerText = "Copy";
        }, 2000);
      });

      const shareWhatsAppBtn = document.getElementById('share-whatsapp-btn');
      shareWhatsAppBtn.addEventListener('click', () => {
        const link = referralLink.value;
        const text = `Join my team on OHC! Here is your invite link:\n\n${link}\n\n⚡ Powered by OHC`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      });

      // Omnibox logic
      const omniboxInput = document.getElementById('omnibox-input');
      const omniboxResults = document.getElementById('omnibox-results');
      let searchTimeout;

      // Global shortcut Cmd+K or Ctrl+K
      document.addEventListener('keydown', (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
              e.preventDefault();
              omniboxInput.focus();
          }
      });

      // Hide results on outside click
      document.addEventListener('click', (e) => {
          if (!document.getElementById('omnibox').contains(e.target)) {
              omniboxResults.style.display = 'none';
          }
      });

      omniboxInput.addEventListener('focus', () => {
          if (omniboxInput.value.trim().length > 0) {
              omniboxResults.style.display = 'block';
          }
      });

      omniboxInput.addEventListener('input', (e) => {
          const query = e.target.value.trim();

          if (query.length === 0) {
              omniboxResults.style.display = 'none';
              return;
          }

          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
              performSearch(query);
          }, 300); // Debounce 300ms
      });

      async function performSearch(query) {
          try {
              // Get auth token if available in local storage
              // In this standalone/Tauri mode, you might not have a bearer token,
              // but the backend will accept requests if authenticated via session.
              // Adjust this fetch call if your Tauri app requires specific auth headers.
              const response = await fetch(`/api/v1/search?q=${encodeURIComponent(query)}`);

              if (!response.ok) {
                  console.error("Search failed:", response.statusText);
                  return;
              }

              const data = await response.json();
              renderResults(data.results);
          } catch (err) {
              console.error("Error fetching search results:", err);
          }
      }

      function renderResults(results) {
          omniboxResults.innerHTML = '';

          if (!results || results.length === 0) {
              omniboxResults.innerHTML = '<div class="omnibox-result-item"><span class="result-title">No results found</span></div>';
          } else {
              results.forEach(res => {
                  const item = document.createElement('a');
                  item.className = 'omnibox-result-item';
                  item.href = res.url;

                  let html = `<span class="result-type">${res.type}</span>`;
                  html += `<span class="result-title">${res.title}</span>`;
                  if (res.subtitle) {
                      html += `<span class="result-subtitle">${res.subtitle}</span>`;
                  }
                  if (res.snippet) {
                      html += `<span class="result-subtitle"><em>${res.snippet}</em></span>`;
                  }

                  item.innerHTML = html;
                  omniboxResults.appendChild(item);
              });
          }

          omniboxResults.style.display = 'block';
      }
    </script>
  </body>
</html>
