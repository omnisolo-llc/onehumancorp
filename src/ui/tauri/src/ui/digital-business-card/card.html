<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Business Card</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f9fafb; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card-container { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 30px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #0066FF; color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; }
    h1 { margin: 0 0 5px; font-size: 24px; color: #111827; }
    .title { color: #6b7280; font-size: 16px; margin-bottom: 5px; }
    .company { color: #4b5563; font-weight: 500; margin-bottom: 20px; }
    .contact-info { background: #f3f4f6; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: left; }
    .contact-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 15px; color: #374151; }
    .contact-item:last-child { margin-bottom: 0; }
    .contact-item svg { width: 20px; height: 20px; margin-right: 10px; color: #6b7280; }
    .btn-save { background-color: #0066FF; color: white; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; display: block; box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39); }
    .viral-footer { margin-top: auto; text-align: center; padding: 20px 0; }
    .viral-footer p { margin: 0 0 10px; color: #6b7280; font-size: 14px; }
    .viral-footer a { color: #0066FF; text-decoration: none; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="avatar" id="avatar-initial">C</div>
    <h1 id="card-name">Name</h1>
    <div class="title" id="card-title">Title</div>
    <div class="company" id="card-company">Company</div>

    <div class="contact-info">
      <div class="contact-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        <span id="card-phone">Phone</span>
      </div>
    </div>

    <button class="btn-save" id="save-btn">Save to Contacts</button>
  </div>

  <div class="viral-footer">
    <p>Create your own free digital business card</p>
    <a href="/setup.html">⚡ Powered by OHC</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get('n') || 'Jane Doe';
      const title = urlParams.get('t') || 'Founder & CEO';
      const company = urlParams.get('c') || 'Acme Corp';
      const phone = urlParams.get('p') || '+1 (555) 123-4567';
      const hideBranding = urlParams.get('h') === '1';

      document.getElementById('card-name').textContent = name;
      document.getElementById('card-title').textContent = title;
      document.getElementById('card-company').textContent = company;
      document.getElementById('card-phone').textContent = phone;
      document.getElementById('avatar-initial').textContent = name.charAt(0).toUpperCase();

      if (hideBranding) {
        document.querySelector('.viral-footer').style.display = 'none';
      }

      document.getElementById('save-btn').addEventListener('click', () => {
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nN:${name.split(' ').reverse().join(';')};;;\nFN:${name}\nORG:${company}\nTITLE:${title}\nTEL;TYPE=WORK,VOICE:${phone}\nEND:VCARD`;
        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name.replace(/\s+/g, '_')}.vcf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    });
  </script>
</body>
</html>
