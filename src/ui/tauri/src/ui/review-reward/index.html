<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leave a Review</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1d1d1f;
    }
    .widget-container {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }
    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .stars {
      font-size: 36px;
      color: #d1d5db;
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .stars span {
      transition: color 0.2s, transform 0.1s;
    }
    .stars span:hover {
      transform: scale(1.1);
    }
    .stars span.active {
      color: #fbbf24;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      margin-bottom: 20px;
      box-sizing: border-box;
      background: #f9fafb;
      color: #111827;
      resize: vertical;
      min-height: 100px;
      font-size: 14px;
      display: none;
    }
    textarea:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      display: none;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:active {
        transform: scale(0.98);
    }
    .branding {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
    .branding a {
      color: #9ca3af;
      text-decoration: none;
      font-weight: 600;
    }
    .branding a:hover {
      color: #6b7280;
    }
    #success-state {
      display: none;
    }
    .reward-box {
      background: rgba(16, 185, 129, 0.1);
      border: 2px dashed #10b981;
      padding: 16px;
      border-radius: 8px;
      color: #10b981;
      font-weight: 700;
      margin: 20px 0;
      font-size: 18px;
      word-break: break-all;
    }
    @media (prefers-color-scheme: dark) {
        .widget-container {
            background: #1f2937;
            border-color: #374151;
        }
        h2 { color: #f9fafb; }
        p { color: #9ca3af; }
        textarea {
            background: #111827;
            border-color: #374151;
            color: #f9fafb;
        }
    }
  </style>
</head>
<body>
  <div class="widget-container" id="main-card">
    <h2 id="display-title">How was your experience?</h2>
    <p id="display-desc">Leave a 5-star review and unlock your special reward!</p>

    <div class="stars" id="star-rating">
      <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
    </div>

    <textarea id="review-text" placeholder="Tell us what you loved..."></textarea>
    <button id="submit-btn">Submit Review</button>

    <div id="success-state">
      <div style="font-size: 48px; margin-bottom: 10px;">🎉</div>
      <h2 style="color: #10b981;">Thank you!</h2>
      <p>Here is your unique referral link to claim your reward:</p>
      <div class="reward-box" id="reward-link">Generating...</div>
      <button id="copy-btn" style="display: block; background-color: #10b981;">Copy Link</button>
    </div>

    <div class="branding" id="branding-footer">
      <a href="/onboarding?ref=review_reward&source=viral_widget" target="_blank" id="branding-link">⚡ Powered by OHC</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const desc = params.get('desc');
        const tenant = params.get('tenant') || 'e2e-tenant';
        const hideBranding = params.get('hideBranding') === 'true';

        if (title) document.getElementById('display-title').textContent = title;
        if (desc) document.getElementById('display-desc').innerHTML = desc;

        const brandingLink = document.getElementById('branding-link');
        if (hideBranding) {
            document.getElementById('branding-footer').style.display = 'none';
        } else {
            brandingLink.href = `/api/v1/growth/referrals/click?target=/onboarding&ref=${encodeURIComponent(tenant)}&source=review_reward`;
        }

        const stars = document.querySelectorAll('.stars span');
        const textarea = document.getElementById('review-text');
        const submitBtn = document.getElementById('submit-btn');
        let currentRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                currentRating = parseInt(e.target.dataset.val);
                stars.forEach((s, idx) => {
                    if (idx < currentRating) s.classList.add('active');
                    else s.classList.remove('active');
                });
                textarea.style.display = 'block';
                submitBtn.style.display = 'block';
            });
        });

        submitBtn.addEventListener('click', async () => {
            if (currentRating === 0) return;

            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;

            try {
                // Determine base URL, works for local dev or production
                let baseUrl = window.location.origin;
                if (window.location.protocol === 'file:') {
                    baseUrl = 'http://127.0.0.1:18789';
                }

                const res = await fetch(`${baseUrl}/api/v1/growth/review-reward/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenant: tenant, rating: currentRating, text: textarea.value })
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('star-rating').style.display = 'none';
                    textarea.style.display = 'none';
                    submitBtn.style.display = 'none';
                    document.getElementById('display-title').style.display = 'none';
                    document.getElementById('display-desc').style.display = 'none';

                    document.getElementById('success-state').style.display = 'block';
                    document.getElementById('reward-link').textContent = data.referral_link;
                } else {
                    throw new Error("Failed to submit");
                }
            } catch (err) {
                console.error(err);
                submitBtn.textContent = 'Error. Try again';
                submitBtn.disabled = false;
            }
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const link = document.getElementById('reward-link').textContent;
            navigator.clipboard.writeText(link).then(() => {
                document.getElementById('copy-btn').textContent = 'Copied!';
                setTimeout(() => document.getElementById('copy-btn').textContent = 'Copy Link', 2000);
            });
        });
    });
  </script>
</body>
</html>
