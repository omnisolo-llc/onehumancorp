<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent Feed</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #F2F2F7; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .feed-container { width: 100%; max-width: 375px; }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 16px;
      margin-bottom: 16px;
    }
    .triage-card h3 { margin-top: 0; font-size: 16px; color: #1C1C1E; }
    .triage-card p { font-size: 14px; color: #3A3A3C; margin-bottom: 16px; }
    .button-group { display: flex; gap: 8px; justify-content: flex-end; }
    button { border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-approve { background: #007AFF; color: white; }
    .btn-edit { background: #E5E5EA; color: #1C1C1E; }
    .btn-discard { background: #FF3B30; color: white; }
    .empty-state { text-align: center; color: #8E8E93; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="feed-container" id="feed">
    <div id="loading" class="empty-state">Loading agent feed...</div>
  </div>

  <script>
    async function fetchFeed() {
      try {
        const response = await fetch('/api/ui/triage');
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        renderFeed(data.items || []);
      } catch (err) {
        document.getElementById('feed').innerHTML = `<div class="empty-state" data-testid="triage-feed-empty">Caught up for now. No new actions.</div>`;
      }
    }

    function renderFeed(items) {
      const feed = document.getElementById('feed');
      if (items.length === 0) {
        feed.innerHTML = `<div class="empty-state" data-testid="triage-feed-empty">Caught up for now. No new actions.</div>`;
        return;
      }

      feed.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glassmorphism triage-card';
        card.setAttribute('data-testid', `triage-card-${item.id}`);

        let draftText = "Action required";
        if (item.action_payload && item.action_payload.draft) draftText = item.action_payload.draft;
        else if (item.action_payload && typeof item.action_payload === 'string') draftText = item.action_payload;
        else if (item.context) draftText = item.context;

        card.innerHTML = `
          <h3>${item.source || 'Task'}</h3>
          <p>${draftText}</p>
          <div class="button-group">
            <button class="btn-discard" data-testid="triage-dismiss-${item.id}" onclick="handleAction('${item.id}', 'discard')">Discard</button>
            <button class="btn-edit" onclick="handleAction('${item.id}', 'edit')">Edit</button>
            <button class="btn-approve" data-testid="triage-approve-${item.id}" onclick="handleAction('${item.id}', 'approve')">Approve</button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    async function handleAction(id, action) {
      // Optimistic update
      const card = document.querySelector(`[data-testid="triage-card-${id}"]`);
      if (card) card.remove();

      if (document.querySelectorAll('.triage-card').length === 0) {
        document.getElementById('feed').innerHTML = `<div class="empty-state" data-testid="triage-feed-empty">Caught up for now. No new actions.</div>`;
      }

      await fetch('/api/ui/triage/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ triage_item_id: id, action: action === 'approve' ? 'COMPLETED' : 'DISMISSED' })
      });
    }

    fetchFeed();
  </script>
</body>
</html>
