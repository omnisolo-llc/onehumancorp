<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spin to Win Generator | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
        --bg-color: #f5f5f7;
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.65);
        --card-border: rgba(255, 255, 255, 0.4);
        --primary: #0066FF;
        --primary-hover: #0052cc;
        --input-bg: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #16161a;
            --text-color: #f5f5f7;
            --card-bg: rgba(22, 22, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(32, 32, 36, 0.8);
        }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
      background: var(--card-bg);
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid var(--card-border);
    }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(134, 134, 139, 0.3);
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: "Inter", sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }

    code {
      display: block;
      background: rgba(0,0,0,0.05);
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      white-space: pre-wrap;
      color: var(--text-color);
      margin-bottom: 15px;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }

    .back-link:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container glassmorphism">
    <div style="font-size: 48px; text-align: center; margin-bottom: 10px;">🎡</div>
    <h1>Spin to Win Generator</h1>
    <h2>Widget Configuration</h2>

    <div>
      <label for="campaign-name">Campaign Name</label>
      <input type="text" id="campaign-name" placeholder="e.g. Summer Spin to Win" value="Summer Spin to Win" />
    </div>

    <div>
      <label for="reward">Main Reward</label>
      <input type="text" id="reward" placeholder="e.g. 20% Off" value="20% Off" />
    </div>

    <button id="generate-btn">Generate Widget</button>

    <div id="result-area">
      <h2>Embed Spin to Win</h2>
      <code id="embed-code"></code>
    </div>
  </div>

  <a href="/dashboard" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
      const campaign = document.getElementById('campaign-name').value.trim() || 'Summer Spin to Win';
      const reward = document.getElementById('reward').value.trim() || '20% Off';
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default-tenant';

      const origin = window.location.origin;
      const widgetUrl = `${origin}/api/v1/growth/spin-to-win/embed?tenant=${encodeURIComponent(tenantId)}&campaign=${encodeURIComponent(campaign)}&reward=${encodeURIComponent(reward)}`;

      const code = `<div class="ohc-spin-to-win-widget">
  <iframe src="${widgetUrl}" width="100%" height="400" style="border:none;border-radius:16px;overflow:hidden;" title="Spin To Win"></iframe>
  <div style="text-align: center; font-size: 12px; margin-top: 8px;">
    <a href="${origin}/api/v1/growth/referrals/click?target=/onboarding&ref=${encodeURIComponent(tenantId)}" target="_blank" style="color: #6b7280; text-decoration: none; font-weight: 600;">⚡ Powered by OHC</a>
  </div>
</div>`;

      document.getElementById('embed-code').innerText = code;
      document.getElementById('result-area').style.display = 'block';
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
