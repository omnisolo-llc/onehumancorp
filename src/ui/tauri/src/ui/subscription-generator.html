<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe & Save AI Generator - OHC</title>
  <style>
    :root {
      --primary: #0066FF;
      --bg-color: #f5f5f7;
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --border-color: rgba(0, 0, 0, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #0A84FF;
        --bg-color: #000000;
        --text-main: #f5f5f7;
        --text-muted: #86868b;
        --border-color: rgba(255, 255, 255, 0.1);
        --glass-bg: rgba(22, 22, 26, 0.7);
      }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 30px;
      margin-top: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      font-size: 16px;
      box-sizing: border-box;
      min-height: 44px; /* Touch target */
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background-color 0.2s;
      min-height: 44px; /* Touch target */
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .preview-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      .preview-box {
        background: rgba(255, 255, 255, 0.05);
      }
    }

    .preview-box h3 {
      margin-top: 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
    }

    .back-link {
        text-decoration: none;
        color: var(--primary);
        font-weight: 600;
        font-size: 14px;
        display: inline-block;
        margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <div class="container glassmorphism">
    <h1>Subscribe & Save Campaign</h1>
    <p>Convert one-time buyers into recurring revenue. Our AI will draft a personalized offer for customers who recently purchased a consumable item.</p>

    <div class="form-group">
      <label for="product-name">Product Name</label>
      <input type="text" id="product-name" placeholder="e.g. Organic Coffee Beans">
    </div>

    <div class="form-group">
      <label for="discount">Discount Percentage</label>
      <input type="number" id="discount" value="15" min="1" max="100">
    </div>

    <div class="form-group">
      <label for="frequency">Delivery Frequency</label>
      <select id="frequency">
        <option value="weekly">Weekly</option>
        <option value="bi-weekly">Bi-weekly</option>
        <option value="monthly" selected>Monthly</option>
      </select>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="brand-link" checked>
      <label for="brand-link" style="margin-bottom: 0;">Include 'Powered by OHC' branding link (Earn referral credits)</label>
    </div>

    <button id="generate-btn" class="btn-primary">Generate AI Campaign</button>

    <div id="preview-box" class="preview-box">
      <h3>Draft Preview</h3>
      <pre id="preview-text"></pre>
      <button id="send-btn" class="btn-primary" style="margin-top: 16px;">Send Campaign</button>
      <p id="success-msg" style="color: #34C759; margin-top: 12px; font-weight: 500; display: none;">Campaign sent successfully!</p>
    </div>
  </div>

  <script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const btn = document.getElementById('generate-btn');
      btn.innerText = 'Generating...';
      btn.disabled = true;

      const payload = {
        product_name: document.getElementById('product-name').value || undefined,
        discount_percentage: document.getElementById('discount').value || undefined,
        frequency: document.getElementById('frequency').value || undefined,
        store_name: "Your Store", // Ideally fetched from state
        brand_link: document.getElementById('brand-link').checked
      };

      try {
        const res = await fetch('/api/v1/growth/campaign/generate-subscription-offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const data = await res.json();
          document.getElementById('preview-text').innerText = data.message;
          document.getElementById('preview-box').style.display = 'block';
          document.getElementById('success-msg').style.display = 'none';
        } else {
          alert('Failed to generate campaign. Please try again.');
        }
      } catch (err) {
        console.error(err);
        // Fallback for UI testing if backend is offline
        document.getElementById('preview-text').innerText = `Subject: Never run out of ${payload.product_name || 'your favorite items'} again!\n\nHi there,\n\nWe noticed you recently purchased ${payload.product_name || 'your favorite items'}. Did you know you can get it delivered automatically?\n\nSign up for our ${payload.frequency || 'monthly'} Subscribe & Save plan and get ${payload.discount_percentage || '10'}% off every order.\n\nReady to subscribe? Click here: https://ohc.store/subscribe\n\nBest,\nThe Your Store Team${payload.brand_link ? '\n\n⚡ Powered by OHC' : ''}`;
        document.getElementById('preview-box').style.display = 'block';
        document.getElementById('success-msg').style.display = 'none';
      } finally {
        btn.innerText = 'Generate AI Campaign';
        btn.disabled = false;
      }
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      const btn = document.getElementById('send-btn');
      btn.innerText = 'Sending...';
      btn.disabled = true;

      setTimeout(() => {
        btn.innerText = 'Send Campaign';
        btn.disabled = false;
        document.getElementById('success-msg').style.display = 'block';
      }, 1000); // Simulate network request
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
