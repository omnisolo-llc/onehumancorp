<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Help Article</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        width: 100%;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        font-size: 14px;
        padding: 8px 0;
        min-height: 44px;
      }
      .back-link svg {
        width: 16px;
        height: 16px;
        margin-right: 5px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .article-card {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 24px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
      }
      .article-title {
        color: #1d1d1f;
        font-size: 32px;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 30px;
        letter-spacing: -0.5px;
      }
      .article-content {
        color: #333;
        font-size: 16px;
        line-height: 1.7;
      }
      .article-content h2 {
        color: #1d1d1f;
        font-size: 22px;
        font-weight: 700;
        margin-top: 30px;
        margin-bottom: 15px;
      }
      .article-content p {
        margin-bottom: 20px;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-weight: 500;
        animation: pulse 1.5s infinite ease-in-out;
      }
      .error {
        text-align: center;
        padding: 40px;
        color: #FF3B30;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .article-card {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .article-title, .article-content h2 { color: #f5f5f7; }
        .article-content { color: #d1d1d6; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="help.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Help Center
      </a>

      <div class="article-card" id="article-container">
        <div class="loading" id="loading-indicator">Loading article...</div>
      </div>
    </div>


    <!-- OHC Help Utils -->
    <link rel="stylesheet" href="help-utils.css">
    <script src="help-utils.js"></script>



    <script>
      const container = document.getElementById('article-container');

      // Get article ID from URL query params
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');

      async function loadArticle() {
        if (!articleId) {
            container.innerHTML = `<div class="error"><h2>Oops!</h2><p>Article not found.</p></div>`;
            return;
        }

        try {
          let article = null;
          if (window.__TAURI__ && window.__TAURI__.core) {
             article = await window.__TAURI__.core.invoke('get_help_article', { id: articleId });
          } else {
             const res = await fetch(`/api/help/${articleId}`);
             if (res.ok) {
                 article = await res.json();
             } else {
                 throw new Error("Article not found");
             }
          }

          if (article) {
             container.innerHTML = `
                <h1 class="article-title">${article.title}</h1>
                <div class="article-content">${article.contentHtml || article.content_html || '<p>No content available.</p>'}</div>
             `;
          } else {
             container.innerHTML = `<div class="error"><h2>Oops!</h2><p>Article not found.</p></div>`;
          }
        } catch (e) {
          console.error("Failed to load article", e);

          // Mock data fallback for Playwright
          if (articleId === 'getting-started-1') {
              container.innerHTML = `
                <h1 class="article-title">Getting Started with Your Store</h1>
                <div class="article-content">
                  <p>Welcome to OneHumanCorp! Let's get your business online in under 10 minutes.</p>
                  <h2>Step 1: Tell us about your business</h2>
                  <p>Add your store name and a short bio so customers know who you are.</p>
                  <h2>Step 2: Add your first product</h2>
                  <p>Upload a photo, set a price, and describe what you're selling.</p>
                </div>
              `;
          } else {
              container.innerHTML = `<div class="error"><h2>Oops!</h2><p>${e.message || 'Failed to load article.'}</p></div>`;
          }
        }
      }

      loadArticle();
    </script>
  </body>
</html>
