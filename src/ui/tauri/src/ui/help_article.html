<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Help Article - OHC</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        width: 100%;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        border: 1px solid #e5e5ea;
        box-sizing: border-box;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 24px;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .back-link svg {
        margin-right: 6px;
        width: 16px;
        height: 16px;
      }
      h1 {
        color: #1d1d1f;
        font-size: 32px;
        font-weight: 800;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .content {
        font-size: 16px;
        line-height: 1.6;
        color: #1d1d1f;
      }
      .content h2 {
        font-size: 20px;
        margin-top: 32px;
        margin-bottom: 16px;
      }
      .content p {
        margin-bottom: 16px;
      }
      .content img {
        max-width: 100%;
        border-radius: 12px;
        margin: 20px 0;
      }
      .loading {
        text-align: center;
        color: #86868b;
        padding: 40px;
      }
      .helpful-box {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid #e5e5ea;
        text-align: center;
      }
      .helpful-box p {
        font-weight: 600;
        margin-bottom: 16px;
      }
      .helpful-btn {
        background: transparent;
        border: 1px solid #d2d2d7;
        padding: 8px 24px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        color: #1d1d1f;
        cursor: pointer;
        margin: 0 8px;
        transition: all 0.2s;
      }
      .helpful-btn:hover {
        background: #f5f5f7;
      }
      .helpful-btn.active {
        background: #0066FF;
        color: white;
        border-color: #0066FF;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .container { background: #1c1c1e; border-color: #2c2c2e; }
        h1, .content, .helpful-box p, .helpful-btn { color: #F5F5F7; }
        .helpful-box { border-color: #2c2c2e; }
        .helpful-btn { border-color: #444; }
        .helpful-btn:hover { background: #2c2c2e; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a href="help.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Help Center
      </a>

      <div id="article-content">
        <div class="loading">Loading article...</div>
      </div>

      <div class="helpful-box">
        <p>Was this article helpful?</p>
        <button class="helpful-btn" onclick="this.classList.add('active')">Yes</button>
        <button class="helpful-btn" onclick="this.classList.add('active')">No</button>
      </div>
    </div>

    <script>
      async function loadArticle() {
          const urlParams = new URLSearchParams(window.location.search);
          const id = urlParams.get('id');
          if (!id) {
              document.getElementById('article-content').innerHTML = '<h1>Article Not Found</h1><p>The requested article could not be found.</p>';
              return;
          }

          const fetchArticle = window.__TAURI__ ? window.__TAURI__.core.invoke("get_help_article", { id }) : fetch(`/api/help/${id}`).then(r => { if (!r.ok) throw new Error('Not found'); return r.json(); });

          try {
              const article = await fetchArticle;
              document.getElementById('article-content').innerHTML = `
                  <h1>${article.title}</h1>
                  <div class="content">
                      ${article.contentHtml}
                  </div>
              `;
              document.title = article.title + " - OHC Help";
          } catch(e) {
              console.error(e);
              document.getElementById('article-content').innerHTML = '<h1>Error</h1><p>Failed to load the article. It may have been moved or deleted.</p>';
          }
      }

      document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
  </body>
</html>
