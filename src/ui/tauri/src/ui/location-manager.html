<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Location Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.4);
            --accent-blue: #0066FF;
            --accent-red: #FF3B30;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --card-bg: rgba(22, 22, 26, 0.7);
                --card-border: rgba(255, 255, 255, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .task-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .task-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .task-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            min-height: 44px;
            min-width: 44px;
        }

        .btn-escalate {
            background: var(--accent-red);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h2 {
            margin-bottom: 16px;
        }

        .modal-content textarea {
            width: 100%;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-family: 'Inter', sans-serif;
            resize: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="location-name">My Location</h1>
        <p>Location Manager Dashboard</p>
    </div>

    <div class="card">
        <h2>Local Tasks</h2>
        <div id="tasks-list" style="margin-top: 16px;">
            <p>Loading tasks...</p>
        </div>
    </div>

    <!-- Escalate Modal -->
    <div id="escalate-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Escalate to Owner</h2>
            <p style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">Agent has drafted this summary based on the issue:</p>
            <textarea id="escalate-summary">Spike in pickup complaints at Location A. Staffing appears adequate, but the kitchen printer is offline. Requesting IT support.</textarea>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeEscalateModal()">Cancel</button>
                <button class="btn" onclick="submitEscalation()">Send to Owner</button>
            </div>
        </div>
    </div>

    <script>
        let currentTaskId = null;
        let tenantId = localStorage.getItem('tenant_id') || 'default';
        let locationId = localStorage.getItem('location_id') || 'loc-1';

        async function fetchTasks() {
            try {
                // Fetch actual tasks from backend
                const res = await fetch(`/api/v1/locations/${locationId}/tasks`, {
                    headers: { 'x-tenant-id': tenantId }
                });
                const tasks = await res.json();

                // We use real data flow now, no stub fallback for data presence
                renderTasks(tasks);

            } catch (err) {
                document.getElementById('tasks-list').innerHTML = '<p>Error loading tasks.</p>';
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks-list');
            container.innerHTML = '';

            if (tasks.length === 0) {
                 container.innerHTML = '<p>No pending tasks</p>';
                 return;
            }

            tasks.forEach(task => {
                const el = document.createElement('div');
                el.className = 'task-item';

                let actionBtn = `<button class="btn" onclick="alert('View task')">View</button>`;
                if (task.status === 'ALERT') {
                    actionBtn = `<button class="btn btn-escalate" onclick="openEscalateModal('${task.task_id}')">Escalate to Owner</button>`;
                }

                el.innerHTML = `
                    <div class="task-info">
                        <h3>${task.title}</h3>
                        <span class="task-status">${task.status}</span>
                    </div>
                    ${actionBtn}
                `;
                container.appendChild(el);
            });
        }

        function openEscalateModal(taskId) {
            currentTaskId = taskId;
            document.getElementById('escalate-modal').style.display = 'flex';
        }

        function closeEscalateModal() {
            document.getElementById('escalate-modal').style.display = 'none';
            currentTaskId = null;
        }

        async function submitEscalation() {
            const summary = document.getElementById('escalate-summary').value;
            try {
                const res = await fetch('/api/v1/locations/escalations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-tenant-id': tenantId
                    },
                    body: JSON.stringify({
                        task_id: currentTaskId,
                        summary: summary
                    })
                });

                if (res.ok) {
                    alert('Escalated to owner.');
                    closeEscalateModal();
                } else {
                    alert('Failed to escalate. API returned an error.');
                    closeEscalateModal();
                }
            } catch (e) {
                alert('Network error.');
                closeEscalateModal();
            }
        }

        fetchTasks();
    </script>
</body>
</html>
