<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Widget Builder</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    h1 {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }
    h2 {
      color: #1d1d1f;
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }
    label {
      display: block;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.8);
      font-family: monospace;
      color: #333;
      resize: none;
    }
    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }
    button:hover { background-color: #0052cc; }
    button:active { transform: scale(0.98); }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #0066FF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .info {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Embeddable Agent Widget</h1>
    <p class="info">
      Embed your OHC Agent directly on your website. The widget handles customer questions and intake requests automatically, completely powered by your OHC intelligence.
    </p>

    <label for="embed-code">Your Embed Snippet</label>
    <textarea id="embed-code" rows="4" readonly></textarea>

    <button id="copy-btn">Copy to Clipboard</button>
  </div>
  <a href="/dashboard" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';
      const baseUrl = window.location.origin;
      const scriptUrl = `${baseUrl}/api/v1/growth/widget.js?tenant=${encodeURIComponent(tenantId)}`;

      const snippet = `<script src="${scriptUrl}"><\/script>`;

      const textArea = document.getElementById('embed-code');
      textArea.value = snippet;

      document.getElementById('copy-btn').addEventListener('click', () => {
        textArea.select();
        document.execCommand('copy');

        const btn = document.getElementById('copy-btn');
        const originalText = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => {
          btn.innerText = originalText;
        }, 2000);
      });
    });
  </script>
</body>
</html>
