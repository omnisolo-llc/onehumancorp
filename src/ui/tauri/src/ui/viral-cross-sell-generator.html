<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Cross-Sell Generator</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
      color: #1d1d1f;
    }

    .container {
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    p {
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.4;
      color: #86868b;
    }

    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }

    button:hover { background-color: #0052cc; transform: translateY(-1px); }
    button:active { transform: scale(0.98); }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #0066FF;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .back-link:hover { opacity: 0.8; }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size: 48px; text-align: center; margin-bottom: 10px;">🛒</div>
    <h1>Viral Cross-Sell Generator</h1>
    <p>Generate a post-purchase cross-sell widget with a viral sharing hook that your customers can add to their order.</p>

    <button id="generate-btn">Generate Widget</button>

    <div id="result-area">
      <h2 style="font-size: 18px; margin-bottom: 10px;">Cross-Sell Widget Generated!</h2>
      <p style="margin-bottom: 15px; font-weight: 500;">Share this link to cross-sell to customers:</p>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="share-link" class="cross-sell-share-link" readonly style="flex: 1; padding: 12px; min-height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(0,0,0,0.2); background: rgba(255, 255, 255, 0.65);" />
        <button id="copy-btn" style="width: auto; padding: 12px 20px; min-height: 44px; background-color: #1d1d1f; box-shadow: none;">Copy</button>
      </div>
    </div>
  </div>

  <a href="/dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      try {
        const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';
        let refId = tenantId;

        try {
          const res = await fetch('/api/v1/growth/cross-sell/generate', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
                  'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
              }
          });

          if (!res.ok) {
              throw new Error("API returned " + res.status);
          }

          const data = await res.json();
          if (data.cross_sell_link) {
              refId = data.cross_sell_link;
          }
        } catch (fetchErr) {
            console.error("Network unreachable or API error", fetchErr);
            btn.disabled = false;
            btn.textContent = 'Generate Widget';
            return;
        }

        const baseUrl = window.location.origin;
        document.getElementById('share-link').value = `${baseUrl}/cross-sell/view?ref=${refId}`;
        document.getElementById('result-area').style.display = 'block';

      } catch (err) {
        console.error("Error generating widget:", err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Widget';
      }
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
        const urlInput = document.getElementById('share-link');
        urlInput.select();
        try {
            await navigator.clipboard.writeText(urlInput.value);
            const btn = document.getElementById('copy-btn');
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        } catch (err) {
            console.error('Failed to copy text: ', err);
        }
    });
  </script>
</body>
</html>
