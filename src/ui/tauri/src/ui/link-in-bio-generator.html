<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
        border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link-in-Bio Generator - OHC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #111827;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: rgba(255, 255, 255, 0.4);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .header {
            padding: 24px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #f3f4f6;
            color: #111827;
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #1D1D1F;
            letter-spacing: -0.02em;
        }

        .container {
            max-w: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .panel h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1D1D1F;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .theme-selector {
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-success {
            background: #d1fae5;
            color: #047857;
        }

        .btn-success:hover {
            background: #d1fae5;
        }

        /* Preview Section */
        .preview-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 8px solid #111827;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 24px;
            background: #111827;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 50;
        }

        .preview-content {
            flex: 1;
            padding: 64px 24px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            transition: background 0.3s, color 0.3s;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 16px;
            margin-top: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .preview-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .preview-bio {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
            text-align: center;
            margin-bottom: 32px;
            max-width: 250px;
            line-height: 1.5;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preview-link {
            width: 100%;
            padding: 16px 24px;
            border-radius: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: block;
        }

        .preview-link:hover {
            transform: scale(1.02);
        }

        .footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 24px;
        }

        .footer a {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .footer a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="window.history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Link-in-Bio Generator</h1>
</header>

<div class="container glassmorphism">
    <section class="editor-section">
        <div class="panel glassmorphism glassmorphism">
            <h2>Profile Details</h2>
            <div class="form-group">
                <label>Business Name</label>
                <input type="text" id="store-name" value="My Store">
            </div>
            <div class="form-group">
                <label>Bio / Tagline</label>
                <textarea id="bio-text" rows="2">Welcome to my storefront!</textarea>
            </div>
            <div class="form-group">
                <label>Theme</label>
                <div class="theme-selector">
                    <button class="theme-btn active" data-theme="gradient" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);"></button>
                    <button class="theme-btn" data-theme="dark" style="background: #1D1D1F;"></button>
                    <button class="theme-btn" data-theme="light" style="background: #ffffff; border: 1px solid #d1d5db;"></button>
                    <button class="theme-btn" data-theme="purple" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></button>
                </div>
            </div>
        </div>

        <div class="panel glassmorphism glassmorphism">
            <h2>Publish & Share</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px; margin-bottom: 16px; background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;">
                <div>
                    <span style="font-size: 14px; font-weight: 500; color: #111827;">Remove "Powered by OHC" Badge</span>
                    <p style="font-size: 12px; color: #6b7280; margin-top: 4px; margin-bottom: 0;">Hide the OHC branding from your public page.</p>
                </div>
                <label style="position: relative; display: inline-block; width: 48px; height: 24px;">
                    <input type="checkbox" id="remove-branding-toggle" style="opacity: 0; width: 0; height: 0;">
                    <span id="remove-branding-slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d5db; transition: .2s; border-radius: 24px;">
                        <span id="remove-branding-knob" style="position: absolute; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .2s; border-radius: 50%;"></span>
                    </span>
                </label>
            </div>
            <button id="copy-btn" class="btn-primary">Copy Link-in-Bio URL</button>
            <p style="text-align: center; font-size: 12px; color: #6b7280; margin-top: 8px;">Add this link to your Instagram, TikTok, or Twitter profile.</p>
        </div>
    </section>

    <section class="preview-section">
        <div class="phone-container">
            <div class="notch"></div>
            <div id="preview-content" class="preview-content">
                <div class="avatar">✨</div>
                <h1 id="preview-title" class="preview-title">My Store</h1>
                <p id="preview-bio" class="preview-bio">Welcome to my storefront!</p>

                <div class="links-container" id="preview-links">
                    <!-- Links will be added here -->
                </div>

                <div class="footer">
                    <a id="powered-by-link" href="/api/v1/growth/referrals/click?target=/setup.html&ref=my-store&source=bio_page">⚡ Powered by OHC</a>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const storeNameInput = document.getElementById('store-name');
        const bioInput = document.getElementById('bio-text');
        const themeBtns = document.querySelectorAll('.theme-btn');
        const copyBtn = document.getElementById('copy-btn');

        const previewTitle = document.getElementById('preview-title');
        const previewBio = document.getElementById('preview-bio');
        const previewContent = document.getElementById('preview-content');
        const previewLinks = document.getElementById('preview-links');
        const poweredByLink = document.getElementById('powered-by-link');
        const removeBrandingToggle = document.getElementById('remove-branding-toggle');
        const removeBrandingSlider = document.getElementById('remove-branding-slider');
        const removeBrandingKnob = document.getElementById('remove-branding-knob');

        let tenant = window.localStorage.getItem('tenant') || window.localStorage.getItem('tenant_id') || 'my-store';

        let currentState = {
            store_name: '',
            bio: '',
            theme: 'gradient',
            links: [],
            remove_branding: false
        };

        // Try load from API
        try {
            const response = await fetch(`/api/v1/growth/link-in-bio/${tenant}`);
            if (response.ok) {
                const data = await response.json();
                currentState.store_name = data.store_name || '';
                currentState.bio = data.bio || '';
                currentState.theme = data.theme || 'gradient';
                currentState.links = data.links || [];
                currentState.remove_branding = !!data.remove_branding;
            }
        } catch(e) {
            console.error("Failed to load bio config", e);
        }

        storeNameInput.value = currentState.store_name;
        bioInput.value = currentState.bio;
        removeBrandingToggle.checked = currentState.remove_branding;

        let saveTimeout;
        function saveState() {
            // Debounce API call
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                try {
                    await fetch('/api/v1/growth/link-in-bio', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${window.localStorage.getItem('token') || ''}`,
                            'X-Tenant-Id': tenant
                        },
                        body: JSON.stringify(currentState)
                    });
                } catch (e) {
                    console.error("Failed to save bio config", e);
                }
            }, 500);
        }

        function getThemeStyles(themeName) {
            switch(themeName) {
                case 'dark': return { bg: '#1D1D1F', color: '#ffffff', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' };
                case 'light': return { bg: '#f3f4f6', color: '#111827', linkBg: '#ffffff', linkBorder: '#e5e7eb' };
                case 'purple': return { bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: '#ffffff', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' };
                case 'gradient': default: return { bg: 'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)', color: '#1D1D1F', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' };
            }
        }

        function updatePreview() {
            previewTitle.textContent = currentState.store_name;
            previewBio.textContent = currentState.bio;
            poweredByLink.href = `/api/v1/growth/referrals/click?target=/setup.html&ref=${encodeURIComponent(tenant)}&source=bio_page`;
            poweredByLink.style.display = currentState.remove_branding ? 'none' : 'block';

            if (currentState.remove_branding) {
                removeBrandingSlider.style.backgroundColor = '#4f46e5';
                removeBrandingKnob.style.transform = 'translateX(24px)';
            } else {
                removeBrandingSlider.style.backgroundColor = '#d1d5db';
                removeBrandingKnob.style.transform = 'translateX(0)';
            }

            const styles = getThemeStyles(currentState.theme);
            previewContent.style.background = styles.bg;
            previewContent.style.color = styles.color;
            poweredByLink.style.color = styles.color;

            // Render links
            previewLinks.innerHTML = '';
            currentState.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.className = 'preview-link';
                a.textContent = link.title;
                a.style.background = styles.linkBg;
                a.style.border = `1px solid ${styles.linkBorder}`;
                a.style.color = styles.color;
                a.style.backdropFilter = 'blur(10px)';
                previewLinks.appendChild(a);
            });

            // update theme buttons
            themeBtns.forEach(btn => {
                if (btn.dataset.theme === currentState.theme) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        storeNameInput.addEventListener('input', (e) => {
            currentState.store_name = e.target.value;
            updatePreview();
            saveState();
        });

        bioInput.addEventListener('input', (e) => {
            currentState.bio = e.target.value;
            updatePreview();
            saveState();
        });

        themeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentState.theme = e.target.dataset.theme;
                updatePreview();
                saveState();
            });
        });

        removeBrandingToggle.addEventListener('change', (e) => {
            currentState.remove_branding = e.target.checked;
            updatePreview();
            saveState();
        });

        copyBtn.addEventListener('click', () => {
            const url = `${window.location.origin}/bio/${tenant}`;
            navigator.clipboard.writeText(url).then(() => {
                copyBtn.textContent = 'Copied Link!';
                copyBtn.classList.add('btn-success');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy Link-in-Bio URL';
                    copyBtn.classList.remove('btn-success');
                }, 2000);
            });
        });

        // initial render
        updatePreview();
    });
</script>

  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
