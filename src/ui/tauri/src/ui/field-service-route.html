<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Today's Route - One Human Corp</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --text-primary: #111111;
      --text-secondary: #666666;
      --border: rgba(0, 0, 0, 0.08);
      --primary: #000000;
      --primary-inverse: #FFFFFF;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Layout starts at 375px mobile-first */
    .app-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    .header {
      padding: 16px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Glassmorphism Cards */
    .route-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .job-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .job-address {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-time {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      background: rgba(0,0,0,0.05);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      display: inline-block;
      margin-bottom: 16px;
    }

    .job-status {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .status-pending { background: #F3F4F6; color: #4B5563; }
    .status-en_route { background: #DBEAFE; color: #1D4ED8; }
    .status-on_site { background: #FEF3C7; color: #B45309; }
    .status-done { background: #D1FAE5; color: #065F46; }
    .status-cancelled { background: #FEE2E2; color: #B91C1C; }

    /* Touch Targets */
    .actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      flex: 1;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-inverse);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #333;
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:active {
      background: #F5F5F5;
    }

    #loading-state, #empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 768px) {
      .route-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .route-card {
        margin-bottom: 0;
      }
    }

    @media (min-width: 1024px) {
      .route-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1 class="header-title">Today's Route</h1>
      <div class="header-subtitle" id="date-display">Loading...</div>
    </div>

    <div id="loading-state">
      <div class="spinner"></div>
      <p>Loading your schedule...</p>
    </div>

    <div id="empty-state" style="display: none;">
      <p>No jobs scheduled for today.</p>
    </div>

    <div class="route-list" id="route-container"></div>
  </div>

  <script>
    // In a real mobile app/PWA context, we retrieve the tenant ID from the session.

    document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });

    async function fetchRoutes() {
      try {
        const response = await fetch('/api/v1/field-service-routing/routes/today');

        if (!response.ok) throw new Error('Failed to fetch routes');

        const data = await response.json();
        renderRoutes(data.routes);
      } catch (err) {
        console.error(err);
        document.getElementById('loading-state').innerHTML = `<p>Error loading routes. Please try again.</p>`;
      }
    }

    async function updateJobStatus(jobId, newStatus) {
      try {
        // Optimistic UI update could go here

        const response = await fetch(`/api/v1/field-service-routing/jobs/${jobId}/status`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: newStatus })
        });

        if (!response.ok) throw new Error('Failed to update status');

        // Refresh the list to get ground truth from the server
        await fetchRoutes();
      } catch (err) {
        console.error(err);
        alert('Could not update job status. Check your connection.');
      }
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function renderRoutes(routes) {
      const container = document.getElementById('route-container');
      const loading = document.getElementById('loading-state');
      const empty = document.getElementById('empty-state');

      loading.style.display = 'none';

      if (!routes || routes.length === 0 || !routes[0].jobs || routes[0].jobs.length === 0) {
        empty.style.display = 'block';
        container.innerHTML = '';
        return;
      }

      empty.style.display = 'none';

      // Flatten jobs from all routes for today
      let allJobs = [];
      routes.forEach(route => {
        if (route.jobs) {
          allJobs = allJobs.concat(route.jobs);
        }
      });

      container.innerHTML = allJobs.map(job => {
        let actionButtons = '';

        if (job.status === 'pending') {
          actionButtons = `
            <button class="btn btn-primary" onclick="updateJobStatus('${job.id}', 'en_route')">Start Travel</button>
          `;
        } else if (job.status === 'en_route') {
          actionButtons = `
            <button class="btn btn-primary" onclick="updateJobStatus('${job.id}', 'on_site')">Arrived On-Site</button>
          `;
        } else if (job.status === 'on_site') {
          actionButtons = `
            <button class="btn btn-secondary">Generate Quote</button>
            <button class="btn btn-primary" onclick="updateJobStatus('${job.id}', 'done')">Job Done</button>
          `;
        } else if (job.status === 'done') {
          actionButtons = `
            <button class="btn btn-secondary" style="flex: 1;">Tap to Pay</button>
          `;
        }

        return `
          <div class="route-card" data-testid="job-card-${job.id}">
            <div class="job-status status-${job.status}">${job.status.replace('_', ' ')}</div>
            <h2 class="job-title">${job.job_title}</h2>
            <div class="job-address">📍 ${job.address}</div>
            <div class="job-time">
              ${formatTime(job.scheduled_start)} ${job.scheduled_end ? '- ' + formatTime(job.scheduled_end) : ''}
            </div>

            <div class="actions-row">
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    // Initialize
    fetchRoutes();
  </script>
</body>
</html>
