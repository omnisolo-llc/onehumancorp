<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnichannel Inbox - OneHumanCorp</title>
    <style>
      :root {
        --mac-light: rgba(255, 255, 255, 0.7);
        --mac-border: rgba(255, 255, 255, 0.2);
        --mac-blur: 20px;
        --accent: #007aff;
        --bg-color: #f5f5f7;
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .glassmorphism {
        background: var(--mac-light);
        backdrop-filter: blur(var(--mac-blur));
        -webkit-backdrop-filter: blur(var(--mac-blur));
        border: 1px solid var(--mac-border);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      header {
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--mac-border);
      }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .container {
        display: flex;
        flex: 1;
        overflow: hidden;
        padding: 20px;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .inbox-list {
        flex: 1;
        min-width: 250px;
        max-width: 350px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .inbox-list h2 {
        padding: 15px;
        margin: 0;
        font-size: 16px;
        border-bottom: 1px solid var(--mac-border);
        background: rgba(255, 255, 255, 0.5);
      }
      .inbox-item {
        padding: 15px;
        border-bottom: 1px solid var(--mac-border);
        cursor: pointer;
        transition: background 0.2s;
      }
      .inbox-item:hover { background: rgba(255, 255, 255, 0.9); }
      .inbox-item.active {
        background: var(--accent);
        color: white;
      }
      .inbox-item.active .inbox-meta { color: rgba(255, 255, 255, 0.8); }
      .inbox-name { font-weight: 600; margin-bottom: 5px; }
      .inbox-meta { font-size: 12px; color: var(--text-secondary); }

      .chat-area {
        flex: 2;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        padding: 15px;
        border-bottom: 1px solid var(--mac-border);
        background: rgba(255, 255, 255, 0.5);
        font-weight: 600;
      }
      .chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .chat-bubble {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 75%;
        line-height: 1.4;
      }
      .chat-bubble.contact {
        background: white;
        border: 1px solid var(--mac-border);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }
      .chat-bubble.agent {
        background: var(--accent);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }
      .chat-input-area {
        padding: 15px;
        border-top: 1px solid var(--mac-border);
        background: rgba(255, 255, 255, 0.5);
        display: flex;
        gap: 10px;
      }
      .chat-input-area input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 20px;
        border: 1px solid var(--mac-border);
        background: white;
        outline: none;
      }
      .chat-input-area button {
        padding: 10px 20px;
        border-radius: 20px;
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      .chat-input-area button:hover { background: #005bb5; }

      .draft-reply {
        margin-top: 5px;
        padding: 10px;
        background: rgba(0, 122, 255, 0.1);
        border: 1px dashed var(--accent);
        border-radius: 8px;
        font-size: 13px;
        align-self: flex-start;
        max-width: 75%;
      }
      .draft-reply-label {
        font-weight: 600;
        color: var(--accent);
        margin-bottom: 5px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .approve-btn {
        margin-top: 8px;
        padding: 6px 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }
      .approve-btn:hover { background: #005bb5; }
      .approve-btn.approved { background: #34c759; cursor: default; }

      .empty-state {
        text-align: center;
        color: var(--text-secondary);
        margin-top: 50px;
      }

      /* Mobile layout adjustments */
      @media (max-width: 768px) {
        .container { flex-direction: column; padding: 10px; }
        .inbox-list, .chat-area { flex: none; height: 50vh; }
      }
    </style>
  </head>
  <body>
    <header class="glassmorphism">
      <h1>Native Omnichannel Inbox</h1>
      <div id="status-indicator">Connecting...</div>
    </header>

    <div class="container">
      <div class="inbox-list glassmorphism" id="inbox-list-container">
        <h2>Inboxes & Conversations</h2>
        <div id="inbox-list" style="overflow-y:auto; flex:1;">
          <div class="empty-state">Loading inboxes...</div>
        </div>
      </div>

      <div class="chat-area glassmorphism">
        <div class="chat-header" id="chat-header">Select a conversation</div>
        <div class="chat-messages" id="chat-messages">
           <div class="empty-state">Select a conversation to view messages.</div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Type a message..." disabled />
          <button id="chat-send-btn" disabled>Send</button>
        </div>
      </div>
    </div>

    <script>
      let currentConversationId = null;
      let socket = null;
      let allConversations = [];

      async function loadInboxes() {
        try {
          const res = await fetch("/api/v1/chat/inboxes", {
             headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
          });
          if (!res.ok) throw new Error("Failed to fetch inboxes");
          const inboxes = await res.json();
          renderInboxes(inboxes);
        } catch (err) {
          console.error(err);
          document.getElementById("inbox-list").innerHTML = `<div class="empty-state" style="color:red">Error loading inboxes</div>`;
        }
      }

      function renderInboxes(inboxes) {
        const list = document.getElementById("inbox-list");
        if (inboxes.length === 0) {
          list.innerHTML = `<div class="empty-state">No inboxes found.</div>`;
          return;
        }

        list.innerHTML = "";
        inboxes.forEach(inbox => {
            // For MVP, we treat an inbox as selectable,
            // but normally we'd list conversations within inboxes.
            // We simulate fetching a default conversation for an inbox here to keep the UI simple.
            const el = document.createElement("div");
            el.className = "inbox-item";
            el.innerHTML = `
                <div class="inbox-name">${inbox.name}</div>
                <div class="inbox-meta">Inbox ID: ${inbox.id.substring(0,8)}...</div>
            `;
            el.onclick = async () => {
                document.querySelectorAll(".inbox-item").forEach(n => n.classList.remove("active"));
                el.classList.add("active");

                // Fetch conversations for this inbox
                try {
                  const cRes = await fetch(`/api/v1/chat/conversations?inbox_id=${inbox.id}`, {
                    headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
                  });
                  const convs = await cRes.json();
                  if(convs.length > 0) {
                     loadConversation(convs[0].id);
                  } else {
                     // Create one for demo purposes if empty
                     const cRes2 = await fetch(`/api/v1/chat/inboxes/${inbox.id}/conversations`, {
                         method: "POST",
                         headers: {
                           "Content-Type": "application/json",
                           "Authorization": `Bearer ${localStorage.getItem("token")}`
                         },
                         body: JSON.stringify({ contact_id: "00000000-0000-0000-0000-000000000000" })
                     });
                     if (cRes2.ok) {
                         const newC = await cRes2.json();
                         loadConversation(newC.id);
                     }
                  }
                } catch(e) { console.error(e); }
            };
            list.appendChild(el);
        });
      }

      async function loadConversation(id) {
        currentConversationId = id;
        document.getElementById("chat-header").textContent = `Conversation: ${id.substring(0,8)}...`;
        document.getElementById("chat-input").disabled = false;
        document.getElementById("chat-send-btn").disabled = false;
        document.getElementById("chat-messages").innerHTML = `<div class="empty-state">Loading messages...</div>`;

        try {
          const res = await fetch(`/api/v1/chat/messages/${id}`, {
             headers: { "Authorization": `Bearer ${localStorage.getItem("token")}` }
          });
          if (!res.ok) throw new Error("Failed to fetch messages");
          const msgs = await res.json();
          renderMessages(msgs);
        } catch (err) {
          console.error(err);
          document.getElementById("chat-messages").innerHTML = `<div class="empty-state" style="color:red">Error: ${err.message}</div>`;
        }
      }

      function renderMessages(msgs) {
        const list = document.getElementById("chat-messages");
        if (!msgs || msgs.length === 0) {
          list.innerHTML = `<div class="empty-state">No messages yet.</div>`;
          return;
        }
        list.innerHTML = "";
        msgs.forEach(msg => {
          appendMessage(msg);
        });
        list.scrollTop = list.scrollHeight;
      }

      function appendMessage(msg) {
        const list = document.getElementById("chat-messages");
        if (list.querySelector(".empty-state")) list.innerHTML = "";

        const bubbleWrap = document.createElement("div");
        bubbleWrap.style.display = "flex";
        bubbleWrap.style.flexDirection = "column";
        if (msg.sender_type === "agent") {
            bubbleWrap.style.alignItems = "flex-end";
        } else {
            bubbleWrap.style.alignItems = "flex-start";
        }

        const el = document.createElement("div");
        el.className = `chat-bubble ${msg.sender_type === "agent" ? "agent" : "contact"}`;
        el.textContent = msg.content;
        bubbleWrap.appendChild(el);

        // If it's a contact message and has a simulated AI draft
        if (msg.sender_type === "contact" && msg.draft_reply) {
            const draftDiv = document.createElement('div');
            draftDiv.className = 'draft-reply';

            const draftLabel = document.createElement('div');
            draftLabel.className = 'draft-reply-label';
            draftLabel.textContent = '✨ AI Draft Proposal';

            const draftContent = document.createElement('div');
            draftContent.className = 'draft-reply-content';
            draftContent.textContent = msg.draft_reply;

            draftDiv.appendChild(draftLabel);
            draftDiv.appendChild(draftContent);

            const btnText = msg.draft_reply.includes('[Send & Deduct Inventory]') ?
                            '✨ Approve & Send (Deduct Inventory)' : 'Approve & Send';

            const approveBtn = document.createElement('button');
            approveBtn.className = 'approve-btn';
            approveBtn.textContent = btnText;
            approveBtn.onclick = async () => {
                approveBtn.textContent = 'Sending...';
                approveBtn.disabled = true;
                try {
                  // Simulate an approval API call. In reality this calls the backend approval route.
                  const res = await fetch(`/api/v1/chat/messages/${currentConversationId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({ content: msg.draft_reply.replace('[Send & Deduct Inventory]', '').trim(), sender_type: "agent" })
                  });
                  if (res.ok) {
                    approveBtn.textContent = 'Draft approved and sent. ✅';
                    approveBtn.classList.add('approved');
                  }
                } catch(e) {
                   approveBtn.textContent = 'Failed to send';
                   console.error(e);
                }
            };

            draftDiv.appendChild(approveBtn);
            bubbleWrap.appendChild(draftDiv);
        }

        list.appendChild(bubbleWrap);
        list.scrollTop = list.scrollHeight;
      }

      function initWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);
        socket.onopen = () => {
            console.log("Chat WebSocket connected");
            document.getElementById("status-indicator").textContent = "Live";
            document.getElementById("status-indicator").style.color = "#34c759";
        };
        socket.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.conversation_id === currentConversationId) {
              appendMessage(msg);
            }
          } catch (e) {
            console.error("Error parsing WS message:", e);
          }
        };
        socket.onclose = () => {
          console.log("Chat WebSocket closed. Reconnecting...");
          document.getElementById("status-indicator").textContent = "Reconnecting...";
          document.getElementById("status-indicator").style.color = "#ff9500";
          setTimeout(initWebSocket, 2000);
        };
      }

      document.getElementById("chat-send-btn").onclick = async () => {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text || !currentConversationId) return;

        input.value = "";
        input.disabled = true;
        document.getElementById("chat-send-btn").disabled = true;

        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            action: "send_message",
            conversation_id: currentConversationId,
            content: text
          }));
          input.disabled = false;
          document.getElementById("chat-send-btn").disabled = false;
          input.focus();
        } else {
          try {
            const res = await fetch(`/api/v1/chat/messages/${currentConversationId}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${localStorage.getItem("token")}`
              },
              body: JSON.stringify({ content: text, sender_type: "agent" })
            });
            if (res.ok) {
              const msg = await res.json();
              appendMessage(msg);
            }
          } catch (err) {
            console.error(err);
          } finally {
            input.disabled = false;
            document.getElementById("chat-send-btn").disabled = false;
            input.focus();
          }
        }
      };

      document.getElementById("chat-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          document.getElementById("chat-send-btn").click();
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        loadInboxes();
        initWebSocket();
      });
    </script>
  </body>
</html>
