<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Unified Inbox</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .header-section {
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        margin-top: 0;
      }
      .subtitle {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .message-card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        border: 1px solid #e5e5ea;
      }
      .message-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
        color: #86868b;
        font-weight: 600;
      }
      .message-source {
        background: #f1f5f9;
        padding: 4px 8px;
        border-radius: 6px;
        color: #0f172a;
      }
      .message-content {
        font-size: 15px;
        color: #1d1d1f;
        margin-bottom: 12px;
        line-height: 1.4;
      }
      .draft-reply {
        background: #f8fafc;
        border-left: 3px solid #0066FF;
        padding: 12px;
        border-radius: 4px 8px 8px 4px;
        margin-bottom: 16px;
      }
      .draft-reply-label {
        font-size: 11px;
        font-weight: 700;
        color: #0066FF;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: block;
      }
      .draft-reply-content {
        font-size: 14px;
        color: #334155;
      }
      .approve-btn {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: transform 0.1s, background-color 0.2s;
      }
      .approve-btn:active {
        transform: scale(0.98);
      }
      .approve-btn.approved {
        background-color: #34C759;
        cursor: default;
      }
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #86868b;
        font-size: 15px;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 16px;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container glassmorphism">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      <div class="header-section">
        <div>
          <h1>Agentic Inbox</h1>
          <div class="subtitle">Unified messages with AI-drafted replies</div>
        </div>
      </div>

      <div id="inbox-queue">
        <div class="empty-state">Loading messages...</div>
      </div>
    </div>

    <script>
      async function loadInbox() {
        const queueEl = document.getElementById('inbox-queue');
        try {
          const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default';
          const res = await fetch(`/api/ui/inbox/messages?tenant_id=${encodeURIComponent(tenantId)}&mobile_optimized=false`);
          if (!res.ok) throw new Error("Failed to load inbox");

          const messages = await res.json();
          renderMessages(messages, queueEl, tenantId);
        } catch (err) {
          console.error(err);
          queueEl.innerHTML = `<div class="empty-state" style="color:#FF3B30;">Failed to load inbox. ${err.message}</div>`;
        }
      }

      function renderMessages(messages, container, tenantId) {
        if (!messages || messages.length === 0) {
          container.innerHTML = '<div class="empty-state">Inbox zero. All caught up!</div>';
          return;
        }

        // Filter out sent/resolved messages to keep it an action-oriented queue
        const actionItems = messages.filter(m => m.status !== 'sent' && m.status !== 'resolved');

        if (actionItems.length === 0) {
          container.innerHTML = '<div class="empty-state">Inbox zero. All caught up!</div>';
          return;
        }

        container.innerHTML = '';

        actionItems.forEach(msg => {
          const card = document.createElement('div');
          card.className = 'message-card';

          const header = document.createElement('div');
          header.className = 'message-header';

          const sourceSpan = document.createElement('span');
          sourceSpan.className = 'message-source';
          sourceSpan.textContent = msg.source || 'Unknown';

          const senderSpan = document.createElement('span');
          senderSpan.textContent = msg.sender_id || '';

          header.appendChild(sourceSpan);
          header.appendChild(senderSpan);

          const contentDiv = document.createElement('div');
          contentDiv.className = 'message-content';
          contentDiv.textContent = msg.original_message || msg.content || '';

          card.appendChild(header);
          card.appendChild(contentDiv);

          if (msg.generated_response && msg.generated_response.trim() !== '') {
            const draftDiv = document.createElement('div');
            draftDiv.className = 'draft-reply';

            const draftLabel = document.createElement('span');
            draftLabel.className = 'draft-reply-label';
            draftLabel.textContent = '✨ AI Drafted Reply';

            const draftContent = document.createElement('div');
            draftContent.className = 'draft-reply-content';
            draftContent.textContent = msg.generated_response;

            draftDiv.appendChild(draftLabel);
            draftDiv.appendChild(draftContent);

            const approveBtn = document.createElement('button');
            approveBtn.className = 'approve-btn';
            approveBtn.textContent = 'Approve & Send';
            approveBtn.onclick = () => approveAndSend(msg.id, approveBtn, tenantId);

            card.appendChild(draftDiv);
            card.appendChild(approveBtn);
          } else {
            const draftLabel = document.createElement('div');
            draftLabel.className = 'draft-reply-label';
            draftLabel.style.color = '#86868b';
            draftLabel.textContent = 'No AI draft available';
            card.appendChild(draftLabel);
          }

          container.appendChild(card);
        });
      }

      async function approveAndSend(messageId, btnElement, tenantId) {
        const originalText = btnElement.textContent;
        btnElement.textContent = 'Sending...';
        btnElement.disabled = true;

        try {
          const res = await fetch(`/api/ui/inbox/messages/${messageId}/approve?tenant_id=${encodeURIComponent(tenantId)}`, {
            method: 'POST'
          });

          if (!res.ok) throw new Error("Approval failed");

          btnElement.textContent = 'Sent! ✅';
          btnElement.classList.add('approved');

          // Hide the card after a short delay
          setTimeout(() => {
            const card = btnElement.closest('.message-card');
            if (card) {
              card.style.opacity = '0';
              card.style.transform = 'scale(0.95)';
              card.style.transition = 'all 0.3s ease';
              setTimeout(() => card.remove(), 300);
            }
          }, 1500);

        } catch (err) {
          console.error(err);
          alert("Failed to send message: " + err.message);
          btnElement.textContent = originalText;
          btnElement.disabled = false;
        }
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', loadInbox);
    </script>
  </body>
</html>
