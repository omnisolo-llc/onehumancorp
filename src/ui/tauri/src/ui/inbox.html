<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omnichannel Inbox</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --primary: #0066FF;
      --primary-hover: #005ce6;
      --border: rgba(0, 0, 0, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --glass-blur: blur(30px) saturate(210%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-color: #f5f5f7;
        --border: rgba(255, 255, 255, 0.1);
        --glass-bg: rgba(22, 22, 26, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .glassmorphism {
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      flex-shrink: 0;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conversation-item {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .conversation-item:hover {
      background: rgba(0, 102, 255, 0.05);
    }

    .conversation-item.active {
      background: rgba(0, 102, 255, 0.1);
      border-color: rgba(0, 102, 255, 0.2);
    }

    .conversation-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .conversation-name {
      font-weight: 600;
      font-size: 15px;
    }

    .conversation-status {
      font-size: 12px;
      color: #888;
    }

    .conversation-status.open {
      color: #34C759;
    }

    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      position: relative;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.received {
      align-self: flex-start;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-meta {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .input-area {
      padding: 16px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .input-box {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 15px;
      background: var(--bg-color);
      color: var(--text-color);
      outline: none;
    }

    .input-box:focus {
      border-color: var(--primary);
    }

    .send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 44px;
      min-height: 44px;
    }

    .send-btn:hover {
      background: var(--primary-hover);
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #888;
      font-size: 16px;
      flex-direction: column;
      gap: 16px;
    }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 16px;
      padding: 8px 0;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 20;
        transition: transform 0.3s ease;
      }

      .sidebar.hidden {
        transform: translateX(-100%);
      }

      .back-btn {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Inbox</h1>
  </div>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="conversation-list" id="conversation-list">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

    <div class="main-view" id="main-view">
      <div class="header glassmorphism" style="border-radius: 0; border-left: none; border-right: none; border-top: none;">
        <button class="back-btn" id="back-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back
        </button>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600;" id="active-chat-title">Select a conversation</h2>
        <div style="width: 24px;"></div>
      </div>

      <div class="messages-container" id="messages-container">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Select a conversation to start chatting</span>
        </div>
      </div>

      <div class="input-area" id="input-area" style="display: none;">
        <input type="text" class="input-box" id="message-input" placeholder="Type a message...">
        <button class="send-btn" id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Extract tenant ID from URL params or use fallback for testing
    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('tenant') || urlParams.get('tenant_id') || 'e2e-tenant';

    let activeConversationId = null;

    const sidebar = document.getElementById('sidebar');
    const backBtn = document.getElementById('back-btn');
    const conversationList = document.getElementById('conversation-list');
    const messagesContainer = document.getElementById('messages-container');
    const inputArea = document.getElementById('input-area');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const activeChatTitle = document.getElementById('active-chat-title');

    backBtn.addEventListener('click', () => {
      sidebar.classList.remove('hidden');
    });

    async function loadConversations() {
      try {
        const response = await fetch(`/api/v1/chat/conversations?tenant_id=${tenantId}`);
        if (!response.ok) throw new Error('Failed to load conversations');

        const conversations = await response.json();

        if (conversations.length === 0) {
          conversationList.innerHTML = '<div class="empty-state">No conversations yet</div>';
          return;
        }

        conversationList.innerHTML = '';
        conversations.forEach(conv => {
          const el = document.createElement('div');
          el.className = 'conversation-item';
          if (conv.id === activeConversationId) el.classList.add('active');

          el.innerHTML = `
            <div class="conversation-meta">
              <div class="conversation-name">Customer</div>
              <div class="conversation-status ${conv.status}">${conv.status}</div>
            </div>
          `;

          el.addEventListener('click', () => {
            document.querySelectorAll('.conversation-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            openConversation(conv.id, "Customer");
            if (window.innerWidth <= 768) {
              sidebar.classList.add('hidden');
            }
          });

          conversationList.appendChild(el);
        });
      } catch (error) {
        console.error('Error loading conversations:', error);
        conversationList.innerHTML = '<div class="empty-state">Error loading conversations</div>';
      }
    }

    async function openConversation(convId, name) {
      activeConversationId = convId;
      activeChatTitle.textContent = name;
      inputArea.style.display = 'flex';
      messagesContainer.innerHTML = '<div class="empty-state">Loading messages...</div>';

      try {
        const response = await fetch(`/api/v1/chat/messages?tenant_id=${tenantId}&conversation_id=${convId}`);
        if (!response.ok) throw new Error('Failed to load messages');

        const messages = await response.json();
        renderMessages(messages);
      } catch (error) {
        console.error('Error loading messages:', error);
        messagesContainer.innerHTML = '<div class="empty-state">Error loading messages</div>';
      }
    }

    function renderMessages(messages) {
      if (messages.length === 0) {
        messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>';
        return;
      }

      messagesContainer.innerHTML = '';
      messages.forEach(msg => {
        const isSentByMe = msg.sender_type === 'agent' || msg.sender_type === 'owner';
        const el = document.createElement('div');
        el.className = `message ${isSentByMe ? 'sent' : 'received'}`;

        const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        el.innerHTML = `
          <div>${msg.content}</div>
          <div class="message-meta">${time}</div>
        `;

        messagesContainer.appendChild(el);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage() {
      const content = messageInput.value.trim();
      if (!content || !activeConversationId) return;

      messageInput.value = '';

      // Optimistic render
      const tempEl = document.createElement('div');
      tempEl.className = 'message sent';
      tempEl.innerHTML = `
        <div>${content}</div>
        <div class="message-meta">Sending...</div>
      `;
      messagesContainer.appendChild(tempEl);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const response = await fetch('/api/v1/chat/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tenant_id: tenantId,
            conversation_id: activeConversationId,
            sender_type: 'owner',
            content: content
          })
        });

        if (!response.ok) throw new Error('Failed to send message');

        // Reload to get real timestamp
        openConversation(activeConversationId, activeChatTitle.textContent);
      } catch (error) {
        console.error('Error sending message:', error);
        tempEl.querySelector('.message-meta').textContent = 'Failed to send';
        tempEl.querySelector('.message-meta').style.color = '#FF3B30';
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // Initial load
    loadConversations();

    // Auto refresh
    setInterval(() => {
      if (!activeConversationId) {
        loadConversations();
      } else {
        openConversation(activeConversationId, activeChatTitle.textContent);
      }
    }, 10000);
  </script>
</body>
</html>
