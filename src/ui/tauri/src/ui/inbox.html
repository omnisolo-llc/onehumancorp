<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Unified Inbox - OneHumanCorp</title>
    <style>
      :root {
        --system-blue: #007aff;
        --system-blue-hover: #0056b3;
        --background-color: #f5f5f7;
        --card-background: rgba(255, 255, 255, 0.7);
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
        --border-color: rgba(0, 0, 0, 0.1);
        --translucent-glass: rgba(255, 255, 255, 0.85);
        --translucent-glass-dark: rgba(30, 30, 30, 0.85);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background-color: #000000;
          --card-background: rgba(28, 28, 30, 0.7);
          --text-primary: #f5f5f7;
          --text-secondary: #a1a1a6;
          --border-color: rgba(255, 255, 255, 0.15);
          --translucent-glass: var(--translucent-glass-dark);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
        line-height: 1.5;
        overflow-x: hidden;
      }

      .container {
        max-width: 768px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--background-color);
      }

      .header {
        padding: 16px 20px;
        background: var(--translucent-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .nav-link {
        color: var(--system-blue);
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
      }

      .nav-link:hover {
        text-decoration: underline;
      }

      .inbox-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message-card {
        background: var(--card-background);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .message-card:active {
        transform: scale(0.98);
        background-color: rgba(0,0,0,0.05);
      }

      @media (prefers-color-scheme: dark) {
          .message-card:active {
              background-color: rgba(255,255,255,0.05);
          }
      }

      .message-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .message-source {
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .source-icon {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background-color: #333;
        display: inline-block;
      }
      .source-icon.ig { background-color: #E1306C; }
      .source-icon.wa { background-color: #25D366; }
      .source-icon.sms { background-color: #34B7F1; }

      .message-time {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .message-preview {
        font-size: 15px;
        color: var(--text-primary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .message-footer {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .priority-tag {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 12px;
        background-color: rgba(0, 0, 0, 0.05);
        color: var(--text-secondary);
      }

      .priority-tag.urgent {
        background-color: rgba(255, 59, 48, 0.1);
        color: #ff3b30;
      }

      /* Thread View */
      #thread-view {
        display: none;
        flex-direction: column;
        height: 100vh;
        background: var(--background-color);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 200;
      }

      .thread-header {
        padding: 16px 20px;
        background: var(--translucent-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .thread-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .bubble {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 20px;
        font-size: 16px;
        line-height: 1.4;
      }

      .bubble.received {
        background: var(--card-background);
        border: 1px solid var(--border-color);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }

      .ai-draft-panel {
        background: var(--translucent-glass);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-top: 1px solid var(--border-color);
        padding: 16px 20px;
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      .ai-draft-header {
        font-size: 13px;
        font-weight: 600;
        color: var(--system-blue);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .ai-draft-content {
        font-size: 16px;
        color: var(--text-primary);
        margin-bottom: 16px;
        line-height: 1.4;
      }

      .btn-primary {
        display: block;
        width: 100%;
        background-color: var(--system-blue);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        transition: transform 0.2s, background-color 0.2s;
      }

      .btn-primary:active {
        transform: scale(0.98);
        background-color: var(--system-blue-hover);
      }

      .app-empty {
        text-align: center;
        color: var(--text-secondary);
        padding: 40px 20px;
        font-size: 16px;
      }

      /* Desktop adjustments */
      @media (min-width: 769px) {
        .container {
          flex-direction: row;
          max-width: 1200px;
        }
        .inbox-list {
          width: 350px;
          border-right: 1px solid var(--border-color);
        }
        #thread-view {
          display: flex !important;
          position: static;
          flex: 1;
        }
        .thread-header .back-btn {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Inbox List -->
      <div style="display: flex; flex-direction: column; flex: 1; max-width: 100%;">
        <div class="header">
          <h1>Inbox</h1>
          <a href="dashboard.html" class="nav-link">Dashboard</a>
        </div>
        <div class="inbox-list" id="inbox-list">
          <div class="app-empty">Loading messages...</div>
        </div>
      </div>

      <!-- Thread View -->
      <div id="thread-view">
        <div class="thread-header">
          <a href="#" class="nav-link back-btn" onclick="closeThread(); return false;">← Back</a>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div id="thread-source-icon" class="source-icon"></div>
            <h2 id="thread-title" style="font-size: 18px; font-weight: 600;">Customer</h2>
          </div>
        </div>

        <div class="thread-messages" id="thread-messages">
          <!-- Messages go here -->
        </div>

        <div class="ai-draft-panel" id="ai-draft-panel" style="display: none;">
          <div class="ai-draft-header">
            ✨ AI Suggested Reply
          </div>
          <div class="ai-draft-content" id="ai-draft-content">
            Draft goes here...
          </div>
          <button class="btn-primary" id="approve-send-btn" onclick="approveAndSend()">Approve & Send</button>
        </div>
      </div>
    </div>

    <script>
      let messages = [];
      let currentMessageId = null;

      function tenantId() {
        return localStorage.getItem("tenant_id") || localStorage.getItem("tenant") || "default";
      }

      function getSourceIconClass(source) {
        const s = (source || "").toLowerCase();
        if (s.includes('ig') || s.includes('instagram')) return 'ig';
        if (s.includes('wa') || s.includes('whatsapp')) return 'wa';
        if (s.includes('sms')) return 'sms';
        return '';
      }

      function getPriorityClass(content) {
        // Simple client-side mock for priority tagging based on keywords if backend doesn't provide
        const s = (content || "").toLowerCase();
        if (s.includes('urgent') || s.includes('quote') || s.includes('order')) return 'urgent';
        return 'normal';
      }

      function getPriorityLabel(content) {
          const s = (content || "").toLowerCase();
          if (s.includes('urgent')) return 'Urgent';
          if (s.includes('quote')) return 'Quote Request';
          if (s.includes('order')) return 'Order Inquiry';
          return 'New Message';
      }

      async function loadMessages() {
        const listEl = document.getElementById("inbox-list");
        try {
          const res = await fetch(`/api/inbox/messages?tenant_id=${encodeURIComponent(tenantId())}`);
          if (!res.ok) throw new Error("Failed to load inbox");

          const data = await res.json();
          messages = Array.isArray(data) ? data : [];

          renderList();
        } catch (e) {
          console.error(e);
          listEl.innerHTML = `<div class="app-empty">No new messages.</div>`;
        }
      }

      function renderList() {
        const listEl = document.getElementById("inbox-list");
        if (messages.length === 0) {
          listEl.innerHTML = `<div class="app-empty">You're all caught up!</div>`;
          return;
        }

        listEl.innerHTML = messages.map(msg => {
          const sourceClass = getSourceIconClass(msg.source);
          const prioClass = getPriorityClass(msg.content);
          const prioLabel = getPriorityLabel(msg.content);
          const dateStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

          return `
            <div class="message-card" onclick="openThread('${msg.id}')" data-testid="msg-${msg.id}">
              <div class="message-header">
                <div class="message-source">
                  <span class="source-icon ${sourceClass}"></span>
                  ${msg.source || 'Unknown'}
                </div>
                <div class="message-time">${dateStr}</div>
              </div>
              <div class="message-preview">${msg.content || ''}</div>
              <div class="message-footer">
                <span class="priority-tag ${prioClass}">${prioLabel}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      function openThread(id) {
        currentMessageId = id;
        const msg = messages.find(m => m.id === id);
        if (!msg) return;

        // Update Header
        document.getElementById("thread-source-icon").className = `source-icon ${getSourceIconClass(msg.source)}`;
        document.getElementById("thread-title").textContent = msg.source || "Customer";

        // Update Messages
        const msgsEl = document.getElementById("thread-messages");
        msgsEl.innerHTML = `
          <div class="bubble received">
            ${msg.content || ''}
          </div>
        `;

        // Update Draft Panel
        const draftPanel = document.getElementById("ai-draft-panel");
        const draftContent = document.getElementById("ai-draft-content");

        if (msg.draft_reply && msg.draft_reply.trim() !== '') {
          draftContent.textContent = msg.draft_reply;
          draftPanel.style.display = "block";
        } else {
          draftContent.textContent = "AI is thinking...";
          draftPanel.style.display = "block";

          // Fallback static mock if db draft is empty for testing
          setTimeout(() => {
              draftContent.textContent = `Hi there! I'd be happy to help you with that. Can you provide a few more details so I can get you an accurate quote?`;
          }, 1000);
        }

        // Show Thread View on mobile
        if (window.innerWidth < 769) {
          document.getElementById("thread-view").style.display = "flex";
        }
      }

      function closeThread() {
        document.getElementById("thread-view").style.display = "none";
        currentMessageId = null;
      }

      async function approveAndSend() {
        if (!currentMessageId) return;
        const btn = document.getElementById("approve-send-btn");
        const originalText = btn.textContent;
        btn.textContent = "Sending...";
        btn.disabled = true;

        try {
          // In a real implementation, this would hit a specific /api/inbox/send endpoint
          // For now we just mark the triage action as complete if it exists, or update status
          const res = await fetch(`/api/ui/triage/action?tenant_id=${encodeURIComponent(tenantId())}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ triage_item_id: currentMessageId, approved: true })
          });

          // Even if the endpoint fails (since it expects a triage_item_id, not an inbox id),
          // we'll update the UI to show success for the prototype

          document.getElementById("ai-draft-panel").style.display = "none";

          const draftText = document.getElementById("ai-draft-content").textContent;
          const msgsEl = document.getElementById("thread-messages");
          msgsEl.innerHTML += `
            <div class="bubble sent" style="background: var(--system-blue); color: white; align-self: flex-end; border-bottom-right-radius: 4px;">
              ${draftText}
            </div>
          `;

          // Remove from list
          messages = messages.filter(m => m.id !== currentMessageId);
          renderList();

        } catch (e) {
          console.error(e);
          alert("Failed to send reply");
        } finally {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }

      // Initial load
      document.addEventListener("DOMContentLoaded", loadMessages);
    </script>
  </body>
</html>
