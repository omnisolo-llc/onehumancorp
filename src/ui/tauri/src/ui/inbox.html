<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }

      .product-card {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 8px;
        padding: 8px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      .product-card-icon {
        background: #0066FF;
        color: white;
        border-radius: 4px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        font-weight: bold;
      }
      .product-card-details {
        flex: 1;
      }
      .product-card-title {
        font-size: 14px;
        font-weight: 600;
        color: #1d1d1f;
        margin: 0;
      }
      .product-card-link {
        font-size: 12px;
        color: #0066FF;
        text-decoration: none;
        word-break: break-all;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Unified Inbox</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .header-section {
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        margin-top: 0;
      }
      .subtitle {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 16px;
      }
      .message-card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        border: 1px solid #e5e5ea;
      }
      .message-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
        color: #86868b;
        font-weight: 600;
      }
      .message-source {
        background: #f1f5f9;
        padding: 4px 8px;
        border-radius: 6px;
        color: #0f172a;
      }
      .message-content {
        font-size: 15px;
        color: #1d1d1f;
        margin-bottom: 12px;
        line-height: 1.4;
      }
      .draft-reply {
        background: #f8fafc;
        border-left: 3px solid #0066FF;
        padding: 12px;
        border-radius: 4px 8px 8px 4px;
        margin-bottom: 16px;
      }
      .draft-reply-label {
        font-size: 11px;
        font-weight: 700;
        color: #0066FF;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: block;
      }
      .draft-reply-content {
        font-size: 14px;
        color: #334155;
      }
      .approve-btn {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: transform 0.1s, background-color 0.2s;
      }
      .approve-btn:active {
        transform: scale(0.98);
      }
      .approve-btn.approved {
        background-color: #34C759;
        cursor: default;
      }
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #86868b;
        font-size: 15px;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 16px;
        color: #0066FF;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }

      .product-card {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 8px;
        padding: 8px;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      .product-card-icon {
        background: #0066FF;
        color: white;
        border-radius: 4px;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        font-weight: bold;
      }
      .product-card-details {
        flex: 1;
      }
      .product-card-title {
        font-size: 14px;
        font-weight: 600;
        color: #1d1d1f;
        margin: 0;
      }
      .product-card-link {
        font-size: 12px;
        color: #0066FF;
        text-decoration: none;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container glassmorphism">
      <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
      <div class="header-section">
        <div>
          <h1>Agentic Inbox</h1>
          <div class="subtitle">Unified messages with AI-drafted replies</div>
        </div>
      </div>

      <div id="inbox-queue">
        <div class="empty-state">Loading messages...</div>
      </div>
    </div>

    <script>
      let currentWebSocket = null;
      let inboxConversations = [];

      async function loadInbox() {
        const queueEl = document.getElementById('inbox-queue');
        try {
          const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default';

          // Connect to the new Native WebSocket endpoint
          setupWebSocket(tenantId);

          // Fetch existing inboxes/conversations (Normally you would fetch inbox list then conversations, but for the MVP UI we'll fetch default inbox or mock it)
          const inboxesRes = await fetch('/api/v1/chat/inboxes', {
              headers: { 'Authorization': `Bearer ${localStorage.getItem('ohc_token')}` }
          });
          if (inboxesRes.ok) {
              const inboxes = await inboxesRes.json();
              if (inboxes.length > 0) {
                 const inboxId = inboxes[0].id;
                 const convsRes = await fetch(`/api/v1/chat/inboxes/${inboxId}/conversations`, {
                     headers: { 'Authorization': `Bearer ${localStorage.getItem('ohc_token')}` }
                 });
                 if (convsRes.ok) {
                     inboxConversations = await convsRes.json();
                 }
              }
          }

          // Fallback legacy API fetch if new API returns nothing (to avoid breaking tests abruptly)
          const res = await fetch(`/api/v1/ui/inbox/messages?tenant_id=${encodeURIComponent(tenantId)}&mobile_optimized=false`);
          if (!res.ok) throw new Error("Failed to load inbox");

          const messages = await res.json();
          renderMessages(messages, queueEl, tenantId);
        } catch (err) {
          console.error(err);
          queueEl.innerHTML = `<div class="empty-state" style="color:#FF3B30;">Failed to load inbox. ${err.message}</div>`;
        }
      }

      function setupWebSocket(tenantId) {
        if (currentWebSocket) {
            currentWebSocket.close();
        }

        const token = localStorage.getItem('ohc_token');
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/api/v1/chat/ws?token=${encodeURIComponent(token)}`;

        currentWebSocket = new WebSocket(wsUrl);

        currentWebSocket.onopen = () => {
            console.log('Native Chat WebSocket connected');
        };

        currentWebSocket.onmessage = (event) => {
            try {
                const message = JSON.parse(event.data);
                console.log('Received real-time message via WS:', message);

                // Dynamically append new message to the UI
                const queueEl = document.getElementById('inbox-queue');
                const emptyState = queueEl.querySelector('.empty-state');
                if (emptyState) {
                    emptyState.remove();
                }

                // Map the native chat_message to the UI's expected format
                const mappedMsg = {
                    id: message.id,
                    source: message.sender_type || 'Customer',
                    sender_id: message.sender_id || 'Unknown',
                    original_message: message.content,
                    content: message.content,
                    status: 'unread',
                    generated_response: ''
                };

                // Check if we need to call AI to generate a response (normally Ambassador agent does this via JobQueue)
                renderSingleMessage(mappedMsg, queueEl, tenantId, true);
            } catch (e) {
                console.error('Error parsing WS message', e);
            }
        };

        currentWebSocket.onclose = () => {
            console.log('Native Chat WebSocket disconnected');
            // Try to reconnect in 5 seconds
            setTimeout(() => setupWebSocket(tenantId), 5000);
        };
      }

      function renderSingleMessage(msg, container, tenantId, prepend = false) {
          const card = document.createElement('div');
          card.className = 'message-card';

          const header = document.createElement('div');
          header.className = 'message-header';

          const sourceSpan = document.createElement('span');
          sourceSpan.className = 'message-source';
          sourceSpan.textContent = msg.source || 'Unknown';

          const senderSpan = document.createElement('span');
          senderSpan.textContent = msg.sender_id || '';

          header.appendChild(sourceSpan);
          header.appendChild(senderSpan);

          const contentDiv = document.createElement('div');
          contentDiv.className = 'message-content';
          contentDiv.textContent = msg.original_message || msg.content || '';

          card.appendChild(header);
          card.appendChild(contentDiv);

          if (msg.generated_response && msg.generated_response.trim() !== '') {
            const draftDiv = document.createElement('div');
            draftDiv.className = 'draft-reply';

            const draftLabel = document.createElement('span');
            draftLabel.className = 'draft-reply-label';
            draftLabel.textContent = '✨ AI Drafted Reply';

            const draftContent = document.createElement('div');
            draftContent.className = 'draft-reply-content';
            draftContent.textContent = msg.generated_response;

            draftDiv.appendChild(draftLabel);
            draftDiv.appendChild(draftContent);

            if (msg.checkout_link) {
              const productCard = document.createElement('div');
              productCard.className = 'product-card glassmorphism';

              const productIcon = document.createElement('div');
              productIcon.className = 'product-card-icon';
              productIcon.textContent = '🛍️';

              const productDetails = document.createElement('div');
              productDetails.className = 'product-card-details';

              const productTitle = document.createElement('p');
              productTitle.className = 'product-card-title';
              productTitle.textContent = msg.proposed_product_id ? `Product: ${msg.proposed_product_id}` : 'Checkout Link';

              const productLink = document.createElement('a');
              productLink.className = 'product-card-link';
              productLink.href = msg.checkout_link;
              productLink.target = '_blank';
              productLink.textContent = msg.checkout_link;

              productDetails.appendChild(productTitle);
              productDetails.appendChild(productLink);
              productCard.appendChild(productIcon);
              productCard.appendChild(productDetails);

              draftDiv.appendChild(productCard);
            }


            const approveBtn = document.createElement('button');
            approveBtn.className = 'approve-btn';
            approveBtn.textContent = 'Approve & Send';
            approveBtn.onclick = () => approveAndSend(msg.id, approveBtn, tenantId, msg.conversation_id, msg.generated_response);

            card.appendChild(draftDiv);
            card.appendChild(approveBtn);
          } else {
            const draftLabel = document.createElement('div');
            draftLabel.className = 'draft-reply-label';
            draftLabel.style.color = '#86868b';
            draftLabel.textContent = 'No AI draft available';
            card.appendChild(draftLabel);

            // Add a manual reply input
            const manualReply = document.createElement('input');
            manualReply.type = 'text';
            manualReply.placeholder = 'Type a reply...';
            manualReply.style.width = '100%';
            manualReply.style.padding = '8px';
            manualReply.style.marginTop = '8px';
            manualReply.style.borderRadius = '8px';
            manualReply.style.border = '1px solid #ccc';
            card.appendChild(manualReply);

            const sendBtn = document.createElement('button');
            sendBtn.className = 'approve-btn';
            sendBtn.style.marginTop = '8px';
            sendBtn.textContent = 'Send Reply';
            sendBtn.onclick = () => approveAndSend(msg.id, sendBtn, tenantId, msg.conversation_id || 'unknown', manualReply.value);
            card.appendChild(sendBtn);
          }

          if (prepend) {
              container.insertBefore(card, container.firstChild);
          } else {
              container.appendChild(card);
          }
      }

      function renderMessages(messages, container, tenantId) {
        if (!messages || messages.length === 0) {
          container.innerHTML = '<div class="empty-state">Inbox zero. All caught up!</div>';
          return;
        }

        // Filter out sent/resolved messages to keep it an action-oriented queue
        const actionItems = messages.filter(m => m.status !== 'sent' && m.status !== 'resolved');

        if (actionItems.length === 0) {
          container.innerHTML = '<div class="empty-state">Inbox zero. All caught up!</div>';
          return;
        }

        container.innerHTML = '';

        actionItems.forEach(msg => renderSingleMessage(msg, container, tenantId));
      }

      async function approveAndSend(messageId, btnElement, tenantId, conversationId, content) {
        const originalText = btnElement.textContent;
        btnElement.textContent = 'Sending...';
        btnElement.disabled = true;

        try {
          // If we have a conversation_id, use the new Native Chat API
          if (conversationId && conversationId !== 'unknown') {
             const res = await fetch(`/api/v1/chat/conversations/${conversationId}/messages`, {
                 method: 'POST',
                 headers: {
                     'Content-Type': 'application/json',
                     'Authorization': `Bearer ${localStorage.getItem('ohc_token')}`
                 },
                 body: JSON.stringify({ content: content })
             });
             if (!res.ok) throw new Error("Native API send failed");
          } else {
             // Fallback to legacy
             const res = await fetch(`/api/v1/ui/inbox/messages/${messageId}/approve?tenant_id=${encodeURIComponent(tenantId)}`, {
               method: 'POST'
             });
             if (!res.ok) throw new Error("Approval failed");
          }

          btnElement.textContent = 'Sent! ✅';
          btnElement.classList.add('approved');

          // Hide the card after a short delay
          setTimeout(() => {
            const card = btnElement.closest('.message-card');
            if (card) {
              card.style.opacity = '0';
              card.style.transform = 'scale(0.95)';
              card.style.transition = 'all 0.3s ease';
              setTimeout(() => card.remove(), 300);
            }
          }, 1500);

        } catch (err) {
          console.error(err);
          alert("Failed to send message: " + err.message);
          btnElement.textContent = originalText;
          btnElement.disabled = false;
        }
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', loadInbox);
    </script>
    <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
