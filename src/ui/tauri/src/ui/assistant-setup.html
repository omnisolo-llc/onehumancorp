<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant - OHC</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .agent-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(0, 102, 255, 0.05);
        border: 1px solid rgba(0, 102, 255, 0.1);
        border-radius: 10px;
        margin-bottom: 8px;
        text-align: left;
        font-size: 13px;
        color: #1d1d1f;
      }
      .agent-badge i { font-size: 18px; }
      @media (prefers-color-scheme: dark) {
        .agent-badge {
          background: rgba(255, 255, 255, 0.05);
          border-color: rgba(255, 255, 255, 0.1);
          color: #f5f5f7;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="form-container">
      <div class="step-indicator">
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>

      <h1>Your AI Team</h1>
      <p style="color: #86868b; margin-bottom: 24px;">Configure your primary assistant and meet your team.</p>

      <div style="text-align: left; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Assistant Name</div>
      <input type="text" id="assistant-name" placeholder="e.g. Jarvis" />
      <div id="name-error" class="error-msg">Please enter a name (min 3 chars).</div>

      <div style="text-align: left; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Tone</div>
      <select id="assistant-tone">
        <option value="" disabled selected>Select a tone</option>
        <option value="Professional">💼 Professional</option>
        <option value="Friendly">👋 Friendly</option>
        <option value="Concise">⚡ Concise</option>
      </select>
      <div id="tone-error" class="error-msg">Please select a tone.</div>

      <div style="text-align: left; margin-top: 20px; margin-bottom: 12px; font-weight: 600; font-size: 14px;">Your Automatic Department Agents</div>
      <div id="agent-team">
        <div class="agent-badge"><span>📋 The Manager (Operations)</span></div>
        <div class="agent-badge"><span>📣 The Promoter (Marketing)</span></div>
        <div class="agent-badge"><span>🤝 The Ambassador (Customer Success)</span></div>
      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px;">
        <button class="secondary" id="back-btn" style="flex: 1;">Back</button>
        <button id="next-btn" style="flex: 2;">Finish Setup</button>
      </div>
    </div>

    <script>
      const nextBtn = document.getElementById('next-btn');
      const backBtn = document.getElementById('back-btn');
      const nameInput = document.getElementById('assistant-name');
      const toneSelect = document.getElementById('assistant-tone');
      const nameError = document.getElementById('name-error');
      const toneError = document.getElementById('tone-error');
      const container = document.getElementById('form-container');

      async function loadState() {
        let state = {};
        if (window.__TAURI__ && window.__TAURI__.core) {
          try {
            state = await window.__TAURI__.core.invoke("get_onboarding_state");
          } catch (e) { console.error(e); }
        } else {
          state = JSON.parse(localStorage.getItem('ohc_onboarding_state') || '{}');
        }

        if (state.assistantName) nameInput.value = state.assistantName;
        if (state.assistantTone) toneSelect.value = state.assistantTone;
      }

      loadState();

      backBtn.addEventListener('click', () => {
        window.location.href = "setup.html";
      });

      nextBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        const tone = toneSelect.value;
        let isValid = true;

        if (name.length < 3) {
          nameError.style.display = 'block';
          nameInput.style.borderColor = '#FF3B30';
          isValid = false;
        } else {
          nameError.style.display = 'none';
          nameInput.style.borderColor = '';
        }

        if (!tone) {
          toneError.style.display = 'block';
          toneSelect.style.borderColor = '#FF3B30';
          isValid = false;
        } else {
          toneError.style.display = 'none';
          toneSelect.style.borderColor = '';
        }

        if (isValid) {
          const newState = { assistantName: name, assistantTone: tone };

          if (window.__TAURI__ && window.__TAURI__.core) {
            nextBtn.disabled = true;
            nextBtn.innerText = "Finalizing...";
            try {
              const state = await window.__TAURI__.core.invoke("get_onboarding_state");
              Object.assign(state, newState);
              await window.__TAURI__.core.invoke("save_onboarding_state", { state });
              window.location.href = "success.html";
            } catch (err) {
              console.error(err);
              nextBtn.disabled = false;
              nextBtn.innerText = "Finish Setup";
            }
          } else {
            const state = JSON.parse(localStorage.getItem('ohc_onboarding_state') || '{}');
            Object.assign(state, newState);
            localStorage.setItem('ohc_onboarding_state', JSON.stringify(state));
            window.location.href = "success.html";
          }
        } else {
          container.classList.remove('animate-shake');
          void container.offsetWidth;
          container.classList.add('animate-shake');
        }
      });
    </script>
  </body>
</html>
