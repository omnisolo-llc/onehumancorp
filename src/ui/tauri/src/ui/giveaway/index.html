<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Giveaway Generator</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 450px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    h1 {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }
    h2 {
      color: #1d1d1f;
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }
    label {
      display: block;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.8);
      font-family: inherit;
    }
    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }
    button:hover { background-color: #0052cc; }
    button:active { transform: scale(0.98); }
    button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }

    #result-area {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }
    #result-area p {
      font-weight: 600;
      color: #0066FF;
      margin-top: 0;
      text-align: center;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #0066FF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Viral Giveaway Generator</h1>
    <h2>Giveaway Details</h2>

    <div>
      <label for="title">Prize / Title</label>
      <input type="text" id="title" placeholder="e.g. Win a Free iPad" />
    </div>

    <div>
      <label for="desc">Description</label>
      <textarea id="desc" rows="3" placeholder="Enter instructions to win..."></textarea>
    </div>

    <button id="generate-btn">Generate Giveaway Link</button>

    <div id="result-area">
      <p>Link Ready!</p>
      <input type="text" id="generated-url" readonly />
    </div>
  </div>
  <a href="/dashboard" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();

      if (!title || !desc) {
        alert("Please fill in both title and description.");
        return;
      }

      const baseUrl = window.location.origin;
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';
      fetch('/api/v1/growth/referrals/generate', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
          }
      }).then(res => res.json()).then(data => {
          const params = new URLSearchParams({
            title: title,
            desc: desc,
            ref: data.referral_link.split('/').pop() || 'giveaway_' + Date.now()
          });
          const generatedUrl = `${baseUrl}/giveaway/enter?${params.toString()}`;

          document.getElementById('generated-url').value = generatedUrl;
          document.getElementById('result-area').style.display = 'block';
      }).catch(err => {
          console.error(err);
          const params = new URLSearchParams({
            title: title,
            desc: desc,
            ref: 'giveaway_' + Date.now()
          });
          const generatedUrl = `${baseUrl}/giveaway/enter?${params.toString()}`;

          document.getElementById('generated-url').value = generatedUrl;
          document.getElementById('result-area').style.display = 'block';
      });
    });
  </script>
    <script src="../tooltips.js"></script>
<script src="../help-chat.js"></script>
  </body>
</html>
