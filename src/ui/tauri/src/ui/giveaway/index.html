<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Giveaway Generator | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
        --bg-color: #f5f5f7;
        --text-color: #1d1d1f;
        --card-bg: rgba(255, 255, 255, 0.65);
        --card-border: rgba(255, 255, 255, 0.4);
        --primary: #0066FF;
        --primary-hover: #0052cc;
        --input-bg: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-color: #16161a;
            --text-color: #f5f5f7;
            --card-bg: rgba(22, 22, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(32, 32, 36, 0.8);
        }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

    .container {
      max-width: 450px;
      width: 100%;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(134, 134, 139, 0.3);
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: var(--input-bg);
      color: var(--text-color);
      font-family: "Inter", sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; transform: none; }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }

    #result-area p {
      font-weight: 600;
      color: var(--text-color);
      margin-top: 0;
      margin-bottom: 15px;
      text-align: center;
    }

    .action-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .link-group {
        display: flex;
        gap: 8px;
    }

    .link-group input {
        margin-bottom: 0;
        flex: 1;
        border-radius: 12px;
    }

    .btn-secondary {
        background-color: #1d1d1f;
        box-shadow: none;
    }
    .btn-secondary:hover { background-color: #000; }

    @media (prefers-color-scheme: dark) {
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
        opacity: 0.8;
    }

    footer {
      margin-top: 40px;
      text-align: center;
    }

    .footer-link {
        color: #86868b;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s;
    }

    .footer-link:hover {
        color: var(--text-color);
    }

    .loading-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .btn-text {
        display: inline;
    }

    .btn-loading .btn-text { display: none; }
    .btn-loading .loading-spinner { display: block; }

    .branding-toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(134, 134, 139, 0.05);
        border-radius: 12px;
        border: 1px solid rgba(134, 134, 139, 0.1);
    }
    .branding-toggle-container span {
        font-weight: 500;
        font-size: 14px;
        color: var(--text-color);
    }
    .branding-toggle-container .pro-badge {
        background: linear-gradient(135deg, #0066FF, #00C6FF);
        color: white;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 700;
        margin-left: 8px;
        letter-spacing: 0.5px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0066FF;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    #paywall-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .paywall-content {
      background: var(--bg-color);
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
    }
    .paywall-content h3 { margin-top: 0; font-size: 22px; }
    .paywall-content p { color: #86868b; line-height: 1.5; margin-bottom: 25px; }
  </style>
</head>
<body>
  <div class="container glassmorphism">
    <div style="font-size: 48px; text-align: center; margin-bottom: 10px;">🎁</div>
    <h1>Viral Giveaway Generator</h1>
    <h2>Giveaway Details</h2>

    <div>
      <label for="title">Prize / Title</label>
      <input type="text" id="title" placeholder="e.g. Win a Free iPad" />
    </div>

    <div>
      <label for="desc">Description</label>
      <textarea id="desc" rows="4" placeholder="Enter instructions to win..."></textarea>
    </div>

    <div class="branding-toggle-container">
      <div>
        <span>Remove OHC Branding</span>
        <span class="pro-badge">Pro Feature</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="branding-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="generate-btn">
        <span class="btn-text">Generate Giveaway Link</span>
        <div class="loading-spinner"></div>
    </button>

    <div id="result-area">
      <p>✨ Your Viral Link is Ready! ✨</p>

      <div class="action-group">
          <div class="link-group">
            <input type="text" id="generated-url" readonly />
            <button id="copy-btn" style="width: auto; padding: 14px 20px;" class="btn-secondary">Copy</button>
          </div>
          <button id="share-x-btn" style="background-color: #000; box-shadow: none;">Share on X</button>
      </div>
    </div>
  </div>

  <a href="/dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <footer>
    <a href="/api/v1/growth/referrals/click?target=/setup.html&ref=giveaway_footer" target="_blank" class="footer-link">⚡ Powered by OHC</a>
  </footer>

  <div id="paywall-modal">
    <div class="paywall-content">
      <div style="font-size: 48px; margin-bottom: 15px;">⭐</div>
      <h3>Upgrade to Pro</h3>
      <p>Removing the "Powered by OHC" branding is a Pro feature. Upgrade your workspace to build completely white-labeled experiences.</p>
      <button onclick="window.location.href='/pricing.html'" style="width: 100%; margin-bottom: 10px;">View Plans</button>
      <button class="btn-secondary" onclick="document.getElementById('paywall-modal').style.display='none'" style="width: 100%;">Maybe Later</button>
    </div>
  </div>

  <script>
    const hasPro = localStorage.getItem('has_pro') === 'true';
    const brandingToggle = document.getElementById('branding-toggle');

    brandingToggle.addEventListener('change', (e) => {
        if (!hasPro) {
            e.preventDefault();
            brandingToggle.checked = false;
            document.getElementById('paywall-modal').style.display = 'flex';
        } else {
            // Update preview or footer logic if needed
            const footerLink = document.querySelector('.footer-link');
            if (footerLink) {
                footerLink.style.display = brandingToggle.checked ? 'none' : 'inline';
            }
        }
    });

    document.getElementById('generate-btn').addEventListener('click', () => {
      const title = document.getElementById('title').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const btn = document.getElementById('generate-btn');

      if (!title || !desc) {
        alert("Please fill in both title and description.");
        return;
      }

      btn.classList.add('btn-loading');
      btn.disabled = true;

      const baseUrl = window.location.origin;
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

      fetch('/api/v1/growth/referrals/generate', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json',
              'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
          }
      }).then(res => res.json()).then(data => {
          const params = new URLSearchParams({
            title: title,
            desc: desc,
            ref: data.referral_link ? data.referral_link.split('/').pop() : 'giveaway_' + Date.now()
          });
          if (brandingToggle.checked && hasPro) {
              params.append('branding', 'false');
          }
          const generatedUrl = `${baseUrl}/giveaway/enter?${params.toString()}`;

          showResult(generatedUrl);
      }).catch(err => {
          console.error(err);
          // Fallback
          const params = new URLSearchParams({
            title: title,
            desc: desc,
            ref: 'giveaway_' + Date.now()
          });
          if (brandingToggle.checked && hasPro) {
              params.append('branding', 'false');
          }
          const generatedUrl = `${baseUrl}/giveaway/enter?${params.toString()}`;

          showResult(generatedUrl);
      }).finally(() => {
          btn.classList.remove('btn-loading');
          btn.disabled = false;
      });
    });

    function showResult(url) {
        document.getElementById('generated-url').value = url;
        document.getElementById('result-area').style.display = 'block';
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
        const urlInput = document.getElementById('generated-url');
        urlInput.select();
        document.execCommand('copy');

        const btn = document.getElementById('copy-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.backgroundColor = '#34C759';

        setTimeout(() => {
            btn.textContent = originalText;
            btn.style.backgroundColor = '';
        }, 2000);
    });

    document.getElementById('share-x-btn').addEventListener('click', () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('generated-url').value;
        const text = `I'm running a new giveaway: ${title}! Enter to win here:\n\n${url}\n\n⚡ Powered by OHC`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
    });
  </script>
</body>
</html>
