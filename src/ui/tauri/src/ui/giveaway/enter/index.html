<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giveaway Entry</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-align: center;
    }
    h1 {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 10px;
    }
    p {
      color: #86868b;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    input[type="email"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.65);
      font-family: inherit;
    }
    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
      margin-bottom: 20px;
    }
    button:hover { background-color: #0052cc; }
    button:active { transform: scale(0.98); }

    #success-area {
      display: none;
      margin-top: 10px;
    }
    #success-area h2 {
      color: #25D366;
      font-size: 20px;
      margin-bottom: 10px;
    }
    #success-area p.bonus {
      color: #1d1d1f;
      font-weight: 600;
    }

    footer {
      margin-top: 30px;
      text-align: center;
    }
    footer a {
      color: #86868b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    footer a:hover {
      color: #1d1d1f;
    }

      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
<style>
@media (prefers-color-scheme: dark) {
    body {
        background-color: #16161a;
        color: #f5f5f7;
    }
    .container {
        background: rgba(22, 22, 26, 0.7) !important;
        backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    h1, h2, p, label {
        color: #f5f5f7;
    }
    input {
        background: rgba(32, 32, 36, 0.8) !important;
        color: #f5f5f7;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
}
</style>
</head>
<body>
  <div class="container" id="entry-form-container">
    <h1 id="giveaway-title">Loading Giveaway...</h1>
    <p id="giveaway-desc"></p>

    <div id="form-area">
      <input type="email" id="email-input" placeholder="Enter your email" required />
      <button id="enter-btn">Enter Giveaway</button>
    </div>

    <div id="success-area">
      <h2>You're Entered!</h2>
      <p class="bonus">Share this link to get 3 bonus entries!</p>
      <input type="text" id="share-link" readonly />
    </div>
  </div>

  <footer>
    <a href="/setup.html?ref=giveaway_footer">⚡ Powered by OHC</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title') || 'Exclusive Giveaway';
      const desc = params.get('desc') || 'Enter your email below for a chance to win.';

      document.getElementById('giveaway-title').textContent = title;
      document.getElementById('giveaway-desc').textContent = desc;

      // Update page title
      document.title = title;

      document.getElementById('enter-btn').addEventListener('click', () => {
        const email = document.getElementById('email-input').value.trim();
        if (!email) {
          alert('Please enter a valid email.');
          return;
        }

        fetch('/api/v1/growth/storefront/track', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: email, event_type: "giveaway_entry" })
        }).catch(e => console.error(e));

        // Hide form, show success
        document.getElementById('form-area').style.display = 'none';

        // Generate share link
        const currentUrl = window.location.href.replace(/\/index\.html\?/, '/?').replace(/\/index\.html$/, '/');
        document.getElementById('share-link').value = currentUrl;
        document.getElementById('success-area').style.display = 'block';

        const refId = params.get('ref');
        if (refId) {
            fetch('/api/v1/growth/referrals/click', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: refId })
            }).catch(e => console.error(e));
        }
      });
    });
  </script>
</body>
</html>
