<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pre-Orders</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px;
      }
      .container {
        max-width: 375px;
        width: 100%;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 20px;
        box-sizing: border-box;
      }
      h1 {
        color: #1d1d1f;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 20px;
        text-align: center;
      }
      .order-item {
        padding: 16px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        margin-bottom: 12px;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .customer-name {
        font-weight: 600;
        color: #1d1d1f;
      }
      .order-status {
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #e8f5e9;
        color: #2e7d32;
      }
      .order-details {
        font-size: 14px;
        color: #86868b;
      }
      .back-btn {
        margin-top: 20px;
        background: none;
        border: none;
        color: #0066FF;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: block;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .container {
          background: rgba(22, 22, 26, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { color: #f5f5f7; }
        .order-item {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .customer-name { color: #f5f5f7; }
        .order-details { color: #a1a1a6; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Pre-Orders</h1>
      <div id="order-list">
        <p style="text-align: center; color: #86868b;">Fetching orders...</p>
      </div>
      <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <script>
      async function loadOrders() {
        const orderList = document.getElementById('order-list');
        try {
          const orders = await window.__TAURI__.core.invoke('get_local_orders');

          if (orders.length === 0) {
            orderList.innerHTML = '<p style="text-align: center; color: #86868b;">No pending orders found locally.</p>';
            return;
          }

          orderList.innerHTML = orders.map(o => `
            <div class="order-item">
              <div class="order-header">
                <span class="customer-name">${o.customerName || 'Guest'}</span>
                <span class="order-status">${o.status}</span>
              </div>
              <div class="order-details">
                Order #${o.id.substring(0, 8)}<br>
                Amount: $${o.totalAmount.toFixed(2)}<br>
                <small>${o.createdAt}</small>
              </div>
            </div>
          `).join('');
        } catch (err) {
          console.error(err);
          orderList.innerHTML = '<p style="text-align: center; color: #86868b;">Error loading local orders.</p>';
        }
      }

      document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
  </body>
</html>
