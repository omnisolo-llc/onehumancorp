<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Public Profile</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --primary-color: #0066FF;
      --secondary-text: #86868b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #16161a;
        --text-color: #F5F5F7;
        --secondary-text: #A1A1A6;
      }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .preview-wrapper {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      position: relative;
    }

    @media (prefers-color-scheme: dark) {
      .preview-wrapper {
        background: #222;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      }
    }

    .preview-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 120px;
      position: relative;
    }

    .preview-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @media (prefers-color-scheme: dark) {
      .preview-avatar {
        background: #333;
        border-color: #222;
      }
    }

    .preview-content {
      padding: 64px 32px 32px;
      text-align: center;
    }

    .preview-name {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
      color: #111;
    }

    @media (prefers-color-scheme: dark) {
      .preview-name {
        color: #eee;
      }
    }

    .preview-role {
      font-size: 14px;
      color: var(--primary-color);
      font-weight: 600;
      margin: 0 0 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-desc {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    @media (prefers-color-scheme: dark) {
      .preview-desc {
        color: #aaa;
      }
    }

    .preview-btn {
      background: #111;
      color: white;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      display: inline-block;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: opacity 0.2s;
    }

    .preview-btn:hover {
      opacity: 0.9;
    }

    @media (prefers-color-scheme: dark) {
      .preview-btn {
        background: #eee;
        color: #111;
      }
    }

    .preview-footer {
      border-top: 1px solid #eaeaea;
      padding: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      .preview-footer {
        border-top-color: #333;
      }
    }

    .preview-footer a {
      color: #888;
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .preview-footer a:hover {
      color: #555;
    }
  </style>
</head>
<body>

  <div class="preview-wrapper" id="preview-wrapper">
    <div class="preview-header">
      <div class="preview-avatar">🤖</div>
    </div>
    <div class="preview-content">
      <h4 class="preview-name" id="preview-name-el">Loading...</h4>
      <p class="preview-role" id="preview-role-el"></p>
      <p class="preview-desc" id="preview-desc-el"></p>

      <a href="#" class="preview-btn" onclick="alert('This is a demo button. Start a chat here.'); return false;">Chat with me</a>
    </div>
    <div class="preview-footer" id="preview-footer-el">
      <a href="#" id="branding-link" target="_blank">
        <span>⚡</span> Powered by OHC
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);

      const name = urlParams.get('name') || 'AI Agent';
      const role = urlParams.get('role') || 'Customer Support';
      const desc = urlParams.get('desc') || 'Hi there! I am ready to help you with anything you need.';
      const hideBranding = urlParams.get('hideBranding') === 'true';
      const tenant = urlParams.get('tenant') || 'default';

      document.title = `${name} - ${role}`;
      document.getElementById('preview-name-el').textContent = name;
      document.getElementById('preview-role-el').textContent = role;
      document.getElementById('preview-desc-el').textContent = desc;

      const footerEl = document.getElementById('preview-footer-el');
      if (hideBranding) {
        footerEl.style.display = 'none';
      } else {
        document.getElementById('branding-link').href = `/api/v1/growth/referrals/click?target=/onboarding&ref=${encodeURIComponent(tenant)}`;
      }
    });
  </script>






    <script src="tooltips.js"></script>
<script src="help-chat.js"></script>
  </body>
</html>
