<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Public Profile</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --primary-color: #0066FF;
      --secondary-text: #86868b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #16161a;
        --text-color: #F5F5F7;
        --secondary-text: #A1A1A6;
      }
    }

    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .preview-wrapper {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      position: relative;
    }

    @media (prefers-color-scheme: dark) {
      .preview-wrapper {
        background: #222;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      }
    }

    .preview-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 120px;
      position: relative;
    }

    .preview-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      position: absolute;
      bottom: -45px;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @media (prefers-color-scheme: dark) {
      .preview-avatar {
        background: #333;
        border-color: #222;
      }
    }

    .preview-content {
      padding: 64px 32px 32px;
      text-align: center;
    }

    .preview-name {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
      color: #111;
    }

    @media (prefers-color-scheme: dark) {
      .preview-name {
        color: #eee;
      }
    }

    .preview-role {
      font-size: 14px;
      color: var(--primary-color);
      font-weight: 600;
      margin: 0 0 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .preview-desc {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    @media (prefers-color-scheme: dark) {
      .preview-desc {
        color: #aaa;
      }
    }

    .preview-btn {
      background: #111;
      color: white;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      display: inline-block;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: opacity 0.2s;
    }

    .preview-btn:hover {
      opacity: 0.9;
    }

    @media (prefers-color-scheme: dark) {
      .preview-btn {
        background: #eee;
        color: #111;
      }
    }

    .preview-footer {
      border-top: 1px solid #eaeaea;
      padding: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      .preview-footer {
        border-top-color: #333;
      }
    }

    .preview-footer a {
      color: #888;
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .preview-footer a:hover {
      color: #555;
    }
  </style>
</head>
<body>

  <div class="preview-wrapper" id="preview-wrapper">
    <div class="preview-header">
      <div class="preview-avatar">🤖</div>
    </div>
    <div class="preview-content">
      <h4 class="preview-name" id="preview-name-el">Loading...</h4>
      <p class="preview-role" id="preview-role-el"></p>
      <p class="preview-desc" id="preview-desc-el"></p>

      <a href="#" class="preview-btn" onclick="alert('This is a demo button. Start a chat here.'); return false;">Chat with me</a>
    </div>
    <div class="preview-footer" id="preview-footer-el">
      <a href="#" id="branding-link" target="_blank">
        <span>⚡</span> Powered by OHC
      </a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);

      const name = urlParams.get('name') || 'AI Agent';
      const role = urlParams.get('role') || 'Customer Support';
      const desc = urlParams.get('desc') || 'Hi there! I am ready to help you with anything you need.';
      const hideBranding = urlParams.get('hideBranding') === 'true';
      const tenant = urlParams.get('tenant') || 'default';

      document.title = `${name} - ${role}`;
      document.getElementById('preview-name-el').textContent = name;
      document.getElementById('preview-role-el').textContent = role;
      document.getElementById('preview-desc-el').textContent = desc;

      const footerEl = document.getElementById('preview-footer-el');
      if (hideBranding) {
        footerEl.style.display = 'none';
      } else {
        document.getElementById('branding-link').href = `/api/v1/growth/referrals/click?target=/onboarding&ref=${encodeURIComponent(tenant)}`;
      }
    });
  </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject chat CSS
    const style = document.createElement('style');
    style.textContent = `
        #ohc-help-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #0066FF;
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }
        #ohc-help-btn:hover {
            transform: scale(1.05);
        }
        #ohc-help-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        #ohc-help-chat-overlay {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            max-height: calc(100vh - 120px);
            max-width: calc(100vw - 40px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 9998;
            overflow: hidden;
            font-family: "Outfit", sans-serif;
            transform-origin: bottom right;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #ohc-help-chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
        }
        #ohc-help-chat-header h3 {
            margin: 0;
            font-size: 16px;
            color: #1d1d1f;
        }
        #ohc-help-close {
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            padding: 5px;
        }
        #ohc-help-close:hover { color: #1d1d1f; }
        #ohc-help-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-user {
            align-self: flex-end;
            background: #0066FF;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-ai {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
            border-bottom-left-radius: 4px;
        }
        .msg-ai a {
            color: #0066FF;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }
        #ohc-help-input-area {
            padding: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.5);
        }
        #ohc-help-input {
            flex-grow: 1;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 10px 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        #ohc-help-input:focus { border-color: #0066FF; }
        #ohc-help-send {
            background: #0066FF;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (prefers-color-scheme: dark) {
            #ohc-help-chat-overlay {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
            }
            #ohc-help-chat-header, #ohc-help-input-area {
                background: rgba(0, 0, 0, 0.2);
                border-color: rgba(255, 255, 255, 0.1);
            }
            #ohc-help-chat-header h3 { color: #f5f5f7; }
            .msg-ai {
                background: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
            #ohc-help-input {
                background: rgba(0, 0, 0, 0.3);
                border-color: rgba(255, 255, 255, 0.2);
                color: white;
            }
        }
    `;
    document.head.appendChild(style);

    // Inject HTML
    const btn = document.createElement('button');
    btn.id = 'ohc-help-btn';
    btn.setAttribute('aria-label', 'Open help chat');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
    document.body.appendChild(btn);

    const overlay = document.createElement('div');
    overlay.id = 'ohc-help-chat-overlay';
    overlay.innerHTML = `
        <div id="ohc-help-chat-header">
            <h3>Ask AI Help</h3>
            <button id="ohc-help-close" aria-label="Close help chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="ohc-help-messages">
            <div class="msg msg-ai">Hi! I am your AI Help Agent! How can I assist you with OHC today?</div>
        </div>
        <div id="ohc-help-input-area">
            <input type="text" id="ohc-help-input" placeholder="Ask me anything..." />
            <button id="ohc-help-send" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    `;
    document.body.appendChild(overlay);

    const closeBtn = document.getElementById('ohc-help-close');
    const messages = document.getElementById('ohc-help-messages');
    const input = document.getElementById('ohc-help-input');
    const sendBtn = document.getElementById('ohc-help-send');

    btn.addEventListener('click', () => {
        overlay.style.display = 'flex';
        input.focus();
    });

    closeBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
    });

        async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        // Add user msg
        const uMsg = document.createElement('div');
        uMsg.className = 'msg msg-user';
        uMsg.textContent = text;
        messages.appendChild(uMsg);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        try {
            let url = '/api/chat';
            if (window.__TAURI__ && window.__TAURI__.core) {
                url = 'http://127.0.0.1:18789/api/chat';
            }
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();

            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg msg-ai';
            if (data.link && data.link.url) {
                aiMsg.innerHTML = `${data.reply}<br/><a href="${data.link.url}">${data.link.title}</a>`;
            } else {
                aiMsg.textContent = data.reply;
            }
            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
        } catch (e) {
            console.error(e);
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg msg-ai';
            aiMsg.textContent = 'Sorry, there was an error connecting to the help assistant.';
            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});

</script>







  <script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const tooltipStyle = document.createElement('style');
    tooltipStyle.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(tooltipStyle);

    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(console.error);
    }

    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    function showTooltip(e, text) {
        if (!text) return;
        tooltipEl.textContent = text;
        const rect = e.target.getBoundingClientRect();

        let top = rect.top - tooltipEl.offsetHeight - 10;
        let left = rect.left + (rect.width / 2) - (tooltipEl.offsetWidth / 2);

        if (top < 10) {
            top = rect.bottom + 10;
        }
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        tooltipEl.style.top = top + 'px';
        tooltipEl.style.left = left + 'px';
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    // Hover (desktop)
    document.addEventListener('mouseover', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target;
        if (target && typeof target.closest === 'function' && target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    let hideTimeout;

    document.addEventListener('touchstart', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;
        if (target) {
            clearTimeout(hideTimeout);
            touchTimeout = setTimeout(() => {
                showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        } else {
            // Tap anywhere else hides tooltip immediately
            hideTooltip();
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        // Do not hide immediately on mobile so user can read it.
        hideTimeout = setTimeout(() => {
            hideTooltip();
        }, 2500); // Hide after 2.5 seconds
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
    });

    // --- WALKTHROUGH LOGIC ---
    const walkthroughStyle = document.createElement('style');
    walkthroughStyle.textContent = `
        .ohc-walkthrough-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 9998;
            animation: fadeIn 0.3s ease;
        }
        .ohc-walkthrough-highlight {
            position: absolute;
            background: transparent;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 102, 255, 0.5);
            border: 2px solid #0066FF;
            border-radius: 12px;
            z-index: 9999;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .ohc-walkthrough-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            z-index: 10000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            font-family: "Outfit", -apple-system, sans-serif;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease, left 0.3s ease, top 0.3s ease;
        }
        .ohc-walkthrough-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-walkthrough-bubble {
                background: rgba(30, 30, 30, 0.9);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
        .ohc-walkthrough-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #1d1d1f;
        }
        @media (prefers-color-scheme: dark) { .ohc-walkthrough-title { color: #fff; } }
        .ohc-walkthrough-text {
            font-size: 14px;
            color: #6b7280;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }
        @media (prefers-color-scheme: dark) { .ohc-walkthrough-text { color: #a1a1aa; } }
        .ohc-walkthrough-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ohc-walkthrough-btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .ohc-walkthrough-btn-secondary {
            background: transparent;
            color: #6b7280;
            border: none;
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .ohc-walkthrough-close {
            position: absolute;
            top: 12px; right: 12px;
            background: transparent;
            border: none;
            color: #86868b;
            cursor: pointer;
            padding: 4px;
        }
    `;
    document.head.appendChild(walkthroughStyle);

    let currentSteps = [];
    let currentStepIndex = 0;
    let overlayEl = null;
    let highlightEl = null;
    let bubbleEl = null;

    function renderStep() {
        if (!currentSteps || currentStepIndex >= currentSteps.length) {
            endWalkthrough();
            return;
        }

        const step = currentSteps[currentStepIndex];
        const targetEl = document.querySelector(step.selector);

        if (!targetEl) {
            console.warn('Walkthrough target not found:', step.selector);
            endWalkthrough();
            return;
        }

        targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

        setTimeout(() => {
            const rect = targetEl.getBoundingClientRect();

            highlightEl.style.top = (rect.top - 5 + window.scrollY) + 'px';
            highlightEl.style.left = (rect.left - 5 + window.scrollX) + 'px';
            highlightEl.style.width = (rect.width + 10) + 'px';
            highlightEl.style.height = (rect.height + 10) + 'px';

            bubbleEl.innerHTML = `
                <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
                <h4 class="ohc-walkthrough-title">${step.title}</h4>
                <p class="ohc-walkthrough-text">${step.text}</p>
                <div class="ohc-walkthrough-controls">
                    ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                    <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                </div>
            `;

            let bubbleTop = rect.bottom + 15 + window.scrollY;
            let bubbleLeft = rect.left + (rect.width / 2) - 140 + window.scrollX;

            if (bubbleLeft < 10) bubbleLeft = 10;
            if (bubbleLeft + 280 > window.innerWidth - 10) bubbleLeft = window.innerWidth - 290;
            if (bubbleTop + 200 > window.innerHeight + window.scrollY) {
                bubbleTop = rect.top - 180 + window.scrollY;
            }

            bubbleEl.style.top = bubbleTop + 'px';
            bubbleEl.style.left = bubbleLeft + 'px';
            bubbleEl.classList.add('visible');

            bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;
            bubbleEl.querySelector('.next-btn').onclick = () => {
                bubbleEl.classList.remove('visible');
                setTimeout(() => {
                    currentStepIndex++;
                    renderStep();
                }, 300);
            };
            const prevBtn = bubbleEl.querySelector('.prev-btn');
            if (prevBtn) {
                prevBtn.onclick = () => {
                    bubbleEl.classList.remove('visible');
                    setTimeout(() => {
                        currentStepIndex--;
                        renderStep();
                    }, 300);
                };
            }

        }, 300);
    }

    function endWalkthrough() {
        if (overlayEl) {
            overlayEl.remove();
            overlayEl = null;
        }
        if (highlightEl) {
            highlightEl.remove();
            highlightEl = null;
        }
        if (bubbleEl) {
            bubbleEl.remove();
            bubbleEl = null;
        }
        currentSteps = [];
        currentStepIndex = 0;
    }

    window.startWalkthrough = function(steps) {
        if (!steps || steps.length === 0) return;
        currentSteps = steps;
        currentStepIndex = 0;

        endWalkthrough();

        overlayEl = document.createElement('div');
        overlayEl.className = 'ohc-walkthrough-overlay';

        highlightEl = document.createElement('div');
        highlightEl.className = 'ohc-walkthrough-highlight';

        bubbleEl = document.createElement('div');
        bubbleEl.className = 'ohc-walkthrough-bubble';

        document.body.appendChild(overlayEl);
        document.body.appendChild(highlightEl);
        document.body.appendChild(bubbleEl);

        renderStep();
    };
});

</script>
  </body>
</html>
