<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing Calculator Embed</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      color: #1d1d1f;
    }
    .widget-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      max-width: 100%;
    }
    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #86868b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .option-group {
      margin-bottom: 16px;
    }
    .option-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.2);
      background: white;
      font-family: inherit;
      font-size: 14px;
    }
    .total-area {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-label {
      font-weight: 600;
      font-size: 16px;
    }
    .total-price {
      font-weight: 700;
      font-size: 24px;
      color: #0066FF;
    }
    button {
      width: 100%;
      margin-top: 20px;
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }
    button:hover { background-color: #0052cc; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      body { color: #F5F5F7; }
      .widget-container {
        background: rgba(30, 30, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      p { color: #a1a1a6; }
      select {
        background: #1c1c1e;
        color: #F5F5F7;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .total-area { border-top: 1px solid rgba(255,255,255,0.1); }
      .total-price { color: #409CFF; }
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <h2 id="service-title">Pricing Calculator</h2>
    <p>Select options to instantly estimate your project cost.</p>

    <div class="option-group">
      <label for="speed">Delivery Speed</label>
      <select id="speed" onchange="calculate()">
        <option value="1">Standard (1-2 weeks)</option>
        <option value="1.5">Expedited (3-5 days) [+50%]</option>
        <option value="2">Rush (48 hours) [+100%]</option>
      </select>
    </div>

    <div class="option-group">
      <label for="scale">Project Scale</label>
      <select id="scale" onchange="calculate()">
        <option value="1">Small / Basic</option>
        <option value="2">Medium / Standard</option>
        <option value="3">Large / Complex</option>
      </select>
    </div>

    <div class="total-area">
      <span class="total-label">Estimated Total:</span>
      <span class="total-price" id="total-price">$0</span>
    </div>

    <button id="book-btn">Request Quote</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const serviceName = urlParams.get('service') || 'Custom Service';
    const basePriceStr = urlParams.get('base') || '500';
    let basePrice = parseFloat(basePriceStr) || 0;
    const tenantId = urlParams.get('tenant') || '';

    document.getElementById('service-title').innerText = `${serviceName} Estimate`;

    function calculate() {
      const speedMultiplier = parseFloat(document.getElementById('speed').value);
      const scaleMultiplier = parseFloat(document.getElementById('scale').value);

      const total = basePrice * speedMultiplier * scaleMultiplier;
      document.getElementById('total-price').innerText = '$' + total.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // Initial calculation
    calculate();

    document.getElementById('book-btn').addEventListener('click', () => {
      alert(`Quote requested for ${serviceName} at ${document.getElementById('total-price').innerText}. Powered by OHC.`);
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
