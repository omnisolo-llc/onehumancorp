<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OHC - Weekly Snapshot Share</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --text-main: #1d1d1f;
      --text-muted: #86868b;
      --primary: #0066FF;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: "Outfit", "Inter", sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      margin: 40px auto;
      padding: 40px;
      text-align: center;
      box-sizing: border-box;
    }

    .glassmorphism {
      border-radius: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    @media (prefers-color-scheme: dark) {
      .glassmorphism {
        background: rgba(22, 22, 26, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
      }
      body {
        color: #ffffff;
      }
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #1d1d1f, #0066FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (prefers-color-scheme: dark) {
      h1 {
        background: linear-gradient(90deg, #ffffff, #66b2ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-weight: 400;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    @media (prefers-color-scheme: dark) {
      .stat-card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #000000;
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .cta-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    .spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: var(--primary);
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-link {
      margin-top: 20px;
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="container glassmorphism" id="main-container">
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <div style="color: var(--text-muted); font-weight: 500;">Analyzing your week...</div>
    </div>

    <div id="content" style="display: none;">
      <h1 id="snapshot-title">Weekly Snapshot Share</h1>
      <p class="subtitle" id="snapshot-subtitle">Your AI agents have been busy.</p>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="hours-saved">--</div>
          <div class="stat-label">Hours Saved</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-sales">--</div>
          <div class="stat-label">Sales Driven</div>
        </div>
      </div>

      <button id="share-btn" class="cta-btn" disabled>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" style="width: 16px; height: 16px;"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.008 5.94H5.078z"/></svg>
        Share on X (Twitter)
      </button>
    </div>
  </div>

  <a href="dashboard.html" class="back-link">← Back to Dashboard</a>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const getAuthHeaders = () => {
        const token = localStorage.getItem('ohc_token');
        return token ? { 'authorization': `Bearer ${token}` } : {};
      };

      try {
        const res = await fetch('/api/v1/growth/wrapped', {
          headers: getAuthHeaders()
        });

        if (res.ok) {
          const data = await res.json();

          document.getElementById('snapshot-title').innerText = "AI Weekly Snapshot Share";
          document.getElementById('snapshot-subtitle').innerText = data.subtitle || "See how your AI agents and viral loops grew your business.";
          document.getElementById('hours-saved').innerText = data.stats.aiHoursSaved;
          document.getElementById('total-sales').innerText = data.stats.totalSales;

          const shareBtn = document.getElementById('share-btn');
          shareBtn.disabled = false;
          shareBtn.addEventListener('click', () => {
            const shareText = data.shareText || `My AI agents saved me ${data.stats.aiHoursSaved} hours this week and drove ${data.stats.totalSales} in sales! Get your own assistant: https://ohc.app/invite/`;
            const encodedText = encodeURIComponent(`${shareText}\n\n⚡ Powered by OHC`);
            window.open(`https://twitter.com/intent/tweet?text=${encodedText}`, '_blank');
          });

          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';
        } else {
          document.getElementById('loading').innerHTML = '<div style="color: #ff3b30;">Failed to load data. Please try again.</div>';
        }
      } catch (err) {
        console.error("Error fetching wrapped data:", err);
        document.getElementById('loading').innerHTML = '<div style="color: #ff3b30;">Error loading snapshot data.</div>';
      }
    });
  </script>
</body>
</html>
