<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omnichannel Inbox - OHC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-color: #F5F5F7;
      --text-primary: #1D1D1F;
      --card-bg: rgba(255, 255, 255, 0.7);
      --glass-blur: blur(20px) saturate(180%);
      --accent-blue: #0066FF;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      width: 100vw;
    }
    .glass {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    /* Mobile-first layout constraints */
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid rgba(0,0,0,0.05);
      border-right: 1px solid rgba(0,0,0,0.05);
    }
    .message-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .message-sent {
      background-color: var(--accent-blue);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message-received {
      background-color: #E9E9EB;
      color: black;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    #conversation-view {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-container bg-white">
    <!-- Inbox List View -->
    <div id="inbox-list-view" class="flex flex-col h-screen">
      <header class="glass sticky top-0 z-10 px-4 py-3 border-b border-gray-200 flex items-center">
        <a href="dashboard.html" class="text-blue-500 mr-3 text-lg">←</a>
        <h1 class="text-xl font-bold">Unified Inbox</h1>
      </header>
      <main class="flex-1 overflow-y-auto p-4 space-y-3" id="inbox-container">
        <!-- Conversations will be loaded here -->
        <div class="text-center text-gray-500 mt-10">Loading conversations...</div>
      </main>
    </div>

    <!-- Conversation View -->
    <div id="conversation-view" class="flex flex-col h-screen">
      <header class="glass sticky top-0 z-10 px-4 py-3 border-b border-gray-200 flex items-center justify-between">
        <button onclick="backToInbox()" class="text-blue-500 font-medium">← Back</button>
        <h1 class="text-lg font-bold" id="chat-header-name">Customer</h1>
        <div class="w-8"></div>
      </header>

      <main class="flex-1 overflow-y-auto p-4 flex flex-col" id="messages-container">
        <!-- Messages will be loaded here -->
      </main>

      <div class="glass p-3 border-t border-gray-200">
        <!-- Agent Assist Draft Area -->
        <div id="agent-assist-draft" class="hidden mb-3 p-3 bg-blue-50 border border-blue-100 rounded-xl relative">
          <p class="text-xs font-bold text-blue-600 mb-1 uppercase tracking-wider">✨ AI Draft</p>
          <p id="draft-text" class="text-sm text-gray-800 mb-2"></p>
          <button onclick="approveDraft()" id="approve-draft-btn" class="w-full bg-blue-600 text-white text-sm font-bold py-2 rounded-lg" data-testid="approve-ai-draft-btn">Approve AI Draft & Send</button>
        </div>

        <form id="chat-form" class="flex items-center gap-2">
          <input type="text" id="chat-input" class="flex-1 bg-gray-100 border-none rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type a message..." required>
          <button type="submit" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" data-testid="send-msg-btn">
            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const tenantId = localStorage.getItem('tenant_id') || 'tenant-1';
    let currentConversationId = null;
    let ws = null;
    let reconnectAttempts = 0;

    async function loadInboxes() {
      try {
        const res = await fetch(`/api/v1/omnichannel/inboxes`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (!res.ok) {
          throw new Error('Failed to load inboxes');
        }
        const inboxes = await res.json();
        if (inboxes.length > 0) {
            loadConversations(inboxes[0].id);
        } else {
            document.getElementById('inbox-container').innerHTML = '<div class="text-center text-gray-500 mt-10">No inboxes found</div>';
        }
      } catch (err) {
        console.error('Failed to load inboxes', err);
        document.getElementById('inbox-container').innerHTML = '<div class="text-center text-red-500 mt-10">Error loading inboxes</div>';
      }
    }

    async function loadConversations(inboxId) {
      try {
        const res = await fetch(`/api/v1/omnichannel/inboxes/${inboxId}/conversations`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (!res.ok) throw new Error('Failed to load');
        const convos = await res.json();
        renderConversations(convos);
      } catch (err) {
        console.error(err);
        document.getElementById('inbox-container').innerHTML = '<div class="text-center text-red-500 mt-10">Error loading conversations</div>';
      }
    }

    function renderConversations(convos) {
      const container = document.getElementById('inbox-container');
      container.innerHTML = '';

      if (convos.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-500 mt-10">No active conversations</div>';
        return;
      }

      convos.forEach(c => {
        const div = document.createElement('div');
        div.className = 'bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:bg-gray-50 active:scale-95 transition-transform flex items-center gap-3';
        div.setAttribute('data-testid', 'conversation-item');
        div.onclick = () => openConversation(c.id, c.channel);

        const icon = c.channel === 'instagram' ? '📷' : c.channel === 'whatsapp' ? '💬' : '✉️';

        div.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-xl flex-shrink-0">${icon}</div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1">
              <h3 class="font-bold text-gray-900 truncate">Customer</h3>
              <span class="text-xs text-gray-500">Now</span>
            </div>
            <p class="text-sm text-gray-600 truncate">${c.preview || 'Tap to view messages'}</p>
          </div>
          <div class="w-2 h-2 rounded-full bg-blue-500"></div>
        `;
        container.appendChild(div);
      });
    }

    async function openConversation(convoId, channel) {
      currentConversationId = convoId;
      document.getElementById('inbox-list-view').style.display = 'none';
      document.getElementById('conversation-view').style.display = 'flex';
      document.getElementById('chat-header-name').textContent = `Customer (${channel})`;
      document.getElementById('messages-container').innerHTML = '<div class="text-center text-gray-500 mt-10">Loading messages...</div>';

      // Setup WebSocket
      setupWebSocket();

      try {
        const res = await fetch(`/api/v1/omnichannel/conversations/${convoId}/messages`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        if (res.ok) {
          const messages = await res.json();
          renderMessages(messages);
          checkAiDrafts(messages);
        } else {
           throw new Error('Failed to load messages');
        }
      } catch (err) {
         console.error(err);
         document.getElementById('messages-container').innerHTML = '<div class="text-center text-red-500 mt-10">Failed to load messages</div>';
      }
    }

    function checkAiDrafts(messages) {
      // In a real implementation this would check if the last message has an AI draft
      // We will check if the last message was a customer message and we have no draft
      if (messages.length > 0) {
          let lastMsg = messages[messages.length - 1];
          if (lastMsg.sender_type === 'customer' && lastMsg.ai_draft_response) {
            document.getElementById('agent-assist-draft').classList.remove('hidden');
            document.getElementById('draft-text').textContent = lastMsg.ai_draft_response;
          } else {
            document.getElementById('agent-assist-draft').classList.add('hidden');
          }
      }
    }

    function backToInbox() {
      currentConversationId = null;
      document.getElementById('inbox-list-view').style.display = 'flex';
      document.getElementById('conversation-view').style.display = 'none';
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      messages.forEach(msg => appendMessage(msg));
      scrollToBottom();
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages-container');
      const div = document.createElement('div');
      const isAgent = msg.sender_type === 'agent';
      div.className = `message-bubble ${isAgent ? 'message-sent' : 'message-received'}`;
      div.textContent = msg.content;
      container.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function setupWebSocket() {
      if (ws) {
        ws.close();
      }
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/v1/omnichannel/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('WebSocket connected');
        reconnectAttempts = 0;
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === 'new_message' && data.data && data.data.conversation_id === currentConversationId) {
             appendMessage(data.data);
             // Clear draft if customer replied
             if (data.data.sender_type === 'customer') {
                document.getElementById('agent-assist-draft').classList.add('hidden');
             }
          }
        } catch (err) {
          console.error('Error parsing WS message', err);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        if (currentConversationId && reconnectAttempts < 5) {
          reconnectAttempts++;
          setTimeout(setupWebSocket, 1000 * reconnectAttempts);
        }
      };
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentConversationId) return;

      input.value = '';

      // Optimistic append
      const tempMsg = { content: text, sender_type: 'agent' };
      appendMessage(tempMsg);
      document.getElementById('agent-assist-draft').classList.add('hidden');

      try {
        await fetch(`/api/v1/omnichannel/conversations/${currentConversationId}/messages`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({
            content: text,
            message_type: 'text',
            sender_type: 'agent',
            sender_id: 'agent-1'
          })
        });
      } catch (err) {
        console.error('Failed to send message', err);
      }
    });

    async function approveDraft() {
      const draftText = document.getElementById('draft-text').textContent;
      const input = document.getElementById('chat-input');
      input.value = draftText;
      document.getElementById('chat-form').dispatchEvent(new Event('submit'));
    }

    // Initialize
    loadInboxes();
  </script>
</body>
</html>
