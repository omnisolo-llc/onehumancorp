<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #1D1D1F;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
          color: #F5F5F7;
        }
      }

      .container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: calc(100% - 40px);
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.4);
        animation: fade-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @media (prefers-color-scheme: dark) {
        .container {
          background: rgba(22, 22, 26, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
      }

      h1 {
        margin-top: 0;
        font-size: 24px;
        font-weight: 700;
        color: inherit;
      }

      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }

      button {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        min-height: 44px;
        transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 14px 0 rgba(52, 199, 89, 0.39);
        box-sizing: border-box;
      }

      button:hover {
        background-color: #2eb350;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're all set!</h1>
      <p id="success-msg">Your workspace is ready.</p>
      <button id="dashboard-btn">Go to Dashboard</button>
    </div>
    <script>
      const name = localStorage.getItem('businessName');
      if (name) {
          document.getElementById('success-msg').innerText = `Workspace created for ${name}.`;
      }
    </script>
  </body>
</html>
