<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-sizing: border-box;
      }
      h1 {
        margin-top: 0;
        color: #1d1d1f;
        font-size: 24px;
        font-weight: 700;
      }
      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }
      button {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 14px 24px;
        min-height: 44px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:hover {
        background-color: #32d74b;
      }
      button:active {
        transform: scale(0.98);
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
        }
        .container {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
          color: #F5F5F7;
        }
        p {
          color: #A1A1A6;
        }
        input {
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #F5F5F7;
        }
        input:focus {
          border-color: #0066FF;
          background: rgba(255, 255, 255, 0.15);
        }
      }
    </style>
    <link rel="stylesheet" href="shared.css">
    <script src="help-center.mjs"></script>
  </head>
  <body>
    <div class="container">
      <h1>You're all set!</h1>
      <p id="success-msg">Your workspace is ready.</p>
      <button id="dashboard-btn">Go to Dashboard</button>
    </div>
    <script>
      function showSuccess(name, assistantName) {
        if (name) {
            let msg = `Workspace created for ${name}.`;
            if (assistantName) {
                msg += ` ${assistantName} is ready to help.`;
            }
            document.getElementById('success-msg').innerText = msg;
        }
      }

      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke("get_onboarding_state").then((state) => {
          showSuccess(state.businessName, state.assistantName);
        }).catch(console.error);
      } else {
        const name = localStorage.getItem('businessName');
        const assistantName = localStorage.getItem('assistantName');
        showSuccess(name, assistantName);
      }

      const dashboardBtn = document.getElementById('dashboard-btn');
      if (dashboardBtn) {
        dashboardBtn.addEventListener('click', () => {
          window.location.href = "dashboard.html";
        });
      }
    </script>
  </body>
</html>
