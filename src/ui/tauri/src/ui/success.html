<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-sizing: border-box;
      }
      h1 {
        margin-top: 0;
        color: #1d1d1f;
        font-size: 24px;
        font-weight: 700;
      }
      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }
      button {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 14px 24px;
        min-height: 44px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:hover {
        background-color: #32d74b;
      }
      button:active {
        transform: scale(0.98);
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
        }
        .container {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
          color: #F5F5F7;
        }
        p {
          color: #A1A1A6;
        }
        input {
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #F5F5F7;
        }
        input:focus {
          border-color: #0066FF;
          background: rgba(255, 255, 255, 0.15);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="success-title">You're all set!</h1>
      <p id="success-msg">Your workspace is ready.</p>

      <div id="referral-success-card" style="display: none; margin: 24px 0; padding: 24px; background: rgba(0, 102, 255, 0.05); border: 1px solid rgba(0, 102, 255, 0.2); border-radius: 20px; text-align: center;" data-testid="referral-success-card">
          <div style="font-size: 32px; margin-bottom: 12px;">🚀</div>
          <h2 style="font-size: 18px; font-weight: 700; color: #1d1d1f; margin: 0 0 8px 0;">Start Your AI Business</h2>
          <p style="font-size: 13px; color: #86868b; margin: 0 0 16px 0; line-height: 1.4;">Inspired? Launch your own AI-powered business hub just like this in 2 minutes.</p>
          <a href="#" id="referral-success-link" style="display: inline-block; background: #0066FF; color: white; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px;">Get OHC Free</a>
      </div>

      <button id="dashboard-btn">Go to Assistant</button>
    </div>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const successType = urlParams.get('type');
      const tenantId = urlParams.get('tenant') || 'e2e-tenant';

      function showSuccess(name, assistantName) {
        if (successType === 'booking_deposit') {
            document.getElementById('success-title').innerText = 'Deposit Paid!';
            document.getElementById('success-msg').innerText = 'Your booking is confirmed. We will reach out shortly.';
            document.getElementById('dashboard-btn').style.display = 'none';

            const refCard = document.getElementById('referral-success-card');
            const refLink = document.getElementById('referral-success-link');
            refCard.style.display = 'block';
            refLink.href = `https://ohc.app/onboarding?ref=${encodeURIComponent(tenantId)}&source=success_page`;
            return;
        }

        if (name) {
            let msg = `Workspace created for ${name}.`;
            if (assistantName) {
                msg += ` ${assistantName} is ready to help.`;
            }
            document.getElementById('success-msg').innerText = msg;
        }
      }

      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke("get_onboarding_state").then((state) => {
          showSuccess(state.businessName, state.assistantName);
        }).catch(console.error);
      } else {
        const name = localStorage.getItem('businessName');
        const assistantName = localStorage.getItem('assistantName');
        showSuccess(name, assistantName);
      }

      const dashboardBtn = document.getElementById('dashboard-btn');
      if (dashboardBtn) {
        dashboardBtn.addEventListener('click', () => {
          window.location.href = "assistant.html";
        });
      }
    </script>
  </body>
</html>
