<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      h1 {
        margin-top: 0;
        color: #1d1d1f;
        font-size: 24px;
        font-weight: 700;
      }
      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }
      button {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
      }
      button:hover {
        background-color: #32d74b;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're all set!</h1>
      <p id="success-msg">Your workspace is ready.</p>
      <button id="dashboard-btn">Go to Dashboard</button>
    </div>
    <script>
      const name = localStorage.getItem('businessName');
      if (name) {
          document.getElementById('success-msg').innerText = `Workspace created for ${name}.`;
      }

      const dashboardBtn = document.getElementById('dashboard-btn');
      if (dashboardBtn) {
        dashboardBtn.addEventListener('click', () => {
          window.location.href = "dashboard.html";
        });
      }
    </script>
  </body>
</html>
