<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Complete - OHC</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      .success-icon {
        width: 64px;
        height: 64px;
        background: var(--success-accent);
        color: white;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin: 0 auto 24px;
        box-shadow: 0 4px 14px rgba(52, 199, 89, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="step-indicator">
        <div class="step-dot"></div>
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
      </div>

      <div class="success-icon">✓</div>
      <h1>You're all set!</h1>
      <p id="success-msg" style="color: #86868b; margin-bottom: 32px;">Workspace created and assistant ready.</p>

      <button id="finish-btn" data-tooltip="Welcome to OHC! Your journey starts here.">Go to Dashboard</button>
    </div>

    <script src="tooltips.js"></script>
    <script src="help-chat.js"></script>
    <script>
      const finishBtn = document.getElementById('finish-btn');
      const successMsg = document.getElementById('success-msg');

      async function loadState() {
        let state = {};
        if (window.__TAURI__ && window.__TAURI__.core) {
          try {
            state = await window.__TAURI__.core.invoke("get_onboarding_state");
          } catch (e) { console.error(e); }
        } else {
          state = JSON.parse(localStorage.getItem('ohc_onboarding_state') || '{}');
        }

        if (state.businessName && state.assistantName) {
          successMsg.innerText = `Workspace created for ${state.businessName}. ${state.assistantName} is ready to help.`;
        }
      }

      loadState();

      finishBtn.addEventListener('click', () => {
        window.location.href = "dashboard.html";
      });
    </script>
  </body>
</html>
