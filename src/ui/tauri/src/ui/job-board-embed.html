<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board Embed</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: transparent;
      color: #1d1d1f;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      background: white;
      border-radius: 8px;
      border: 1px dashed #ccc;
    }
    .empty-state h3 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }
    .empty-state p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }
    #branding-container {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
    }
    #branding-container a {
      color: #888;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2 id="board-title" style="margin-top: 0; font-size: 20px;">Open Positions</h2>

  <div class="empty-state" id="job-list">
    <h3>No Open Positions</h3>
    <p>Check back later for new opportunities!</p>
  </div>

  <div id="branding-container">
     <a href="#" id="branding-link" target="_blank">⚡ Powered by OHC</a>
  </div>

  <script>

      // OHC Referral Fetcher
      let __ohcReferralCode = (() => { try { return localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default-team'; } catch(e) { return 'default-team'; } })();
      (async function() {
        try {
          let token = localStorage.getItem('ohc_token');
          let headers = token ? { 'authorization': `Bearer ${token}` } : {};
          let url = '/api/v1/growth/referrals/generate';
          if (window.__TAURI__ && window.__TAURI__.core) {
            url = 'http://127.0.0.1:18789/api/v1/growth/referrals/generate';
          }
          let res = await fetch(url, { method: 'POST', headers });
          if (res.ok) {
            let data = await res.json();
            if (data.referral_link) {
              let parts = data.referral_link.split('/ref/');
              if (parts.length > 1) {
                __ohcReferralCode = parts[1];
              }
            }
          }
        } catch(e) {}
      })();

    const urlParams = new URLSearchParams(window.location.search);
    const company = urlParams.get('company') || 'Our Company';
    const hideBranding = urlParams.get('hideBranding') === 'true';
    const tenantId = urlParams.get('tenant') || 'e2e-tenant';

    document.getElementById('board-title').textContent = `${company} Open Positions`;

    const brandingContainer = document.getElementById('branding-container');
    if (hideBranding) {
        brandingContainer.style.display = 'none';
    } else {
        const brandingLink = document.getElementById('branding-link');
        let baseUrl = window.location.origin;
        if (baseUrl === 'file://' || baseUrl.includes('localhost') || baseUrl === 'null') {
            baseUrl = 'https://app.onehumancorp.com';
        }
        brandingLink.href = `${baseUrl}/setup.html?ref=${__ohcReferralCode}&source=job_board`;
    }
  </script>
</body>
</html>
