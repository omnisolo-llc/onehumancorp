<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Dashboard | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      background: #F5F5F7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .back-btn {
      text-decoration: none;
      color: #0066FF;
      font-weight: 600;
      font-size: 14px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }
    .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .panel {
      flex: 1;
      min-width: 300px;
      padding: 30px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid rgba(0,0,0,0.05);
    }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #0066FF;
      margin: 10px 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #86868b;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #d2d2d7;
      font-size: 16px;
      font-family: inherit;
      box-sizing: border-box;
      background: white;
      transition: all 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      outline: none;
      border-color: #0066FF;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover {
      background: #005ce6;
      transform: translateY(-1px);
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #affiliate-link-container {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #e6f0ff;
        border-radius: 12px;
        border: 1px solid #b3d1ff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Affiliate Dashboard 💸</h1>
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </header>

  <div class="container" id="affiliate-dashboard">
    <div class="panel glassmorphism">
      <h2 style="margin-top: 0; margin-bottom: 24px; font-size: 24px;">Your Affiliate Program</h2>

      <div class="stat-box">
          <div style="font-size: 14px; color: #86868b; font-weight: 600;">Total Affiliates</div>
          <div class="stat-value" id="stat-total-affiliates">0</div>
      </div>

      <div class="stat-box">
          <div style="font-size: 14px; color: #86868b; font-weight: 600;">Total Commissions Paid</div>
          <div class="stat-value" id="stat-total-commissions">$0.00</div>
      </div>
    </div>

    <div class="panel glassmorphism">
      <h2 style="margin-top: 0; margin-bottom: 24px; font-size: 24px;">Generate Affiliate Link</h2>
      <p style="color: #86868b; font-size: 14px; margin-bottom: 24px;">Create a unique affiliate tracking link for a customer or micro-influencer.</p>

      <div class="form-group">
        <label for="customerId">Customer ID</label>
        <input type="text" id="customerId" placeholder="e.g. cust_12345" value="cust_12345">
      </div>

      <div class="form-group">
        <label for="discountPercentage">Discount for their followers (%)</label>
        <input type="number" id="discountPercentage" value="10" min="0" max="100">
      </div>

      <div class="form-group">
        <label for="commissionPercentage">Their Commission (%)</label>
        <input type="number" id="commissionPercentage" value="10" min="0" max="100">
      </div>

      <button id="generate-affiliate" class="btn">Generate Link</button>

      <div id="affiliate-link-container">
          <label>Their Unique Affiliate Link:</label>
          <input type="text" id="affiliate-link" readonly style="margin-bottom: 10px;">
          <button id="copy-btn" class="btn" style="background: #1d1d1f;">Copy Link</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('ohc_token') || '';

        // Fetch Stats
        try {
            const statsRes = await fetch('/api/v1/growth/affiliate/stats', {
                headers: { 'Authorization': token ? `Bearer ${token}` : '' }
            });
            if (statsRes.ok) {
                const stats = await statsRes.json();
                document.getElementById('stat-total-affiliates').innerText = stats.total_affiliates || 0;
                document.getElementById('stat-total-commissions').innerText = '$' + ((stats.total_commission_cents || 0) / 100).toFixed(2);
            }
        } catch (e) {
            console.error("Failed to load affiliate stats", e);
        }

        // Generate Link
        const generateBtn = document.getElementById('generate-affiliate');
        generateBtn.addEventListener('click', async () => {
            const customerId = document.getElementById('customerId').value;
            const discount = parseInt(document.getElementById('discountPercentage').value, 10);
            const commission = parseInt(document.getElementById('commissionPercentage').value, 10);

            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";

            try {
                const res = await fetch('/api/v1/growth/affiliate/generate-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({
                        customer_id: customerId,
                        discount_percentage: discount,
                        commission_percentage: commission
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('affiliate-link').value = data.affiliate_link;
                    document.getElementById('affiliate-link-container').style.display = 'block';

                    // Optimistically update stats
                    let currentAffiliates = parseInt(document.getElementById('stat-total-affiliates').innerText, 10) || 0;
                    document.getElementById('stat-total-affiliates').innerText = currentAffiliates + 1;
                } else {
                    alert("Failed to generate link.");
                }
            } catch(e) {
                console.error("Error generating affiliate link", e);
                alert("Failed to generate link.");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = "Generate Link";
            }
        });

        // Copy button
        document.getElementById('copy-btn').addEventListener('click', () => {
            const linkInput = document.getElementById('affiliate-link');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value);
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerText = 'Copied!';
            setTimeout(() => { copyBtn.innerText = 'Copy Link'; }, 2000);
        });
    });
  </script>
</body>
</html>
