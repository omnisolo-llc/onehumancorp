<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
        border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Quote Request</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --blur: blur(20px) saturate(180%);
            --text-dark: #1D1D1F;
            --text-muted: #86868B;
            --primary: #0066FF;
            --primary-hover: #0055DD;
            --bg-color: #F5F5F7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            padding: 24px;
            margin-bottom: 24px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
            width: 100%;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .toggle-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-item:active {
            transform: scale(0.98);
        }

        .toggle-item .info {
            flex: 1;
        }

        .toggle-item .title {
            font-weight: 600;
            font-size: 15px;
        }

        .toggle-item .desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Checkbox styling */
        .checkbox-wrapper {
            position: relative;
            width: 24px;
            height: 24px;
        }

        .checkbox-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: #eee;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .toggle-item:hover input ~ .checkmark {
            background-color: #ccc;
        }

        .toggle-item input:checked ~ .checkmark {
            background-color: var(--primary);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .toggle-item input:checked ~ .checkmark:after {
            display: block;
        }

        .toggle-item .checkmark:after {
            left: 9px;
            top: 5px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Sticky bottom bar */
        .sticky-bottom {
            position: sticky;
            bottom: 0;
            padding: 16px;
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-top: 1px solid var(--glass-border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-display {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .price-value {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.1;
        }

        .price-value.updating {
            animation: pulse 0.3s ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }

        button.primary-btn:hover {
            background: var(--primary-hover);
        }

        button.primary-btn:active {
            transform: scale(0.96);
        }

        button.primary-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .success-state {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: #34C759;
            color: white;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
        }

        @media (max-width: 375px) {
            .container {
                padding: 16px 12px;
            }
            .glass-panel {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container glassmorphism" id="request-view">
        <header>
            <h1>Instant Quote</h1>
            <p>Customize your service request</p>
        </header>

        <div class="glass-panel">
            <div class="form-group">
                <label>Service Options</label>
                <div class="toggle-options" id="options-container">
                    <!-- Options will be injected here -->
                    <div class="toggle-item text-center text-muted" id="loading-rules">
                        Loading pricing rules...
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-top: 24px;">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" style="width: 100%; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); padding: 12px; font-family: inherit; font-size: 15px; resize: vertical; min-height: 80px;" placeholder="Any special requests?"></textarea>
            </div>
        </div>
    </div>

    <div class="container success-state glassmorphism" id="success-view">
        <div class="success-icon">✓</div>
        <h2>Quote Requested</h2>
        <p style="color: var(--text-muted); margin-top: 12px;">We've sent your request to the business owner. You'll receive a final confirmation shortly.</p>
        <button class="primary-btn" style="margin-top: 32px;" onclick="location.reload()">Request Another</button>
    </div>

    <div class="sticky-bottom" id="bottom-bar">
        <div class="price-display">
            <span class="price-label">Estimated Quote</span>
            <span class="price-value" id="price-display" data-testid="estimated-price">-</span>
        </div>
        <button class="primary-btn" id="submit-btn" onclick="submitQuote()">Request Final Quote</button>
    </div>

    <footer style="text-align: center; margin: 24px 0 100px 0;">
        <a id="powered-by-link" href="/api/v1/growth/referrals/click?target=/setup.html&ref=default-team" target="_blank" style="text-decoration: none; color: var(--text-muted); font-size: 14px; font-weight: 600;">⚡ Powered by OHC</a>
    </footer>

    <script>
        // Store rules fetched from edge/backend
        let pricingRules = [];
        let basePrice = 0;
        let selectedOptions = new Set();
        let currentTotal = 0;

        // Fetch deterministic rules from backend
        async function fetchRules() {
            try {
                // In a real app, tenantId would be injected via subdomain or token
                // We use default for local testing
                const tenantId = new URLSearchParams(window.location.search).get('tenant') || 'e2e-tenant';

                // Update powered-by-link
                const poweredByLink = document.getElementById('powered-by-link');
                if (poweredByLink) {
                    poweredByLink.href = `/api/v1/growth/referrals/click?target=/setup.html&ref=${encodeURIComponent(tenantId)}`;
                }

                let rules = [];
                try {
                    const res = await fetch(`/api/v1/quoting/pricing-rules`, {
                        headers: { 'x-tenant-id': tenantId, 'x-user-id': 'customer' }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.length > 0) {
                            basePrice = data[0].base_price_cents;
                            rules = data[0].rules_json || [];
                        }
                    }
                } catch (e) {
                    console.warn("Failed to load pricing rules", e);
                }

                // Truthful empty state if no rules from backend
                if (!rules || rules.length === 0) {
                    basePrice = 0;
                    rules = [];
                    document.getElementById('loading-rules').innerText = "No options available right now.";
                }

                pricingRules = rules;
                renderOptions();
                calculatePrice();
            } catch (err) {
                console.error("Error loading rules:", err);
                document.getElementById('loading-rules').innerText = "Failed to load pricing rules.";
            }
        }

        function renderOptions() {
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            pricingRules.forEach(rule => {
                const item = document.createElement('label');
                item.className = 'toggle-item';

                let priceText = '';
                if (rule.adjustment_cents) {
                    priceText = `+$${(rule.adjustment_cents / 100).toFixed(2)}`;
                } else if (rule.adjustment_percent) {
                    priceText = `+${rule.adjustment_percent}%`;
                }

                item.innerHTML = `
                    <div class="info">
                        <div class="title">${rule.name} <span style="color:var(--primary); font-size:12px; margin-left:4px;">${priceText}</span></div>
                        <div class="desc">${rule.description || ''}</div>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" value="${rule.id}" onchange="toggleOption(this)">
                        <span class="checkmark"></span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Deterministic instant edge calculation
        function calculatePrice() {
            let totalCents = basePrice;

            // Add absolute adjustments
            pricingRules.forEach(rule => {
                if (selectedOptions.has(rule.id) && rule.adjustment_cents) {
                    totalCents += rule.adjustment_cents;
                }
            });

            // Add percentage adjustments (calculated against base + absolutes)
            let multiplier = 1.0;
            pricingRules.forEach(rule => {
                if (selectedOptions.has(rule.id) && rule.adjustment_percent) {
                    multiplier += (rule.adjustment_percent / 100);
                }
            });

            totalCents = Math.round(totalCents * multiplier);
            currentTotal = totalCents;

            // Update UI with animation
            const display = document.getElementById('price-display');
            display.classList.remove('updating');
            void display.offsetWidth; // trigger reflow
            display.innerText = `$${(totalCents / 100).toFixed(2)}`;
            display.classList.add('updating');
        }

        function toggleOption(checkbox) {
            if (checkbox.checked) {
                selectedOptions.add(checkbox.value);
            } else {
                selectedOptions.delete(checkbox.value);
            }
            calculatePrice();
        }

        async function submitQuote() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            const tenantId = new URLSearchParams(window.location.search).get('tenant') || 'e2e-tenant';
            const notes = document.getElementById('notes').value;

            const lineItems = Array.from(selectedOptions).map(id => {
                const rule = pricingRules.find(r => r.id === id);
                return {
                    description: rule.name,
                    unit_price_cents: rule.adjustment_cents || 0, // Simplified for now
                    quantity: 1,
                    is_optional: true
                };
            });

            // Always add base service
            lineItems.unshift({
                description: "Base Service Request",
                unit_price_cents: basePrice,
                quantity: 1,
                is_optional: false
            });

            try {
                const res = await fetch(`/api/v1/quoting/quotes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-tenant-id': tenantId,
                        'x-user-id': 'customer'
                    },
                    body: JSON.stringify({
                        customer_id: '00000000-0000-0000-0000-000000000000',
                        status: 'Draft',
                        line_items: lineItems,
                        notes: notes
                    })
                });

                // Show success UI
                document.getElementById('request-view').style.display = 'none';
                document.getElementById('bottom-bar').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
            } catch (err) {
                console.error("Submission failed", err);
                alert("Failed to submit quote. Please try again.");
                btn.disabled = false;
                btn.innerText = 'Request Final Quote';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchRules);
    </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
