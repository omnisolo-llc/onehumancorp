<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Embed Builder | OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      background: #F5F5F7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .back-btn {
      text-decoration: none;
      color: #0066FF;
      font-weight: 600;
    }
    .container {
      display: flex;
      flex-direction: row;
      gap: 40px;
      max-width: 1200px;
      width: 100%;
      padding: 40px;
      box-sizing: border-box;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px;
      }
    }
    .builder-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    }
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333336;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.5);
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="text"]:focus {
      border-color: #0066FF;
    }
    .type-selectors {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .type-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      color: #333;
      transition: all 0.2s;
    }
    .type-btn.active {
      background: #0066FF;
      color: white;
      border-color: #0066FF;
    }
    .code-container {
      position: relative;
      background: #1d1d1f;
      border-radius: 16px;
      padding: 20px;
      color: #f5f5f7;
      margin-top: 30px;
      overflow-x: auto;
    }
    pre {
      margin: 0;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333336;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .copy-btn:hover {
      background: #555;
    }
    .preview-container {
      background: white;
      border-radius: 24px;
      border: 1px solid rgba(0,0,0,0.05);
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 12px;
    }
    .powered-by {
      margin-top: 15px;
      font-size: 12px;
      color: #86868b;
      text-decoration: none;
      font-weight: 600;
    }
    .powered-by:hover {
      color: #1d1d1f;
    }
  </style>
</head>
<body>
  <header>
    <h1>Interactive Embed Builder</h1>
    <a href="/dashboard.html" class="back-btn">Back to Dashboard</a>
  </header>

  <div class="container">
    <div class="builder-panel">
      <h2>Configure your Widget</h2>
      <p style="color: #666; font-size: 14px; margin-bottom: 24px;">Generate a snippet you can paste into WordPress, Webflow, or any HTML site to capture demand directly into OHC.</p>

      <div class="form-group">
        <label>Widget Type</label>
        <div class="type-selectors">
          <button class="type-btn active" data-type="booking">booking</button>
          <button class="type-btn" data-type="quote">quote</button>
        </div>
      </div>

      <div class="form-group">
        <label for="tenantId">Workspace ID</label>
        <input type="text" id="tenantId" placeholder="Enter Workspace ID" />
      </div>

      <div class="form-group">
        <label for="theme">Theme</label>
        <div class="type-selectors">
          <button class="type-btn active theme-btn" data-theme="light">light</button>
          <button class="type-btn theme-btn" data-theme="dark">dark</button>
        </div>
      </div>

      <div class="code-container">
        <button class="copy-btn" id="copyBtn">Copy Code</button>
        <pre><code id="embedCode"></code></pre>
      </div>
    </div>

    <div class="preview-panel">
      <h2>Live Preview</h2>
      <div class="preview-container">
        <iframe id="previewIframe" title="Preview" src=""></iframe>
        <a href="#" id="previewPoweredBy" class="powered-by" target="_blank">⚡ Powered by OHC</a>
      </div>
    </div>
  </div>

  <script src="ohc-help-widget.mjs"></script>
</body>
</html>
