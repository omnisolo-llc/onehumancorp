<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Help Center</title>
    <style>
      body { font-family: "Outfit", sans-serif; background-color: #f5f5f7; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; box-sizing: border-box; min-height: 100vh; }
      .container { max-width: 800px; width: 100%; box-sizing: border-box; }
      .header-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px); border-radius: 16px; padding: 40px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); margin-bottom: 40px; }
      h1 { color: #1d1d1f; font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 20px; }
      .search-box { display: flex; max-width: 500px; margin: 0 auto; position: relative; }
      .search-box input { flex-grow: 1; padding: 14px 20px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; outline: none; transition: border-color 0.2s; font-family: "Outfit", sans-serif; }
      .search-box input:focus { border-color: #0066FF; }
      .search-box button { background: #0066FF; color: white; border: none; padding: 0 24px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-left: 10px; transition: background 0.2s; }
      .search-box button:hover { background: #0052cc; }
      .section-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
      .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #e5e5ea; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
      .card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); }
      .card-title { font-weight: 600; font-size: 16px; color: #1d1d1f; margin-bottom: 8px; }
      .card-desc { font-size: 14px; color: #86868b; line-height: 1.4; flex-grow: 1; margin: 0; }
      .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
      .video-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #e5e5ea; text-decoration: none; color: inherit; display: block; transition: transform 0.2s; }
      .video-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.06); }
      .video-thumb { background: #000; height: 160px; position: relative; display: flex; align-items: center; justify-content: center; }
      .video-thumb::after { content: "▶"; color: white; font-size: 32px; opacity: 0.8; }
      .video-info { padding: 16px; }
      .video-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #1d1d1f; }
      .video-meta { font-size: 12px; color: #86868b; }
      .bottom-nav { margin-top: 40px; text-align: center; }
      .bottom-nav a { color: #0066FF; text-decoration: none; font-weight: 600; font-size: 14px; }
      .bottom-nav a:hover { text-decoration: underline; }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .header-card { background: rgba(22, 22, 26, 0.7); border-color: rgba(255, 255, 255, 0.1); }
        h1, .section-title, .card-title, .video-title { color: #F5F5F7; }
        .card, .video-card { background: #1c1c1e; border-color: #2c2c2e; }
        .card-desc, .video-meta { color: #a1a1a6; }
        .search-box input { background: #1c1c1e; border-color: #2c2c2e; color: #F5F5F7; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-card">
        <h1>How can we help?</h1>
        <div class="search-box">
          <input type="text" id="help-search" placeholder="Search for help..." />
          <button id="search-btn">Search</button>
        </div>
      </div>

      <div class="section-title">Help Topics</div>
      <div class="grid" id="topics-grid">
        <!-- Rendered by JS -->
      </div>

      <div class="section-title">Video Tutorials</div>
      <div class="video-grid" id="videos-grid">
        <!-- Rendered by JS -->
      </div>

      <div class="bottom-nav">
        <a href="dashboard.html">← Back to Dashboard</a>
      </div>
    </div>

    <script>
      async function loadHelp() {
          const fetchArticles = window.__TAURI__ ? window.__TAURI__.core.invoke("get_help_articles") : fetch('/api/help').then(r => r.json());
          const fetchVideos = window.__TAURI__ ? window.__TAURI__.core.invoke("get_help_videos") : fetch('/api/videos').then(r => r.json());

          try {
              const [articles, videos] = await Promise.all([fetchArticles, fetchVideos]);

              const grid = document.getElementById('topics-grid');
              grid.innerHTML = articles.map(a => `
                <a class="card" href="help_article.html?id=${a.link.split('/').pop()}">
                  <div class="card-title">${a.title}</div>
                  <div class="card-desc">${a.desc}</div>
                </a>
              `).join('');

              const vGrid = document.getElementById('videos-grid');
              vGrid.innerHTML = videos.map(v => `
                <a class="video-card" href="#">
                  <div class="video-thumb"></div>
                  <div class="video-info">
                    <div class="video-title">${v.title}</div>
                    <div class="video-meta">${v.duration}</div>
                  </div>
                </a>
              `).join('');
          } catch(e) {
              console.error(e);
          }
      }

      document.addEventListener('DOMContentLoaded', loadHelp);
    </script>
  <script>

// Global Help Agent Chat
document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('ohc-help-btn')) return;

    // Inject chat CSS
    const style = document.createElement('style');
    style.textContent = `
        #ohc-help-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #0066FF;
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }
        #ohc-help-btn:hover { transform: scale(1.05); }
        #ohc-help-btn svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; }

        #ohc-help-chat-overlay {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            max-height: calc(100vh - 120px);
            max-width: calc(100vw - 40px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 9998;
            overflow: hidden;
            font-family: "Outfit", sans-serif;
            transform-origin: bottom right;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #ohc-help-chat-header { padding: 15px 20px; border-bottom: 1px solid rgba(0, 0, 0, 0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.5); }
        #ohc-help-chat-header h3 { margin: 0; font-size: 16px; color: #1d1d1f; }
        #ohc-help-close { background: none; border: none; color: #86868b; cursor: pointer; padding: 5px; }
        #ohc-help-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; }
        .msg-user { align-self: flex-end; background: #0066FF; color: white; border-bottom-right-radius: 4px; }
        .msg-ai { align-self: flex-start; background: rgba(0, 0, 0, 0.05); color: #1d1d1f; border-bottom-left-radius: 4px; }
        #ohc-help-input-area { padding: 15px; border-top: 1px solid rgba(0, 0, 0, 0.1); display: flex; gap: 10px; background: rgba(255, 255, 255, 0.5); }
        #ohc-help-input { flex-grow: 1; border: 1px solid #d2d2d7; border-radius: 20px; padding: 10px 15px; font-size: 14px; outline: none; font-family: "Outfit", sans-serif; }
        #ohc-help-send { background: #0066FF; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #ohc-help-send svg { width: 16px; height: 16px; fill: currentColor; }

        @media (prefers-color-scheme: dark) {
            #ohc-help-chat-overlay { background: rgba(30, 30, 30, 0.85); border-color: rgba(255,255,255,0.1); }
            #ohc-help-chat-header { background: rgba(0,0,0,0.2); }
            #ohc-help-chat-header h3 { color: #f5f5f7; }
            .msg-ai { background: rgba(255,255,255,0.1); color: #f5f5f7; }
            #ohc-help-input-area { background: rgba(0,0,0,0.2); }
            #ohc-help-input { background: rgba(0,0,0,0.2); color: #f5f5f7; border-color: #444; }
        }
    `;
    document.head.appendChild(style);

    // Inject chat HTML
    const btn = document.createElement('button');
    btn.id = 'ohc-help-btn';
    btn.setAttribute('aria-label', 'Help Chat');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
    document.body.appendChild(btn);

    const overlay = document.createElement('div');
    overlay.id = 'ohc-help-chat-overlay';
    overlay.innerHTML = `
        <div id="ohc-help-chat-header">
            <h3>Ask anything</h3>
            <button id="ohc-help-close" aria-label="Close help chat">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div id="ohc-help-messages">
            <div class="msg msg-ai">Hi! I am your AI Help Agent! How can I assist you with OHC today?</div>
        </div>
        <div id="ohc-help-input-area">
            <input type="text" id="ohc-help-input" placeholder="Ask about OHC features..." />
            <button id="ohc-help-send" aria-label="Send message">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    `;
    document.body.appendChild(overlay);

    const msgs = document.getElementById('ohc-help-messages');
    const input = document.getElementById('ohc-help-input');

    btn.addEventListener('click', () => {
        overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
        if (overlay.style.display === 'flex') input.focus();
    });

    document.getElementById('ohc-help-close').addEventListener('click', () => {
        overlay.style.display = 'none';
    });

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        msgs.innerHTML += `<div class="msg msg-user">${text}</div>`;
        msgs.scrollTop = msgs.scrollHeight;

        try {
            const req = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, provider: 'help-agent' })
            });
            const res = await req.json();

            let replyText = res.response || "I couldn't find an answer. Please check our Help Center.";

            // Link to full article if provided
            if (res.article_id) {
                replyText += `<br><br><a href="help_article.html?id=${res.article_id}" style="color: #0066FF; font-weight: bold; text-decoration: none;">Read the full article →</a>`;
            }

            msgs.innerHTML += `<div class="msg msg-ai">${replyText}</div>`;
        } catch (e) {
            msgs.innerHTML += `<div class="msg msg-ai" style="color: red;">Failed to connect.</div>`;
        }
        msgs.scrollTop = msgs.scrollHeight;
    }

    document.getElementById('ohc-help-send').addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});

</script>
</body>
</html>
