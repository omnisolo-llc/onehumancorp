<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container glassmorphism">
      <a href="dashboard.html" class="back-link">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Dashboard
      </a>

      <div class="header-card">
        <h1 data-testid="help-center-title">In-App Help Center</h1>
        <input type="text" id="search-input" data-testid="help-search-input" data-tooltip-id="help-search-tooltip" placeholder="Search for help articles and videos..." data-tooltip="Search for articles, videos, and guides" />
      </div>

      <div id="content-area">
        <div class="empty-state" style="display:none;" id="loading-state">
           <p>Loading help content...</p>
        </div>
        <div id="results">
        </div>
      </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal">
      <div class="modal-content glassmorphism">
        <button class="modal-close" id="close-video" aria-label="Close video">Close video</button>
        <video id="video-player" controls>
          Your browser does not support the video tag.
        </video>
        <div class="modal-info">
          <h3 class="modal-title" id="video-modal-title"></h3>
          <p class="modal-duration" id="video-modal-duration"></p>
        </div>
      </div>
    </div>
    <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
