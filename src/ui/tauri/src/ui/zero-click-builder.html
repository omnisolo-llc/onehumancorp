<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zero-Click Business Generator</title>
    <style>
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .glassmorphism {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 80vh;
            max-height: 800px;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.5);
        }

        .chat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 102, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .chat-header-text h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .chat-header-text p {
            margin: 0;
            font-size: 12px;
            color: #86868b;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .chat-message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .chat-message.assistant {
            align-self: flex-start;
            align-items: flex-start;
        }

        .chat-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-message.user .chat-bubble {
            background: #0066FF;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant .chat-bubble {
            background: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            font-family: inherit;
            font-size: 14px;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #0066FF;
        }

        .chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #0066FF;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .chat-send-btn:hover {
            background: #0055DD;
        }

        .chat-send-btn:active {
            transform: scale(0.95);
        }

        .chat-send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-left-color: #0066FF;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .provisioning-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            border-radius: 16px;
        }

        .provisioning-overlay h2 {
            margin: 16px 0 8px;
            color: #1d1d1f;
            font-size: 20px;
        }

        .provisioning-overlay p {
            margin: 0;
            color: #86868b;
            font-size: 14px;
        }

        .success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            border-radius: 16px;
            padding: 32px;
        }

        .success-overlay h2 {
            margin: 16px 0 8px;
            color: #1d1d1f;
            font-size: 24px;
        }

        .success-overlay p {
            margin: 0 0 24px;
            color: #86868b;
            font-size: 14px;
            line-height: 1.5;
        }

        .launch-btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        }

        .launch-btn:active {
            transform: scale(0.98);
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            body { background-color: #16161a; }
            .glassmorphism {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
            }
            .chat-header, .chat-input-area {
                background: rgba(0, 0, 0, 0.2);
                border-color: rgba(255, 255, 255, 0.1);
            }
            .chat-header-text h3 { color: #F5F5F7; }
            .chat-message.assistant .chat-bubble {
                background: rgba(255, 255, 255, 0.1);
                color: #F5F5F7;
                border-color: rgba(255, 255, 255, 0.05);
            }
            .chat-input {
                background: rgba(0, 0, 0, 0.2);
                border-color: rgba(255, 255, 255, 0.1);
                color: #F5F5F7;
            }
            .provisioning-overlay, .success-overlay {
                background: rgba(22, 22, 26, 0.8);
            }
            .provisioning-overlay h2, .success-overlay h2 { color: #F5F5F7; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="glassmorphism" style="position: relative;">
        <div class="chat-header">
            <div class="chat-icon">✨</div>
            <div class="chat-header-text">
                <h3>OHC Setup Assistant</h3>
                <p>Usually replies instantly</p>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="chat-message assistant">
                <div class="chat-bubble">What kind of business do you want to build or manage today?</div>
            </div>
        </div>

        <form class="chat-input-area" id="chat-form">
            <input type="text" class="chat-input" id="chat-input" placeholder="Type your message..." autocomplete="off">
            <button type="submit" class="chat-send-btn" id="chat-send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>

        <div class="provisioning-overlay" id="provisioning-overlay" style="display: none;">
            <div class="spinner"></div>
            <h2>Building Your Business...</h2>
            <p>Setting up default deposit rules...</p>
        </div>

        <div class="success-overlay" id="success-overlay" style="display: none;">
            <div style="font-size: 48px; margin-bottom: 16px;">🚀</div>
            <h2>Your business is live!</h2>
            <p>We've configured your storefront, catalog, and booking system with zero clicks.</p>
            <button class="launch-btn" id="launch-btn">Launch My Store</button>
        </div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const provisioningOverlay = document.getElementById('provisioning-overlay');
    const successOverlay = document.getElementById('success-overlay');
    const launchBtn = document.getElementById('launch-btn');

    let messages = [
        { role: 'assistant', content: "What kind of business do you want to build or manage today?" }
    ];

    function appendMessage(role, content) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-message ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        bubble.textContent = content;

        msgDiv.appendChild(bubble);
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-message assistant typing-indicator`;
        msgDiv.id = 'typing-indicator';

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        bubble.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px;"></div>';

        msgDiv.appendChild(bubble);
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    async function handleZeroClickGenerate(promptStr) {
        provisioningOverlay.style.display = 'flex';

        try {
            const backendUrl = (window.location.protocol === 'file:' || ["1420", "3000", "8081"].includes(window.location.port)) ? 'http://127.0.0.1:18789' : '';

            const res = await fetch(`${backendUrl}/api/v1/growth/zero-click-builder/generate`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Tenant-ID': 'e2e-tenant',
                    'X-User-ID': 'e2e-admin-user'
                },
                body: JSON.stringify({ prompt: promptStr })
            });

            if (res.ok) {
                const data = await res.json();
                if (data.organization_id) {
                    localStorage.setItem('tenant_id', data.organization_id);
                    localStorage.setItem('tenant', data.organization_id);
                }
                if (data.user_id) {
                    localStorage.setItem('user_id', data.user_id);
                }

                provisioningOverlay.style.display = 'none';
                successOverlay.style.display = 'flex';
            } else {
                throw new Error("Generation failed");
            }
        } catch (e) {
            provisioningOverlay.style.display = 'none';
            appendMessage('assistant', "Sorry, there was an error generating your business. Please try again.");
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = '';
        chatInput.disabled = true;
        chatSendBtn.disabled = true;

        appendMessage('user', text);
        messages.push({ role: 'user', content: text });

        showTypingIndicator();

        try {
            const backendUrl = (window.location.protocol === 'file:' || ["1420", "3000", "8081"].includes(window.location.port)) ? 'http://127.0.0.1:18789' : '';
            const res = await fetch(`${backendUrl}/api/onboarding/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Tenant-ID': 'e2e-tenant',
                    'X-User-ID': 'e2e-admin-user'
                },
                body: JSON.stringify({ messages })
            });

            removeTypingIndicator();

            if (res.ok) {
                const data = await res.json();
                messages.push({ role: 'assistant', content: data.reply });
                appendMessage('assistant', data.reply);

                if (data.is_complete) {
                    const fullPrompt = messages.filter(m => m.role === 'user').map(m => m.content).join(' ');
                    handleZeroClickGenerate(fullPrompt);
                } else {
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.focus();
                }
            } else {
                throw new Error("Chat request failed");
            }
        } catch (err) {
            removeTypingIndicator();
            appendMessage('assistant', "Sorry, I'm having trouble connecting right now.");
            chatInput.disabled = false;
            chatSendBtn.disabled = false;
        }
    });

    launchBtn.addEventListener('click', () => {
        window.location.href = "dashboard.html";
    });
</script>
</body>
</html>
