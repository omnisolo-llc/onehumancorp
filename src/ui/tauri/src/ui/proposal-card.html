<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
        min-height: 44px;
        min-width: 44px;
        border: none;
        cursor: pointer;
        font-weight: 500;
        font-size: 16px;
        transition: all 0.2s ease;
      }
      .glassmorphism-input {
        border-radius: 8px;
        min-height: 44px;
        border: 1px solid rgba(0,0,0,0.1);
        padding: 8px 12px;
        width: 100%;
        box-sizing: border-box;
      }
    </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposal & Invoicing Agent Card - OHC</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --primary-color: #0066FF;
      --success-color: #34C759;
      --warning-color: #FF9500;
      --danger-color: #FF3B30;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      /* Mobile first layout */
    }
    .mobile-container {
      width: 100%;
      max-width: 375px; /* STRICT 375px restriction for testing */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .agent-feed-item {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--primary-color);
    }
    .customer-inquiry {
      font-style: italic;
      color: #555;
      font-size: 14px;
      padding-left: 8px;
      border-left: 2px solid #ccc;
    }
    .proposal-details {
      background: rgba(255,255,255,0.4);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .line-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      border-top: 1px solid rgba(0,0,0,0.1);
      padding-top: 8px;
      margin-top: 4px;
    }
    .deposit-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--warning-color);
      font-weight: 500;
    }
    .action-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-primary {
      background: var(--primary-color);
      color: white;
    }
    .btn-secondary {
      background: rgba(0,0,0,0.05);
      color: var(--text-color);
    }
    .btn-danger {
      background: rgba(255,59,48,0.1);
      color: var(--danger-color);
    }
    .edit-mode {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .edit-mode.active {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="glassmorphism agent-feed-item" id="proposal-card">
      <div class="agent-header">
        <span>🤖 The Closer (Sales/Finance Agent)</span>
      </div>
      <div class="customer-inquiry">
        "Sarah requested a quote for kitchen cabinet repair."
      </div>

      <div id="view-mode" class="proposal-details">
        <div style="font-weight: 600; font-size: 15px; margin-bottom: 4px;">Drafted Proposal</div>
        <div class="line-item">
          <span>Cabinet Repair (Labor)</span>
          <span>$300.00</span>
        </div>
        <div class="line-item">
          <span>Materials</span>
          <span>$150.00</span>
        </div>
        <div class="total-row">
          <span>Total</span>
          <span>$450.00</span>
        </div>
        <div class="deposit-row">
          <span>Required Deposit</span>
          <span>$150.00</span>
        </div>
        <div style="font-size: 12px; color: #666; margin-top: 4px;">
          Based on your standard hourly rate and material estimates.
        </div>
      </div>

      <div id="edit-mode" class="glassmorphism edit-mode proposal-details" style="background: white;">
         <div style="font-weight: 600; font-size: 15px; margin-bottom: 4px;">Edit Proposal</div>
         <label style="font-size: 12px; font-weight: 500;">Total Amount ($)</label>
         <input type="number" class="glassmorphism-input" id="edit-total" value="450" />

         <label style="font-size: 12px; font-weight: 500;">Deposit Amount ($)</label>
         <input type="number" class="glassmorphism-input" id="edit-deposit" value="150" />
      </div>

      <div class="action-row" id="view-actions">
        <button class="glassmorphism-btn btn-primary" onclick="approveAndSend()">Approve & Send Link</button>
        <button class="glassmorphism-btn btn-secondary" onclick="toggleEdit()">Review / Edit</button>
        <button class="glassmorphism-btn btn-danger" onclick="dismiss()">Dismiss</button>
      </div>

      <div class="action-row edit-mode" id="edit-actions">
        <button class="glassmorphism-btn btn-primary" onclick="saveEdit()">Save & Update</button>
        <button class="glassmorphism-btn btn-secondary" onclick="toggleEdit()">Cancel</button>
      </div>

    </div>
  </div>

  <script>
    function toggleEdit() {
      const viewMode = document.getElementById('view-mode');
      const editMode = document.getElementById('edit-mode');
      const viewActions = document.getElementById('view-actions');
      const editActions = document.getElementById('edit-actions');

      if (editMode.classList.contains('active')) {
        editMode.classList.remove('active');
        editActions.classList.remove('active');
        viewMode.style.display = 'flex';
        viewActions.style.display = 'flex';
      } else {
        editMode.classList.add('active');
        editActions.classList.add('active');
        viewMode.style.display = 'none';
        viewActions.style.display = 'none';
      }
    }

    async function approveAndSend() {
      alert("Proposal approved! Stripe Payment Link generated and sent to customer.");
      document.getElementById('proposal-card').style.opacity = '0.5';
      document.getElementById('proposal-card').style.pointerEvents = 'none';

      // Real integration would call: /api/v1/quotes/:id/approve -> generates Stripe Link -> sends message
    }

    function saveEdit() {
      alert("Proposal updated successfully.");
      toggleEdit();
    }

    function dismiss() {
      document.getElementById('proposal-card').style.display = 'none';
    }
  </script>
</body>
</html>
