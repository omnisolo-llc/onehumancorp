<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Promoter</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 24px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #1d1d1f;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 24px;
      text-align: center;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 8px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255,255,255,0.8);
      font-family: inherit;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      background: #0066FF;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:disabled {
      background: #a0c4ff;
      cursor: not-allowed;
    }
    .variant-card {
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(0,102,255,0.2);
    }
    .platform-badge {
      display: inline-block;
      background: #e5f0ff;
      color: #0066FF;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .variant-content {
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
    }
    .action-btn {
      background: #34C759;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      width: auto;
      display: inline-block;
    }
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #results-section {
      display: none;
      margin-top: 24px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      color: #0066FF;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    <h1>The Promoter</h1>
    <p class="subtitle">Enter a new product to instantly generate marketing copy for your social media channels.</p>

    <div class="input-group">
      <label>Product Name</label>
      <input type="text" id="product-name" placeholder="e.g. Vegan Chocolate Cake">
    </div>

    <div class="input-group">
      <label>Product Description (Optional)</label>
      <textarea id="product-desc" placeholder="Tell us about the features or ingredients..."></textarea>
    </div>

    <button id="generate-btn">
      <span id="btn-text">Generate Posts</span>
      <div class="spinner" id="btn-spinner"></div>
    </button>

    <div id="results-section">
      <h3>Suggested Posts</h3>
      <div id="variants-container"></div>
    </div>
  </div>

  <script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const name = document.getElementById('product-name').value.trim();
      const desc = document.getElementById('product-desc').value.trim();

      if (!name) {
        alert("Please enter a product name.");
        return;
      }

      const btn = document.getElementById('generate-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const resultsSection = document.getElementById('results-section');
      const container = document.getElementById('variants-container');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      resultsSection.style.display = 'none';
      container.innerHTML = '';

      try {
        const payload = {
          product_id: "preview-" + Date.now(),
          name: name,
          description: desc || null
        };

        let url = '/api/v1/growth/promoter/generate';
        if (window.location.protocol === 'file:') {
          url = 'http://127.0.0.1:18789/api/v1/growth/promoter/generate';
        }

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const data = await res.json();
          if (data.variants && data.variants.length > 0) {
            data.variants.forEach((v, index) => {
              const card = document.createElement('div');
              card.className = 'variant-card';
              card.innerHTML = `
                <span class="platform-badge">${v.platform}</span>
                <div class="variant-content">${v.content}</div>
                <button class="action-btn" id="approve-btn-${index}">Approve & Send</button>
              `;
              container.appendChild(card);

              card.querySelector(`#approve-btn-${index}`).addEventListener('click', (e) => {
                const button = e.target;
                button.innerText = "Scheduled!";
                button.style.background = "#8e8e93";
                button.disabled = true;
              });
            });
            resultsSection.style.display = 'block';
          } else {
            alert("Failed to generate variants.");
          }
        } else {
          alert("Server error. Please try again.");
        }
      } catch (err) {
        console.error(err);
        alert("Network error.");
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    });
  </script>
<script src="help-widget.mjs"></script>
</body>
</html>
