<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to OHC</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Welcome to OHC</h1>
      <p style="color: #86868b; margin-bottom: 30px;">The AI work assistant for owners and operators.</p>
      <button id="start-btn" data-tooltip="Ready to launch your AI assistant? Click here to begin setup.">Start Onboarding</button>
    </div>
    <script src="tooltips.js"></script>
    <script src="help-chat.js"></script>
    <script>
      const startBtn = document.getElementById('start-btn');
      if (startBtn) {
        startBtn.addEventListener('click', () => {
           window.location.href = "setup.html";
        });
      }
    </script>
  </body>
</html>
