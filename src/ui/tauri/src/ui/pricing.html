<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Options</title>
    <style>
      body { font-family: "Outfit", sans-serif; background: #f5f5f7; padding: 20px; }
      .container { text-align: center; max-width: 800px; margin: 0 auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
      .card { background: rgba(255, 255, 255, 0.65); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; justify-content: space-between;}
      .card.pro { border: 2px solid #0066FF; background: rgba(255, 255, 255, 0.9); }
      button { width: 100%; background: #0066FF; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; margin-top: 20px; }
      button.back { width: auto; background: #e5e5ea; color: #1d1d1f; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="back" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
      <h1>Choose Your Plan</h1>
      <p>Plain-language pricing — no hidden fees.</p>

      <div class="grid" id="pricing-grid">
        <div class="card">
          <div>
            <h3>Free</h3>
            <p>$0 / month</p>
            <ul style="text-align:left; font-size:14px; color:#555;">
              <li>1 Agent Limit</li>
              <li>100 AI actions</li>
              <li>500MB Storage</li>
            </ul>
          </div>
          <button style="background:#ccc; color:#555">Current Plan</button>
        </div>
        <div class="card pro">
          <div>
            <h3>Starter</h3>
            <p>$29 / month</p>
            <ul style="text-align:left; font-size:14px; color:#555;">
              <li>3 Agents Limit</li>
              <li>1000 AI actions</li>
              <li>5GB Storage</li>
            </ul>
          </div>
          <button onclick="upgrade('Starter')">Upgrade via Stripe</button>
        </div>
        <div class="card">
          <div>
            <h3>Pro</h3>
            <p>$79 / month</p>
            <ul style="text-align:left; font-size:14px; color:#555;">
              <li>10 Agents Limit</li>
              <li>Unlimited AI</li>
              <li>50GB Storage</li>
            </ul>
          </div>
          <button onclick="upgrade('Pro')">Upgrade via Stripe</button>
        </div>
      </div>
    </div>
    <script>
      function upgrade(tier) {
          window.location.href = "/checkout?tier=" + tier;
      }
    </script>
  </body>
</html>
