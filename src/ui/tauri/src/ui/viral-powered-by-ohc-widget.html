<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Powered by OHC Widget</title>
</head>
<body>
    <div id="widget-generator">
        <h1>Grow your business with OHC</h1>
        <p>Get your custom "Powered by OHC" widget to display on your website.</p>
        <button id="generate-widget-btn">Generate Widget Code</button>
        <div id="widget-output" style="display: none;">
            <p>Copy and paste this code into your website:</p>
            <textarea id="embed-code-textarea" rows="4" cols="50" readonly></textarea>
        </div>
    </div>
    <script>
        document.getElementById('generate-widget-btn').addEventListener('click', async () => {
            const response = await fetch('/api/v1/growth/referrals/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tenant_id: 'test-tenant-123',
                    business_name: 'Test Business'
                })
            });
            const data = await response.json();
            const outputDiv = document.getElementById('widget-output');
            const textarea = document.getElementById('embed-code-textarea');
            textarea.value = data.embed_code;
            outputDiv.style.display = 'block';
        });
    </script>
</body>
</html>
