<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Ledger - OneHumanCorp</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div id="app" class="flex flex-col min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                <div class="flex items-center">
                    <button class="mr-4 text-gray-500 hover:text-gray-700" onclick="window.history.back()">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </button>
                    <h1 class="text-xl font-semibold">Financial Ledger</h1>
                </div>
            </div>
        </header>

        <main class="flex-1 px-4 sm:px-6 lg:px-8 py-8 max-w-3xl mx-auto w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8 text-center">
                <p class="text-sm font-medium text-gray-500 mb-1">Today's Revenue</p>
                <h2 class="text-4xl font-bold text-gray-900" id="todayRevenue">$0.00</h2>
                <div class="mt-4 flex justify-center space-x-4">
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium shadow-sm hover:bg-blue-700 transition-colors" onclick="openTapToPay()">Tap to Pay</button>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-medium mb-4">Transactions</h3>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <ul id="transactionList" class="divide-y divide-gray-100">
                        <li class="p-4 text-center text-gray-500 text-sm py-8" id="emptyState">No transactions yet</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Mock data loading
        document.addEventListener('DOMContentLoaded', () => {
            const revenueEl = document.getElementById('todayRevenue');
            const listEl = document.getElementById('transactionList');
            const emptyState = document.getElementById('emptyState');

            // Example data that would normally come from the API
            const mockEntries = [
                { id: '1', amount: 45.00, type: 'In-Store Tap', status: 'Cleared', date: '2 mins ago' },
                { id: '2', amount: 120.00, type: 'Online Order', status: 'Pending', date: '1 hour ago' }
            ];

            if (mockEntries.length > 0) {
                emptyState.style.display = 'none';
                let total = 0;

                mockEntries.forEach(entry => {
                    total += entry.amount;
                    const li = document.createElement('li');
                    li.className = 'p-4 flex items-center justify-between hover:bg-gray-50 transition-colors';

                    const statusClass = entry.status === 'Cleared' ? 'text-green-700 bg-green-50 ring-green-600/20' : 'text-yellow-700 bg-yellow-50 ring-yellow-600/20';

                    li.innerHTML = `
                        <div class="flex items-center">
                            <div class="h-10 w-10 rounded-full bg-gray-100 flex items-center justify-center mr-4">
                                <span class="text-gray-600 font-medium text-sm">$</span>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-900">${entry.type}</p>
                                <p class="text-xs text-gray-500">${entry.date}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-semibold text-gray-900">$${entry.amount.toFixed(2)}</p>
                            <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset ${statusClass}">${entry.status}</span>
                        </div>
                    `;
                    listEl.appendChild(li);
                });

                revenueEl.textContent = `$${total.toFixed(2)}`;
            }
        });

        function openTapToPay() {
            alert('Opening native Tap to Pay interface...');
        }
    </script>
</body>
</html>
