<!DOCTYPE html>
<html lang="en">
<head>
    <style>

          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Success Milestones - OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="next_out/_next/static/css/global.css">
  <style>
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #fdf2f8 100%);
      color: #1D1D1F;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .app-header {
      padding: calc(16px + var(--safe-area-inset-top)) 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
    }
    .app-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      margin-left: -8px;
      color: #1D1D1F;
      transition: opacity 0.2s;
    }
    .back-btn:active {
      opacity: 0.5;
    }
    .main-content {
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: calc(40px + var(--safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    @media (min-width: 768px) {
      .main-content {
        flex-direction: row;
        align-items: flex-start;
      }
      .milestones-list {
        flex: 1;
      }
      .milestone-share {
        flex: 1;
        position: sticky;
        top: 100px;
      }
    }
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 16px;
    }

    /* Milestone List */
    .milestones-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .milestone-item {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .milestone-item.reached:hover {
      background: rgba(255, 255, 255, 0.65);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .milestone-item.active {
      background: #fff;
      border-color: #6366f1;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.25), inset 0 0 0 2px #6366f1;
    }
    .milestone-item.locked {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }
    .milestone-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .milestone-info {
      flex: 1;
    }
    .milestone-title {
      font-weight: 600;
      font-size: 16px;
      margin: 0 0 4px 0;
    }
    .milestone-desc {
      font-size: 14px;
      color: #6b7280;
      margin: 0;
      line-height: 1.4;
    }
    .milestone-locked-text {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #9ca3af;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Share Card */
    .milestone-share {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .card-preview-container {
      width: 100%;
      aspect-ratio: 1200 / 630;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: #f3f4f6;
      position: relative;
    }
    .card-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .empty-card {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 20px;
      border: 2px dashed #d1d5db;
      background: rgba(255, 255, 255, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      gap: 12px;
    }
    .empty-card-icon {
      font-size: 40px;
    }
    .empty-card-text {
      font-weight: 500;
      font-size: 14px;
    }

    /* Buttons */
    .share-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
      box-sizing: border-box;
      min-height: 44px; /* Mobile touch target size */
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-download {
      background: #4f46e5;
      color: white;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }
    .btn-download:hover {
      background: #4338ca;
    }
    .btn-copy {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #1f2937;
    }
    .btn-copy.copied {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }
    .btn-x {
      background: #000;
      color: white;
    }
    .btn-whatsapp {
      background: #25D366;
      color: white;
    }
    .btn-facebook {
      background: #1877F2;
      color: white;
    }
    .btn-invite {
      background: #eef2ff;
      color: #4f46e5;
      margin-top: 8px;
    }
    .btn-invite:hover {
      background: #e0e7ff;
    }

    /* Loading state */
    .skeleton {
      animation: pulse 1.5s infinite ease-in-out;
      background: #e5e7eb;
      border-radius: 16px;
      height: 80px;
      width: 100%;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .icon-svg {
      width: 20px;
      height: 20px;
    }

    .btn-uniform {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      margin-bottom: 10px;
    }

  </style>
</head>
<body>
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="app-title">Success Milestones 🏆</h1>
    </div>
  </header>

  <main class="main-content">
    <section class="milestones-list" id="milestones-container">
      <h2 class="section-title">Your Achievements</h2>
      <!-- Skeletons -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

      <div id="share-container" style="display: none; flex-direction: column; gap: 24px;">
        <div class="card-preview-container">
          <img id="card-preview-img" class="card-preview" src="" alt="Milestone Card" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjYzMCI+PHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI2YxZjVmOSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSI0OCIgZmlsbD0iIzk0YTNiOSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Q291bGQgbm90IGxvYWQgbWlsZXN0b25lIGNhcmQ8L3RleHQ+PC9zdmc+'">
        </div>

        <div class="share-buttons">
          <button id="btn-download" class="btn btn-download btn-uniform">
            <svg class="icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>

          </button>

            Copy Share Message

      <div id="empty-state" class="empty-card">
        <span class="empty-card-icon">🏆</span>
        <p class="empty-card-text">Select an unlocked milestone</p>
      </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'DEFAULT';
      const container = document.getElementById('milestones-container');
      const shareContainer = document.getElementById('share-container');
      const emptyState = document.getElementById('empty-state');
      const imgPreview = document.getElementById('card-preview-img');

      let allMilestones = [];
      let activeMilestoneId = null;

      const getIcon = (id) => {
        switch (id) {
          case 'first_sale': return '🎉';
          case '10th_order': return '📈';
          case '50th_order': return '🔥';
          case '100_orders': return '📦';
          case '1000_orders': return '👑';
          case '100_visitors': return '🚀';
          case '5_referrals': return '🤝';
          case 'revenue_1k': return '💰';
          case 'revenue_10k': return '💎';
          case 'revenue_100k': return '🌟';
          default: return '🏆';
        }
      };

      const shareTarget = `${window.location.origin}/setup.html?ref=milestone`;

      const getShareText = (milestone) => {
        const title = milestone ? milestone.title.replace('🎉 Milestone: ', '') : 'huge business milestone';
        return `I just hit a huge business milestone (🎉 Milestone: ${title}) using OHC! Launch your own store today: ${shareTarget}\n\n⚡ Powered by OHC`;
      };

      const selectMilestone = (id) => {
        if (!id) return;

        const milestone = allMilestones.find(m => m.id === id);
        if (!milestone || !milestone.reached) return;

        activeMilestoneId = id;

        // Update UI styles
        document.querySelectorAll('.milestone-item').forEach(el => {
          el.classList.remove('active');
          if (el.dataset.id === id) {
            el.classList.add('active');
          }
        });

        // Update Share Card
        emptyState.style.display = 'none';
        shareContainer.style.display = 'flex';

        const cardUrl = `/api/v1/growth/milestone/card?milestone_id=${id}&tenant=${tenantId}`;
        imgPreview.src = cardUrl;

        // Update Links
        const text = getShareText(milestone);
        const encodedText = encodeURIComponent(text);

        document.getElementById('btn-x').href = `https://twitter.com/intent/tweet?text=${encodedText}`;
        document.getElementById('btn-whatsapp').href = `https://wa.me/?text=${encodedText}`;
        document.getElementById('btn-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareTarget)}&quote=${encodedText}`;

        // Setup Download
        document.getElementById('btn-download').onclick = async () => {
          try {
            const response = await fetch(cardUrl);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `milestone-${id}.svg`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
          } catch (err) {
            console.error("Failed to download milestone card", err);
          }
        };

        // Setup Copy
        const btnCopy = document.getElementById('btn-copy');
        btnCopy.onclick = () => {
          navigator.clipboard.writeText(text).then(() => {
            btnCopy.textContent = 'Copied Message!';
            btnCopy.classList.add('copied');
            setTimeout(() => {
              btnCopy.textContent = 'Copy Share Message';
              btnCopy.classList.remove('copied');
            }, 2000);
          }).catch(err => {
            console.error('Failed to copy text: ', err);
          });
        };
      };

      try {
        const response = await fetch(`/api/v1/growth/milestones/check?tenant=${tenantId}`);
        const data = await response.json();

        if (data && data.milestones) {
          allMilestones = data.milestones;

          // Clear skeletons
          container.innerHTML = '<h2 class="section-title">Your Achievements</h2>';

          data.milestones.forEach(m => {
            const isReached = m.reached;
            const div = document.createElement('div');
            div.className = `milestone-item ${isReached ? 'reached' : 'locked'}`;
            div.dataset.id = m.id;

            if (isReached) {
              div.onclick = () => selectMilestone(m.id);
            }

            div.innerHTML = `
              <div class="milestone-icon">${getIcon(m.id)}</div>
              <div class="milestone-info">
                <h3 class="milestone-title">${m.title}</h3>
                <p class="milestone-desc">${m.description}</p>
                ${!isReached ? '<div class="milestone-locked-text"><span>🔒</span> Locked</div>' : ''}
              </div>
            `;
            container.appendChild(div);
          });

          // Auto-select first unlocked
          const firstUnlocked = data.milestones.find(m => m.reached);
          if (firstUnlocked) {
            selectMilestone(firstUnlocked.id);
          }
        }
      } catch (e) {
        console.error("Failed to fetch milestones", e);
        container.innerHTML = '<h2 class="section-title">Your Achievements</h2><p>Failed to load milestones.</p>';
      }
    });
  </script>
</body>
</html>
