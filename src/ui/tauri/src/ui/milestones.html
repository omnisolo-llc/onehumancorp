<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Achievements - OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --text-secondary: #86868b;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: rgba(0, 0, 0, 0.1);
      --accent: #0066FF;
      --accent-hover: #005ce6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-color: #f5f5f7;
        --text-secondary: #a1a1a6;
        --glass-bg: rgba(28, 28, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 768px) {
      .content-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .glassmorphism {
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--glass-shadow);
      padding: 24px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .milestone-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .milestone-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 16px;
      cursor: pointer;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.05);
    }

    .milestone-item:hover {
      background: rgba(255,255,255,0.1);
    }

    .milestone-item.active {
      border-color: var(--accent);
      background: rgba(0, 102, 255, 0.05);
    }

    .milestone-item.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .milestone-icon {
      font-size: 32px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .milestone-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .milestone-info p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .locked-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      color: var(--text-secondary);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .preview-section {
      position: sticky;
      top: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .preview-card {
      width: 100%;
      aspect-ratio: 1200 / 630;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-whatsapp {
      background: #25D366;
      color: white;
    }

    .btn-whatsapp:hover {
      background: #20bd5a;
    }

    .btn-facebook {
      background: #1877F2;
      color: white;
    }

    .btn-facebook:hover {
      background: #166fe5;
    }

    .btn-x {
      background: #000000;
      color: white;
    }

    @media (prefers-color-scheme: dark) {
      .btn-x {
        background: #ffffff;
        color: #000000;
      }
    }

    .btn-x:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: rgba(134, 134, 139, 0.1);
      color: var(--text-color);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(134, 134, 139, 0.2);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      text-align: center;
      color: var(--text-secondary);
      border: 2px dashed var(--glass-border);
      border-radius: 20px;
    }

    .empty-state span {
      font-size: 48px;
      margin-bottom: 16px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2 style="font-size: 32px; margin-bottom: 8px;">Your Achievements</h2>
      <p>Celebrate and share your business milestones</p>
    </div>

    <div id="loading">Loading milestones...</div>

    <div class="content-grid" id="main-content" style="display: none;">
      <!-- Milestone List -->
      <div class="glassmorphism milestone-list" id="milestones-container">
        <!-- Rendered via JS -->
      </div>

      <!-- Preview & Share -->
      <div class="preview-section" id="preview-section">
        <div class="empty-state" id="empty-preview">
          <span>🏆</span>
          <p>Select an unlocked milestone to share</p>
        </div>

        <div id="active-preview" style="display: none; width: 100%; display: flex; flex-direction: column; gap: 24px;">
          <div class="preview-card">
            <img id="milestone-image" src="" alt="Milestone Preview">
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px;">
            <button class="btn btn-secondary" id="copy-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy Share Message
            </button>
            <a href="#" target="_blank" class="btn btn-x" id="share-x">
              <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.008 5.94H5.078z"/></svg>
              Share on X
            </a>
            <a href="#" target="_blank" class="btn btn-whatsapp" id="share-whatsapp">
              <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
              Share to WhatsApp
            </a>
            <a href="#" target="_blank" class="btn btn-facebook" id="share-facebook">
              <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              Share on Facebook
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'DEFAULT';
      const container = document.getElementById('milestones-container');
      const loading = document.getElementById('loading');
      const mainContent = document.getElementById('main-content');

      const emptyPreview = document.getElementById('empty-preview');
      const activePreview = document.getElementById('active-preview');
      const milestoneImage = document.getElementById('milestone-image');

      const copyBtn = document.getElementById('copy-btn');
      const shareX = document.getElementById('share-x');
      const shareWhatsapp = document.getElementById('share-whatsapp');
      const shareFacebook = document.getElementById('share-facebook');

      let milestones = [];
      let activeMilestone = null;

      try {
        const response = await fetch(`/api/v1/growth/milestones/check?tenant=${encodeURIComponent(tenantId)}`);
        const data = await response.json();
        if (data && data.milestones) {
          milestones = data.milestones;
        }
      } catch (err) {
        console.error("Failed to fetch milestones", err);
      }

      loading.style.display = 'none';
      mainContent.style.display = 'grid';

      if (milestones.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">No milestones available.</div>';
        return;
      }

      function getShareText(m) {
        const referralLink = `https://cloud.ohc.network/invite/${tenantId}`;
        return `I just hit a huge milestone with my business: ${m.title}! 🚀\n\n${m.description}\n\n⚡ Powered by OHC - Create your AI agent business today: ${referralLink}`;
      }

      function selectMilestone(m, element) {
        if (!m.reached) return;

        // Update active class
        document.querySelectorAll('.milestone-item').forEach(el => el.classList.remove('active'));
        if (element) {
          element.classList.add('active');
        }

        activeMilestone = m;

        // Show preview
        emptyPreview.style.display = 'none';
        activePreview.style.display = 'flex';

        const cardUrl = `/api/v1/growth/milestone/card?milestone_id=${m.id}&tenant=${tenantId}`;
        milestoneImage.src = cardUrl;

        const shareText = getShareText(m);
        const encodedText = encodeURIComponent(shareText);

        shareX.href = `https://twitter.com/intent/tweet?text=${encodedText}`;
        shareWhatsapp.href = `https://wa.me/?text=${encodedText}`;
        shareFacebook.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent('https://cloud.ohc.network')}&quote=${encodedText}`;
      }

      milestones.forEach((m, index) => {
        const div = document.createElement('div');
        div.className = `milestone-item glassmorphism ${m.reached ? '' : 'locked'}`;

        const icon = m.title.includes('Sale') || m.title.includes('Revenue') || m.title.includes('Four') ? '💰' :
                     m.title.includes('Visitor') ? '🚀' :
                     m.title.includes('Order') ? '📦' : '🤝';

        const iconDiv = document.createElement('div');
        iconDiv.className = 'milestone-icon';
        iconDiv.textContent = icon;

        const infoDiv = document.createElement('div');
        infoDiv.className = 'milestone-info';

        const h3 = document.createElement('h3');
        h3.textContent = m.title;

        const p = document.createElement('p');
        p.textContent = m.description;

        infoDiv.appendChild(h3);
        infoDiv.appendChild(p);

        if (!m.reached) {
          const lockedDiv = document.createElement('div');
          lockedDiv.className = 'locked-badge';
          lockedDiv.textContent = '🔒 Locked';
          infoDiv.appendChild(lockedDiv);
        }

        div.appendChild(iconDiv);
        div.appendChild(infoDiv);

        div.addEventListener('click', () => selectMilestone(m, div));
        container.appendChild(div);

        // Auto-select first unlocked
        if (m.reached && !activeMilestone) {
          selectMilestone(m, div);
        }
      });

      copyBtn.addEventListener('click', () => {
        if (!activeMilestone) return;
        navigator.clipboard.writeText(getShareText(activeMilestone));
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '✅ Copied!';
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
        }, 2000);
      });
    });
  </script>
</body>
</html>
