<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container glassmorphism" id="form-container">
      <h1>Set up your Assistant</h1>
      <p>Give your AI assistant a name and tone.</p>

      <input type="text" id="assistant-name" placeholder="e.g. Jarvis" />
      <div id="name-error" class="error-msg">Please enter a name for your assistant.</div>

      <select id="assistant-tone">
        <option value="" disabled selected>Select a tone</option>
        <option value="Professional">Professional</option>
        <option value="Friendly">Friendly</option>
        <option value="Concise">Concise</option>
      </select>
      <div id="tone-error" class="error-msg">Please select a tone.</div>

      <button id="next-btn">Next</button>
    </div>
    <script>
      const nextBtn = document.getElementById('next-btn');
      const nameInput = document.getElementById('assistant-name');
      const toneSelect = document.getElementById('assistant-tone');
      const nameError = document.getElementById('name-error');
      const toneError = document.getElementById('tone-error');
      const container = document.getElementById('form-container');

      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
           let isValid = true;
           const name = nameInput.value.trim();
           const tone = toneSelect.value;

           if (!name) {
               nameError.style.display = 'block';
               isValid = false;
           } else {
               nameError.style.display = 'none';
           }

           if (!tone) {
               toneError.style.display = 'block';
               isValid = false;
           } else {
               toneError.style.display = 'none';
           }

           if (isValid) {
               localStorage.setItem('assistantName', name);
               localStorage.setItem('assistantTone', tone);
               window.location.href = "success.html";
           } else {
               container.classList.remove('animate-shake');
               void container.offsetWidth; // trigger reflow
               container.classList.add('animate-shake');
           }
        });
      }

      nameInput.addEventListener('input', () => {
          if (nameInput.value.trim()) {
              nameError.style.display = 'none';
          }
      });

      toneSelect.addEventListener('change', () => {
          if (toneSelect.value) {
              toneError.style.display = 'none';
          }
      });
    </script>
  </body>
</html>
