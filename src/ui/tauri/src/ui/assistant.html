<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Assistant Workstation</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* OHC Translucent Glass Theme */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }

      /* Top Bar */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        z-index: 10;
      }
      .header-title {
        font-weight: 700;
        font-size: 18px;
        color: #1d1d1f;
      }
      .top-actions {
        display: flex;
        gap: 15px;
      }
      .top-actions a {
        text-decoration: none;
        color: #0066FF;
        font-weight: 500;
        font-size: 14px;
        transition: opacity 0.2s;
      }
      .top-actions a:hover {
        opacity: 0.8;
      }

      /* Main Layout */
      .workspace {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* Left Rail */
      .left-rail {
        width: 250px;
        border-right: 1px solid rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
      }
      .rail-section {
        margin-bottom: 20px;
      }
      .rail-title {
        font-size: 12px;
        text-transform: uppercase;
        color: #86868b;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .task-item {
        padding: 10px;
        border-radius: 16px;
        cursor: pointer;
        margin-bottom: 5px;
        font-size: 14px;
        color: #1d1d1f;
        background: rgba(255, 255, 255, 0.5);
      }
      .task-item:hover, .task-item.active {
        background: rgba(0, 102, 255, 0.1);
        color: #0066FF;
      }
      .empty-state {
        color: #86868b;
        font-style: italic;
        font-size: 13px;
        padding: 10px;
      }

      /* Center Conversation */
      .center-conversation {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(0, 0, 0, 0.1);
        background-color: transparent;
      }
      .task-header {
        padding: 20px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .task-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 5px 0;
      }
      .task-status {
        font-size: 12px;
        color: #86868b;
      }
      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }
      .message {
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 16px;
        max-width: 80%;
      }
      .message.user {
        background: rgba(0, 102, 255, 0.1);
        align-self: flex-end;
        margin-left: auto;
      }
      .message.assistant {
        background: rgba(255, 255, 255, 0.8);
      }
      .composer {
        padding: 20px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }
      .composer-input {
        width: 100%;
        padding: 15px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        font-size: 14px;
        box-sizing: border-box;
        resize: none;
        background: rgba(255, 255, 255, 0.8);
      }
      .composer-input:focus {
        outline: none;
        border-color: #0066FF;
      }

      /* Right Panel */
      .right-panel {
        width: 300px;
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
      }
      .panel-tabs {
        display: flex;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .panel-tab {
        padding: 10px 15px;
        font-size: 14px;
        cursor: pointer;
        color: #86868b;
        border-bottom: 2px solid transparent;
      }
      .panel-tab.active {
        color: #0066FF;
        border-bottom-color: #0066FF;
        font-weight: 500;
      }
      .result-item {
        padding: 10px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        margin-bottom: 10px;
        font-size: 13px;
        display: flex;
        align-items: center;
      }
      .result-icon {
        margin-right: 10px;
        font-size: 16px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
          color: #F5F5F7;
        }
        .glass-panel {
          background: rgba(22, 22, 26, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header-title, .task-title, .task-item {
          color: #F5F5F7;
        }
        .left-rail, .center-conversation, .task-header, .composer, .panel-tabs {
          border-color: rgba(255, 255, 255, 0.1);
        }
        .task-item {
          background: rgba(255, 255, 255, 0.05);
        }
        .message.assistant, .composer-input, .result-item {
          background: rgba(255, 255, 255, 0.1);
          color: #F5F5F7;
          border-color: rgba(255, 255, 255, 0.2);
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Bar -->
    <header class="glass-panel">
      <div class="header-title" id="assistant-header-title">Assistant Workspace</div>
      <div class="top-actions">
        <a href="workflow-builder.html" aria-label="Automations">Automations</a>
        <a href="agent-profile.html" aria-label="Expert Center">Expert Center</a>
        <button id="assistant-walkthrough-btn" data-tooltip="assistant-walkthrough-btn" style="background: none; border: none; font-size: 14px; font-weight: 600; color: #0066FF; cursor: pointer; padding: 0 8px;" onclick="window.startWalkthrough([{selector: '#ohc-help-input-area', title: 'Activate your AI Support Agent', text: 'Chat here to activate your AI agent.'}])">Walkthrough</button>
        <button id="help-center-nav-btn" data-tooltip="help-center-nav-btn" style="background: none; border: none; font-size: 18px; font-weight: 600; color: #1d1d1f; cursor: pointer; padding: 0 8px;" onclick="window.location.href='help.html'">?</button>
      </div>
    </header>

    <div class="workspace">
      <!-- Left Rail -->
      <div class="left-rail glass-panel">
        <div class="rail-section">
          <div class="rail-title">Workspace</div>
          <select style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); margin-bottom: 10px; background: rgba(255,255,255,0.5);" aria-label="Workspace Selector">
            <option>Personal Workspace</option>
          </select>
        </div>

        <div class="rail-section">
          <div class="rail-title">Active Tasks</div>
          <div id="active-tasks-container">
            <div class="empty-state">No active tasks.</div>
          </div>
        </div>

        <div class="rail-section">
          <div class="rail-title">Filters</div>
          <div id="filters-container">
             <div class="empty-state">No filters.</div>
          </div>
        </div>
      </div>

      <!-- Center Conversation -->
      <div class="center-conversation">
        <div class="task-header">
          <h2 class="task-title" aria-label="Task Title">New Task</h2>
          <div class="task-status" aria-label="Task Status">Status: Idle</div>
        </div>

        <div class="messages" id="messages-container" aria-label="Conversation View">
            <div class="empty-state" style="text-align: center; margin-top: 40px;">How can I help you today?</div>
        </div>

        <div class="composer">
          <textarea class="composer-input" rows="3" placeholder="Tell the assistant what to do next..." aria-label="Composer Input"></textarea>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="right-panel glass-panel" aria-label="Results Panel">
        <div class="panel-tabs">
          <div class="panel-tab active" aria-label="Tab: Artifacts">Artifacts</div>
          <div class="panel-tab" aria-label="Tab: All Files">All Files</div>
          <div class="panel-tab" aria-label="Tab: Changes">Changes</div>
          <div class="panel-tab" aria-label="Tab: Preview">Preview</div>
        </div>

        <div class="result-list" id="results-container">
            <div class="empty-state">No results to show.</div>
        </div>
      </div>
    </div>


    <script>
(function() {
    // Inject walkthrough CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-walkthrough-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 10000;
            pointer-events: auto;
        }
        .ohc-walkthrough-highlight {
            position: absolute;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            pointer-events: none;
            z-index: 10001;
            transition: all 0.3s ease;
        }
        .ohc-walkthrough-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px) saturate(210%); -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 10002;
            font-family: "Outfit", sans-serif;
            color: #1d1d1f;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }
        .ohc-walkthrough-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .ohc-walkthrough-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }
        .ohc-walkthrough-text {
            font-size: 14px;
            color: #86868b;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }
        .ohc-walkthrough-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ohc-walkthrough-btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .ohc-walkthrough-btn-secondary {
            background: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .ohc-walkthrough-close {
            position: absolute;
            top: 12px; right: 12px;
            background: none; border: none; color: #86868b; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            .ohc-walkthrough-bubble {
                background: rgba(22, 22, 26, 0.95);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
            .ohc-walkthrough-btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    let currentSteps = [];
    let currentStepIndex = 0;
    let overlayEl = null;
    let highlightEl = null;
    let bubbleEl = null;

    function renderStep() {
        if (!currentSteps || currentStepIndex >= currentSteps.length) {
            endWalkthrough();
            return;
        }

        const step = currentSteps[currentStepIndex];
        const targetEl = document.querySelector(step.selector);

        if (!targetEl) {
            console.warn('Walkthrough target not found:', step.selector);
            endWalkthrough();
            return;
        }

        targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

        setTimeout(() => {
            const rect = targetEl.getBoundingClientRect();

            highlightEl.style.top = (rect.top - 5) + 'px';
            highlightEl.style.left = (rect.left - 5) + 'px';
            highlightEl.style.width = (rect.width + 10) + 'px';
            highlightEl.style.height = (rect.height + 10) + 'px';

            bubbleEl.innerHTML = `
                <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
                <h4 class="ohc-walkthrough-title">${step.title}</h4>
                <p class="ohc-walkthrough-text">${step.text}</p>
                <div class="ohc-walkthrough-controls">
                    ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                    <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                </div>
            `;

            let bubbleTop = rect.bottom + 15;
            let bubbleLeft = rect.left + (rect.width / 2) - 140;

            if (bubbleLeft < 10) bubbleLeft = 10;
            if (bubbleLeft + 280 > window.innerWidth - 10) bubbleLeft = window.innerWidth - 290;
            if (bubbleTop + 200 > window.innerHeight) {
                bubbleTop = rect.top - 180;
            }

            bubbleEl.style.top = bubbleTop + 'px';
            bubbleEl.style.left = bubbleLeft + 'px';
            bubbleEl.classList.add('visible');

            bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;
            bubbleEl.querySelector('.next-btn').onclick = () => {
                bubbleEl.classList.remove('visible');
                setTimeout(() => {
                    currentStepIndex++;
                    renderStep();
                }, 300);
            };
            const prevBtn = bubbleEl.querySelector('.prev-btn');
            if (prevBtn) {
                prevBtn.onclick = () => {
                    bubbleEl.classList.remove('visible');
                    setTimeout(() => {
                        currentStepIndex--;
                        renderStep();
                    }, 300);
                };
            }

        }, 300);
    }

    function endWalkthrough() {
        if (overlayEl) {
            overlayEl.remove();
            overlayEl = null;
        }
        if (highlightEl) {
            highlightEl.remove();
            highlightEl = null;
        }
        if (bubbleEl) {
            bubbleEl.remove();
            bubbleEl = null;
        }
        currentSteps = [];
        currentStepIndex = 0;
    }

        // Walkthroughs
    if (!window.startWalkthrough) {
            // Walkthroughs
    if (!window.startWalkthrough) {
        window.startWalkthrough = function(steps) {
            if (!steps || steps.length === 0) return;

            let currentStepIndex = 0;
            let currentSteps = steps;

            const overlayEl = document.createElement('div');
            overlayEl.className = 'ohc-walkthrough-overlay';
            document.body.appendChild(overlayEl);

            const highlightEl = document.createElement('div');
            highlightEl.className = 'ohc-walkthrough-highlight';
            document.body.appendChild(highlightEl);

            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'ohc-walkthrough-bubble';
            document.body.appendChild(bubbleEl);

            function endWalkthrough() {
                if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
                if (highlightEl.parentNode) highlightEl.parentNode.removeChild(highlightEl);
                if (bubbleEl.parentNode) bubbleEl.parentNode.removeChild(bubbleEl);
                window.removeEventListener('resize', positionHighlight);
                window.removeEventListener('scroll', positionHighlight);
            }

            function positionHighlight() {
                const step = currentSteps[currentStepIndex];
                const target = document.querySelector(step.selector || step.targetId);

                if (!target) {
                    console.warn('Walkthrough target not found:', step.selector);
                    endWalkthrough();
                    return;
                }

                const rect = target.getBoundingClientRect();

                highlightEl.style.top = `${rect.top - 4}px`;
                highlightEl.style.left = `${rect.left - 4}px`;
                highlightEl.style.width = `${rect.width + 8}px`;
                highlightEl.style.height = `${rect.height + 8}px`;

                bubbleEl.innerHTML = `
                    <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                    <h4 class="ohc-walkthrough-title">${step.title}</h4>
                    <p class="ohc-walkthrough-text">${step.text || step.content}</p>
                    <div class="ohc-walkthrough-controls">
                        ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                        <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                    </div>
                `;

                bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;

                if (currentStepIndex > 0) {
                    bubbleEl.querySelector('.prev-btn').onclick = () => {
                        currentStepIndex--;
                        positionHighlight();
                    };
                }

                bubbleEl.querySelector('.next-btn').onclick = () => {
                    if (currentStepIndex === currentSteps.length - 1) {
                        endWalkthrough();
                    } else {
                        currentStepIndex++;
                        positionHighlight();
                    }
                };

                let top = rect.bottom + 16;
                let left = rect.left + (rect.width / 2) - 150;

                if (top + 200 > window.innerHeight) {
                    top = rect.top - bubbleEl.offsetHeight - 16;
                }

                if (left < 16) left = 16;
                if (left + 300 > window.innerWidth - 16) left = window.innerWidth - 316;

                bubbleEl.style.top = `${top}px`;
                bubbleEl.style.left = `${left}px`;

                requestAnimationFrame(() => {
                    bubbleEl.classList.add('visible');
                });
            }

            positionHighlight();
            window.addEventListener('resize', positionHighlight);
            window.addEventListener('scroll', positionHighlight);
        };
    })();
</script>

<script>
      // Load assistant name from state if available
      document.addEventListener('DOMContentLoaded', () => {
        const headerTitle = document.getElementById('assistant-header-title');

        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("get_onboarding_state").then((state) => {
            if (state && state.assistantName) {
              headerTitle.innerText = `${state.assistantName} Workspace`;
            }
          }).catch(console.error);
        } else {
          const storedName = localStorage.getItem('assistantName');
          if (storedName) {
            headerTitle.innerText = `${storedName} Workspace`;
          }
        }
      });
    </script>

        const rect = e.target.getBoundingClientRect();

        let top = rect.top - tooltipEl.offsetHeight - 10;
        let left = rect.left + (rect.width / 2) - (tooltipEl.offsetWidth / 2);

        if (top < 10) {

    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    // Hover (desktop)

        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target; if (target && typeof target.closest === 'function' && target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const t = e.target;
        const target = t && typeof t.closest === 'function' ? t.closest('[data-tooltip]') : null;

            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});

<script>
function initWalkthrough() {
        // Walkthroughs
    if (!window.startWalkthrough) {
            // Walkthroughs
    if (!window.startWalkthrough) {
        window.startWalkthrough = function(steps) {
            if (!steps || steps.length === 0) return;

            let currentStepIndex = 0;
            let currentSteps = steps;

            const overlayEl = document.createElement('div');
            overlayEl.className = 'ohc-walkthrough-overlay';
            document.body.appendChild(overlayEl);

            const highlightEl = document.createElement('div');
            highlightEl.className = 'ohc-walkthrough-highlight';
            document.body.appendChild(highlightEl);

            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'ohc-walkthrough-bubble';
            document.body.appendChild(bubbleEl);

            function endWalkthrough() {
                if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
                if (highlightEl.parentNode) highlightEl.parentNode.removeChild(highlightEl);
                if (bubbleEl.parentNode) bubbleEl.parentNode.removeChild(bubbleEl);
                window.removeEventListener('resize', positionHighlight);
                window.removeEventListener('scroll', positionHighlight);
            }

            function positionHighlight() {
                const step = currentSteps[currentStepIndex];
                const target = document.querySelector(step.selector || step.targetId);

                if (!target) {
                    console.warn('Walkthrough target not found:', step.selector);
                    endWalkthrough();
                    return;
                }

                const rect = target.getBoundingClientRect();

                highlightEl.style.top = `${rect.top - 4}px`;
                highlightEl.style.left = `${rect.left - 4}px`;
                highlightEl.style.width = `${rect.width + 8}px`;
                highlightEl.style.height = `${rect.height + 8}px`;

                bubbleEl.innerHTML = `
                    <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                    <h4 class="ohc-walkthrough-title">${step.title}</h4>
                    <p class="ohc-walkthrough-text">${step.text || step.content}</p>
                    <div class="ohc-walkthrough-controls">
                        ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                        <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                    </div>
                `;

                bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;

                if (currentStepIndex > 0) {
                    bubbleEl.querySelector('.prev-btn').onclick = () => {
                        currentStepIndex--;
                        positionHighlight();
                    };
                }

                bubbleEl.querySelector('.next-btn').onclick = () => {
                    if (currentStepIndex === currentSteps.length - 1) {
                        endWalkthrough();
                    } else {
                        currentStepIndex++;
                        positionHighlight();
                    }
                };

                let top = rect.bottom + 16;
                let left = rect.left + (rect.width / 2) - 150;

                if (top + 200 > window.innerHeight) {
                    top = rect.top - bubbleEl.offsetHeight - 16;
                }

                if (left < 16) left = 16;
                if (left + 300 > window.innerWidth - 16) left = window.innerWidth - 316;

                bubbleEl.style.top = `${top}px`;
                bubbleEl.style.left = `${left}px`;

                requestAnimationFrame(() => {
                    bubbleEl.classList.add('visible');
                });
            }

            positionHighlight();
            window.addEventListener('resize', positionHighlight);
            window.addEventListener('scroll', positionHighlight);
        };
    };

            if (target) {
                target.classList.add('walkthrough-highlight');
                target.style.position = 'relative';
                target.style.zIndex = '99999';
                target.style.background = 'white'; // Make it pop

                const rect = target.getBoundingClientRect();
                // Position bubble below target if space permits, else above
                if (rect.bottom + 200 < window.innerHeight) {
                    bubble.style.top = (rect.bottom + 10) + 'px';
                } else {
                    bubble.style.top = (rect.top - bubble.offsetHeight - 10) + 'px';
                }
                bubble.style.left = Math.max(10, Math.min(rect.left, window.innerWidth - 320)) + 'px';
            } else {
                // Center if no target
                bubble.style.top = '50%';
                bubble.style.left = '50%';
                bubble.style.transform = 'translate(-50%, -50%)';
            }
        }

        function closeWalkthrough() {
            document.querySelectorAll('.walkthrough-highlight, .ohc-walkthrough-highlight').forEach(el => {
                el.classList.remove('walkthrough-highlight', 'ohc-walkthrough-highlight');
                el.style.position = '';
                el.style.zIndex = '';
                el.style.background = '';
            });
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }

        renderStep();
    };
}
initWalkthrough();
</script>

            <div style="margin-bottom: 16px;">
                <a href="/help.html" style="display: block; padding: 12px; background: rgba(241, 245, 249, 0.8); border-radius: 8px; text-decoration: none; color: #0f172a; font-weight: 500; text-align: center;">Open Full Help Center</a>
            </div>
            <h4>Popular Articles</h4>
            <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;" id="ohc-help-articles-list">
                <li><a href="/help_article.html?id=getting-started-1" style="color: #0066FF; text-decoration: none; font-size: 14px;">Welcome to One Human Corp</a></li>
                <li><a href="/help_article.html?id=my-store-1" style="color: #0066FF; text-decoration: none; font-size: 14px;">Setting up your storefront</a></li>
                <li><a href="/help_article.html?id=payments-1" style="color: #0066FF; text-decoration: none; font-size: 14px;">Accepting your first payment</a></li>
            </ul>
            <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(226, 232, 240, 0.5);">
                <a href="/api-docs.html" style="color: #64748b; font-size: 13px; text-decoration: none;">API Reference for advanced users</a>
            </div>
        </div>

        <div id="tab-tours" class="ohc-help-content">
            <div class="ohc-tour-card" onclick="window.startWalkthrough && window.startWalkthrough([{targetId: '#nav-store', title: 'Set up your store', content: 'Click here to access your storefront and add your first products.'}])">
                <h4>Set up your store</h4>
                <p>Learn how to add products and customize your storefront.</p>
            </div>
            <div class="ohc-tour-card" onclick="window.startWalkthrough && window.startWalkthrough([{targetId: '#nav-settings', title: 'Accept your first payment', content: 'Go to Settings > Payments to connect your bank account.'}])">
                <h4>Accept your first payment</h4>
                <p>Connect your account to start receiving money.</p>
            </div>
            <div class="ohc-tour-card" onclick="window.startWalkthrough && window.startWalkthrough([{targetId: '#nav-agents', title: 'Activate your AI Support Agent', content: 'Visit the AI Agents tab to hire your first digital assistant.'}])">
                <h4>Activate your AI Support Agent</h4>
                <p>Let AI handle customer queries for you.</p>
            </div>
        </div>

        <div id="tab-chat" class="ohc-help-content" style="padding-bottom: 12px;">
            <div id="ohc-help-chat-messages">
                <div class="ohc-chat-msg agent">
                    Hi! I'm your Help Agent. How can I assist you today? You can ask me anything about using OHC.
                </div>
            </div>
            <div id="ohc-help-chat-input-container">
                <input type="text" id="ohc-help-chat-input" placeholder="Ask anything...">
                <button id="ohc-help-chat-send" aria-label="Send message">Send</button>
            </div>
        </div>
    `;
    document.body.appendChild(widget);

    // Logic
    btn.addEventListener('click', () => {
        widget.style.display = widget.style.display === 'flex' ? 'none' : 'flex';
    });

    document.getElementById('ohc-floating-help-close').addEventListener('click', () => {
        widget.style.display = 'none';
    });

    const tabs = widget.querySelectorAll('.ohc-help-tab');
    const contents = widget.querySelectorAll('.ohc-help-content');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));

            tab.classList.add('active');
            document.getElementById(tab.getAttribute('data-target')).classList.add('active');
        });
    });

    // Chat Logic
    const chatInput = document.getElementById('ohc-help-chat-input');
    const chatSend = document.getElementById('ohc-help-chat-send');
    const chatMessages = document.getElementById('ohc-help-chat-messages');

    function appendMessage(text, sender, link = null) {
        const msg = document.createElement('div');
        msg.className = `ohc-chat-msg ${sender}`;
        msg.innerHTML = text;
        if (link && link.url && link.title) {
            msg.innerHTML += `<a href="${link.url}">${link.title}</a>`;
        }
        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleSend() {
        const text = chatInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        chatInput.value = '';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();

            if (data.reply) {
                appendMessage(data.reply.text || data.reply, 'agent', data.reply.link);
            } else if (data.text) {
                appendMessage(data.text, 'agent', data.link);
            } else {
                appendMessage(data, 'agent');
            }
        } catch (e) {
            appendMessage("I'm sorry, I'm having trouble connecting right now.", 'agent');
        }
    }

    chatSend.addEventListener('click', handleSend);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });

    // --- Global Tooltip & Walkthrough Logic ---

    // Tooltips
    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(e => {
            //
            //
            //
            //
            //
            //
            console.error(e);
        });
    }
    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    function showTooltip(e, text) {
        if (!text) return;
        tooltipEl.textContent = text;
        const targetRect = e.target.closest('[id]') ? e.target.closest('[id]').getBoundingClientRect() : e.target.getBoundingClientRect();

        let left = targetRect.left + (targetRect.width / 2) - (tooltipEl.offsetWidth / 2);
        let top = targetRect.bottom + 10;

        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        } else if (left < 10) {
            left = 10;
        }

        if (top + tooltipEl.offsetHeight > window.innerHeight - 10) {
            top = targetRect.top - tooltipEl.offsetHeight - 10;
        }

        tooltipEl.style.top = `${top}px`;
        tooltipEl.style.left = `${left}px`;
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    document.addEventListener('mouseover', (e) => {
        const target = e.target.closest('[id]');
        if (target && target.id && window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) {
            showTooltip(e, window.OHC_TOOLTIPS[target.id]);
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target.closest('[id]');
        if (target && target.id && window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) {
            hideTooltip();
        }
    });

    // Walkthroughs
    if (!window.startWalkthrough) {
            // Walkthroughs
    if (!window.startWalkthrough) {
            // Walkthroughs
    if (!window.startWalkthrough) {
        window.startWalkthrough = function(steps) {
            if (!steps || steps.length === 0) return;

            let currentStepIndex = 0;
            let currentSteps = steps;

            const overlayEl = document.createElement('div');
            overlayEl.className = 'ohc-walkthrough-overlay';
            document.body.appendChild(overlayEl);

            const highlightEl = document.createElement('div');
            highlightEl.className = 'ohc-walkthrough-highlight';
            document.body.appendChild(highlightEl);

            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'ohc-walkthrough-bubble';
            document.body.appendChild(bubbleEl);

            function endWalkthrough() {
                if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
                if (highlightEl.parentNode) highlightEl.parentNode.removeChild(highlightEl);
                if (bubbleEl.parentNode) bubbleEl.parentNode.removeChild(bubbleEl);
                window.removeEventListener('resize', positionHighlight);
                window.removeEventListener('scroll', positionHighlight);
            }

            function positionHighlight() {
                const step = currentSteps[currentStepIndex];
                const target = document.querySelector(step.selector || step.targetId);

                if (!target) {
                    console.warn('Walkthrough target not found:', step.selector);
                    endWalkthrough();
                    return;
                }

                const rect = target.getBoundingClientRect();

                highlightEl.style.top = `${rect.top - 4}px`;
                highlightEl.style.left = `${rect.left - 4}px`;
                highlightEl.style.width = `${rect.width + 8}px`;
                highlightEl.style.height = `${rect.height + 8}px`;

                bubbleEl.innerHTML = `
                    <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                    <h4 class="ohc-walkthrough-title">${step.title}</h4>
                    <p class="ohc-walkthrough-text">${step.text || step.content}</p>
                    <div class="ohc-walkthrough-controls">
                        ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                        <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                    </div>
                `;

                bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;

                if (currentStepIndex > 0) {
                    bubbleEl.querySelector('.prev-btn').onclick = () => {
                        currentStepIndex--;
                        positionHighlight();
                    };
                }

                bubbleEl.querySelector('.next-btn').onclick = () => {
                    if (currentStepIndex === currentSteps.length - 1) {
                        endWalkthrough();
                    } else {
                        currentStepIndex++;
                        positionHighlight();
                    }
                };

                let top = rect.bottom + 16;
                let left = rect.left + (rect.width / 2) - 150;

                if (top + 200 > window.innerHeight) {
                    top = rect.top - bubbleEl.offsetHeight - 16;
                }

                if (left < 16) left = 16;
                if (left + 300 > window.innerWidth - 16) left = window.innerWidth - 316;

                bubbleEl.style.top = `${top}px`;
                bubbleEl.style.left = `${left}px`;

                requestAnimationFrame(() => {
                    bubbleEl.classList.add('visible');
                });
            }

            positionHighlight();
            window.addEventListener('resize', positionHighlight);
            window.addEventListener('scroll', positionHighlight);
        };
    };

                if (target) {
                    target.classList.add('walkthrough-highlight');
                    target.style.position = 'relative';
                    target.style.zIndex = '99999';
                    target.style.background = 'white';

                    const rect = target.getBoundingClientRect();
                    if (rect.bottom + 200 < window.innerHeight) {
                        bubble.style.top = (rect.bottom + 10) + 'px';
                    } else {
                        bubble.style.top = (rect.top - bubble.offsetHeight - 10) + 'px';
                    }
                    bubble.style.left = Math.max(10, Math.min(rect.left, window.innerWidth - 320)) + 'px';
                } else {
                    bubble.style.top = '50%';
                    bubble.style.left = '50%';
                    bubble.style.transform = 'translate(-50%, -50%)';
                }
            }

            function closeWalkthrough() {
                document.querySelectorAll('.walkthrough-highlight, .ohc-walkthrough-highlight').forEach(el => {
                    el.classList.remove('walkthrough-highlight', 'ohc-walkthrough-highlight');
                    el.style.position = '';
                    el.style.zIndex = '';
                    el.style.background = '';
                });
                if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
            }

            renderStep();
        };
    }
});
</script>
