<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-sizing: border-box;
      }
      h1 {
        margin-top: 0;
        color: #1d1d1f;
        font-size: 24px;
        font-weight: 700;
      }
      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }
      input, select {
        width: 100%;
        padding: 14px;
        min-height: 44px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.5);
      }
      input:focus, select:focus {
        outline: none;
        border-color: #0066FF;
      }
      button {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 14px 24px;
        min-height: 44px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
      }
      button:hover {
        background-color: #0052cc;
      }
      button:active {
        transform: scale(0.98);
      }
      .error-msg {
        color: #FF3B30;
        font-size: 12px;
        margin-top: -15px;
        margin-bottom: 15px;
        display: none;
        text-align: left;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.2s ease-in-out 0s 2;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
        }
        .container {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
          color: #F5F5F7;
        }
        p {
          color: #A1A1A6;
        }
        input, select {
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: #F5F5F7;
        }
        input:focus, select:focus {
          border-color: #0066FF;
          background: rgba(255, 255, 255, 0.15);
        }
        select option {
          background-color: #16161a;
          color: #F5F5F7;
        }
      }
    </style>
  </head>
  <body>
    <div class="container" id="form-container">
      <h1>Set up your Assistant</h1>
      <p>Give your AI assistant a name and tone.</p>

      <input type="text" id="assistant-name" placeholder="e.g. Jarvis" />
      <div id="name-error" class="error-msg">Please enter a name for your assistant.</div>

      <select id="assistant-tone">
        <option value="" disabled selected>Select a tone</option>
        <option value="Professional">Professional</option>
        <option value="Friendly">Friendly</option>
        <option value="Concise">Concise</option>
      </select>
      <div id="tone-error" class="error-msg">Please select a tone.</div>

      <button id="next-btn">Next</button>
    </div>
    <script>
      const nextBtn = document.getElementById('next-btn');
      const nameInput = document.getElementById('assistant-name');
      const toneSelect = document.getElementById('assistant-tone');
      const nameError = document.getElementById('name-error');
      const toneError = document.getElementById('tone-error');
      const container = document.getElementById('form-container');

      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
           let isValid = true;
           const name = nameInput.value.trim();
           const tone = toneSelect.value;

           if (!name) {
               nameError.style.display = 'block';
               isValid = false;
           } else {
               nameError.style.display = 'none';
           }

           if (!tone) {
               toneError.style.display = 'block';
               isValid = false;
           } else {
               toneError.style.display = 'none';
           }

           if (isValid) {
               localStorage.setItem('assistantName', name);
               localStorage.setItem('assistantTone', tone);
               window.location.href = "success.html";
           } else {
               container.classList.remove('animate-shake');
               void container.offsetWidth; // trigger reflow
               container.classList.add('animate-shake');
           }
        });
      }

      nameInput.addEventListener('input', () => {
          if (nameInput.value.trim()) {
              nameError.style.display = 'none';
          }
      });

      toneSelect.addEventListener('change', () => {
          if (toneSelect.value) {
              toneError.style.display = 'none';
          }
      });
    </script>
  </body>
</html>
