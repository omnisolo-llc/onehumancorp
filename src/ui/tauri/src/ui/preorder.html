<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pre-Order Menu - Fatima's Cart</title>
  <style>
    body { font-family: "Outfit", sans-serif; background-color: #f5f5f7; margin: 0; padding: 16px; }
    .glassmorphism { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px); border-radius: 16px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 16px; }
    .item-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
    .item-price { font-size: 1rem; color: #666; margin-bottom: 8px; }
    .stock-tag { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; display: inline-block; font-weight: bold; }
    .tag-high { background-color: #e6f4ea; color: #1e8e3e; }
    .tag-low { background-color: #fce8e6; color: #d93025; }
    .tag-sold-out { background-color: #f1f3f4; color: #5f6368; }
    .sold-out { opacity: 0.5; pointer-events: none; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
    button { background-color: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 1rem; cursor: pointer; }
    button:disabled { background-color: #ccc; }
  </style>
</head>
<body>
  <h1>Menu</h1>
  <div id="menu-container">Loading...</div>

  <script>
    async function fetchMenu() {
      try {
        const tenantId = localStorage.getItem("tenant_id") || "default";
        const response = await fetch(`/api/v1/pos/inventory?tenant_id=${tenantId}`);
        const data = await response.json();
        if (data.inventory && data.inventory.length > 0) {
            renderMenu(data.inventory);
        } else {
            document.getElementById('menu-container').innerText = 'No items found.';
        }
      } catch (e) {
        document.getElementById('menu-container').innerText = 'Error loading menu';
      }
    }

    function renderMenu(items) {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      items.forEach(item => {
        let stockClass = 'tag-high';
        let stockText = 'In Stock';
        let isSoldOut = false;

        if (item.stock === 0) {
          stockClass = 'tag-sold-out';
          stockText = 'Sold Out';
          isSoldOut = true;
        } else if (item.stock <= 5) {
          stockClass = 'tag-low';
          stockText = `Selling fast! Only ${item.stock} left`;
        }

        const div = document.createElement('div');
        div.className = `glassmorphism ${isSoldOut ? 'sold-out' : ''}`;
        div.innerHTML = `
          <div class="item-title">${item.name}</div>
          <div class="item-price">$${(item.price_cents / 100).toFixed(2)}</div>
          <div class="stock-tag ${stockClass}">${stockText}</div>
          ${!isSoldOut ? `
            <div style="margin-top: 12px;">
              <input type="number" id="qty-${item.id}" value="1" min="1" max="${item.stock}">
              <input type="text" id="note-${item.id}" placeholder="Special instructions...">
              <button onclick="preOrder('${item.id}')">Pre-Order</button>
            </div>
          ` : ''}
        `;
        container.appendChild(div);
      });
    }

    async function preOrder(itemId) {
      const qty = document.getElementById(`qty-${itemId}`).value;
      const note = document.getElementById(`note-${itemId}`).value;
      const button = document.querySelector(`button[onclick="preOrder('${itemId}')"]`);
      button.disabled = true;
      button.innerText = 'Ordering...';

      try {
        const tenantId = localStorage.getItem("tenant_id") || "default";
        const res = await fetch('/api/v1/pos/preorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-tenant-id': tenantId },
          body: JSON.stringify({ item_id: itemId, quantity: parseInt(qty), customer_note: note })
        });
        const data = await res.json();
        if (data.status === 'ok') {
          alert('Pre-order successful!');
          fetchMenu(); // Refresh to update stock tags
        } else {
          alert('Error: ' + data.error);
          button.disabled = false;
          button.innerText = 'Pre-Order';
        }
      } catch(e) {
        alert('Network error');
        button.disabled = false;
        button.innerText = 'Pre-Order';
      }
    }

    fetchMenu();
    // Poll for stock updates to show dynamic tags instantly
    setInterval(fetchMenu, 5000);
  </script>
</body>
</html>
