<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Profile - OHC</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container" id="form-container">
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <h1>Business Profile</h1>
      <p style="color: #86868b; margin-bottom: 24px;">Tell us about your business.</p>

      <div style="text-align: left; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Business Name</div>
      <input type="text" id="business-name" placeholder="e.g. Maya's Bakery" />
      <div id="name-error" class="error-msg">Business Name must be at least 3 characters.</div>

      <div style="text-align: left; margin-bottom: 12px; font-weight: 600; font-size: 14px;">Industry</div>
      <div class="grid-select" id="industry-select">
        <div class="select-card" data-value="Bakery">
          <span>🍰 Bakery</span>
        </div>
        <div class="select-card" data-value="Field Service">
          <span>🛠️ Field Service</span>
        </div>
        <div class="select-card" data-value="Boutique">
          <span>👗 Boutique</span>
        </div>
        <div class="select-card" data-value="Creator">
          <span>🎨 Creator</span>
        </div>
        <div class="select-card" data-value="Food Cart">
          <span>🚛 Food Cart</span>
        </div>
        <div class="select-card" data-value="Agency">
          <span>🏢 Agency</span>
        </div>
      </div>
      <div id="industry-error" class="error-msg">Please select an industry.</div>

      <button id="next-btn" data-tooltip="Click here to save your business details and proceed.">Next</button>
    </div>

    <script src="shared.js"></script>
    <script>
      const nextBtn = document.getElementById('next-btn');
      const nameInput = document.getElementById('business-name');
      const nameError = document.getElementById('name-error');
      const industryError = document.getElementById('industry-error');
      const industryCards = document.querySelectorAll('#industry-select .select-card');
      const container = document.getElementById('form-container');

      let selectedIndustry = null;

      industryCards.forEach(card => {
        card.addEventListener('click', () => {
          industryCards.forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedIndustry = card.getAttribute('data-value');
          industryError.style.display = 'none';
        });
      });

      async function loadState() {
        let state = {};
        if (window.__TAURI__ && window.__TAURI__.core) {
          try {
            state = await window.__TAURI__.core.invoke("get_onboarding_state");
          } catch (e) { console.error(e); }
        } else {
          state = JSON.parse(localStorage.getItem('ohc_onboarding_state') || '{}');
        }

        if (state.businessName) nameInput.value = state.businessName;
        if (state.industry) {
          selectedIndustry = state.industry;
          const card = document.querySelector(`.select-card[data-value="${state.industry}"]`);
          if (card) card.classList.add('selected');
        }
      }

      loadState();

      nextBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        let isValid = true;

        if (name.length < 3) {
          nameError.style.display = 'block';
          nameInput.style.borderColor = '#FF3B30';
          isValid = false;
        } else {
          nameError.style.display = 'none';
          nameInput.style.borderColor = '';
        }

        if (!selectedIndustry) {
          industryError.style.display = 'block';
          isValid = false;
        }

        if (isValid) {
          const newState = { businessName: name, industry: selectedIndustry };

          if (window.__TAURI__ && window.__TAURI__.core) {
            nextBtn.disabled = true;
            nextBtn.innerText = "Saving...";
            try {
              const state = await window.__TAURI__.core.invoke("get_onboarding_state");
              Object.assign(state, newState);
              await window.__TAURI__.core.invoke("save_onboarding_state", { state });
              window.location.href = "assistant-setup.html";
            } catch (err) {
              console.error(err);
              nextBtn.disabled = false;
              nextBtn.innerText = "Next";
            }
          } else {
            const state = JSON.parse(localStorage.getItem('ohc_onboarding_state') || '{}');
            Object.assign(state, newState);
            localStorage.setItem('ohc_onboarding_state', JSON.stringify(state));
            window.location.href = "assistant-setup.html";
          }
        } else {
          container.classList.remove('animate-shake');
          void container.offsetWidth;
          container.classList.add('animate-shake');
        }
      });

      nameInput.addEventListener('input', () => {
        if (nameInput.value.trim().length >= 3) {
          nameError.style.display = 'none';
          nameInput.style.borderColor = '';
        }
      });
    </script>
  </body>
</html>
