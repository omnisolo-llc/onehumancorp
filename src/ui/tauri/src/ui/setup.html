<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open secure onboarding</title>
    <style>
      body {
        align-items: center;
        background: #f5f5f7;
        color: #1d1d1f;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      a { color: #06f; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Continue in secure onboarding</h1>
      <p>Account credentials are managed by the signed-in web session.</p>
      <p><a id="continue" href="http://127.0.0.1:3000/onboarding">Open onboarding</a></p>
    </main>
    <script>
      const link = document.getElementById("continue");
      const webOrigin = window.location.protocol.startsWith("http")
        ? `${window.location.protocol}//${window.location.hostname}:3000`
        : "http://127.0.0.1:3000";
      link.href = `${webOrigin}/onboarding${window.location.search}${window.location.hash}`;
    </script>
  </body>
</html>
