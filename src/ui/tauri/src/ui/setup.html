<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OHC Setup</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .header {
        padding: 20px;
        text-align: center;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        z-index: 10;
        flex-shrink: 0;
      }

      .header h1 {
        margin: 0;
        font-size: 18px;
        color: #1d1d1f;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .chat-bubble {
        max-width: 85%;
        padding: 14px 18px;
        border-radius: 20px;
        font-size: 15px;
        line-height: 1.5;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .bubble-ai {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-bottom-left-radius: 4px;
        color: #1d1d1f;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      }

      .bubble-user {
        align-self: flex-end;
        background: #0066FF;
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 102, 255, 0.25);
      }

      .input-area {
        padding: 16px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        gap: 12px;
        flex-shrink: 0;
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }

      .chat-input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 24px;
        font-size: 16px;
        font-family: inherit;
        background: white;
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }

      .chat-input:focus {
        border-color: #0066FF;
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
      }

      .send-btn {
        width: 48px;
        height: 48px;
        border-radius: 24px;
        background: #0066FF;
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        flex-shrink: 0;
      }

      .send-btn:hover {
        background: #0052cc;
      }

      .send-btn:active {
        transform: scale(0.95);
      }

      .send-btn svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.5;
        margin-left: 2px;
      }

      .loading-skeleton {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }

      .skeleton-text {
        height: 12px;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
        border-radius: 4px;
      }

      @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .status-text {
        font-size: 13px;
        color: #888;
        margin-top: 4px;
        font-style: italic;
      }

      @media (max-width: 375px) {
        .chat-bubble {
          max-width: 90%;
        }
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #000; }
        .header, .input-area {
          background: rgba(28, 28, 30, 0.85);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .header h1 { color: #f5f5f7; }
        .bubble-ai {
          background: rgba(44, 44, 46, 0.8);
          color: #f5f5f7;
          border-color: rgba(255, 255, 255, 0.05);
        }
        .chat-input {
          background: rgba(44, 44, 46, 0.8);
          border-color: rgba(255, 255, 255, 0.1);
          color: white;
        }
        .skeleton-text {
          background: linear-gradient(90deg, #2c2c2e 25%, #3a3a3c 50%, #2c2c2e 75%);
          background-size: 200% 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="header glassmorphism container">
      <h1>OHC Agentic Onboarding</h1>
    </div>

    <div class="chat-container" id="chat-container">
      <div class="chat-bubble bubble-ai">
        Hi there! I'm your OHC onboarding assistant. What do you do? (e.g., "I bake custom cakes in Austin. I need to take 50% deposits.")
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="chat-input" class="chat-input" placeholder="Type your business description..." autocomplete="off" />
      <button id="send-btn" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      </button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        let backendUrl = '/';
        if (window.__TAURI__) {
            backendUrl = 'http://127.0.0.1:18789/';
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            if (window.location.port !== '18789' && window.location.port !== '8080') {
               backendUrl = 'http://127.0.0.1:18789/';
            }
        }

        function addMessage(text, isUser = false) {
          const div = document.createElement('div');
          div.className = `chat-bubble ${isUser ? 'bubble-user' : 'bubble-ai'}`;
          div.textContent = text;
          chatContainer.appendChild(div);
          scrollToBottom();
          return div;
        }

        function addLoadingBubble() {
          const div = document.createElement('div');
          div.className = 'chat-bubble bubble-ai';
          div.id = 'loading-bubble';
          div.innerHTML = `
            <div>Building your workspace...</div>
            <div class="status-text" id="loading-status">Connecting payments...</div>
            <div class="loading-skeleton">
              <div class="skeleton-text" style="width: 100%;"></div>
              <div class="skeleton-text" style="width: 80%;"></div>
              <div class="skeleton-text" style="width: 60%;"></div>
            </div>
          `;
          chatContainer.appendChild(div);
          scrollToBottom();

          // Cycle through statuses
          const statuses = ['Drafting menu...', 'Configuring agents...', 'Setting up storefront...'];
          let idx = 0;
          const interval = setInterval(() => {
            const el = document.getElementById('loading-status');
            if (el) {
              el.textContent = statuses[idx % statuses.length];
              idx++;
            } else {
              clearInterval(interval);
            }
          }, 1500);

          return div;
        }

        function removeLoadingBubble() {
          const el = document.getElementById('loading-bubble');
          if (el) el.remove();
        }

        function scrollToBottom() {
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function handleSubmit() {
          const text = chatInput.value.trim();
          if (!text) return;

          chatInput.value = '';
          chatInput.disabled = true;
          sendBtn.disabled = true;

          addMessage(text, true);
          addLoadingBubble();

          try {
            // Step 1: Intake
            const intakeRes = await fetch(`${backendUrl}api/onboarding/intake`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ description: text })
            });

            if (!intakeRes.ok) throw new Error('Intake failed');

            const intakeData = await intakeRes.json();

            // Map to StartOnboardingRequest
            const reqPayload = {
                business_type: intakeData.business_type || 'Local Business',
                company_name: intakeData.business_name || 'My Business',
                company_description: text,
                selling_categories: intakeData.categories || [],
                payment_pref: "online",
                admin_email: "admin@example.com",
                admin_name: "Admin User",
                admin_password: "password123",
                website_template: "Modern",
                first_product_name: intakeData.initial_products?.[0]?.name || "First Item",
                first_product_price: intakeData.initial_products?.[0]?.price || "10.00",
                domain_choice: "subdomain",
                price_type: "fixed",
                location: intakeData.location || "",
                target_audience: intakeData.target_audience || "",
                initial_products: intakeData.initial_products || []
            };

            // Step 2: Start Onboarding (Provision)
            let startRes;
            if (window.__TAURI__ && window.__TAURI__.core) {
                await window.__TAURI__.core.invoke("start_onboarding", { req: reqPayload });
                startRes = { ok: true };
            } else {
                startRes = await fetch(`${backendUrl}api/onboarding/start`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(reqPayload)
                });
            }

            if (!startRes.ok && (!window.__TAURI__ || !window.__TAURI__.core)) {
                 throw new Error('Provisioning failed');
            }

            removeLoadingBubble();
            addMessage("Workspace ready! Redirecting you to your dashboard...");

            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);

          } catch (error) {
            console.error(error);
            removeLoadingBubble();
            addMessage("Oops, something went wrong. Please try again.");
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
          }
        }

        sendBtn.addEventListener('click', handleSubmit);
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleSubmit();
        });
      });
    </script>
  </body>
</html>
