<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHC Setup</title>
    <style>
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #1D1D1F;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #16161a;
          color: #F5F5F7;
        }
      }

      .container {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: calc(100% - 40px);
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.4);
        animation: fade-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @media (prefers-color-scheme: dark) {
        .container {
          background: rgba(22, 22, 26, 0.7);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
      }

      h1 {
        margin-top: 0;
        font-size: 24px;
        font-weight: 700;
        color: inherit;
      }

      p {
        color: #86868b;
        font-size: 14px;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.5);
        min-height: 44px;
        color: inherit;
      }

      @media (prefers-color-scheme: dark) {
        input {
          background: rgba(0, 0, 0, 0.2);
          border-color: rgba(255, 255, 255, 0.15);
        }
      }

      input:focus {
        outline: none;
        border-color: #0066FF;
      }

      button {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        min-height: 44px;
        transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        box-sizing: border-box;
      }

      button:hover {
        background-color: #0052cc;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>What's the name of your business?</h1>
      <p>We'll use this to set up your workspace.</p>
      <input type="text" id="business-name" placeholder="e.g. Maya's Bakery" />
      <button id="next-btn">Next</button>
    </div>
    <script>
      const nextBtn = document.getElementById('next-btn');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
           const name = document.getElementById('business-name').value;
           if (name) {
               localStorage.setItem('businessName', name);
               window.location.href = "success.html";
           }
        });
      }
    </script>
  </body>
</html>
