<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share to Unlock</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-align: center;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      color: #1d1d1f;
      font-size: 28px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 10px;
    }
    p.reward {
      color: #86868b;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    p.reward strong {
        color: #8b5cf6;
        font-size: 18px;
    }

    .locked-code-box {
        border: 2px dashed #d1d5db;
        background: #f3f4f6;
        padding: 20px;
        border-radius: 8px;
        position: relative;
        margin-bottom: 30px;
        font-family: monospace;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 4px;
        color: rgba(0,0,0,0.3);
        filter: blur(5px);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .locked-code-box.unlocked {
        filter: blur(0);
        color: #1d1d1f;
        border-color: #34C759;
        background: rgba(52, 199, 89, 0.1);
    }
    .locked-badge {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #111827;
        color: white;
        padding: 6px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        z-index: 2;
        transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button.share-btn {
      color: white;
      border: none;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button.share-btn.x { background-color: #000; }
    button.share-btn.wa { background-color: #25D366; }
    button.share-btn:hover { opacity: 0.9; }
    button.share-btn:active { transform: scale(0.98); }

    .unlocked-actions {
        display: none;
    }

    button.copy-btn {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
    }
    button.copy-btn:hover { background-color: #0052cc; }

    footer {
      margin-top: 30px;
      text-align: center;
    }
    footer a {
      color: #86868b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    footer a:hover {
      color: #1d1d1f;
    }


    @media (max-width: 375px) {
      .container { padding: 20px 15px; }
      h1 { font-size: 24px; }
    }


      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
<style>
@media (prefers-color-scheme: dark) {
    body {
        background-color: #16161a;
        color: #f5f5f7;
    }
    .container {
        background: rgba(22, 22, 26, 0.7) !important;
        backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    h1, p.reward {
        color: #f5f5f7;
    }
    .locked-code-box {
        border-color: #4b5563;
        background: #111827;
        color: rgba(255,255,255,0.3);
    }
    .locked-code-box.unlocked {
        color: #f5f5f7;
        background: rgba(52, 199, 89, 0.2);
    }
}
</style>
</head>
<body>
  <div class="container">
    <div class="icon">🎁</div>
    <h1 id="campaign-title">Loading...</h1>
    <p class="reward">Unlock your special reward: <br/><strong id="reward-desc">...</strong></p>

    <div style="position: relative;">
        <div class="locked-code-box" id="discount-code">SECRET</div>
        <div class="locked-badge" id="locked-badge">Locked</div>
    </div>

    <div id="share-actions">
        <button class="share-btn x" id="share-x-btn">
            Share on X to Unlock
        </button>
        <button class="share-btn wa" id="share-wa-btn">
            Share on WhatsApp
        </button>
    </div>

    <div id="unlocked-actions" class="unlocked-actions">
        <p style="color: #34C759; font-weight: bold; margin-bottom: 15px;">Unlocked!</p>
        <button class="copy-btn" id="copy-code-btn">Copy Code</button>
    </div>
  </div>

  <footer>
    <a href="/setup.html?ref=share_unlock">⚡ Powered by OHC</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title') || 'Secret Deal';
      const reward = params.get('reward') || '20% Off Your Entire Order';
      const code = params.get('code') || 'SECRET20';
      const shareMsg = params.get('msg') || 'I just unlocked a secret discount!';
      const tenant = params.get('tenant') || 'e2e-tenant';

      document.getElementById('campaign-title').textContent = title;
      document.getElementById('reward-desc').textContent = reward;
      document.getElementById('discount-code').textContent = code;

      document.title = title;

      const shareUrl = encodeURIComponent(window.location.href);
      const encodedMsg = encodeURIComponent(shareMsg);

      async function unlock() {
          // Track the unlock event if possible
          try {
              await fetch('/api/v1/growth/storefront/track', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ event_type: "share_to_unlock_reveal", metadata: { campaign: title, tenant: tenant } })
              });
          } catch(e) {
              console.error('Failed to track unlock, proceeding anyway', e);
          }

          document.getElementById('discount-code').classList.add('unlocked');
          document.getElementById('locked-badge').style.opacity = '0';
          setTimeout(() => { document.getElementById('locked-badge').style.display = 'none'; }, 300);

          document.getElementById('share-actions').style.display = 'none';
          document.getElementById('unlocked-actions').style.display = 'block';
      }

      document.getElementById('share-x-btn').addEventListener('click', () => {
          window.open(`https://twitter.com/intent/tweet?text=${encodedMsg}&url=${shareUrl}`, '_blank');
          unlock();
      });

      document.getElementById('share-wa-btn').addEventListener('click', () => {
          window.open(`https://wa.me/?text=${encodedMsg}%20${shareUrl}`, '_blank');
          unlock();
      });

      document.getElementById('copy-code-btn').addEventListener('click', () => {
          navigator.clipboard.writeText(code).then(() => {
              const btn = document.getElementById('copy-code-btn');
              btn.textContent = 'Copied!';
              setTimeout(() => { btn.textContent = 'Copy Code'; }, 2000);
          });
      });
    });
  </script>
</body>
</html>
