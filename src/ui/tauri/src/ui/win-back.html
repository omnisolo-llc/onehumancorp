<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Win-Back Generator</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --text-secondary: #86868b;
      --panel-bg: rgba(255, 255, 255, 0.65);
      --border-color: rgba(255, 255, 255, 0.4);
      --input-bg: rgba(255, 255, 255, 0.65);
      --button-bg: #0066FF;
      --button-hover: #0055DD;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --text-color: #f5f5f7;
        --text-secondary: #a1a1a6;
        --panel-bg: rgba(32, 32, 36, 0.65);
        --border-color: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(32, 32, 36, 0.8);
      }
    }
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      margin-bottom: 8px;
    }
    p.desc {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--button-bg);
    }
    button {
      width: 100%;
      background-color: var(--button-bg);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    button:hover {
      background-color: var(--button-hover);
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: var(--text-secondary);
      cursor: not-allowed;
    }
    #result-area {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .draft-preview {
      background: var(--input-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 16px;
    }
    .back-link {
      margin-top: 24px;
      color: var(--button-bg);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    @media (max-width: 400px) {
      body {
        padding: 20px 10px;
      }
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container glassmorphism">
    <h1>Customer Win-Back</h1>
    <p class="desc">Generate personalized win-back campaigns to re-engage inactive customers using AI.</p>

    <div class="form-group">
      <label for="inactive-days">Target Inactive Customers (Days)</label>
      <select id="inactive-days">
        <option value="30">30+ Days Inactive</option>
        <option value="60">60+ Days Inactive</option>
        <option value="90">90+ Days Inactive</option>
        <option value="180">180+ Days Inactive</option>
      </select>
    </div>

    <div class="form-group">
      <label for="offer">Special Offer / Incentive</label>
      <input type="text" id="offer" placeholder="e.g. 20% off your next order" />
    </div>

    <div class="form-group">
      <label for="tone">Email Tone</label>
      <select id="tone">
        <option value="friendly">Friendly & Casual</option>
        <option value="professional">Professional</option>
        <option value="urgent">Urgent & Time-Sensitive</option>
        <option value="apologetic">"We miss you" / Apologetic</option>
      </select>
    </div>

    <button id="generate-btn">Draft Campaign with AI</button>

    <div id="result-area">
      <h3>Review AI Draft</h3>
      <div id="draft-preview" class="draft-preview"></div>
      <button id="send-btn" style="background-color: #34C759;">Schedule Campaign</button>
      <p id="status-msg" style="text-align: center; font-size: 14px; margin-top: 12px; font-weight: 500; display: none;"></p>
    </div>
  </div>

  <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.getElementById('generate-btn').addEventListener('click', async () => {
      const inactiveDays = document.getElementById('inactive-days').value;
      const offer = document.getElementById('offer').value.trim();
      const tone = document.getElementById('tone').value;
      const btn = document.getElementById('generate-btn');

      if (!offer) {
        alert('Please enter a special offer to entice customers.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Drafting...';

      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

      try {
        const res = await fetch('/api/v1/growth/campaign/generate-win-back', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
            },
            body: JSON.stringify({
              days_inactive: parseInt(inactiveDays),
              offer: offer,
              tone: tone,
            })
        });

        if (res.ok) {
          const data = await res.json();
          document.getElementById('draft-preview').innerText = data.subject + '\n\n' + data.body;
          document.getElementById('result-area').style.display = 'block';
        } else {
            alert('Failed to generate draft. Please try again.');
        }
      } catch (err) {
        alert('Failed to generate draft. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Regenerate Draft';
      }
    });

    document.getElementById('send-btn').addEventListener('click', async () => {
        const btn = document.getElementById('send-btn');
        const statusMsg = document.getElementById('status-msg');

        btn.disabled = true;
        btn.innerText = 'Scheduling...';

        const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

        try {
            const res = await fetch('/api/v1/growth/campaign/send-cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-spiffe-id': 'spiffe://onehumancorp.io/' + tenantId + '/agent1'
                },
                body: JSON.stringify({
                    type: 'win_back'
                })
            });

            if (!res.ok) {
                throw new Error('Failed to schedule campaign');
            }

            btn.style.display = 'none';
            statusMsg.style.color = '#34C759';
            statusMsg.innerText = '✅ Campaign scheduled successfully!';
            statusMsg.style.display = 'block';
        } catch (err) {
            btn.disabled = false;
            btn.innerText = 'Schedule Campaign';
            statusMsg.style.color = '#FF3B30';
            statusMsg.innerText = 'Failed to schedule campaign. Try again.';
            statusMsg.style.display = 'block';
        }
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
