<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          border-radius: 16px;
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(40px) saturate(220%);
          -webkit-backdrop-filter: blur(40px) saturate(220%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(40px) saturate(220%);
        -webkit-backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share-to-Unlock Generator</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 30px;
    }
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
    }
    .panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(40px) saturate(220%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    h1 {
      color: #1d1d1f;
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      width: 100%;
    }
    h2 {
      color: #1d1d1f;
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
    }
    label {
      display: block;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.65);
      font-family: inherit;
    }
    button.primary-btn {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }
    button.primary-btn:hover { background-color: #0052cc; }
    button.primary-btn:active { transform: scale(0.98); }

    #result-area {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }
    #result-area p {
      font-weight: 600;
      color: #0066FF;
      margin-top: 0;
      text-align: center;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #0066FF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    /* Preview Styles */
    .preview-box {
        background: #f9fafb;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        margin-top: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .preview-box.dark {
        background: #1f2937;
        border-color: #374151;
        color: #f9fafb;
    }
    .preview-box .icon {
        font-size: 40px;
        margin-bottom: 10px;
    }
    .preview-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 5px;
    }
    .preview-reward {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 20px;
    }
    .preview-box.dark .preview-reward { color: #9ca3af; }
    .preview-reward strong { color: #8b5cf6; }

    .locked-code-box {
        border: 2px dashed #d1d5db;
        background: #f3f4f6;
        padding: 15px;
        border-radius: 8px;
        position: relative;
        margin-bottom: 20px;
        font-family: monospace;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 4px;
        color: rgba(0,0,0,0.3);
        filter: blur(4px);
    }
    .preview-box.dark .locked-code-box {
        border-color: #4b5563;
        background: #111827;
        color: rgba(255,255,255,0.3);
    }
    .locked-badge {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #111827;
        color: white;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        filter: none;
        z-index: 2;
    }
    .theme-toggle {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    .theme-btn {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
    }
    .theme-btn.active {
        background: #e5e7eb;
        border-color: #9ca3af;
    }
  </style>
<style>
@media (prefers-color-scheme: dark) {
    body {
        background-color: #16161a;
        color: #f5f5f7;
    }
    .panel {
        background: rgba(22, 22, 26, 0.7) !important;
        backdrop-filter: blur(40px) saturate(220%);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    h1, h2, p, label, .preview-title {
        color: #f5f5f7;
    }
    input[type="text"], textarea {
        background: rgba(32, 32, 36, 0.8) !important;
        color: #f5f5f7;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
}
</style>
</head>
<body>
  <h1>Share-to-Unlock Generator</h1>
  <div class="container glassmorphism">

    <div class="panel glassmorphism glassmorphism">
      <h2>Campaign Settings</h2>

      <div>
        <label for="campaign-title">Campaign Title</label>
        <input type="text" id="campaign-title" placeholder="e.g. Secret Weekend Deal" value="Secret Weekend Deal" />
      </div>

      <div>
        <label for="reward">Reward Description</label>
        <input type="text" id="reward" placeholder="e.g. 20% Off Your Entire Order" value="20% Off Your Entire Order" />
      </div>

      <div>
        <label for="hidden-code">Hidden Discount Code</label>
        <input type="text" id="hidden-code" placeholder="e.g. SECRET20" style="text-transform: uppercase;" value="SECRET20" />
      </div>

      <div>
        <label for="message">Pre-filled Share Message</label>
        <textarea id="message" rows="2" placeholder="e.g. I just unlocked a secret 20% discount!">I just unlocked a secret discount! 🎁</textarea>
      </div>

      <button id="generate-btn" class="primary-btn">Generate Link</button>

      <div id="result-area">
        <p>Your Share-to-Unlock Link is Ready!</p>
        <input type="text" id="generated-url" readonly />
        <button id="copy-btn" class="primary-btn" style="background-color: #34C759; box-shadow: none; margin-top: 10px;">Copy Link</button>
      </div>
    </div>

    <div class="panel glassmorphism glassmorphism">
      <h2>Live Preview</h2>
      <div class="theme-toggle">
          <button class="theme-btn active" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="dark">Dark</button>
      </div>

      <div class="preview-box" id="preview-box">
          <div class="icon">🎁</div>
          <div class="preview-title" id="preview-title">Secret Weekend Deal</div>
          <div class="preview-reward">Unlock your special reward: <br/><strong id="preview-reward-text">20% Off Your Entire Order</strong></div>

          <div style="position: relative;">
            <div class="locked-code-box" id="preview-code">SECRET20</div>
            <div class="locked-badge">Locked</div>
          </div>

          <div style="background: black; color: white; padding: 12px; border-radius: 8px; font-weight: 600; margin-bottom: 10px;">Share on X to Unlock</div>
          <div style="background: #25D366; color: white; padding: 12px; border-radius: 8px; font-weight: 600;">Share on WhatsApp</div>
      </div>
    </div>

  </div>
  <a href="/dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <script>
    const titleInput = document.getElementById('campaign-title');
    const rewardInput = document.getElementById('reward');
    const codeInput = document.getElementById('hidden-code');

    const previewTitle = document.getElementById('preview-title');
    const previewReward = document.getElementById('preview-reward-text');
    const previewCode = document.getElementById('preview-code');

    function updatePreview() {
        previewTitle.textContent = titleInput.value || 'Secret Deal';
        previewReward.textContent = rewardInput.value || '20% Off';
        previewCode.textContent = codeInput.value || 'SECRET';
    }

    titleInput.addEventListener('input', updatePreview);
    rewardInput.addEventListener('input', updatePreview);
    codeInput.addEventListener('input', updatePreview);

    const themeBtns = document.querySelectorAll('.theme-btn');
    const previewBox = document.getElementById('preview-box');

    themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            themeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.theme === 'dark') {
                previewBox.classList.add('dark');
            } else {
                previewBox.classList.remove('dark');
            }
        });
    });

    document.getElementById('generate-btn').addEventListener('click', () => {
      const title = titleInput.value.trim();
      const reward = rewardInput.value.trim();
      const code = codeInput.value.trim().toUpperCase();
      const message = document.getElementById('message').value.trim();

      if (!title || !reward || !code) {
        alert("Please fill in title, reward, and code.");
        return;
      }

      const baseUrl = window.location.origin;
      const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'e2e-tenant';

      const params = new URLSearchParams({
        title: title,
        reward: reward,
        code: code,
        msg: message,
        tenant: tenantId
      });
      const generatedUrl = `${baseUrl}/share-to-unlock/index.html?${params.toString()}`;

      document.getElementById('generated-url').value = generatedUrl;
      document.getElementById('result-area').style.display = 'block';
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
        const urlInput = document.getElementById('generated-url');
        urlInput.select();
        document.execCommand('copy');
        const btn = document.getElementById('copy-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = originalText; }, 2000);
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
