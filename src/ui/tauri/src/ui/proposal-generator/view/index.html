<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Proposal</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 40px;
      margin-bottom: 30px;
    }
    h1 {
      color: #1d1d1f;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 0;
      margin-bottom: 30px;
      text-transform: uppercase;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }
    .field {
      margin-bottom: 25px;
    }
    .label {
      display: block;
      color: #86868b;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .value {
      color: #1d1d1f;
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .price-value {
      font-size: 24px;
      font-weight: 700;
      color: #0066FF;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding: 20px 0;
    }
    .cta-container {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      padding: 20px 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .cta-container a {
      color: #0066FF;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
    }
    .cta-container a:hover {
      text-decoration: underline;
    }
    .powered-by {
      color: #86868b;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .powered-by:hover {
      color: #1d1d1f;
    }
  </style>
  <style>
  @media (prefers-color-scheme: dark) {
      body {
          background-color: #16161a;
          color: #f5f5f7;
      }
      .container {
          background: #202024;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      h1 {
          color: #f5f5f7;
          border-bottom: 2px solid #333;
      }
      .value {
          color: #f5f5f7;
      }
      .cta-container {
          background: rgba(22, 22, 26, 0.7) !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
      }
      .powered-by {
          color: #a1a1a6;
      }
      .powered-by:hover {
          color: #f5f5f7;
      }
  }
  </style>
</head>
<body>
  <div class="container">
    <h1>PROJECT PROPOSAL</h1>

    <div class="field">
      <div class="label">Prepared For</div>
      <div class="value" id="view-client-name">Loading...</div>
    </div>

    <div class="field">
      <div class="label">Project Scope</div>
      <div class="value" id="view-scope">Loading...</div>
    </div>

    <div class="field">
      <div class="label">Estimated Timeline</div>
      <div class="value" id="view-timeline">Loading...</div>
    </div>

    <div class="field">
      <div class="label">Project Investment</div>
      <div class="value price-value" id="view-price">Loading...</div>
    </div>
  </div>

  <footer>
    <div class="cta-container">
      <a href="#" id="cta-link">Create your own professional proposals</a>
    </div>
    <a href="#" id="powered-by-link" class="powered-by">⚡ Powered by OHC</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const dataParam = params.get('data');

      let tenantId = 'e2e-tenant';

      if (dataParam) {
        try {
          const decodedStr = decodeURIComponent(escape(atob(dataParam)));
          const data = JSON.parse(decodedStr);

          document.getElementById('view-client-name').textContent = data.clientName || '';
          document.getElementById('view-scope').textContent = data.scope || '';
          document.getElementById('view-timeline').textContent = data.timeline || '';

          const priceVal = parseFloat(data.price || 0);
          document.getElementById('view-price').textContent = `$${priceVal.toFixed(2)}`;

          if (data.tenantId) {
            tenantId = data.tenantId;
          }
        } catch (e) {
          console.error("Error parsing proposal data:", e);
          document.getElementById('view-client-name').textContent = "Error loading proposal";
        }
      }

      const referralUrl = `/api/v1/growth/referrals/click?target=/onboarding&ref=${encodeURIComponent(tenantId)}&source=proposal_generator`;

      document.getElementById('cta-link').href = referralUrl;
      document.getElementById('powered-by-link').href = referralUrl;

      // Track view
      fetch('/api/v1/growth/storefront/track', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: "proposal_viewed",
            tenant_id: tenantId
          })
      }).catch(e => console.error("Tracking error:", e));
    });
  </script>
</body>
</html>
