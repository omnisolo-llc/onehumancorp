<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Social Share Widget - OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f9fafb;
      --card-bg: rgba(255, 255, 255, 0.7);
      --text: #111827;
      --text-muted: #6b7280;
      --border: rgba(229, 231, 235, 0.5);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      margin: 0 0 8px 0;
    }

    .header p {
      color: var(--text-muted);
      margin: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .layout {
        grid-template-columns: 350px 1fr;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 375px) {
      .container {
        padding: 12px;
        overflow-x: hidden;
      }
      .card {
        padding: 16px;
      }
      .header h1 {
        font-size: 24px;
      }
      .form-group input, .form-group textarea, .btn {
        width: 100%;
        box-sizing: border-box;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      box-sizing: border-box;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
    }

    .preview-container {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      position: relative;
    }

    .widget-preview {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .widget-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px 0;
      text-align: center;
    }

    .share-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .share-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      font-size: 18px;
    }

    .share-btn.twitter { background: #1DA1F2; }
    .share-btn.facebook { background: #4267B2; }
    .share-btn.linkedin { background: #0077b5; }
    .share-btn.whatsapp { background: #25D366; }

    .powered-by {
      display: block;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #f3f4f6;
      font-weight: 600;
    }

    .powered-by:hover {
      text-decoration: underline;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(30px) saturate(210%);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Social Share Widget</h1>
      <p>Embed viral sharing buttons anywhere.</p>
    </header>

    <div class="layout">
      <div class="card">
        <h2 style="margin-top: 0; font-family: 'Outfit';">Configuration</h2>

        <div class="form-group">
          <label class="form-label">Share Title</label>
          <input type="text" id="title-input" class="input-field" value="Check out this great post!" />
        </div>

        <div class="form-group">
          <label class="form-label">Share URL</label>
          <input type="text" id="url-input" class="input-field" value="https://example.com" />
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="remove-branding" />
            Remove "Powered by OHC" Badge (Pro)
          </label>
        </div>
      </div>

      <div class="preview-container">
        <div class="widget-preview">
          <h3 class="widget-title" id="preview-title">Check out this great post!</h3>

          <div class="share-buttons">
            <button class="share-btn twitter">X</button>
            <button class="share-btn facebook">f</button>
            <button class="share-btn linkedin">in</button>
            <button class="share-btn whatsapp">W</button>
          </div>

          <a href="/api/v1/growth/referrals/click?target=/setup.html&ref=" target="_blank" class="powered-by" id="preview-branding">⚡ Powered by OHC</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Paywall Modal -->
  <div class="modal-overlay" id="paywall-modal">
    <div class="modal-content" style="text-align: center;">
      <button class="modal-close" id="close-paywall">&times;</button>
      <div style="font-size: 48px; margin-bottom: 16px;">✨</div>
      <h2 style="font-family: 'Outfit'; margin: 0 0 16px 0;">Upgrade to Pro</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px;">
        Make the Social Share Widget 100% yours. Upgrade to Pro to remove the "Powered by OHC" watermark.
      </p>
      <button class="primary-btn" onclick="window.location.href='/pricing'">Upgrade Now</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const titleInput = document.getElementById('title-input');
      const previewTitle = document.getElementById('preview-title');
      const removeBranding = document.getElementById('remove-branding');
      const previewBranding = document.getElementById('preview-branding');
      const paywallModal = document.getElementById('paywall-modal');
      const closePaywall = document.getElementById('close-paywall');

      titleInput.addEventListener('input', (e) => {
        previewTitle.textContent = e.target.value || 'Share this post';
      });

      removeBranding.addEventListener('change', (e) => {
        // Soft paywall trigger
        if (e.target.checked) {
          e.target.checked = false; // Reset checkbox
          paywallModal.classList.add('active');
        }
      });

      closePaywall.addEventListener('click', () => {
        paywallModal.classList.remove('active');
      });
    });
  </script>
  <script src="help-widget.mjs" type="module"></script>
  </body>
</html>
