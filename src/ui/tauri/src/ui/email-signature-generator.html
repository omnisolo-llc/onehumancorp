<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Email Signature Generator - OHC</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      background: #F5F5F7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .back-btn {
      text-decoration: none;
      color: #0066FF;
      font-weight: 600;
    }
    .container {
      display: flex;
      flex-direction: row;
      gap: 40px;
      max-width: 1200px;
      width: 100%;
      padding: 40px;
      box-sizing: border-box;
      flex: 1;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
    .config-panel, .preview-panel {
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      color: #1d1d1f;
    }
    input[type="text"], select {
      padding: 12px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: #0066FF;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
    }
    .btn-primary {
      background: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background: #0055cc;
      transform: scale(1.02);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(30px) saturate(210%);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-content h3 {
      margin-top: 0;
      font-size: 24px;
    }
    .modal-content p {
      color: #86868b;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn-secondary {
      background: #f5f5f7;
      color: #1d1d1f;
      border: 1px solid #d2d2d7;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: #e5e5ea;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    #signature-preview {
        padding: 20px;
        border: 1px dashed #d2d2d7;
        border-radius: 12px;
        min-height: 150px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Free Email Signature Generator</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </header>

  <div class="container glassmorphism">
    <div class="config-panel">
      <h2>Details</h2>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Jane Doe" value="" />
      </div>

      <div class="form-group">
        <label>Title</label>
        <input type="text" id="titleInput" placeholder="e.g. Founder & CEO" value="Founder & CEO" />
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="remove-branding" />
        <label for="remove-branding">Remove "Powered by OHC" branding</label>
      </div>

      <button class="btn-primary" id="copyHtmlBtn">Copy Signature HTML</button>

    </div>

    <div class="preview-panel">
      <h2>Live Preview</h2>
      <div id="signature-preview">
        <!-- Rendered signature goes here -->
      </div>
    </div>
  </div>

  <!-- Soft Paywall Modal -->
  <div class="modal-overlay" id="paywall-modal">
    <div class="modal-content">
      <h3>Upgrade to Pro</h3>
      <p>Remove the "Powered by OHC" branding and make the signature 100% yours.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="closePaywallBtn">Cancel</button>
        <a href="pricing.html" class="btn-primary" style="text-decoration: none; width: auto;">Upgrade</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('nameInput');
      const titleInput = document.getElementById('titleInput');
      const removeBrandingCheckbox = document.getElementById('remove-branding');
      const copyHtmlBtn = document.getElementById('copyHtmlBtn');
      const signaturePreview = document.getElementById('signature-preview');
      const paywallModal = document.getElementById('paywall-modal');
      const closePaywallBtn = document.getElementById('closePaywallBtn');

      const renderSignature = () => {
        const name = nameInput.value;
        const title = titleInput.value || 'Founder & CEO';

        let signatureHtml = `<div style="font-family: sans-serif; font-size: 14px; color: #1d1d1f;">
  <div style="font-weight: bold; font-size: 16px;">${name}</div>
  <div style="color: #6b7280; margin-bottom: 12px;">${title}</div>
`;

        if (!removeBrandingCheckbox.checked) {
            signatureHtml += `  <div style="margin-top: 16px; font-size: 12px; color: #86868b;">
    <a href="https://ohc.app/api/v1/growth/referrals/click" style="color: #6b7280; text-decoration: none;">⚡ Powered by OHC (One Human Corp)</a>
  </div>
`;
        }

        signatureHtml += `</div>`;

        signaturePreview.innerHTML = signatureHtml;
      };

      nameInput.addEventListener('input', renderSignature);
      titleInput.addEventListener('input', renderSignature);

      removeBrandingCheckbox.addEventListener('change', (e) => {
        if (e.target.checked) {
            // Trigger soft paywall
            e.target.checked = false; // Revert immediately
            paywallModal.style.display = 'flex';
        }
        renderSignature();
      });

      closePaywallBtn.addEventListener('click', () => {
          paywallModal.style.display = 'none';
      });

      copyHtmlBtn.addEventListener('click', () => {
          const html = signaturePreview.innerHTML;
          navigator.clipboard.writeText(html).then(() => {
              const oldText = copyHtmlBtn.innerText;
              copyHtmlBtn.innerText = 'Copied!';
              setTimeout(() => {
                  copyHtmlBtn.innerText = oldText;
              }, 2000);
          }).catch(err => {
              console.error('Failed to copy: ', err);
          });
      });

      // Initial render
      renderSignature();
    });
  </script>
</body>
</html>
