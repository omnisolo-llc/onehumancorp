<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OHC - Quick Charge</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        box-sizing: border-box;
      }
      .container {
        max-width: 400px;
        width: 100%;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border-radius: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        border-left: 1px solid rgba(255, 255, 255, 0.4);
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      @media (min-width: 401px) {
        body {
            justify-content: center;
        }
        .container {
            height: auto;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            min-height: 600px;
        }
      }
      .header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        margin-bottom: 24px;
      }
      .back-btn {
        background: none;
        border: none;
        color: #1d1d1f;
        font-size: 16px;
        cursor: pointer;
        padding: 8px 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        text-decoration: none;
        border-radius: 16px;
        transition: background-color 0.2s;
      }
      .back-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .amount-display {
        font-size: 56px;
        font-weight: 700;
        color: #1d1d1f;
        margin: 20px 0;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -1px;
      }
      .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
        flex-grow: 1;
      }
      .num-btn {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        font-size: 28px;
        font-weight: 600;
        color: #1d1d1f;
        padding: 16px;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
      }
      .num-btn:active {
        transform: scale(0.95);
        background: rgba(229, 229, 234, 0.8);
      }
      .charge-btn {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 56px;
        margin-top: auto;
      }
      .charge-btn:hover {
        background-color: #0052cc;
      }
      .charge-btn:active {
        transform: scale(0.98);
      }
      .charge-btn:disabled {
        background-color: #a1a1a6;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      /* Tap to Pay Overlay */
      .tap-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: inherit;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .tap-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        color: #0066FF;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
      }
      .tap-title {
        font-size: 24px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 8px;
      }
      .tap-subtitle {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 32px;
      }
      .simulate-tap-btn {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 16px;
      }

      /* Receipt Screen */
      .receipt-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes slideUp {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .success-icon {
        width: 64px;
        height: 64px;
        background: #34C759;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        margin-bottom: 24px;
      }
      .receipt-amount {
        font-size: 40px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 8px;
      }
      .receipt-text {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 32px;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .container {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .back-btn { color: #f5f5f7; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .amount-display { color: #f5f5f7; }
        .num-btn {
          background: rgba(44, 44, 46, 0.8);
          border-color: rgba(255, 255, 255, 0.05);
          color: #f5f5f7;
        }
        .num-btn:active { background: rgba(58, 58, 60, 0.8); }
        .tap-overlay { background: rgba(22, 22, 26, 0.95); }
        .tap-title { color: #f5f5f7; }
        .receipt-amount { color: #f5f5f7; }
      }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">

      <div id="pos-view" style="display: flex; flex-direction: column; height: 100%;">
          <div class="header">
            <a href="dashboard.html" class="back-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Dashboard
            </a>
            <div style="flex-grow: 1;"></div>
            <button id="pos-walkthrough-btn" data-tooltip="pos-walkthrough-btn" style="background: none; border: none; font-size: 14px; font-weight: 600; color: #0066FF; cursor: pointer; padding: 0 8px;" onclick="window.startWalkthrough([{selector: '#charge-btn', title: 'Accept Payment', text: 'Enter an amount and tap here to charge.'}])">Walkthrough</button>
            <button id="help-center-nav-btn" data-tooltip="help-center-nav-btn" style="background: none; border: none; font-size: 18px; font-weight: 600; color: #1d1d1f; cursor: pointer; padding: 0 8px;" onclick="window.location.href='help.html'">?</button>
          </div>

          <div class="amount-display" id="amount-display">$0.00</div>

          <div class="numpad">
            <button class="num-btn" onclick="appendDigit(1)">1</button>
            <button class="num-btn" onclick="appendDigit(2)">2</button>
            <button class="num-btn" onclick="appendDigit(3)">3</button>
            <button class="num-btn" onclick="appendDigit(4)">4</button>
            <button class="num-btn" onclick="appendDigit(5)">5</button>
            <button class="num-btn" onclick="appendDigit(6)">6</button>
            <button class="num-btn" onclick="appendDigit(7)">7</button>
            <button class="num-btn" onclick="appendDigit(8)">8</button>
            <button class="num-btn" onclick="appendDigit(9)">9</button>
            <button class="num-btn" onclick="clearAmount()" style="font-size: 20px; color: #FF3B30;">C</button>
            <button class="num-btn" onclick="appendDigit(0)">0</button>
            <button class="num-btn" onclick="appendDigit('00')">00</button>
          </div>

          <button class="charge-btn" id="charge-btn" disabled onclick="initiateCharge()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H3a2 2 0 00-2 2v12a2 2 0 002 2h18a2 2 0 002-2V6a2 2 0 00-2-2zM1 10h22"/></svg>
            Accept Contactless Payment
          </button>
      </div>

      <!-- Tap to Pay Overlay -->
      <div class="tap-overlay" id="tap-overlay">
        <svg class="tap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L6 22M12 4L12 20M18 6L18 18M2 12C2 12 4.5 12 7 12M17 12C17 12 19.5 12 22 12"/>
          <!-- A simplified NFC wave icon -->
          <path d="M4 8.5C6 7.5 8 8 10 9.5M3 12.5C5.5 11 8.5 11.5 11 13M2 16.5C5 14.5 9 15 12 17" transform="translate(6, 0)"/>
        </svg>
        <div class="tap-title">Hold Card to Phone</div>
        <div class="tap-subtitle" id="tap-amount-subtitle">$0.00</div>

        <!-- Hidden button to simulate the tap for E2E tests and web mode -->
        <button class="simulate-tap-btn" id="simulate-tap-btn">Simulate Customer Tap (Test)</button>
        <button class="back-btn" onclick="cancelCharge()" style="border: 1px solid rgba(0,0,0,0.1);">Cancel</button>
      </div>

      <!-- Receipt Screen -->
      <div class="receipt-screen" id="receipt-screen">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="receipt-amount" id="receipt-amount">$0.00</div>
        <div class="receipt-text">Payment Successful</div>

        <button class="btn-outline" style="background: rgba(0,0,0,0.05); border: none; padding: 12px 24px; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; width: 100%;">Email Receipt</button>
        <button class="charge-btn" onclick="resetPOS()">New Sale</button>
      </div>

    </div>


    <script>
(function() {
    // Inject walkthrough CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-walkthrough-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 10000;
            pointer-events: auto;
        }
        .ohc-walkthrough-highlight {
            position: absolute;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            pointer-events: none;
            z-index: 10001;
            transition: all 0.3s ease;
        }
        .ohc-walkthrough-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(0, 102, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 10002;
            font-family: "Outfit", sans-serif;
            color: #1d1d1f;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }
        .ohc-walkthrough-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .ohc-walkthrough-title {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }
        .ohc-walkthrough-text {
            font-size: 14px;
            color: #86868b;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }
        .ohc-walkthrough-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ohc-walkthrough-btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .ohc-walkthrough-btn-secondary {
            background: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .ohc-walkthrough-close {
            position: absolute;
            top: 12px; right: 12px;
            background: none; border: none; color: #86868b; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            .ohc-walkthrough-bubble {
                background: rgba(22, 22, 26, 0.95);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
            .ohc-walkthrough-btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    let currentSteps = [];
    let currentStepIndex = 0;
    let overlayEl = null;
    let highlightEl = null;
    let bubbleEl = null;

    function renderStep() {
        if (!currentSteps || currentStepIndex >= currentSteps.length) {
            endWalkthrough();
            return;
        }

        const step = currentSteps[currentStepIndex];
        const targetEl = document.querySelector(step.selector);

        if (!targetEl) {
            console.warn('Walkthrough target not found:', step.selector);
            endWalkthrough();
            return;
        }

        targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

        setTimeout(() => {
            const rect = targetEl.getBoundingClientRect();

            highlightEl.style.top = (rect.top - 5) + 'px';
            highlightEl.style.left = (rect.left - 5) + 'px';
            highlightEl.style.width = (rect.width + 10) + 'px';
            highlightEl.style.height = (rect.height + 10) + 'px';

            bubbleEl.innerHTML = `
                <button class="ohc-walkthrough-close" aria-label="Close walkthrough">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                </button>
                <h4 class="ohc-walkthrough-title">${step.title}</h4>
                <p class="ohc-walkthrough-text">${step.text}</p>
                <div class="ohc-walkthrough-controls">
                    ${currentStepIndex > 0 ? '<button class="ohc-walkthrough-btn-secondary prev-btn">Back</button>' : '<div></div>'}
                    <button class="ohc-walkthrough-btn next-btn">${currentStepIndex === currentSteps.length - 1 ? 'Finish' : 'Next'}</button>
                </div>
            `;

            let bubbleTop = rect.bottom + 15;
            let bubbleLeft = rect.left + (rect.width / 2) - 140;

            if (bubbleLeft < 10) bubbleLeft = 10;
            if (bubbleLeft + 280 > window.innerWidth - 10) bubbleLeft = window.innerWidth - 290;
            if (bubbleTop + 200 > window.innerHeight) {
                bubbleTop = rect.top - 180;
            }

            bubbleEl.style.top = bubbleTop + 'px';
            bubbleEl.style.left = bubbleLeft + 'px';
            bubbleEl.classList.add('visible');

            bubbleEl.querySelector('.ohc-walkthrough-close').onclick = endWalkthrough;
            bubbleEl.querySelector('.next-btn').onclick = () => {
                bubbleEl.classList.remove('visible');
                setTimeout(() => {
                    currentStepIndex++;
                    renderStep();
                }, 300);
            };
            const prevBtn = bubbleEl.querySelector('.prev-btn');
            if (prevBtn) {
                prevBtn.onclick = () => {
                    bubbleEl.classList.remove('visible');
                    setTimeout(() => {
                        currentStepIndex--;
                        renderStep();
                    }, 300);
                };
            }

        }, 300);
    }

    function endWalkthrough() {
        if (overlayEl) {
            overlayEl.remove();
            overlayEl = null;
        }
        if (highlightEl) {
            highlightEl.remove();
            highlightEl = null;
        }
        if (bubbleEl) {
            bubbleEl.remove();
            bubbleEl = null;
        }
        currentSteps = [];
        currentStepIndex = 0;
    }

    window.startWalkthrough = function(steps) {
        if (!steps || steps.length === 0) return;
        currentSteps = steps;
        currentStepIndex = 0;

        endWalkthrough();

        overlayEl = document.createElement('div');
        overlayEl.className = 'ohc-walkthrough-overlay';

        highlightEl = document.createElement('div');
        highlightEl.className = 'ohc-walkthrough-highlight';

        bubbleEl = document.createElement('div');
        bubbleEl.className = 'ohc-walkthrough-bubble';

        document.body.appendChild(overlayEl);
        document.body.appendChild(highlightEl);
        document.body.appendChild(bubbleEl);

        renderStep();
    };

})();
</script>

<script>
      let currentAmountCents = 0;

      const amountDisplay = document.getElementById('amount-display');
      const chargeBtn = document.getElementById('charge-btn');
      const posView = document.getElementById('pos-view');
      const tapOverlay = document.getElementById('tap-overlay');
      const tapAmountSubtitle = document.getElementById('tap-amount-subtitle');
      const receiptScreen = document.getElementById('receipt-screen');
      const receiptAmount = document.getElementById('receipt-amount');
      const simulateTapBtn = document.getElementById('simulate-tap-btn');

      function updateDisplay() {
        const dollars = (currentAmountCents / 100).toFixed(2);
        const formattedAmount = '$' + dollars;
        amountDisplay.innerText = formattedAmount;
        tapAmountSubtitle.innerText = formattedAmount;
        receiptAmount.innerText = formattedAmount;

        if (currentAmountCents > 0) {
          chargeBtn.removeAttribute('disabled');
        } else {
          chargeBtn.setAttribute('disabled', 'true');
        }
      }

      function appendDigit(digit) {
        if (currentAmountCents.toString().length >= 8) return; // limit size

        if (digit === '00') {
          currentAmountCents = currentAmountCents * 100;
        } else {
          currentAmountCents = currentAmountCents * 10 + parseInt(digit);
        }
        updateDisplay();
      }

      function clearAmount() {
        currentAmountCents = 0;
        updateDisplay();
      }

      async function initiateCharge() {
        tapOverlay.style.display = 'flex';

        // In a real app, here we would invoke the native Tap To Pay SDK.
        // For web and tests, we show a simulate button.
        try {
          const tenantId = localStorage.getItem('tenant_id') || 'default';

          // Request Payment Intent
          const res = await fetch('/api/v1/payments/terminal/intent', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            },
            body: JSON.stringify({
              amount_cents: currentAmountCents,
              currency: 'usd',
              product_id: 'pos_custom_amount', // Using a placeholder for custom amounts
              quantity: 1,
              order_id: 'pos_web_' + Date.now()
            })
          });

          // Even if it fails (unauthorized in test), we allow simulation for UI testing purposes
          if (res.ok) {
              const data = await res.json();

          } else {
              console.warn("Payment intent API returned error (expected in some mock environments)");
          }

        } catch (e) {
          console.error("Failed to create intent", e);
        }
      }

      simulateTapBtn.addEventListener('click', async () => {
          simulateTapBtn.innerText = "Processing...";
          simulateTapBtn.style.backgroundColor = "#86868b";

          // Simulate SDK processing time
          setTimeout(() => {
              // Tap Success
              tapOverlay.style.display = 'none';
              posView.style.display = 'none';
              receiptScreen.style.display = 'flex';

              // In real flow, we'd confirm the intent and sync offline txs.
              // We simulate the offline sync for E2E validation:
              const tenantId = localStorage.getItem('tenant_id') || 'default';
              fetch('/api/v1/payments/terminal/sync_offline', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      session_id: 'web_session',
                      transactions: [{
                          id: 'tx_' + Date.now(),
                          client_id: 'web_client',
                          amount_cents: currentAmountCents,
                          currency: 'usd',
                          payload: '{}'
                      }]
                  })
              }).catch(console.error);

          }, 800);
      });

      function cancelCharge() {
        tapOverlay.style.display = 'none';
        simulateTapBtn.innerText = "Simulate Customer Tap (Test)";
        simulateTapBtn.style.backgroundColor = "#34C759";
      }

      function resetPOS() {
          clearAmount();
          receiptScreen.style.display = 'none';
          posView.style.display = 'flex';
          simulateTapBtn.innerText = "Simulate Customer Tap (Test)";
          simulateTapBtn.style.backgroundColor = "#34C759";
      }

      // Initialize
      updateDisplay();
    </script>






    <script src="tooltips.js"></script>
<script src="help-chat.js"></script>
  </body>
</html>
