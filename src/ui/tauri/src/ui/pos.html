<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OHC - Quick Charge</title>
    <style>
      body {
        font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
        box-sizing: border-box;
      }
      .container {
        max-width: 400px;
        width: 100%;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        border-radius: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        border-left: 1px solid rgba(255, 255, 255, 0.4);
        border-right: 1px solid rgba(255, 255, 255, 0.4);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      @media (min-width: 401px) {
        body {
            justify-content: center;
        }
        .container {
            height: auto;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            min-height: 600px;
        }
      }
      .header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        margin-bottom: 24px;
      }
      .back-btn {
        background: none;
        border: none;
        color: #1d1d1f;
        font-size: 16px;
        cursor: pointer;
        padding: 8px 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        text-decoration: none;
        border-radius: 8px;
        transition: background-color 0.2s;
      }
      .back-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .amount-display {
        font-size: 56px;
        font-weight: 700;
        color: #1d1d1f;
        margin: 20px 0;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: -1px;
      }
      .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
        flex-grow: 1;
      }
      .num-btn {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        font-size: 28px;
        font-weight: 600;
        color: #1d1d1f;
        padding: 16px;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.2s;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
      }
      .num-btn:active {
        transform: scale(0.95);
        background: rgba(229, 229, 234, 0.8);
      }
      .charge-btn {
        background-color: #0066FF;
        color: white;
        border: none;
        padding: 16px 24px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 56px;
        margin-top: auto;
      }
      .charge-btn:hover {
        background-color: #0052cc;
      }
      .charge-btn:active {
        transform: scale(0.98);
      }
      .charge-btn:disabled {
        background-color: #a1a1a6;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      /* Tap to Pay Overlay */
      .tap-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: inherit;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .tap-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        color: #0066FF;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
      }
      .tap-title {
        font-size: 24px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 8px;
      }
      .tap-subtitle {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 32px;
      }
      .simulate-tap-btn {
        background-color: #34C759;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 16px;
      }

      /* Receipt Screen */
      .receipt-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes slideUp {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .success-icon {
        width: 64px;
        height: 64px;
        background: #34C759;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        margin-bottom: 24px;
      }
      .receipt-amount {
        font-size: 40px;
        font-weight: 700;
        color: #1d1d1f;
        margin-bottom: 8px;
      }
      .receipt-text {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 32px;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #16161a; }
        .container {
          background: rgba(22, 22, 26, 0.7);
          border-color: rgba(255, 255, 255, 0.1);
        }
        .back-btn { color: #f5f5f7; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .amount-display { color: #f5f5f7; }
        .num-btn {
          background: rgba(44, 44, 46, 0.8);
          border-color: rgba(255, 255, 255, 0.05);
          color: #f5f5f7;
        }
        .num-btn:active { background: rgba(58, 58, 60, 0.8); }
        .tap-overlay { background: rgba(22, 22, 26, 0.95); }
        .tap-title { color: #f5f5f7; }
        .receipt-amount { color: #f5f5f7; }
      }
    </style>
  </head>
  <body>
    <div class="container" id="main-container">

      <div id="pos-view" style="display: flex; flex-direction: column; height: 100%;">
          <div class="header">
            <a href="dashboard.html" class="back-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Dashboard
            </a>
          </div>

          <div class="amount-display" id="amount-display">$0.00</div>

          <div class="numpad">
            <button class="num-btn" onclick="appendDigit(1)">1</button>
            <button class="num-btn" onclick="appendDigit(2)">2</button>
            <button class="num-btn" onclick="appendDigit(3)">3</button>
            <button class="num-btn" onclick="appendDigit(4)">4</button>
            <button class="num-btn" onclick="appendDigit(5)">5</button>
            <button class="num-btn" onclick="appendDigit(6)">6</button>
            <button class="num-btn" onclick="appendDigit(7)">7</button>
            <button class="num-btn" onclick="appendDigit(8)">8</button>
            <button class="num-btn" onclick="appendDigit(9)">9</button>
            <button class="num-btn" onclick="clearAmount()" style="font-size: 20px; color: #FF3B30;">C</button>
            <button class="num-btn" onclick="appendDigit(0)">0</button>
            <button class="num-btn" onclick="appendDigit('00')">00</button>
          </div>

          <button class="charge-btn" id="charge-btn" disabled onclick="initiateCharge()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H3a2 2 0 00-2 2v12a2 2 0 002 2h18a2 2 0 002-2V6a2 2 0 00-2-2zM1 10h22"/></svg>
            Accept Contactless Payment
          </button>
      </div>

      <!-- Tap to Pay Overlay -->
      <div class="tap-overlay" id="tap-overlay">
        <svg class="tap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L6 22M12 4L12 20M18 6L18 18M2 12C2 12 4.5 12 7 12M17 12C17 12 19.5 12 22 12"/>
          <!-- A simplified NFC wave icon -->
          <path d="M4 8.5C6 7.5 8 8 10 9.5M3 12.5C5.5 11 8.5 11.5 11 13M2 16.5C5 14.5 9 15 12 17" transform="translate(6, 0)"/>
        </svg>
        <div class="tap-title">Hold Card to Phone</div>
        <div class="tap-subtitle" id="tap-amount-subtitle">$0.00</div>

        <!-- Hidden button to simulate the tap for E2E tests and web mode -->
        <button class="simulate-tap-btn" id="simulate-tap-btn">Simulate Customer Tap (Test)</button>
        <button class="back-btn" onclick="cancelCharge()" style="border: 1px solid rgba(0,0,0,0.1);">Cancel</button>
      </div>

      <!-- Receipt Screen -->
      <div class="receipt-screen" id="receipt-screen">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="receipt-amount" id="receipt-amount">$0.00</div>
        <div class="receipt-text">Payment Successful</div>

        <button class="btn-outline" style="background: rgba(0,0,0,0.05); border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; width: 100%;">Email Receipt</button>
        <button class="charge-btn" onclick="resetPOS()">New Sale</button>
      </div>

    </div>

    <script>
      let currentAmountCents = 0;

      const amountDisplay = document.getElementById('amount-display');
      const chargeBtn = document.getElementById('charge-btn');
      const posView = document.getElementById('pos-view');
      const tapOverlay = document.getElementById('tap-overlay');
      const tapAmountSubtitle = document.getElementById('tap-amount-subtitle');
      const receiptScreen = document.getElementById('receipt-screen');
      const receiptAmount = document.getElementById('receipt-amount');
      const simulateTapBtn = document.getElementById('simulate-tap-btn');

      function updateDisplay() {
        const dollars = (currentAmountCents / 100).toFixed(2);
        const formattedAmount = '$' + dollars;
        amountDisplay.innerText = formattedAmount;
        tapAmountSubtitle.innerText = formattedAmount;
        receiptAmount.innerText = formattedAmount;

        if (currentAmountCents > 0) {
          chargeBtn.removeAttribute('disabled');
        } else {
          chargeBtn.setAttribute('disabled', 'true');
        }
      }

      function appendDigit(digit) {
        if (currentAmountCents.toString().length >= 8) return; // limit size

        if (digit === '00') {
          currentAmountCents = currentAmountCents * 100;
        } else {
          currentAmountCents = currentAmountCents * 10 + parseInt(digit);
        }
        updateDisplay();
      }

      function clearAmount() {
        currentAmountCents = 0;
        updateDisplay();
      }

      async function initiateCharge() {
        tapOverlay.style.display = 'flex';

        // In a real app, here we would invoke the native Tap To Pay SDK.
        // For web and tests, we show a simulate button.
        try {
          const tenantId = localStorage.getItem('tenant_id') || 'default';

          // Request Payment Intent
          const res = await fetch('/api/v1/payments/terminal/intent', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + localStorage.getItem('access_token')
            },
            body: JSON.stringify({
              amount_cents: currentAmountCents,
              currency: 'usd',
              product_id: 'pos_custom_amount', // Using a placeholder for custom amounts
              quantity: 1,
              order_id: 'pos_web_' + Date.now()
            })
          });

          // Even if it fails (unauthorized in test), we allow simulation for UI testing purposes
          if (res.ok) {
              const data = await res.json();

          } else {
              console.warn("Payment intent API returned error (expected in some mock environments)");
          }

        } catch (e) {
          console.error("Failed to create intent", e);
        }
      }

      simulateTapBtn.addEventListener('click', async () => {
          simulateTapBtn.innerText = "Processing...";
          simulateTapBtn.style.backgroundColor = "#86868b";

          // Simulate SDK processing time
          setTimeout(() => {
              // Tap Success
              tapOverlay.style.display = 'none';
              posView.style.display = 'none';
              receiptScreen.style.display = 'flex';

              // In real flow, we'd confirm the intent and sync offline txs.
              // We simulate the offline sync for E2E validation:
              const tenantId = localStorage.getItem('tenant_id') || 'default';
              fetch('/api/v1/payments/terminal/sync_offline', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      session_id: 'web_session',
                      transactions: [{
                          id: 'tx_' + Date.now(),
                          client_id: 'web_client',
                          amount_cents: currentAmountCents,
                          currency: 'usd',
                          payload: '{}'
                      }]
                  })
              }).catch(console.error);

          }, 800);
      });

      function cancelCharge() {
        tapOverlay.style.display = 'none';
        simulateTapBtn.innerText = "Simulate Customer Tap (Test)";
        simulateTapBtn.style.backgroundColor = "#34C759";
      }

      function resetPOS() {
          clearAmount();
          receiptScreen.style.display = 'none';
          posView.style.display = 'flex';
          simulateTapBtn.innerText = "Simulate Customer Tap (Test)";
          simulateTapBtn.style.backgroundColor = "#34C759";
      }

      // Initialize
      updateDisplay();
    </script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject chat CSS
    const style = document.createElement('style');
    style.textContent = `
        #ohc-help-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #0066FF;
            color: white;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s;
        }
        #ohc-help-btn:hover {
            transform: scale(1.05);
        }
        #ohc-help-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        #ohc-help-chat-overlay {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            max-height: calc(100vh - 120px);
            max-width: calc(100vw - 40px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 9998;
            overflow: hidden;
            font-family: "Outfit", sans-serif;
            transform-origin: bottom right;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        #ohc-help-chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
        }
        #ohc-help-chat-header h3 {
            margin: 0;
            font-size: 16px;
            color: #1d1d1f;
        }
        #ohc-help-close {
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            padding: 5px;
        }
        #ohc-help-close:hover { color: #1d1d1f; }
        #ohc-help-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-user {
            align-self: flex-end;
            background: #0066FF;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-ai {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.05);
            color: #1d1d1f;
            border-bottom-left-radius: 4px;
        }
        .msg-ai a {
            color: #0066FF;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }
        #ohc-help-input-area {
            padding: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.5);
        }
        #ohc-help-input {
            flex-grow: 1;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 10px 15px;
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        #ohc-help-input:focus { border-color: #0066FF; }
        #ohc-help-send {
            background: #0066FF;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (prefers-color-scheme: dark) {
            #ohc-help-chat-overlay {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
            }
            #ohc-help-chat-header, #ohc-help-input-area {
                background: rgba(0, 0, 0, 0.2);
                border-color: rgba(255, 255, 255, 0.1);
            }
            #ohc-help-chat-header h3 { color: #f5f5f7; }
            .msg-ai {
                background: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
            #ohc-help-input {
                background: rgba(0, 0, 0, 0.3);
                border-color: rgba(255, 255, 255, 0.2);
                color: white;
            }
        }
    `;
    document.head.appendChild(style);

    // Inject HTML
    const btn = document.createElement('button');
    btn.id = 'ohc-help-btn';
    btn.setAttribute('aria-label', 'Open help chat');
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
    document.body.appendChild(btn);

    const overlay = document.createElement('div');
    overlay.id = 'ohc-help-chat-overlay';
    overlay.innerHTML = `
        <div id="ohc-help-chat-header">
            <h3>Ask AI Help</h3>
            <button id="ohc-help-close" aria-label="Close help chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="ohc-help-messages">
            <div class="msg msg-ai">Hi! I am your AI Help Agent! How can I assist you with OHC today?</div>
        </div>
        <div id="ohc-help-input-area">
            <input type="text" id="ohc-help-input" placeholder="Ask me anything..." />
            <button id="ohc-help-send" aria-label="Send message">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    `;
    document.body.appendChild(overlay);

    const closeBtn = document.getElementById('ohc-help-close');
    const messages = document.getElementById('ohc-help-messages');
    const input = document.getElementById('ohc-help-input');
    const sendBtn = document.getElementById('ohc-help-send');

    btn.addEventListener('click', () => {
        overlay.style.display = 'flex';
        input.focus();
    });

    closeBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
    });

        async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        // Add user msg
        const uMsg = document.createElement('div');
        uMsg.className = 'msg msg-user';
        uMsg.textContent = text;
        messages.appendChild(uMsg);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        try {
            let url = '/api/chat';
            if (window.__TAURI__ && window.__TAURI__.core) {
                url = 'http://127.0.0.1:18789/api/chat';
            }
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();

            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg msg-ai';
            if (data.link && data.link.url) {
                aiMsg.innerHTML = `${data.reply}<br/><a href="${data.link.url}">${data.link.title}</a>`;
            } else {
                aiMsg.textContent = data.reply;
            }
            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
        } catch (e) {
            console.error(e);
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg msg-ai';
            aiMsg.textContent = 'Sorry, there was an error connecting to the help assistant.';
            messages.appendChild(aiMsg);
            messages.scrollTop = messages.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
});

</script>


<script>
document.addEventListener('DOMContentLoaded', () => {
    // Inject tooltip CSS
    const style = document.createElement('style');
    style.textContent = `
        .ohc-tooltip {
            position: fixed;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(210%);
            -webkit-backdrop-filter: blur(20px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 12px 16px;
            color: #1d1d1f;
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            max-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            text-align: center;
        }
        .ohc-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        @media (prefers-color-scheme: dark) {
            .ohc-tooltip {
                background: rgba(22, 22, 26, 0.7);
                border-color: rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }
    `;
    document.head.appendChild(style);

    if (!window.OHC_TOOLTIPS) {
        window.OHC_TOOLTIPS = {};
        fetch("/api/tooltips").then(r => r.json()).then(data => { window.OHC_TOOLTIPS = data; }).catch(console.error);
    }

    const tooltipEl = document.createElement('div');
    tooltipEl.className = 'ohc-tooltip';
    document.body.appendChild(tooltipEl);

    function showTooltip(e, text) {
        if (!text) return;
        tooltipEl.textContent = text;
        const rect = e.target.getBoundingClientRect();

        // Position above the element
        let top = rect.top - tooltipEl.offsetHeight - 10;
        let left = rect.left + (rect.width / 2) - (tooltipEl.offsetWidth / 2);

        // Adjust if out of bounds
        if (top < 10) {
            top = rect.bottom + 10; // show below if not enough space above
        }
        if (left < 10) left = 10;
        if (left + tooltipEl.offsetWidth > window.innerWidth - 10) {
            left = window.innerWidth - tooltipEl.offsetWidth - 10;
        }

        tooltipEl.style.top = top + 'px';
        tooltipEl.style.left = left + 'px';
        tooltipEl.classList.add('visible');
    }

    function hideTooltip() {
        tooltipEl.classList.remove('visible');
    }

    // Hover (desktop)
    document.addEventListener('mouseover', (e) => {
        const target = e.target.closest('[data-tooltip]');
        if (target) {
            showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
        }
    });

    document.addEventListener('mouseout', (e) => {
        if (e.target.closest('[data-tooltip]')) {
            hideTooltip();
        }
    });

    // Mobile long press (contextmenu) or touchstart
    let touchTimeout;
    document.addEventListener('touchstart', (e) => {
        const target = e.target.closest('[data-tooltip]');
        if (target) {
            touchTimeout = setTimeout(() => {
                showTooltip(e, (window.OHC_TOOLTIPS && window.OHC_TOOLTIPS[target.id]) || target.getAttribute('data-tooltip'));
            }, 500); // 500ms long press
        }
    });

    document.addEventListener('touchend', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });

    document.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
        hideTooltip();
    });
});
</script>

</body>
</html>
