<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHC Tooltip Registry</title>
    <style>
        body { font-family: "Outfit", -apple-system, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; padding: 40px; margin: 0; }
        .container { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px) saturate(210%); -webkit-backdrop-filter: blur(30px) saturate(210%); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 16px; padding: 30px; width: 100%; max-width: 700px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); transition: transform 0.2s; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.4); border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 14px; }
        th { background: rgba(0,0,0,0.03); font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; background: rgba(255,255,255,0.7); }
        input:focus { outline: none; border-color: #0066FF; box-shadow: 0 0 0 2px rgba(0,102,255,0.2); }
        button { padding: 10px 16px; background-color: #0066FF; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 14px; transition: background-color 0.2s; }
        button:hover { background-color: #0055cc; }
        h1 { margin-top: 0; font-size: 28px; color: #1d1d1f; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #86868b; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
        @media (prefers-color-scheme: dark) {
            body { background-color: #16161a; }
            .container { background: rgba(22, 22, 26, 0.7); border-color: rgba(255, 255, 255, 0.1); }
            h1 { color: #f5f5f7; }
            p { color: #a1a1aa; }
            table { background: rgba(0,0,0,0.3); }
            th, td { border-bottom: 1px solid rgba(255,255,255,0.05); color: #e5e5ea; }
            th { background: rgba(255,255,255,0.03); }
            input { background: rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.1); color: #fff; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tooltip Registry</h1>
        <p>Update dynamic tooltips. Agents can modify these to assist non-technical users.</p>
        <table>
            <thead><tr><th>Element ID</th><th>Tooltip Text</th><th>Action</th></tr></thead>
            <tbody id="registry-body"></tbody>
        </table>
        <div style="margin-top: 20px;">
            <input id="new-id" placeholder="New Element ID" style="margin-bottom: 10px;" />
            <input id="new-text" placeholder="Tooltip Text" style="margin-bottom: 10px;" />
            <button id="add-btn">Add Tooltip</button>
        </div>
    </div>
    <script>
        async function loadTooltips() {
            try {
                const res = await fetch('/api/tooltips');
                if (!res.ok) return;
                const data = await res.json();
                const tbody = document.getElementById('registry-body');
                tbody.innerHTML = '';
                for (const [id, text] of Object.entries(data)) {
                    tbody.innerHTML += `<tr>
                        <td>${id}</td>
                        <td><input type="text" id="input-${id}" value="${text.replace(/"/g, '&quot;')}" /></td>
                        <td><button onclick="update('${id}')">Save</button></td>
                    </tr>`;
                }
            } catch (e) {
                console.error('Failed to load tooltips', e);
            }
        }
        window.update = async function(id) {
            const text = document.getElementById('input-' + id).value;
            try {
                await fetch('/api/tooltips', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, text })
                });
                loadTooltips();
            } catch (e) {
                console.error('Failed to update tooltip', e);
            }
        };
        document.getElementById('add-btn').onclick = async () => {
            const id = document.getElementById('new-id').value;
            const text = document.getElementById('new-text').value;
            if (!id || !text) return;
            try {
                await fetch('/api/tooltips', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, text })
                });
                document.getElementById('new-id').value = '';
                document.getElementById('new-text').value = '';
                loadTooltips();
            } catch (e) {
                console.error('Failed to add tooltip', e);
            }
        };
        loadTooltips();
    </script>
</body>
</html>
