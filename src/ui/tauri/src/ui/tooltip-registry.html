<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);  border-radius: 16px;
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);  border-radius: 16px;
        }
      }
      .old-glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }

      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHC Tooltip Registry</title>
    <style>
                        body { font-family: "Outfit", -apple-system, sans-serif; background-color: #f5f5f7; display: flex; justify-content: center; padding: 40px; margin: 0; }
        .container { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; padding: 30px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 14px; }
        input { width: 100%; padding: 10px; min-height: 44px; display: inline-flex; align-items: center; justify-content: flex-start; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; background: rgba(255, 255, 255, 0.65); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        input:focus { outline: none; border-color: #0066FF; box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2); }
        button { padding: 10px 16px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; background-color: #0066FF; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 14px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(0, 102, 255, 0.2); }
        button:hover { background-color: #0055cc; transform: translateY(-1px); box-shadow: 0 6px 12px rgba(0, 102, 255, 0.25); }
        button:active { transform: translateY(0); box-shadow: 0 2px 4px rgba(0, 102, 255, 0.2); }
        h1 { margin-top: 0; font-size: 28px; color: #1d1d1f; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #86868b; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }

        @media (max-width: 480px) {
            body { padding: 16px 8px; }
            .container { padding: 16px; border-radius: 16px; width: 100%; box-sizing: border-box; }
            th, td { padding: 8px 4px; font-size: 12px; }
            h1 { font-size: 24px; }
            input { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container glassmorphism">
        <h1>Tooltip Registry</h1>
        <p>Customize the helpful tips shown across your workspace. Your agents use these to guide you and your team.</p>
        <div style="overflow-x: auto;">
            <table>
                <thead><tr><th>Element ID</th><th>Tooltip Text</th><th>Action</th></tr></thead>
                <tbody id="registry-body"></tbody>
            </table>
        </div>
        <div style="margin-top: 24px; background: rgba(255, 255, 255, 0.65); padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.4);">
            <h3 style="margin-top: 0; font-size: 16px; color: #1d1d1f;">Add New Tooltip</h3>
            <input id="new-id" class="glassmorphism-input" placeholder="New Element ID (e.g., settings-btn)" style="margin-bottom: 12px;" />
            <input id="new-text" class="glassmorphism-input" placeholder="Tooltip text explaining this element" style="margin-bottom: 16px;" />
            <button id="add-btn" class="glassmorphism-btn" style="width: 100%;">Add Tooltip</button>
        </div>
    </div>
    <script>
        async function loadTooltips() {
            try {
                const res = await fetch('/api/tooltips');
                if (!res.ok) return;
                const data = await res.json();
                const tbody = document.getElementById('registry-body');
                tbody.innerHTML = '';
                for (const [id, text] of Object.entries(data)) {
                    tbody.innerHTML += `<tr>
                        <td>${id}</td>
                        <td><input type="text" id="input-${id}" value="${text.replace(/"/g, '&quot;')}" /></td>
                        <td><button onclick="update('${id}')">Save</button></td>
                    </tr>`;
                }
            } catch (e) {
                console.error('Failed to load tooltips', e);
            }
        }
        window.update = async function(id) {
            const text = document.getElementById('input-' + id).value;
            try {
                await fetch('/api/tooltips', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, text })
                });
                loadTooltips();
            } catch (e) {
                console.error('Failed to update tooltip', e);
            }
        };
        document.getElementById('add-btn').onclick = async () => {
            const id = document.getElementById('new-id').value;
            const text = document.getElementById('new-text').value;
            if (!id || !text) return;
            try {
                await fetch('/api/tooltips', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, text })
                });
                document.getElementById('new-id').value = '';
                document.getElementById('new-text').value = '';
                loadTooltips();
            } catch (e) {
                console.error('Failed to add tooltip', e);
            }
        };
        loadTooltips();
    </script>
</body>
</html>
