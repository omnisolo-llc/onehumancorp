<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share and Save Widget</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #111827;
      --text-muted-light: #6b7280;
      --border-light: #e5e7eb;

      --bg-dark: #1f2937;
      --text-dark: #f9fafb;
      --text-muted-dark: #9ca3af;
      --border-dark: #374151;

      --accent: #0066FF;
      --twitter: #000000;
      --whatsapp: #25D366;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    body.theme-light {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    body.theme-dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .widget-container {
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.3s;
    }

    body.theme-dark .widget-container {
      border-color: var(--border-dark);
    }

    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }

    p {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: var(--text-muted-light);
    }

    body.theme-dark p {
      color: var(--text-muted-dark);
    }

    .share-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    .btn-x { background-color: var(--twitter); }
    .btn-wa { background-color: var(--whatsapp); }

    .reward-section {
      display: none;
      background: rgba(0, 102, 255, 0.1);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }

    .reward-code {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-family: monospace;
    }

    .copy-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .branding {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted-light);
      text-decoration: none;
      display: block;
    }

    body.theme-dark .branding {
      color: var(--text-muted-dark);
    }

      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
</head>
<body class="theme-light" id="body">
  <div class="widget-container">
    <h3 class="font-outfit" id="widget-title">Share & Get 10% Off</h3>
    <p id="widget-desc">Share this store with your friends on social media to instantly unlock your discount code!</p>

    <div class="share-buttons" id="share-actions">
      <button class="btn-share btn-x" id="share-x">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Share on X
      </button>
      <button class="btn-share btn-wa" id="share-wa">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        Share on WhatsApp
      </button>
    </div>

    <div class="reward-section" id="reward-section">
      <p style="margin-bottom: 8px; color: var(--accent); font-weight: 600;">Thanks for sharing! Here is your code:</p>
      <div class="reward-code" id="discount-code-display">CODE</div>
      <button class="copy-btn" id="copy-btn">Copy Code</button>
    </div>

    <a href="https://onehumancorp.com" target="_blank" class="branding">⚡ Powered by OHC</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Parse URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const val = urlParams.get('val') || '10';
      const type = urlParams.get('type') || 'percent'; // percent or fixed
      const code = urlParams.get('code') || 'SHARE10';
      const theme = urlParams.get('theme') || 'light';
      const tenant = urlParams.get('tenant') || 'demo';

      // Elements
      const body = document.getElementById('body');
      const title = document.getElementById('widget-title');
      const desc = document.getElementById('widget-desc');
      const shareX = document.getElementById('share-x');
      const shareWa = document.getElementById('share-wa');
      const shareActions = document.getElementById('share-actions');
      const rewardSection = document.getElementById('reward-section');
      const codeDisplay = document.getElementById('discount-code-display');
      const copyBtn = document.getElementById('copy-btn');

      // Apply theme
      body.className = `theme-${theme}`;

      // Set text
      const sign = type === 'fixed' ? '$' : '';
      const pct = type === 'percent' ? '%' : '';
      const discountText = `${sign}${val}${pct}`;

      title.textContent = `Share & Get ${discountText} Off`;
      desc.textContent = `Share this store with your friends on social media to instantly unlock your ${discountText} discount code!`;
      codeDisplay.textContent = code;

      // Handle Sharing
      const shareMessage = encodeURIComponent(`Check out this amazing store! Get a discount by using this link: https://ohc.app/invite/${tenant}`);

      function unlockReward() {
        shareActions.style.display = 'none';
        rewardSection.style.display = 'block';
        title.textContent = "You're all set!";
        desc.textContent = "Apply this code at checkout.";
      }

      shareX.addEventListener('click', () => {
        window.open(`https://twitter.com/intent/tweet?text=${shareMessage}`, '_blank');
        setTimeout(unlockReward, 2000);
      });

      shareWa.addEventListener('click', () => {
        window.open(`https://wa.me/?text=${shareMessage}`, '_blank');
        setTimeout(unlockReward, 2000);
      });

      // Handle Copy
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 2000);
        });
      });
    });
  </script>
</body>
</html>
