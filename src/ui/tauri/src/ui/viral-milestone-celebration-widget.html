<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viral Milestone Celebration</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
      color: #1d1d1f;
    }

    .container {
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.4;
      color: #86868b;
      text-align: center;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 44px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
    }

    button:hover { background-color: #0052cc; transform: translateY(-1px); }
    button:active { transform: scale(0.98); }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #0066FF;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 0.8; }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }

    @media (max-width: 375px) {
      body { padding: 20px 15px; }
      .container { padding: 20px 15px; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size: 48px; text-align: center; margin-bottom: 10px;">🎉</div>
    <h1>Viral Milestone Generator</h1>
    <p>Celebrate a milestone (e.g., 1000 orders) and generate a special discount link to share.</p>

    <label for="milestone-input">Milestone Reached (e.g., "1,000 Customers")</label>
    <input type="text" id="milestone-input" placeholder="1,000 Customers" />

    <label for="discount-input">Discount Code / Offer (e.g., "10% OFF")</label>
    <input type="text" id="discount-input" placeholder="10% OFF" />

    <button id="generate-btn">Generate Share Link</button>

    <div id="result-area">
      <h2 style="font-size: 18px; margin-bottom: 10px; color: #1d1d1f;">Milestone Share Link Generated!</h2>
      <p style="margin-bottom: 15px; font-weight: 500; text-align: left; color: #1d1d1f;">Share this link:</p>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="share-link" readonly style="flex: 1; margin-bottom: 0;" />
        <button id="copy-btn" style="width: auto; padding: 12px 20px; background-color: #1d1d1f; box-shadow: none;">Copy</button>
      </div>
    </div>
  </div>

  <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <script>
    document.getElementById('generate-btn').addEventListener('click', () => {
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      setTimeout(() => {
        const milestone = encodeURIComponent(document.getElementById('milestone-input').value || '1000 Customers');
        const discount = encodeURIComponent(document.getElementById('discount-input').value || '10% OFF');
        const baseUrl = window.location.origin.includes('localhost') || window.location.origin === 'null' || window.location.protocol === 'file:' ? 'https://app.onehumancorp.com' : window.location.origin;
        document.getElementById('share-link').value = `${baseUrl}/celebrate?m=${milestone}&d=${discount}&ref=viral`;

        document.getElementById('result-area').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Generate Share Link';
      }, 500);
    });

    document.getElementById('copy-btn').addEventListener('click', async () => {
      const urlInput = document.getElementById('share-link');
      urlInput.select();
      try {
        await navigator.clipboard.writeText(urlInput.value);
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      } catch (err) {
        console.error('Failed to copy text: ', err);
      }
    });
  </script>
</body>
</html>
