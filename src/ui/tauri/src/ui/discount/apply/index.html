<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discount Applied</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-align: center;
      overflow: hidden;
    }
    .banner {
      background-color: #0066FF;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .banner h1 {
      margin: 0;
      font-family: "Outfit", sans-serif;
      font-size: 24px;
    }
    .banner p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .content {
      padding: 30px;
    }
    h2 {
      color: #1d1d1f;
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 10px;
    }
    p.desc {
      color: #86868b;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    button {
      background-color: #1d1d1f;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }
    button:hover { background-color: #000; }
    button:active { transform: scale(0.98); }

    footer {
      margin-top: 30px;
      text-align: center;
    }
    footer a {
      color: #86868b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    footer a:hover {
      color: #1d1d1f;
    }

    @media (prefers-color-scheme: dark) {
      body {
          background-color: #16161a;
          color: #f5f5f7;
      }
      .container {
          background: rgba(22, 22, 26, 0.7) !important;
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
      }
      h2 {
          color: #f5f5f7;
      }
      button {
          background-color: #0066FF;
      }
      button:hover { background-color: #0052cc; }
      footer a:hover { color: #f5f5f7; }
    }

      /* OHC Touch Targets & Colors Enforced */
      button, input, select, textarea, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-height: 44px !important;
      }
      button, .btn, .btn-primary, .btn-secondary, .btn-outline {
        min-width: 44px !important;
      }
      .error-msg {
        color: #FF3B30 !important;
      }
      .invalid-input {
        border-color: #FF3B30 !important;
      }
</style>
</head>
<body>
  <div class="container" id="main-container">
    <div class="banner">
        <h1 id="discount-code">Loading...</h1>
        <p id="discount-amount">Loading offer...</p>
    </div>

    <div class="content">
        <h2>Discount Applied!</h2>
        <p class="desc">Your discount has been automatically applied to your session. Continue shopping to see your savings.</p>

        <button id="shop-btn">Continue Shopping</button>
    </div>
  </div>

  <footer id="branding-footer">
    <a href="/setup.html?ref=discount_footer">⚡ Powered by OHC</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || 'DISCOUNT';
      const amount = params.get('amount') || 'Special offer applied';
      const hideBranding = params.get('hideBranding') === 'true';

      document.getElementById('discount-code').textContent = code;
      document.getElementById('discount-amount').textContent = amount;

      // Update page title
      document.title = `${code} - Discount Applied`;

      if (hideBranding) {
          document.getElementById('branding-footer').style.display = 'none';
      }

      document.getElementById('shop-btn').addEventListener('click', () => {
        // Log application event
        fetch('/api/v1/growth/storefront/track', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ event_type: "discount_applied", code: code })
        }).catch(e => console.error(e));

        alert("Redirecting to storefront... (Simulation)");
      });
    });
  </script>
</body>
</html>
