<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Poll</title>
    <style>
        body { font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .container { max-width: 400px; width: 100%; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(30px) saturate(210%); border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 40px 30px; border: 1px solid rgba(255, 255, 255, 0.4); text-align: center; }
        .icon { font-size: 48px; margin-bottom: 20px; }
        h1 { color: #1d1d1f; font-size: 24px; font-weight: 700; margin-top: 0; margin-bottom: 10px; }
        p.desc { color: #86868b; font-size: 16px; margin-bottom: 30px; line-height: 1.4; }
        .vote-summary { background: #f3f4f6; border-radius: 8px; padding: 15px; margin-bottom: 30px; font-weight: 600; color: #111827; }
        footer { margin-top: 30px; text-align: center; }
        footer a { color: #86868b; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        footer a:hover { color: #1d1d1f; }

        @media (prefers-color-scheme: dark) {
            body { background-color: #16161a; color: #f5f5f7; }
            .container { background: rgba(22, 22, 26, 0.7) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; }
            h1, .vote-summary { color: #f5f5f7; }
            .vote-summary { background: rgba(255, 255, 255, 0.1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Thank you for voting!</h1>
        <p class="desc" id="question-desc">Your feedback has been recorded.</p>

        <div class="vote-summary" id="vote-summary">
            You voted: <span id="voted-option" style="color: #0066FF;">...</span>
        </div>
    </div>

    <footer>
        <a href="/setup.html?ref=customer_poll" id="branding-link">⚡ Powered by OHC</a>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const question = params.get('q') || 'Customer Poll';
            const vote = params.get('vote') || 'N/A';
            const tenant = params.get('tenant') || 'e2e-tenant';

            document.title = question;
            document.getElementById('question-desc').textContent = question;
            document.getElementById('voted-option').textContent = vote;

            const brandingLink = document.getElementById('branding-link');
            brandingLink.href = `/setup.html?ref=${encodeURIComponent(tenant)}&source=customer_poll`;

            // Track the vote event
            try {
                fetch('/api/v1/growth/storefront/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_type: "customer_poll_vote",
                        metadata: { question: question, vote: vote, tenant: tenant }
                    })
                });
            } catch(e) {
                console.error('Tracking failed', e);
            }
        });
    </script>
</body>
</html>
