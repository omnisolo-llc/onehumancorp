<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .glassmorphism {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(30px) saturate(210%);
        -webkit-backdrop-filter: blur(30px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .glassmorphism {
          background: rgba(22, 22, 26, 0.7);
          backdrop-filter: blur(30px) saturate(210%);
          -webkit-backdrop-filter: blur(30px) saturate(210%);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 16px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
      }
      .glassmorphism-btn {
        border-radius: 8px;
      }
      .glassmorphism-input {
        border-radius: 8px;
      }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link-in-Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 64px 24px 48px;
            transition: background 0.3s, color 0.3s;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
            margin-top: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .bio {
            font-size: 16px;
            font-weight: 500;
            opacity: 0.9;
            text-align: center;
            margin-bottom: 40px;
            max-width: 320px;
            line-height: 1.5;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-item {
            width: 100%;
            padding: 16px 24px;
            border-radius: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: transform 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: block;
        }

        .link-item:hover {
            transform: scale(1.02);
        }

        .footer {
            margin-top: auto;
            padding-top: 48px;
            padding-bottom: 24px;
        }

        .footer a {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .footer a:hover {
            opacity: 1;
        }

        /* Expandable Badge Styles */
        .ohc-floating-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(210%);
            -webkit-backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 9999px;
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            width: auto;
            max-width: 200px; /* Collapsed state max width */
        }

        .ohc-floating-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .ohc-floating-badge .badge-icon {
            font-size: 16px;
        }

        .ohc-floating-badge .badge-content {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.1);
            width: 100%;
            text-align: left;
        }

        .ohc-floating-badge .badge-content p {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: #1d1d1f;
            line-height: 1.4;
        }

        .ohc-floating-badge .badge-cta {
            display: inline-block;
            background: #0066FF;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            transition: background 0.2s;
            width: 100%;
        }

        .ohc-floating-badge .badge-cta:hover {
            background: #005ce6;
        }

        /* Expanded State */
        .ohc-floating-badge.expanded {
            border-radius: 20px;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px;
            max-width: 300px; /* Expanded state max width */
            cursor: default;
        }

        .ohc-floating-badge.expanded:hover {
            transform: none; /* Disable hover lift when expanded */
        }

        .ohc-floating-badge.expanded .badge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            cursor: pointer;
        }

        .ohc-floating-badge.expanded .badge-content {
            display: flex;
        }

        /* Dark mode overrides if needed based on body background, but since it's glass it adapts well. We can add specific dark mode if required */
    </style>
</head>
<body>

<div id="app" class="container glassmorphism">
    <div class="avatar">✨</div>
    <h1 id="title" class="title">Loading...</h1>
    <p id="bio" class="bio"></p>

    <div class="links-container" id="links">
    </div>

    <div class="footer">
        <!-- Replaced by floating badge -->
    </div>

    <!-- Expandable Floating Badge -->
    <div id="ohc-badge" class="ohc-floating-badge">
        <div class="badge-header" id="ohc-badge-header">
            <span class="badge-icon">⚡</span>
            <span>Powered by OHC</span>
        </div>
        <div class="badge-content">
            <p>Want a storefront like this? Get OHC for free and start growing your business.</p>
            <a id="badge-cta-link" href="#" class="badge-cta">Start Free Trial</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Extract tenant from URL path: /bio/:tenant
        const pathParts = window.location.pathname.split('/');
        const tenant = pathParts[pathParts.length - 1] || 'my-store';

        const titleEl = document.getElementById('title');
        const bioEl = document.getElementById('bio');
        const linksEl = document.getElementById('links');
        const appEl = document.getElementById('app');

        let data = {
            store_name: 'My Store',
            bio: 'Welcome to my storefront!',
            theme: 'gradient',
            links: [
                { id: '1', title: 'Visit My Store', url: '/website-builder' },
                { id: '2', title: 'Book an Appointment', url: '/booking' }
            ]
        };

        try {
            const response = await fetch(`/api/v1/growth/link-in-bio/${tenant}`);
            if (response.ok) {
                data = await response.json();
            }
        } catch(e) {
            console.error("Failed to load from API", e);
        }

        // Update UI
        titleEl.textContent = data.store_name;
        bioEl.textContent = data.bio;

        // Setup Badge Interactive Logic
        const badge = document.getElementById('ohc-badge');
        const badgeHeader = document.getElementById('ohc-badge-header');
        const ctaLink = document.getElementById('badge-cta-link');

        if (data.remove_branding) {
            badge.style.display = 'none';
        } else {
            ctaLink.href = `/api/v1/growth/referrals/click?target=/setup.html&ref=${encodeURIComponent(tenant)}&source=bio_expandable_badge`;

            badgeHeader.addEventListener('click', () => {
                badge.classList.toggle('expanded');
            });
        }

        let styles = { bg: 'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)', color: '#1D1D1F', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' };
        switch(data.theme) {
            case 'dark': styles = { bg: '#1D1D1F', color: '#ffffff', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' }; break;
            case 'light': styles = { bg: '#f3f4f6', color: '#111827', linkBg: '#ffffff', linkBorder: '#e5e7eb' }; break;
            case 'purple': styles = { bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', color: '#ffffff', linkBg: 'rgba(255, 255, 255, 0.15)', linkBorder: 'rgba(255, 255, 255, 0.3)' }; break;
        }

        document.body.style.background = styles.theme === 'light' ? '#f3f4f6' : '#000';
        appEl.style.background = styles.bg;
        appEl.style.color = styles.color;

        data.links.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.className = 'link-item';
            a.textContent = link.title;
            a.style.background = styles.linkBg;
            a.style.border = `1px solid ${styles.linkBorder}`;
            a.style.color = styles.color;
            a.style.backdropFilter = 'blur(10px)';
            linksEl.appendChild(a);
        });
    });
</script>
</body>
</html>
