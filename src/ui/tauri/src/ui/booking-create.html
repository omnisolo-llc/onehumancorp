<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create a Service</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.65);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --border-color: rgba(255, 255, 255, 0.4);
      --accent-color: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.65);
        --text-main: #f5f5f7;
        --text-sub: #a1a1a6;
        --border-color: rgba(255, 255, 255, 0.1);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 375px;
      padding: 24px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      margin: 0;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.4;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
      box-sizing: border-box;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    textarea {
      height: 120px;
      resize: none;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }
  </style>
</head>
<body>

  <div class="mobile-container" id="create-view">
    <div class="header">
      <h1>Create a Service</h1>
      <p>Add a new service offering for your business.</p>
    </div>

    <div class="glass-card">
      <form id="create-service-form">
        <label for="title" style="font-size: 13px; font-weight: 600;">Service Name</label>
        <input type="text" id="title" placeholder="e.g. Sink Repair" required>

        <label for="price" style="font-size: 13px; font-weight: 600;">Deposit Amount ($)</label>
        <input type="number" id="price" placeholder="e.g. 50" min="0" step="0.01" required>

        <label for="description" style="font-size: 13px; font-weight: 600;">Description</label>
        <textarea id="description" placeholder="Briefly describe what this service entails..." required></textarea>

        <button type="submit" class="btn btn-primary" id="btn-submit">Save Service</button>
      </form>
    </div>
  </div>

  <div class="mobile-container" id="success-view" style="display: none; align-items: center; justify-content: center; text-align: center;">
    <div style="width: 60px; height: 60px; background-color: #34C759; color: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1 style="margin-bottom: 8px;">Service Created!</h1>
    <p>Your service has been successfully added to your catalog.</p>
    <button class="btn btn-primary" onclick="window.location.href='booking-dashboard.html'" style="margin-top: 24px;">Go to Dashboard</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('create-service-form');
      const submitBtn = document.getElementById('btn-submit');
      const createView = document.getElementById('create-view');
      const successView = document.getElementById('success-view');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.textContent = 'Saving...';
        submitBtn.disabled = true;

        const title = document.getElementById('title').value;
        const priceCents = parseInt(document.getElementById('price').value || 0) * 100;
        const description = document.getElementById('description').value;

        const urlParams = new URLSearchParams(window.location.search);
        const tenantId = urlParams.get('tenant') || 'demo-tenant';

        try {
          const res = await fetch('/api/v1/booking/services', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-tenant-id': tenantId
            },
            body: JSON.stringify({
              title,
              price_cents: priceCents,
              description
            })
          });

          if (res.ok) {
            createView.style.display = 'none';
            successView.style.display = 'flex';
          } else {
            alert('Failed to save service.');
            submitBtn.textContent = 'Save Service';
            submitBtn.disabled = false;
          }
        } catch (error) {
          alert('Error saving service: ' + error);
          submitBtn.textContent = 'Save Service';
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
