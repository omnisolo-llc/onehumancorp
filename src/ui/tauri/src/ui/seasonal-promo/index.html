<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seasonal Promotion Generator ✨</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      --primary: #0066FF;
      --text-dark: #1D1D1F;
      --text-light: #86868b;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      color: var(--text-dark);
      font-size: 28px;
      margin-bottom: 12px;
    }
    .form-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(20px);
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      color: var(--text-dark);
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      background: rgba(255,255,255,0.9);
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.2);
    }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      margin-top: 10px;
    }
    button:active {
      transform: scale(0.98);
    }
    .result-card {
      margin-top: 32px;
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(0,0,0,0.05);
      display: none;
      white-space: pre-wrap;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-dark);
    }

    /* Paywall Modal */
    .soft-paywall-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.4);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .soft-paywall-content {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 32px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
    }
    .btn-secondary {
      background: none;
      border: none;
      color: var(--text-light);
      font-weight: 500;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Seasonal Promotion Generator ✨</h1>
      <p style="color: var(--text-light);">Create viral seasonal offers in seconds.</p>
    </div>

    <div class="form-card">
      <div class="form-group">
        <label for="promo-occasion">Occasion</label>
        <input type="text" id="promo-occasion" placeholder="e.g. Winter Wonderland">
      </div>
      <div class="form-group">
        <label for="promo-discount">Discount %</label>
        <input type="number" id="promo-discount" placeholder="e.g. 25">
      </div>

      <button id="generate-btn">Generate Campaign</button>

      <div id="promo-result" class="result-card"></div>
    </div>
  </div>

  <div id="soft-paywall-modal" class="soft-paywall-modal">
    <div class="soft-paywall-content">
      <div style="font-size: 40px; margin-bottom: 16px;">🚀</div>
      <h2 style="margin-bottom: 12px; font-size: 24px; color: #1D1D1F;">Unlock Advanced Features</h2>
      <p style="color: #86868b; margin-bottom: 24px;">Advanced AI Automations are available on the Pro plan. Upgrade now or share OHC to unlock 7 Days of Pro for free!</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button id="soft-paywall-share-btn" style="background-color: #1DA1F2; margin-top: 0;">
          Share on X to Unlock
        </button>
        <button onclick="window.location.href='../pricing.html'" style="margin-top: 0;">
          Upgrade to Pro
        </button>
        <button id="soft-paywall-close-btn" class="btn-secondary">
          Maybe Later
        </button>
      </div>
      <p id="soft-paywall-status" style="display: none; color: #1D1D1F; margin-top: 16px; font-weight: 500;">Verifying...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const generateBtn = document.getElementById('generate-btn');
      const resultCard = document.getElementById('promo-result');
      const paywallModal = document.getElementById('soft-paywall-modal');
      const paywallCloseBtn = document.getElementById('soft-paywall-close-btn');
      const paywallShareBtn = document.getElementById('soft-paywall-share-btn');
      const paywallStatus = document.getElementById('soft-paywall-status');

      generateBtn.addEventListener('click', () => {
        const hasPro = localStorage.getItem('has_pro') === 'true';
        if (!hasPro) {
          paywallModal.style.display = 'flex';
          return;
        }

        const occasion = document.getElementById('promo-occasion').value || 'Winter Wonderland';
        const discount = document.getElementById('promo-discount').value || '25';

        // Exact format expected by e2e test
        const codeWord = occasion.split(' ')[0].toUpperCase() + discount;
        const text = occasion + ' Special!\n' + discount + '% OFF\nUse code: ' + codeWord + '\n⚡ Powered by OHC';

        resultCard.textContent = text;
        resultCard.style.display = 'block';
      });

      paywallCloseBtn.addEventListener('click', () => {
        paywallModal.style.display = 'none';
      });

      paywallShareBtn.addEventListener('click', async () => {
        const tenantId = localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'DEFAULT';
        const message = `I just discovered Advanced AI Automations on OneHumanCorp! This is going to revolutionize how I work. 🚀 #OneHumanCorp #SmallBiz https://ohc.app/invite/${tenantId}`;
        const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}`;

        window.open(shareUrl, '_blank');

        paywallShareBtn.style.display = 'none';
        paywallStatus.style.display = 'block';
        paywallStatus.innerText = 'Verifying Share...';

        try {
          let url = '/api/v1/growth/trial-extension/claim';
          if (window.__TAURI__ && window.__TAURI__.core) {
              url = 'http://127.0.0.1:18789/api/v1/growth/trial-extension/claim';
          }
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            }
          });

          if (response.ok) {
            paywallStatus.innerText = 'Unlocked!';
            paywallStatus.style.color = '#34C759';
            localStorage.setItem('has_pro', 'true');
            setTimeout(() => {
              paywallModal.style.display = 'none';
            }, 1500);
          } else {
            paywallStatus.innerText = 'Failed to unlock features. Please try again.';
            paywallStatus.style.color = '#FF3B30';
            paywallShareBtn.style.display = 'block';
          }
        } catch (error) {
          console.error('Error claiming trial extension:', error);
          paywallStatus.innerText = 'Error claiming trial extension.';
          paywallShareBtn.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
