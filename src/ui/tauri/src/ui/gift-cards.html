<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Card Generator 🎁</title>
  <style>
    body {
      font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
      color: #1d1d1f;
    }

    .container {
      max-width: 450px;
      width: 100%;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    p {
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.4;
      color: #86868b;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
    }

    input[type="number"], input[type="text"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: rgba(255, 255, 255, 0.65);
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: #0066FF;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 14px 0 rgba(0, 102, 255, 0.39);
      margin-bottom: 20px;
    }

    button:hover { background-color: #0052cc; }
    button:active { transform: scale(0.98); }

    .card-preview {
      background: linear-gradient(135deg, #1d1d1f 0%, #434345 100%);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      position: relative;
      overflow: hidden;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-value {
      font-size: 32px;
      font-weight: 700;
    }

    .card-footer {
      font-size: 12px;
      opacity: 0.8;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .card-footer a {
      color: white;
      text-decoration: none;
    }

    #result-area {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid rgba(134, 134, 139, 0.2);
    }

    .share-container {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gift Card Generator 🎁</h1>
    <p>Create a digital gift card that customers can buy and share. The gift card automatically includes a referral loop.</p>

    <div class="card-preview">
      <div>
        <div style="font-size: 14px; opacity: 0.8;">Gift Card Value</div>
        <div class="card-value">$<span id="preview-value">50</span></div>
      </div>
      <div class="card-footer">
        <div>Redeemable at My Store</div>
        <span>Powered by OHC</span>
        <a href="/api/v1/growth/referrals/click?target=/onboarding&ref=&source=gift_card" id="powered-by-link">⚡ Powered by OHC</a>
      </div>
    </div>

    <div class="input-group">
      <label for="gift-value">Gift Card Value ($)</label>
      <input type="number" id="gift-value" value="50" min="1" step="1" />
    </div>

    <button id="generate-btn">Generate Gift Card</button>

    <div id="result-area">
      <h2 style="font-size: 18px; margin-bottom: 10px;">Share Your Gift Card</h2>
      <p style="margin-bottom: 15px; color: #1d1d1f; font-weight: 500;">Copy this link to sell the gift card:</p>
      <div class="share-container">
        <input type="text" aria-label="Gift Card Link" id="share-link" readonly />
        <button id="copy-btn" style="width: auto; margin-bottom: 0;">Copy</button>
      </div>
    </div>
  </div>

  <script>

      // OHC Referral Fetcher
      let __ohcReferralCode = (() => { try { return localStorage.getItem('tenant_id') || localStorage.getItem('tenant') || 'default-team'; } catch(e) { return 'default-team'; } })();
      (async function() {
        try {
          let token = localStorage.getItem('ohc_token');
          let headers = token ? { 'authorization': `Bearer ${token}` } : {};
          let url = '/api/v1/growth/referrals/generate';
          if (window.__TAURI__ && window.__TAURI__.core) {
            url = 'http://127.0.0.1:18789/api/v1/growth/referrals/generate';
          }
          let res = await fetch(url, { method: 'POST', headers });
          if (res.ok) {
            let data = await res.json();
            if (data.referral_link) {
              let parts = data.referral_link.split('/ref/');
              if (parts.length > 1) {
                __ohcReferralCode = parts[1];
              }
            }
          }
        } catch(e) {}
      })();

    document.addEventListener('DOMContentLoaded', () => {
      const valueInput = document.getElementById('gift-value');
      const previewValue = document.getElementById('preview-value');
      const generateBtn = document.getElementById('generate-btn');
      const resultArea = document.getElementById('result-area');
      const shareLink = document.getElementById('share-link');
      const copyBtn = document.getElementById('copy-btn');
      const poweredByLink = document.getElementById('powered-by-link');

      valueInput.addEventListener('input', (e) => {
        previewValue.textContent = e.target.value || '0';
      });

      generateBtn.addEventListener('click', async () => {
        generateBtn.disabled = true;
        generateBtn.textContent = 'Generating...';

        try {
          const tenantId = localStorage.getItem("tenant_id") || localStorage.getItem("tenant");
          const amount = valueInput.value || '50';

          // Set href dynamically based on tenant id (though default-tenant is hardcoded in initial HTML for preview)
          poweredByLink.href = `/api/v1/growth/referrals/click?target=/onboarding&ref=${__ohcReferralCode}&source=gift_card`;

          const baseUrl = window.location.origin.includes('localhost') ? 'https://app.onehumancorp.com' : window.location.origin;
          shareLink.value = `${baseUrl}/gift-card?amount=${amount}&ref=${__ohcReferralCode}`;

          resultArea.style.display = 'block';
        } catch (err) {
          console.error("Error generating gift card:", err);
        } finally {
          generateBtn.disabled = false;
          generateBtn.textContent = 'Generate Gift Card';
        }
      });

      copyBtn.addEventListener('click', async () => {
        shareLink.select();
        try {
          await navigator.clipboard.writeText(shareLink.value);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
        } catch (err) {
          console.error('Failed to copy text: ', err);
        }
      });
    });
  </script>
</body>
</html>
