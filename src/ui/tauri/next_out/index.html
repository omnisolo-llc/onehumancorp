<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OHC</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d9dee7;
      --text: #17181c;
      --muted: #646b78;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green-bg: #effcf4;
      --green-line: #bbf7d0;
      --green: #166534;
      --red-bg: #fff1f2;
      --red-line: #fecaca;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      width: min(1120px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0;
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: 0;
    }
    .status-pill {
      min-width: 132px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: #fbfcfe;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-align: center;
    }
    main {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 22px;
      padding: 28px 0;
    }
    .providers {
      display: grid;
      gap: 10px;
      align-content: start;
    }
    .provider {
      appearance: none;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px 15px;
      text-align: left;
      cursor: pointer;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .provider[aria-pressed="true"] {
      border-color: var(--blue);
      box-shadow: 0 1px 2px rgba(20, 35, 70, 0.08);
    }
    .provider strong,
    .provider span {
      display: block;
      letter-spacing: 0;
    }
    .provider strong {
      font-size: 14px;
      line-height: 1.3;
      color: var(--text);
    }
    .provider span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    form {
      display: grid;
      gap: 20px;
      padding: 24px;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 650;
    }
    input {
      width: 100%;
      height: 44px;
      border: 1px solid #c8ced9;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--blue); }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid #edf0f4;
      padding-top: 20px;
      flex-wrap: wrap;
    }
    .active {
      color: var(--muted);
      font-size: 14px;
    }
    .active strong { color: var(--text); }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button.primary,
    button.secondary {
      min-width: 126px;
      height: 40px;
      border-radius: 7px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      border: 1px solid var(--blue);
      background: var(--blue);
      color: white;
    }
    button.primary:hover { background: var(--blue-dark); }
    button.secondary {
      border: 1px solid #c8ced9;
      background: white;
      color: var(--text);
    }
    button:disabled {
      opacity: 0.62;
      cursor: not-allowed;
    }
    .message {
      border-radius: 7px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .message.ok { border-color: var(--green-line); background: var(--green-bg); color: var(--green); }
    .message.err { border-color: var(--red-line); background: var(--red-bg); color: var(--red); }
    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
      .status-pill { text-align: left; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <p class="eyebrow">OHC Desktop</p>
        <h1>AI Provider Setup</h1>
      </div>
      <div class="status-pill" id="key-status">Loading</div>
    </div>
  </header>

  <main class="wrap">
    <nav class="providers" aria-label="AI providers">
      <button class="provider" data-provider="openai" aria-pressed="true">
        <strong>OpenAI</strong>
        <span>OPENAI_API_KEY</span>
      </button>
      <button class="provider" data-provider="minimax" aria-pressed="false">
        <strong>MiniMax</strong>
        <span>MINIMAX_API_KEY</span>
      </button>
      <button class="provider" data-provider="openai-compatible" aria-pressed="false">
        <strong>OpenAI-compatible</strong>
        <span>Custom /v1 endpoint</span>
      </button>
    </nav>

    <section class="panel">
      <form id="provider-form">
        <label>
          Model
          <input id="model" name="model" autocomplete="off" placeholder="model-name" />
        </label>
        <label>
          Base URL
          <input id="base-url" name="baseUrl" autocomplete="off" placeholder="https://api.example.com/v1" />
        </label>
        <label>
          API Key
          <input id="api-key" name="apiKey" autocomplete="off" type="password" placeholder="Paste API key" />
        </label>
        <div class="actions">
          <div class="active">Active provider: <strong id="active-provider">OpenAI</strong></div>
          <div class="buttons">
            <button class="secondary" type="button" id="test-button">Test Endpoint</button>
            <button class="primary" type="submit" id="save-button">Save Provider</button>
          </div>
        </div>
        <div id="message" class="message" hidden></div>
      </form>
    </section>
  </main>

  <script>
    const defaults = {
      openai: { name: 'OpenAI', model: 'gpt-4.1-mini', baseUrl: 'https://api.openai.com/v1' },
      minimax: { name: 'MiniMax', model: 'MiniMax-M2.7', baseUrl: 'https://api.minimax.chat/v1' },
      'openai-compatible': { name: 'OpenAI-compatible', model: '', baseUrl: '' },
    };

    const state = {
      provider: 'openai',
      model: defaults.openai.model,
      baseUrl: defaults.openai.baseUrl,
      apiKey: '',
      apiKeySet: false,
    };

    const providerButtons = Array.from(document.querySelectorAll('.provider'));
    const form = document.getElementById('provider-form');
    const modelInput = document.getElementById('model');
    const baseUrlInput = document.getElementById('base-url');
    const apiKeyInput = document.getElementById('api-key');
    const activeProvider = document.getElementById('active-provider');
    const keyStatus = document.getElementById('key-status');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('save-button');
    const testButton = document.getElementById('test-button');

    function invoke(command, payload) {
      if (!window.__TAURI__ || !window.__TAURI__.core) {
        return Promise.reject(new Error('Tauri command bridge is unavailable.'));
      }
      return window.__TAURI__.core.invoke(command, payload);
    }

    function showMessage(text, ok) {
      message.textContent = text;
      message.className = 'message ' + (ok ? 'ok' : 'err');
      message.hidden = false;
    }

    function hideMessage() {
      message.hidden = true;
      message.textContent = '';
    }

    function render() {
      const meta = defaults[state.provider] || defaults['openai-compatible'];
      providerButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.provider === state.provider));
      });
      modelInput.value = state.model || '';
      baseUrlInput.value = state.baseUrl || '';
      apiKeyInput.value = state.apiKey || '';
      apiKeyInput.placeholder = state.apiKeySet ? 'Saved key is set' : 'Paste API key';
      activeProvider.textContent = meta.name;
      keyStatus.textContent = state.apiKeySet ? 'API key saved' : 'API key needed';
    }

    function formConfig() {
      return {
        provider: state.provider,
        model: modelInput.value.trim(),
        baseUrl: baseUrlInput.value.trim(),
        apiKey: apiKeyInput.value.trim(),
      };
    }

    providerButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const provider = button.dataset.provider;
        const meta = defaults[provider] || defaults['openai-compatible'];
        state.provider = provider;
        state.model = meta.model || modelInput.value.trim();
        state.baseUrl = meta.baseUrl || baseUrlInput.value.trim();
        state.apiKey = '';
        hideMessage();
        render();
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      saveButton.disabled = true;
      hideMessage();
      try {
        const saved = await invoke('save_ai_provider', { config: formConfig() });
        Object.assign(state, {
          provider: saved.provider,
          model: saved.model,
          baseUrl: saved.baseUrl,
          apiKey: '',
          apiKeySet: saved.apiKeySet,
        });
        render();
        showMessage('Provider saved.', true);
      } catch (error) {
        showMessage(String(error), false);
      } finally {
        saveButton.disabled = false;
      }
    });

    testButton.addEventListener('click', async () => {
      testButton.disabled = true;
      hideMessage();
      try {
        const result = await invoke('test_ai_provider', { config: formConfig() });
        showMessage(result.message || (result.ok ? 'Endpoint connected.' : 'Endpoint test failed.'), result.ok);
      } catch (error) {
        showMessage(String(error), false);
      } finally {
        testButton.disabled = false;
      }
    });

    async function boot() {
      try {
        const saved = await invoke('load_ai_provider');
        Object.assign(state, {
          provider: saved.provider,
          model: saved.model,
          baseUrl: saved.baseUrl,
          apiKey: '',
          apiKeySet: saved.apiKeySet,
        });
      } catch (error) {
        showMessage(String(error), false);
      }
      render();
    }

    boot();
  </script>
</body>
</html>
