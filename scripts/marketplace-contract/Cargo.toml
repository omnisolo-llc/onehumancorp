[package]
name = "ohc_marketplace_contract"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"

[profile.dev]
debug = 0
incremental = false
