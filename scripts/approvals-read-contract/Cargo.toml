[package]
name = "ohc-approvals-read-contract"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
axum = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros", "json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
server_common = { path = "../../src/server/common" }
tower = { version = "0.5", features = ["util"] }
dashmap = "=5.5.3"
redis = { version = "=0.27.6", features = ["tokio-comp", "connection-manager"] }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
