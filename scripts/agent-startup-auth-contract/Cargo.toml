[package]
name = "ohc-agent-startup-auth-contract"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
[dev-dependencies]
temp-env = "0.3.6"
[lib]
path = "generated.rs"
