[package]
name = "ohc-mesh-startup-contract"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
async-nats = "0.47.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
futures = "0.3"
futures-util = "0.3"
prost = "0.13"
redis = { version = "=0.27.6", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
server_omnisolo = { path = "../../src/server/omnisolo" }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
