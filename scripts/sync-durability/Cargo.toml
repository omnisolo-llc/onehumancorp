[package]
name = "ohc-sync-durability-regressions"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
sea-orm = { version = "=1.1.19", default-features = false, features = ["macros", "runtime-tokio-native-tls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
axum = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27.6", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
server_auth = { path = "../../src/server/auth" }
server_common = { path = "../../src/server/common" }
server_utils = { path = "../../src/server/utils" }
server_omnisolo = { path = "../../src/server/omnisolo" }
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
[dev-dependencies]
# The exact inventory fixture validates its owned loopback database with Url.
reqwest = { version = "0.12", default-features = false }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
