[package]
name = "ohc-agent-receipt-postgres-contract-regressions"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
async-trait = "0.1"
sea-orm = { version = "=1.1.19", default-features = false, features = ["macros", "runtime-tokio-native-tls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
sha2 = "0.10"
futures-util = "0.3.32"
server_config = { path = "../../src/server/config" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
redis = { version = "0.27.6", features = ["tokio-comp"] }
server_pricing = { path = "../../src/server/pricing" }
server_utils = { path = "../../src/server/utils" }
omnisolo_builtin_agent_core = { path = "../../src/agents/builtin/core" }
omnisolo_builtin_agent_llm = { path = "../../src/agents/builtin/llm" }
axum = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "mysql", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
server_auth = { path = "../../src/server/auth" }
server_common = { path = "../../src/server/common" }
server_omnisolo = { path = "../../src/server/omnisolo" }
tower = { version = "0.5", features = ["util"] }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
