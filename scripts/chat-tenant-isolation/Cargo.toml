[package]
name = "ohc-chat-tenant-isolation"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
base64 = "0.22"
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }
server_common = { path = "../../src/server/common" }
server_config = { path = "../../src/server/config" }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono", "uuid", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
