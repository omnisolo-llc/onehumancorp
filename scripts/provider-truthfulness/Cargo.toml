[package]
name = "ohc-provider-truthfulness"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
async-trait = "0.1"
axum = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
[lib]
path = "lib.rs"
[profile.dev]
debug = 0
incremental = false
