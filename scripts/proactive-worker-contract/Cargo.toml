[package]
name = "ohc-proactive-worker-contract"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
path = "generated.rs"
[dependencies]
server_common = { path = "../../src/server/common" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["postgres", "sqlite", "mysql", "macros", "runtime-tokio-rustls", "runtime-tokio-native-tls", "chrono", "uuid"] }
tokio = { version = "=1.52.3", features = ["full"] }
chrono = { version = "=0.4.44", features = ["serde"] }
redis = { version = "=0.27.6", features = ["tokio-comp", "connection-manager"] }
dashmap = "=5.5.3"
tracing = "=0.1.44"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
debug-assertions = true
overflow-checks = true
