[package]
name = "ohc-checkpoint-restore-contract"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
