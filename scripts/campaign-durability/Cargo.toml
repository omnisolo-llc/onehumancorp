[package]
name = "ohc-campaign-durability-regressions"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid", "macros"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
uuid = { version = "1", features = ["v4"] }
server_auth = { path = "../../src/server/auth" }
server_omnisolo = { path = "../../src/server/omnisolo" }
[lib]
path = "generated.rs"
[profile.dev]
debug = 0
incremental = false
