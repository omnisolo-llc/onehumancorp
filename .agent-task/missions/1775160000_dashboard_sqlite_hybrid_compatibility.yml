title: Fix Dashboard Hybrid Sync Rules compatibility for SQLite
description: >
  In srcs/server/dashboard/server.go, the HandleSyncRules method uses a PostgreSQL
  specific query `SELECT mr.* FROM meeting_rooms mr JOIN agents a ON a.id = ANY(mr.participants)`.
  This fails in Standalone Mode where SQLite does not support `ANY()` on array columns.
  Instead of hardcoding a PostgreSQL specific `ANY()`, we should implement a fallback
  or rewrite the rule query for hybrid compatibility, such as checking `OHC_STANDALONE`
  environment variable or checking if we are using sqlite and replacing the query with
  something that works in SQLite (e.g., using `EXISTS (SELECT 1 FROM json_each(mr.participants) WHERE value = a.id)`).
priority: P1
scope: Small
