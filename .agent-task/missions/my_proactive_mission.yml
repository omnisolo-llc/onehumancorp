# Proactive Task: Fix db.Provider Tx.Exec Return Type Handling

## Problem Statement
The custom `db.Provider` interface in `srcs/server/db/provider.go` defines `Tx.Exec` as returning `(int64, error)`, where the first value is the rows affected. However, several places in the orchestration package treat the first return value as `sql.Result` and attempt to call `.RowsAffected()` on it, which will cause a build error or runtime error because an `int64` does not have a `RowsAffected` method.

## Fix
Fix the calls in:
- `srcs/server/orchestration/tasks.go`
- `srcs/server/orchestration/task_orchestrator.go`
- `srcs/server/orchestration/task_queue.go`
- `srcs/server/orchestration/ultraplan.go`

Replace `res, err := tx.Exec(...)` followed by `res.RowsAffected()` with simply using `res` as `rowsAffected`.

## Tests
Run `bazelisk test //srcs/server/orchestration:orchestration_test` to verify.
