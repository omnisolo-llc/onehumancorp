# Title: Implement Hybrid Mode Switch and Local-to-Cloud Health Probes

## Problem Statement
The OHC Hybrid Architecture seamlessly switches between Cloud-Native Mode and Standalone Desktop Mode. However, the system currently lacks dedicated "Health Guardianship" health-check probes specifically designed for verifying hybrid-mode switching and monitoring local-to-cloud mission sync reliability, as directed in the Maintainer execution playbook.

## Execution Playbook
1. Create `srcs/server/orchestration/health.go`.
2. Implement a unified `HybridHealthProbe` mechanism that checks:
   - Database availability (`hub.DB().Provider().Ping()`).
   - SQLite vs PostgreSQL fallback status.
   - Mesh channel connectivity (`mesh:health`).
   - Local-to-cloud mission sync backlog size.
3. Expose this through the orchestrator Hub.
4. Ensure 100% test coverage for `health.go` in `health_test.go`.

## Architecture
- `HybridHealthProbe` struct containing `Status`, `Mode` ("cloud" or "standalone"), `DBPing` delay, and `SyncBacklog` count.
- Update `Hub` interface to include `CheckHealth(ctx) (HybridHealthProbe, error)`.
- Use OHC telemetry guidelines.
