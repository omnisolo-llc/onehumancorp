  title: "Hybrid Architecture: SQLite/PostgreSQL Parity & Multi-Tenancy"
mission_details: |
  **Context**: The newly approved OHC Hybrid Agentic OS architecture requires seamless transition between Cloud-Native Mode (PostgreSQL, Redis, Multi-Tenant) and Standalone Desktop Mode (SQLite, Single-User).
  **Objective**: Ensure the backend database abstraction layer handles both PostgreSQL and SQLite identically. The system must degrade gracefully when Redis or Chatwoot is unavailable in local deployments.
  **Tasks**:
  1. Audit existing `database/sql` queries for SQLite compatibility (e.g., JSONB mapping).
  2. Implement an automated fallback to SQLite (`.agent-task/swarm.db`) if `DATABASE_URL` is unset and `OHC_STANDALONE=true`.
  3. Ensure the `TenantRegistry` supports a `Single-User` bypass for local executions, maintaining strict multi-tenant routing for Cloud deployments.
  4. Write automated integration tests for both database backends.
  5. Adhere to the Golang Google Coding Style.
