# Title: Fixed HybridHealthProbe implementation

## Problem Statement
The OHC Hybrid Architecture health-check probe for hybrid-mode switching (`HybridHealthProbe`) in the Go backend was incorrectly mocked out in `srcs/server/dashboard/server.go`, failing the test in `srcs/server/dashboard/health_test.go`.

## Execution
- Modified `func (s *Server) handleHybridHealthCheck` in `srcs/server/dashboard/server.go`.
- Changed the hardcoded response logic to call `s.hub.CheckHealth(r.Context())`.
- Formatted the response to accurately reflect standalone vs cloud environments and map variables correctly to the expected JSON format (e.g., `db_ping_ms`, `sync_backlog`, `mesh_active`).
- Executed `bazelisk test //srcs/server/...` locally to ensure `dashboard_test` passes successfully.
