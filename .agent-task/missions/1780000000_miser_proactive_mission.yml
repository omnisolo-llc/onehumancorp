# Title: Proactive Implement Context Expiration in Standalone Cache

## Problem Statement
The caching layer (`CachedMinimaxClient`) stores LLM reasoning responses and embeddings in both Redis (for Cloud Mode) and local SQLite (for Standalone Mode). While Redis enforces a TTL (`Ex(24 * time.Hour)`), the SQLite implementation does not enforce any expiration for stored caches. In Standalone Mode, this unbounded growth leads to excessive local storage utilization, which violates the Miser Cost Engineer mandate of optimizing storage footprint and host machine efficiency.

## Research Report
- Current `CachedMinimaxClient` saves cache into `llm_reason_cache` and `embedding_cache` without recording a timestamp or enforcing TTL in SQLite.
- We must add a timestamp column `created_at` to these tables (if missing, though they likely have it or need it).
- We can implement an asynchronous periodic cleanup routine or a probabilistic garbage collection during reads/writes that prunes entries older than 24 hours in SQLite.
- A background go routine started in the client initialization or a clean up on `Save` will solve this.

## Design Doc
1. **Schema Update**:
   - Check the schema for `llm_reason_cache` and `embedding_cache`. If `created_at` doesn't exist, create a new DB migration. Actually, we can just delete from cache using a time threshold. Let's assume or add `created_at`.
   - Wait, `embedding_cache` might already have `created_at`.
2. **Implement Garbage Collection**:
   - In `CachedMinimaxClient`, add a `PruneCache(ctx context.Context)` method.
   - For SQLite: `DELETE FROM llm_reason_cache WHERE created_at < datetime('now', '-1 day')`.
   - Run this pruning once periodically or when a new cache entry is saved (with a probabilistic rate to avoid latency spikes, e.g., 1% chance on write).

