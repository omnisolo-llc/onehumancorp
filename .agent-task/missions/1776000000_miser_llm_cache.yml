title: "💰 Miser: [new cost feature] Implement Global LLM Completion Caching"
description: |
  As no pending Miser missions exist, proactively implementing LLM completion caching.
  Many agents repeat the same queries (e.g., summarizing identical state, or retrying exact same prompts).
  By caching the `CompletionRequest` hash and mapping it to the `AssistantMessage` response,
  we can achieve 100% token cost reduction for identical requests, significantly optimizing cost.
