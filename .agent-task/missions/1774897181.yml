title: "GitHub MCP Integration"
description: >
  Integrate the @modelcontextprotocol/server-github to allow OHC Swarm Agents
  to autonomously review PRs, manage issues, and introspect repository history
  across GitHub.
status: "proposed"
blueprint:
  name: "github-mcp"
  description: "GitHub Model Context Protocol server for repository management"
  type: "mcp_server"
  repository: "https://github.com/modelcontextprotocol/servers/tree/main/src/github"
  capabilities:
    - "pull_requests"
    - "issues"
    - "code_search"
    - "repository_content"
  integration_steps:
    1: "Package the github MCP server using Bazel rules_nodejs"
    2: "Expose it as a standard bundle in MCP_BUNDLE_DIR"
    3: "Add to `srcs/agents/` AI provider registry for dynamic orchestration"
    4: "Verify via E2E testing against a mocked GitHub API or seeded database"
