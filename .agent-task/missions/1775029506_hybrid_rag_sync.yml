mission: "Implement Offline-to-Cloud State Sync for Hybrid RAG"
role: "product_architecture"
context: "Market research indicates a crucial gap in competitor capabilities: pure cloud or strict local silo. OHC needs a Local-to-Cloud State Sync for Hybrid MCP RAG, allowing standalone SQLite states to securely delegate and sync with the multi-tenant Postgres orchestration engine."
objective: "Design and implement the Local-to-Cloud Context Synchronizer daemon that selectively syncs local SQLite RAG state to the cloud Postgres 'agent_missions' table."
metrics:
  - "Zero sensitive data leakage to the cloud."
  - "Sync latency < 500ms."
  - "Robust conflict resolution prioritizing local client."
constraints:
  - "Must use existing OHC-SIP architecture."
  - "Must support graceful degradation."
