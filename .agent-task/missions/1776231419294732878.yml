id: telemetry-postgres-retry-exhausted-parity
title: "Add Observability Mode Parity for Postgres Transaction Retries"
status: "PENDING"
assignee: "IMPLEMENTER"
priority: "HIGH"
description: >
  The current OHC backend telemetry setup lacks parity for PostgreSQL transaction retry exhaustions.
  The global `postgresRetryExhaustedCounter` and `RecordPostgresRetryExhausted` function need to be added to
  `srcs/server/telemetry/telemetry.go`, and test parity must be added to `srcs/server/telemetry/telemetry_test.go`
  and `srcs/server/telemetry/buffer_test.go`.
