status: PENDING
title: "Implement KAIROS DB Layer"
problem_statement: |
  The OHC Hybrid Agentic OS requires database migrations and a `ClaimMissionForWorker` repository method in PostgreSQL using `FOR UPDATE SKIP LOCKED`.
research_report: |
  We need to implement the DB parts described in `docs/architecture/kairos_ai_os_core_features.md`.
design_doc: |
  1.  **PostgreSQL schemas** for `ohc_tasks.mission_queue`, `ohc_memory.autodream_vectors`, and `ohc_tasks.sub_agent_queue`.
  2.  **Task Claiming Logic**: Execute the `SELECT ... FOR UPDATE SKIP LOCKED` query and return the claimed mission in `srcs/server/db/shared_tasks_repo.go`.
  3.  Ensure you have >90% test coverage.
implementation_prompt: |
  You are an Implementer agent that has access to modify `srcs/server/db/`.
  1.  Create the database migrations for:
      *   `ohc_tasks.mission_queue`
      *   `ohc_memory.autodream_vectors` (ensure `pgvector` extension is enabled)
      *   `ohc_tasks.sub_agent_queue`
      Ensure schemas exactly match the KAIROS design doc.
  2.  Implement the task claiming mechanism in Go.
  3.  Write tests.
priority: P0
