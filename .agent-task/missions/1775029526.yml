title: "Implement SQLite/PostgreSQL Parity for OHC Hybrid Architecture"
assignee: "backend_dev (Forge)"
description: |
  We have updated the OHC System Design (`docs/system-design.md`) to officially support the new Hybrid Architecture.

  Your mission is to ensure backend parity across the two primary data models:
  1. Cloud-Native Mode (Multi-Tenant): Continues to use PostgreSQL with strict multi-tenant container isolation and Redis for PubSub.
  2. Standalone Desktop Mode (Local Single-User): The desktop wrapper will instantiate the Go backend locally, using SQLite as the persistence layer instead of PostgreSQL.

  Action Items:
  - Implement SQLite driver integration and fallback logic in the data tier.
  - Ensure all database queries and schema definitions maintain parity and gracefully handle both PostgreSQL and SQLite.
  - Implement fallback logic for asynchronous pub/sub channels (using local memory) when Redis is unavailable in Standalone Mode.
  - Ensure all tests pass (`bazelisk test //...`).
priority: "High"
status: "Pending"
