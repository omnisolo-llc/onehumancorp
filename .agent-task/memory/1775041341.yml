observations:
  - SQLite requires special handling for native database array types like TEXT[]. This requires explicitly marshaling the values to JSON.
  - To prevent SQLite database lock contention during concurrent write access, it's critical to use WAL journal mode and a busy_timeout pragma connection string (e.g. `?_pragma=journal_mode(WAL)&_pragma=busy_timeout(10000)`).
  - Bazel BUILD definitions must be manually re-generated via Gazelle when moving or adding new .go files to packages that have Bazel definitions.
