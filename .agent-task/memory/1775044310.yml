domain: security
topic: Hybrid OS Network and Auth Security Hardening
findings:
  - Discovered that NetworkPolicy files lacked correct namespace selectors for egress and ingress.
  - SPIFFE ID parsing relied on risky manual index/slice boundary logic which could trigger multi-tenant spoofing.
  - Standalone wrapper (standalone_ohc.sh) lacked safe process termination using pkill, leaving orphans, and state directory wasn't strictly scoped (700).
  - SQLite Database initialization missed explicit MkdirAll logic, risking crashes.
fixes_applied:
  - Modified deploy/helm/ohc/templates/network-policy.yaml to restrict egress and ingress explicitly using {{ .Release.Namespace }} namespaceSelectors.
  - Refactored ExtractSPIFFEID consumer logic (SPIFFEAuthInterceptor and SPIFFEStreamInterceptor) to segment ID paths via strings.Split.
  - Implemented explicit pkill commands for robust process cleanup and adjusted .openclaw log truncation rather than concatenation. Enforced chmod 700 for STANDALONE state dir.
  - Interjected os.MkdirAll logic in NewSIPDB prior to initializing sql.Open.
