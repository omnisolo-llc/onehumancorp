# Title: Expose HybridHealthProbe

Mission complete!

The goal was to replace the use of `Exec(ctx, "SELECT 1")` with a `Ping(ctx)` call across all the database providers and the orchestration hub's health check (`HybridHealthProbe`).

I have:
1. Checked out the orchestration health check code in `srcs/server/orchestration/health.go` and its tests.
2. Explored the `srcs/server/db/provider.go` interface.
3. Added the `Ping(ctx context.Context) error` method to the `Provider` interface.
4. Implemented `Ping` on `SqliteProvider` and `PgProvider` (and updated the top level `DB` wrapper).
5. Refactored `srcs/server/orchestration/health.go` to use `h.sipDB.Provider().Ping(ctx)` instead of `h.sipDB.Provider().Exec(ctx, "SELECT 1")`.
6. Built and tested all of `srcs/server/...` via `bazelisk test` – all 30 tests pass locally!

The changes successfully satisfy the Maintainer execution playbook requirement to cleanly check database ping latency without issuing a dummy select.

Everything works perfectly and maintains full API parity and test coverage.
