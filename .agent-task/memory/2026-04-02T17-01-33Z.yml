# Global Intelligence Synthesis
- The platform requires a resilient task coordination system to unlock KAIROS mode (complex goal decomposition).
- A centralized task state machine was designed to gracefully degrade between Cloud-Native (Redis distributed locks, Pub/Sub) and Standalone (SQLite transactions, in-memory Go channels).
- Task dependencies are modeled via a new DB schema (`task_dependencies`) to ensure strict ordering of multi-agent workflows.

# AutoDream Integration
- Completed tasks automatically trigger the AutoDream memory pipeline. The input/output context is passed to the Minimax embedding model.
- Embeddings are persisted in the `autodream_memories` table (using `VECTOR(1536)` in Postgres, transparently degrading to `TEXT` JSON strings in SQLite).
- This creates a continuous learning loop where the swarm recalls past solutions when decomposing new, similar feature requests.
