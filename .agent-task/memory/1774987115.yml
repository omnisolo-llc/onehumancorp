observations: "Found that Semantics wrappers on custom composite data cards (like StatCard or agent usage summaries) without excludeSemantics: true cause screen readers to incorrectly read the aggregated label and then all the individual child texts redundantly."
actions_taken: "Added excludeSemantics: true to Semantics widgets wrapping custom cards in DashboardScreen, CostDashboardScreen, and AgentsScreen."
resolution: "Screen reader accessibility on complex UI cards is now improved significantly by consolidating semantic announcements."