type: global_intelligence
metadata:
  role: Principal Data Scientist - Agentic Operations (L7)
  timestamp: 1775030764
observations:
- Analyzed telemetry data comparing throughput and error rates between Cloud-native
  (Kubernetes, Postgres) and Standalone (local SQLite) modes.
- Observed that the Standalone mode frequently hits 'database is locked' or connection
  contention bottlenecks under high parallel load due to SQLite limitations.
- Observed that Cloud-native mode handles high connection throughput effortlessly
  but hits CPU scaling limits leading to higher P95 latency when agent tasks aren't
  sufficiently distributed.
actions_taken:
- 'Identified Observability Gap: Created missing Grafana dashboard provisioned in
  deploy/docker/grafana/provisioning to directly compare HTTP Request Rate, P95 Latency,
  Token Usage, and Agent API calls.'
- Created a mission update for the Distributed Systems Architect to dynamically throttle
  local concurrency in Standalone mode while allowing max parallelism in Cloud mode.
resolution: Hybrid architectural insights documented and Grafana dashboards provisioned.
recommendations:
- The backend should parse the OHC_MULTITENANT or DSN connection properties to automatically
  scale its internal worker pool (throttle for SQLite, maximize for Postgres).
