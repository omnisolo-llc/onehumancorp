report:
  title: "SMB Platform Market Research Report"
  traditional_platforms:
    - name: Shopify
      description: "E-commerce giant, highly extensible but complex for non-technical users. Requires app integrations for full functionality."
    - name: Wix
      description: "Drag-and-drop builder, visually rich but can easily become overwhelming and disorganized."
    - name: Squarespace
      description: "Template-driven, excellent for creatives but rigid in structural modifications."
    - name: GoDaddy
      description: "Domain registrar with a basic site builder bolted on. Good for very simple presences."
    - name: WordPress
      description: "Highly customizable, open-source, steep learning curve. Requires significant maintenance."
    - name: Weebly
      description: "Simple drag-and-drop builder, but development has largely stalled. Limited scaling."
    - name: BigCommerce
      description: "Enterprise-focused, overkill for micro-SMBs."
    - name: Webflow
      description: "Designer-focused, requires understanding of CSS box model. Not for non-technical users."
    - name: Duda
      description: "Agency-focused platform. Good for white-labeling but less suited for direct-to-SMB."
    - name: Zyro (Hostinger)
      description: "Budget builder, limited features but fast to set up."
  ai_native_platforms:
    - name: Durable.co
      description: "Fast site generation, basic CRM, evolving into a full business management tool."
    - name: 10Web
      description: "WordPress AI builder. Good for transitioning existing WP sites to AI management."
    - name: Mixo
      description: "Quick landing page generator to validate startup ideas."
    - name: Hostinger AI
      description: "Integrated tightly with hosting, aimed at quick site launches."
    - name: Framer AI
      description: "Design-focused generation. Produces beautiful sites but can be complex to edit."
    - name: Hocoos
      description: "Questionnaire-based builder. Creates tailored starting points."
    - name: Bookmark AiDA
      description: "AI design assistant that learns from user preferences."
    - name: Kleap
      description: "Mobile-first AI builder, strong emphasis on mobile editing."
    - name: Pineapple Builder
      description: "Simple AI generation aimed at very small businesses."
    - name: TeleportHQ
      description: "AI to code capabilities, more developer-centric but lowering the barrier."
  deep_dive:
    platform: Durable.co
    strengths: ["30-second site generation", "built-in invoicing", "basic CRM", "extremely low friction for initial onboarding"]
    weaknesses: ["Limited customization options", "cookie-cutter designs", "lacks deep e-commerce features", "no advanced autonomous agentic workflows for customer service or operations"]
    comparison_to_ohc: "Durable focuses heavily on the initial website creation and basic administrative tasks. OHC differentiates by providing full end-to-end business operations with specialized, autonomous AI departments."
  persona_mapping:
    - persona: "Maya (Baker)"
      need: "Simple custom orders, DM replies"
      pain_point: "Overwhelmed by Shopify's complexity; needs a unified inbox with AI assistance."
    - persona: "Carlos (Handyman)"
      need: "Booking, automated quotes"
      pain_point: "Has no website; finds Wix too time-consuming to build and maintain."
    - persona: "Priya (Boutique)"
      need: "Synced inventory, analytics"
      pain_point: "Needs multi-channel analytics without paying for enterprise tier tools."
    - persona: "Leo (Tutor)"
      need: "Calendar sync, subscriptions"
      pain_point: "Needs a system that handles both scheduling and recurring billing seamlessly."
    - persona: "Fatima (Food Cart)"
      need: "Pre-orders, multi-language, low-end device"
      pain_point: "Needs an extremely lightweight, fast, mobile-first solution."
  ohc_gaps:
    - "AI as Add-on vs. AI as Infrastructure: Existing platforms treat AI as an add-on (chatbots, text generators). OHC treats AI as core infrastructure (entire operational departments)."
    - "Mobile-First Management: Mobile management is often an afterthought in traditional platforms, designed primarily for desktop. OHC must be fully operational from a mobile device."
    - "End-to-End Automation: Real end-to-end automation (from initial inquiry to fulfillment to follow-up) is missing. Competitors require stitching together multiple tools."
  agentic_solutions:
    operations: "Autonomous inventory tracking, dynamic booking coordination, and automated vendor reordering."
    marketing: "Continuous, background SEO optimization and automated social media calendar generation and posting."
    sales: "Proactive lead follow-ups and dynamic quoting based on real-time capacity and material costs."
    customer_success: "24/7 intelligent DM/email responses that actually resolve issues, not just deflect them."
    finance: "Automated plain-language reporting, automated tax preparation categorization, and proactive cash flow alerts."
  visualizations:
    mermaid_diagram: |
      ```mermaid
      graph TD
          subgraph Traditional Platforms
          A[Manual Setup] --> B[Complex Dashboards]
          B --> C[Bolted-on AI Tools]
          C --> D[Fragmented Workflows]
          end

          subgraph OHC Agentic Platform
          E[AI-First Onboarding] --> F[Agentic Departments]
          F --> G[Unified Mobile Experience]
          F --> H[Autonomous Operations]
          end
      ```
