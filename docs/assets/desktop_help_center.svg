<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Desktop help center search view</title>
  <desc id="desc">A desktop layout showing a help center search interface with local and cloud sources.</desc>
  <rect width="1280" height="720" fill="#f6f7f9"/>
  <rect x="72" y="56" width="1136" height="608" rx="18" fill="#ffffff" stroke="#d7dce2"/>
  <rect x="72" y="56" width="1136" height="64" rx="18" fill="#263238"/>
  <circle cx="112" cy="88" r="8" fill="#ff6b6b"/>
  <circle cx="140" cy="88" r="8" fill="#ffd166"/>
  <circle cx="168" cy="88" r="8" fill="#4ecdc4"/>
  <text x="208" y="96" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Help Center</text>
  <rect x="120" y="164" width="760" height="58" rx="10" fill="#eef2f5" stroke="#c9d2da"/>
  <text x="148" y="200" font-family="Arial, sans-serif" font-size="22" fill="#53616d">Search business documents...</text>
  <rect x="908" y="164" width="220" height="58" rx="10" fill="#0f766e"/>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Search</text>
  <rect x="120" y="270" width="320" height="280" rx="12" fill="#fbfcfd" stroke="#d7dce2"/>
  <text x="148" y="316" font-family="Arial, sans-serif" font-size="22" fill="#263238">Sources</text>
  <rect x="148" y="348" width="244" height="40" rx="8" fill="#e0f2f1"/>
  <text x="168" y="374" font-family="Arial, sans-serif" font-size="17" fill="#0f766e">Local documents</text>
  <rect x="148" y="408" width="212" height="40" rx="8" fill="#eef2f5"/>
  <text x="168" y="434" font-family="Arial, sans-serif" font-size="17" fill="#53616d">Cloud archive</text>
  <rect x="148" y="468" width="236" height="40" rx="8" fill="#eef2f5"/>
  <text x="168" y="494" font-family="Arial, sans-serif" font-size="17" fill="#53616d">Shared notes</text>
  <rect x="480" y="270" width="648" height="280" rx="12" fill="#ffffff" stroke="#d7dce2"/>
  <text x="516" y="318" font-family="Arial, sans-serif" font-size="24" fill="#263238">Best match</text>
  <text x="516" y="366" font-family="Arial, sans-serif" font-size="20" fill="#0f766e">Vanilla cake recipe</text>
  <text x="516" y="408" font-family="Arial, sans-serif" font-size="18" fill="#53616d">Found locally. Available offline.</text>
  <rect x="516" y="450" width="516" height="16" rx="8" fill="#d7dce2"/>
  <rect x="516" y="486" width="440" height="16" rx="8" fill="#d7dce2"/>
  <rect x="516" y="522" width="360" height="16" rx="8" fill="#d7dce2"/>
</svg>
