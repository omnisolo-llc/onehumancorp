<svg xmlns="http://www.w3.org/2000/svg" width="390" height="760" viewBox="0 0 390 760" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Hybrid MCP RAG search view</title>
  <desc id="desc">A mobile wireframe showing the help center search interface, filters, result cards, and offline status.</desc>
  <rect width="390" height="760" fill="#f7f8fb"/>
  <rect x="28" y="24" width="334" height="712" rx="28" fill="#182234"/>
  <rect x="42" y="64" width="306" height="628" rx="18" fill="#ffffff"/>
  <rect x="42" y="64" width="306" height="68" rx="18" fill="#24324a"/>
  <text x="66" y="104" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Help Center</text>
  <circle cx="318" cy="98" r="8" fill="#1f9d57"/>

  <rect x="66" y="158" width="258" height="46" rx="8" fill="#ffffff" stroke="#9aa7bb" stroke-width="2"/>
  <text x="84" y="186" font-family="Arial, sans-serif" font-size="13" fill="#5d6b82">Vanilla cake recipe</text>
  <rect x="66" y="220" width="76" height="30" rx="15" fill="#dce9ff"/>
  <text x="87" y="240" font-family="Arial, sans-serif" font-size="12" fill="#174ea6">Recipes</text>
  <rect x="150" y="220" width="78" height="30" rx="15" fill="#ffffff" stroke="#c8d0df"/>
  <text x="171" y="240" font-family="Arial, sans-serif" font-size="12" fill="#40506a">Offline</text>
  <rect x="236" y="220" width="88" height="30" rx="15" fill="#ffffff" stroke="#c8d0df"/>
  <text x="257" y="240" font-family="Arial, sans-serif" font-size="12" fill="#40506a">Recent</text>

  <rect x="66" y="278" width="258" height="118" rx="8" fill="#ffffff" stroke="#d6dbe6"/>
  <text x="86" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24324a">Vanilla Cake Recipe</text>
  <text x="86" y="338" font-family="Arial, sans-serif" font-size="13" fill="#40506a">Mix flour, sugar, vanilla,</text>
  <text x="86" y="358" font-family="Arial, sans-serif" font-size="13" fill="#40506a">and butter.</text>
  <text x="86" y="380" font-family="Arial, sans-serif" font-size="12" fill="#67758d">94% - Available offline</text>

  <rect x="66" y="416" width="258" height="118" rx="8" fill="#ffffff" stroke="#d6dbe6"/>
  <text x="86" y="448" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#24324a">Kitchen Prep Notes</text>
  <text x="86" y="476" font-family="Arial, sans-serif" font-size="13" fill="#40506a">Use the local copy when</text>
  <text x="86" y="496" font-family="Arial, sans-serif" font-size="13" fill="#40506a">the network is unavailable.</text>
  <text x="86" y="518" font-family="Arial, sans-serif" font-size="12" fill="#67758d">87% - Synced recently</text>

  <rect x="66" y="558" width="258" height="74" rx="8" fill="#fff8e8" stroke="#f0cc72"/>
  <text x="86" y="588" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6b4a00">Offline support enabled</text>
  <text x="86" y="612" font-family="Arial, sans-serif" font-size="12" fill="#6b4a00">Private documents stay local.</text>
  <rect x="168" y="704" width="54" height="5" rx="2.5" fill="#d6dbe6"/>
</svg>
