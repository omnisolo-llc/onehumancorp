  <rect x="224" y="806" width="252" height="14" rx="7" fill="#d7dce2"/>
  <rect x="224" y="842" width="220" height="14" rx="7" fill="#d7dce2"/>
  <rect x="224" y="878" width="188" height="14" rx="7" fill="#d7dce2"/>
