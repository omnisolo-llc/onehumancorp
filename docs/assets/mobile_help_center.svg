<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Mobile help center search view</title>
  <desc id="desc">A mobile layout showing a help center search interface optimized for one-handed use.</desc>
  <rect width="720" height="1280" fill="#f6f7f9"/>
  <rect x="120" y="56" width="480" height="1168" rx="48" fill="#263238"/>
  <rect x="148" y="104" width="424" height="1072" rx="34" fill="#ffffff"/>
  <rect x="196" y="132" width="328" height="12" rx="6" fill="#52616d"/>
