title: Multi-Tenant Agentic Context Memory Layer
status: completed
summary: >
  Research report detailing the architectural design for a multi-tenant
  pgvector-based agentic context memory layer in OHC.
details:
  - "Objective: Architect a robust, multi-tenant memory layer to provide AI agents with long-term context while strictly enforcing data isolation."
  - "Storage Layer: Utilize PostgreSQL with the `pgvector` extension in Cloud mode, and fallback to SQLite/Rust for standalone deployments."
  - "Tenant Isolation: Enforce strict row-level security (RLS) in PostgreSQL, scoping all vector embeddings and memory records to the `tenant_id`."
  - "Conflict Resolution: Implement semantic similarity search (cosine distance) via a background worker to detect redundant or conflicting memories, resolving them based on explicit overrides, reliability scores, and recency."
  - "Stale Context Pruning: Automatically purge transient context data older than 180 days with low reference counts to maintain high-signal vector density."
  - "Cross-Department Synchronization: Enable distinct agent personas (e.g., Marketing, Operations) to seamlessly access and append context to the shared organizational memory bank."
