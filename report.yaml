issue_category: security
triage:
  - issue: "Cloud Mode IDOR/Tenant Leakage"
    details: "The `set_org_context` function in `src/server/utils/auth_utils.rs` allowed the `system` tenant ID to elevate database privileges via `SET LOCAL ROLE ohc_bypassrls` even when multi-tenancy was enabled, bypassing Row-Level Security."
    severity: "CRITICAL"
  - issue: "Standalone Mode Key Leakage"
    details: "The `StandaloneModeEnforcer` in `src/server/config.rs` formatted the encryption key directly into the `DATABASE_URL` string (`sqlite://...?cipher=sqlcipher&key=...`), exposing the raw SQLite encryption key to logging and procfs environments."
    severity: "HIGH"

debt_report:
  - component: "Postgres multitenancy check"
    details: "Unit tests mocking global config states (`config::get().multitenant`) are fundamentally limited and should be refactored to use dependency injection or test-specific configuration structs for stricter assurance."
  - component: "SQLCipher URL structure"
    details: "Using string manipulation to pass sensitive credentials directly in configuration objects should be strictly replaced with explicit environment passing directly to SQLx options."
