site_name: One Human Corp Docs
site_description: Markdown-first product, architecture, and operations documentation for the OHC monorepo.
docs_dir: docs
site_dir: site
repo_name: onehumancorp/mono
repo_url: https://github.com/onehumancorp/mono
exclude_docs: |
    /README.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
    nav:
        omitted_files: ignore
nav:
  - Home: index.md
  - Chaos Parity Audit: technical/chaos_reports/hybrid_parity_audit.md
  - Architecture:
      - Universal Transport Bridge: technical/api/universal-transport-bridge.md
      - technical/architecture/index.md
      - KAIROS Master Design: technical/research/kairos_master_design_doc.md
      - Hybrid PubSub MCP: technical/research/[integrations]_hybrid_pubsub_mcp.md
  - Developer:
      - technical/developer/index.md
  - UI:
      - Day One Onboarding: technical/ui/guide_proactive_onboarding.md
      - Hybrid Health Check: technical/ui/guide_proactive_onboarding_health_check.md
  - API:
      - technical/api/index.md
      - "Interactive Api Playbook": technical/api/api-playbook.md
  - Features:
      - Hybrid WebSockets MCP: technical/research/[integrations]_hybrid_websockets_mcp.md
      - Hybrid Feature Flags MCP: technical/research/[integrations]_hybrid_feature_flags_mcp.md
      - Hybrid SPIFFE Identity MCP: technical/research/[integrations]_hybrid_spiffe_identity_mcp.md
      - technical/features/index.md
      - Hybrid LLM Routing Gateway MCP: technical/research/[integrations]_hybrid_llm_routing_gateway_mcp.md
      - Hybrid Task Scheduler MCP: technical/research/[integrations]_hybrid_task_scheduler_mcp.md
      - Hybrid Circuit Breaker MCP: technical/research/[integrations]_hybrid_circuit_breaker_mcp.md
      - Hybrid Secure Credential Bridge MCP: technical/research/[integrations]_hybrid_secure_credential_bridge.md
  - Walkthroughs:
      - Interactive API Playbook: technical/walkthroughs/interactive_api_playbook.md
      - Visual Dashboard Guide: technical/walkthroughs/visual_dashboard_guide.md
      - Agent Harness Visual Walkthrough: technical/walkthroughs/agent_harness_walkthrough.md
      - AutoDream Walkthrough: technical/walkthroughs/kairos_autodream_walkthrough.md
      - Capability Plugin Mesh: technical/walkthroughs/capability_plugin_mesh.md
      - Edge LLM Offloading Protocol: technical/walkthroughs/edge_llm_offloading.md
      - Teammate Mesh Walkthrough: technical/walkthroughs/teammate_mesh_walkthrough.md
      - AutoDream CLI Guide: technical/walkthroughs/autodream_cli_interactive_guide.md
      - technical/walkthroughs/index.md
  - Operations:
      - technical/operations/index.md
      - Task Tracking: technical/operations/task-tracking.md
      - Issue Migration Seed: technical/operations/github-issues-migration.md
      - Docs Audit: technical/reports/site-audit-report.md
  - Releases:
      - business/public/index.md
      - Release Notes: business/public/release_notes.md
  - Archive:
      - technical/archive/index.md
      - Legacy Design: technical/archive/design/kairos-hybrid-architecture.md
