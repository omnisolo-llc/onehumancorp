site_name: One Human Corp Docs
site_description: Markdown-first product, architecture, and operations documentation for the OHC monorepo.
docs_dir: docs
site_dir: site
repo_name: onehumancorp/mono
repo_url: https://github.com/onehumancorp/mono
exclude_docs: |
    /README.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
    nav:
        omitted_files: ignore
nav:
  - Home: index.md
  - Chaos Parity Audit: chaos_reports/hybrid_parity_audit.md
  - Architecture:
      - Universal Transport Bridge: architecture/universal_transport_bridge.md
      - RAG Synthesis: architecture/rag_synthesis.md
      - architecture/index.md
      - Chaos Engineering: architecture/chaos_engineering.md
      - KAIROS Features Design: architecture/kairos_hybrid_os_architecture.md
      - KAIROS Master Design: architecture/kairos_master_design_doc.md
      - Hybrid PubSub MCP: research/[integrations]_hybrid_pubsub_mcp.md
  - Developer:
