site_name: OmniSolo OneHumanCorp Docs
site_description: Markdown-first product, architecture, and operations documentation for OmniSolo OneHumanCorp, a product by OmniSolo.
docs_dir: docs
site_dir: site
repo_name: omnisolo/mono
repo_url: https://github.com/omnisolo-llc/omnisolo
exclude_docs: |
    /README.md
    /user_guide.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
validation:
    nav:
        omitted_files: ignore
nav:
  - Home: index.md
  - Chaos Parity Audit: chaos_reports/hybrid_parity_audit.md
  - Architecture:
      - KAIROS Master Design: technical/architecture/kairos/master-design-doc.md
      - Hybrid OS Design: technical/architecture/kairos/hybrid-os-design.md
      - Shared Task Mesh Architecture: technical/architecture/kairos/shared-task-mesh-architecture.md
      - Sub-Agent Queue Design: technical/architecture/kairos/sub-agent-queue-design.md
      - Task Decomposition: technical/architecture/kairos/task-decomposition-design.md
      - Offline Mesh Sync: architecture/mesh/offline_first_sync.md
  - Features:
      - KAIROS Orchestration: features/kairos_orchestration.md
      - KAIROS Distributed State Machine: features/kairos/distributed_state_machine.md
      - KAIROS AutoDream Pipelines: features/kairos/autodream_pipelines.md
      - KAIROS Memory Consolidation: features/kairos/memory_consolidation.md
      - Dynamic Workflows: features/dynamic_workflows.md
      - Hybrid MCP Config Sync: features/hybrid_mcp_config_sync.md
      - Storefront Builder Architecture: features/storefront_builder_architecture.md
  - Technical:
      - Architecture Overview: technical/architecture/architecture-overview.md
      - System Overview: technical/architecture/system-overview.md
      - System Design: technical/architecture/system-design.md
      - API Reference: technical/api/api-reference.md
      - KAIROS Master API Guide: technical/api/kairos-master-api-guide.md
  - Walkthroughs:
      - Sub-Agent Orchestration: walkthroughs/sub_agent_orchestration.md
      - KAIROS Orchestration: walkthroughs/kairos_orchestration.md
      - AutoDream CLI: walkthroughs/autodream_cli_guide.md
      - Teammate Mesh: walkthroughs/teammate_mesh_walkthrough.md
      - Day One Onboarding: technical/walkthroughs/day_one_onboarding.md
      - Agent Harness: technical/walkthroughs/agent_harness_walkthrough.md
      - Hybrid FS MCP Architecture Walkthrough: technical/walkthroughs/hybrid_fs_mcp_architecture.md
  - Developer & Security:
      - Developer Setup: technical/developer/setup.md
      - Developer Guide: technical/developer/developer-guide.md
      - Multi-Harness Compatibility: omnisolo-harness-compatibility-inventory.md
      - OIDC Authority: technical/security/oidc-authority.md
      - HTTP Auth Rate Limits: technical/security/http-auth-rate-limits.md
  - Operations:
      - Operations: technical/operations/index.md
  - Business:
      - Roadmap: business/roadmap.md
      - Execution Plan: business/execution-plan.md
  - Research:
      - Autonomous Subscription Engine: research/[architecture]_autonomous_subscription_and_recurring_billing_engine.md
      - Research: technical/research/index.md
      - Universal Edge-Cached Dynamic Storefront: technical/research/universal_edge_cached_dynamic_storefront_agentic_seo_pre_rendering_architecture.md
  - Reports:
      - OmniSolo SMB Market Research Report: business/market_research/omnisolo_smb_market_report.md
      - Global SMB Market Research Report: reports/omnisolo_global_smb_market_research_report.md
      - SMB Platform Research Report: reports/omnisolo_smb_platform_research_report.md
      - Small Business Platform Strategic Research Report: reports/omnisolo_small_business_platform_strategic_research_report.md
      - Market Research Report: reports/omnisolo_market_research_report.md
      - OmniSolo Market Dominance & SMB Research Report: reports/omnisolo_market_dominance_agentic_workflows_vs_traditional_platforms_research_report.md
      - Market Dominance & AI Differentiation Strategic Report: reports/omnisolo_market_dominance_ai_differentiation_strategic_report.md
      - Market Research & AI Differentiation Report: reports/omnisolo_market_research_ai_differentiation_report.md
      - Tool Integration Research Report: reports/tool_integration_research_report.md
      - Scout Tool Integration Research Report (Q2 2024): reports/scout_tool_integration_research_report_q2_2024.md
      - Third-Party Integration Research Report (Q3): reports/third_party_integration_research_report_q3.md
      - Tool Integration Research Report (Q4): reports/tool_integration_research_report_q4.md
      - OmniSolo Product Research Small Business Platform Dominance: reports/omnisolo_product_research_small_business_platform_dominance.md
      - Scout Tool Integration Research Report (Q4): reports/scout_tool_integration_research_report_q4.md
