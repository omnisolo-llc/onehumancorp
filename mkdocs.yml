site_name: One Human Corp Docs
site_description: Markdown-first product, architecture, and operations documentation for the OHC monorepo.
docs_dir: docs
site_dir: site
repo_name: onehumancorp/mono
repo_url: https://github.com/onehumancorp/mono
exclude_docs: |
    /README.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
    nav:
        omitted_files: ignore
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Architecture:
      - Overview: architecture/index.md
      - System Design: architecture/system-design.md
      - Shared Context: architecture/shared-context.md
      - Hybrid MCP Playbook: architecture/hybrid-mcp-playbook.md
      - CRDT Sync Blueprint: architecture/crdt-sync-blueprint.md
      - Server Roadmap: architecture/server-roadmap.md
      - Kairos:
          - Master Design: architecture/kairos/master-design-doc.md
          - Orchestration Design: architecture/kairos/orchestration-design.md
          - Orchestration Phase 4: architecture/kairos/orchestration-phase4.md
          - Shared Task List: architecture/kairos/shared-task-list-design.md
          - Task Decomposition: architecture/kairos/kairos-task-decomposition-design.md
          - Sub-Agent Queue: architecture/kairos/kairos-sub-agent-queue.md
          - Teammate Mesh API: architecture/kairos/kairos-teammate-mesh-api.md
          - AutoDream Pipeline: architecture/kairos/kairos-autodream-pipeline.md
          - Implementation Guide: architecture/kairos/kairos-implementation-guide.md
          - Master Orchestration: architecture/kairos/kairos-master-orchestration.md
  - Developer:
