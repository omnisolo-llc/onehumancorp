insights: |

  Based on market research:
  OpenClaw emphasizes multi-channel routing (e.g., Slack to GitHub) and persistent sessions across platforms.
  Claude Code utilizes a CLAUDE.md file for contextual memory, allowing sub-agents to share project-specific knowledge natively, and leverages MCP heavily.
  OpenCode heavily relies on AGENTS.md for defining agent personas and routing tasks.
  Windsurf/Cascade use fast ReAct loops and rich file-tree indexing.
  Cursor features excellent context-aware predictive editing.

  Delta/Unfair Advantage for OHC:
  "Omni-Context Sub-agent Routing" - OHC should extend its MCP integration to automatically inject project-level grounding (like CLAUDE.md/AGENTS.md) directly into the Swarm Database (`agent_missions`), allowing any sub-agent to instantly pick up a task with full codebase context without needing to explicitly read the file first.
