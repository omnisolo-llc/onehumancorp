actions:
  - name: "bazel test //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          # xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bazel test \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            -- //...

  - name: "bazel build //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          bazel test //... --test_output=errors --test_summary=terse
          bazel build //release:all_release_artifacts --config=linux
          # Cross-platform builds (assumes CI environment has toolchains)
          bazel build //src/app:app //src/server:server --config=windows || echo "Warning: Windows build failed"
          bazel build //src/app:app //src/server:server --config=macos || echo "Warning: MacOS build failed"
