actions:
  - name: "bazel test //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bazel test \
            --config=buildbuddy \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            -- //...
