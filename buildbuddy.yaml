actions:
  - name: "bazel test //src/e2e:playwright"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          # Build the server first
          bazelisk build //src/server:server --config=linux

          # Run Playwright tests with screenshots
          # Uses playwright_test.sh which handles Docker infra (postgres, redis) and server startup
          bazelisk test //src/e2e:playwright \
            --test_output=streamed \
            --test_timeout=300,600,900,1800

          # Screenshots are saved to test-results/screenshots/ and explicit page.screenshot() calls save to test-results/*.png
          # These are gitignored but available for review after test run

  - name: "bazel test //..."
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      GOTOOLCHAIN: "auto"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          # Build release artifacts first (needed by verification_tests)
          bazelisk build //release:all_release_artifacts --config=linux
          # Run all tests on Linux
          bazelisk test \
            --config=linux \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            //...

  - name: "bazel build //..."
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      GOTOOLCHAIN: "auto"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          bazelisk build //... --config=linux
          # Cross-platform builds (assumes CI environment has toolchains)
          bazelisk build //... --config=windows || echo "Warning: Windows build failed"
          bazelisk build //... --config=macos || echo "Warning: MacOS build failed"
