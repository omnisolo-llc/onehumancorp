actions:
  - name: "bazel test //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb
      - run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bazel test \
            --config=buildbuddy \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            -- //...

  - name: "playwright e2e tests"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL "https://download.docker.com/linux/ubuntu/gpg" -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin
      - run: |
          sudo docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$(pwd)":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.0 \
            /bin/bash -c "npm install --frozen-lockfile && node scripts/run-playwright.mjs"
