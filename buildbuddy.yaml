actions:
  - name: "bazel test -- //... -//src/app:app_test -//src/server:crypto_test -//src/server:server_test"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          bazel test -- //... -//src/app:app_test -//src/server:crypto_test -//src/server:server_test \
            --config=buildbuddy-official \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800
