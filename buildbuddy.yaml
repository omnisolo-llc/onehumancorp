actions:
  - name: "Test all targets"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: "8"
      memory: "16GB"
      disk: "40GB"
    timeout: "1h"
    triggers:
      push:
        branches:
          - "main" # <-- replace "main" with your main branch name
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          bazelisk test //... \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800
