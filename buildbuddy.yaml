actions:
  - name: "bazel test //..."
    # resource_requests:
    #   cpu: 8
    #   memory: 32GB
    #   disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          bazel test //... \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800