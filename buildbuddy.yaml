actions:
  - name: "bazel test //src/e2e:playwright"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          case "$(uname -m)" in
            x86_64) BAZEL_PLATFORM_CONFIG=linux ;;
            aarch64|arm64) BAZEL_PLATFORM_CONFIG=linux_arm64 ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          # Build the server first
          bazelisk build //src/server:server --config="${BAZEL_PLATFORM_CONFIG}"

          # Run Playwright tests with screenshots
          # Uses playwright_test.sh which handles Docker infra (postgres, redis) and server startup
          bazelisk test //src/e2e:playwright \
            --test_output=streamed \
            --test_timeout=300,600,900,1800

          # Screenshots are saved to test-results/screenshots/ and explicit page.screenshot() calls save to test-results/*.png
          # These are gitignored but available for review after test run

  - name: "bazel test //deploy:kind_e2e_test"
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      GOTOOLCHAIN: "auto"
      KIND_VERSION: "v0.31.0"
      KUBECTL_VERSION: "v1.36.1"
      HELM_VERSION: "v3.20.2"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            ca-certificates curl git

          case "$(uname -m)" in
            x86_64) CI_ARCH=amd64; BAZEL_PLATFORM_CONFIG=linux ;;
            aarch64|arm64) CI_ARCH=arm64; BAZEL_PLATFORM_CONFIG=linux_arm64 ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${CI_ARCH}"
          chmod +x /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind

          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${CI_ARCH}/kubectl"
          chmod +x /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl

          curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-${CI_ARCH}.tar.gz"
          tar -C /tmp -xzf /tmp/helm.tar.gz
          sudo install "/tmp/linux-${CI_ARCH}/helm" /usr/local/bin/helm

          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin

          bazelisk test //deploy:kind_e2e_test \
            --config="${BAZEL_PLATFORM_CONFIG}" \
            --nocache_test_results \
            --test_output=streamed \
            --test_summary=terse \
            --test_timeout=300,600,900,1800

  - name: "bazel test //..."
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      GOTOOLCHAIN: "auto"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          case "$(uname -m)" in
            x86_64) BAZEL_PLATFORM_CONFIG=linux ;;
            aarch64|arm64) BAZEL_PLATFORM_CONFIG=linux_arm64 ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          # Build release artifacts first (needed by verification_tests)
          bazelisk build //release:all_release_artifacts --config="${BAZEL_PLATFORM_CONFIG}"
          # Run fast non-E2E tests on Linux. Slow E2E targets have their own actions.
          bazelisk test \
            --config=no-e2e \
            --config="${BAZEL_PLATFORM_CONFIG}" \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            //...

  - name: "bazel build //..."
    container_image: "ubuntu-24.04"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    env:
      GOTOOLCHAIN: "auto"
    steps:
      - run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update && sudo apt-get install -y --fix-missing \
            build-essential pkg-config libssl-dev \
            libdbus-1-dev libatk1.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            ca-certificates curl git
          go install github.com/bazelbuild/bazelisk@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          case "$(uname -m)" in
            x86_64) BAZEL_PLATFORM_CONFIG=linux ;;
            aarch64|arm64) BAZEL_PLATFORM_CONFIG=linux_arm64 ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bazelisk build //... --config="${BAZEL_PLATFORM_CONFIG}"
          # Cross-platform builds (assumes CI environment has toolchains)
          bazelisk build //... --config=windows || echo "Warning: Windows build failed"
          bazelisk build //... --config=macos || echo "Warning: MacOS build failed"
