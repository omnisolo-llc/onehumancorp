actions:
  - name: "bazel test //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb
      - run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bazel test \
            --config=buildbuddy \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            -- //...

  - name: "playwright e2e tests"
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 100GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends docker.io
      - run: |
          sudo service docker start
      - run: |
          bazel run //tests/e2e:run_playwright_e2e
