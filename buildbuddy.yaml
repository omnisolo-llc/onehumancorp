actions:
  - name: "bazel test //..."
    resource_requests:
      cpu: 8
      memory: 16GB
      disk: 50GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb
      - run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bazel test \
            --config=buildbuddy \
            --test_output=errors \
            --test_summary=terse \
            --test_timeout=300,600,900,1800 \
            -- //...

  - name: "playwright e2e tests"
    resource_requests:
      cpu: 4
      memory: 8GB
      disk: 20GB
    triggers:
      push:
        branches:
          - "main"
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
      - run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && nvm install 24 && nvm use 24
      - run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && npm install --frozen-lockfile
      - run: |
          npx playwright install --with-deps chromium
      - run: |
          node scripts/run-playwright.mjs
